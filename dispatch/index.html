<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- WHY a strict CSP (card #376): this origin's localStorage holds the master
     bearer for the desk too. One unescaped card title or model sentence
     running as script would carry it off. So scripts come only from this
     origin (app.js), there is no inline script and no inline handler, and
     every server string reaches the page as text, never as markup. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https: http://127.0.0.1:* http://localhost:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark light">
<title>Dispatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
/* NIGHT is the default: he reads this at a truck stop after dark far more
   than at noon. Tokens are the desk's, so the two apps read as one house. */
:root{
  --void:#07080A; --ink:#E9EDF0; --mid:#AEB8C0; --dim:#8B96A0;
  --amber:#FFA419; --hot:#FF3B18; --line:rgba(150,170,190,.15); --panel:#12161c;
  --on-amber:#07080A; --on-hot:#FFFFFF;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --w-body:400; --w-title:600;
  color-scheme:dark;
}
/* SUN, from the desk's paper tokens. Weights go up a step because full sun
   eats thin strokes on a phone screen. */
:root.sun{
  --void:#EAE0C9; --ink:#221A0E; --mid:#4E4230; --dim:#6E5F45;
  --amber:#8F5A00; --hot:#B3271A; --line:rgba(70,56,32,.24); --panel:#F3EBD6;
  --on-amber:#F3EBD6; --on-hot:#FFFFFF;
  --w-body:500; --w-title:700;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink)}
body{font:var(--w-body) 18px/1.45 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* one column the height of the visible screen; with interactive-widget=
   resizes-content the keyboard shrinks it, so compose rides above the keys */
#app{display:flex;flex-direction:column;height:100dvh;width:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.demo{flex:none;padding:6px 12px;background:var(--hot);color:var(--on-hot);
  font:800 13px/1.2 var(--mono);letter-spacing:.16em;text-align:center}

header{flex:none;position:sticky;top:0;z-index:2;height:52px;display:flex;align-items:center;gap:6px;
  padding:0 8px 0 14px;background:var(--void);border-bottom:1px solid var(--line)}
h1{flex:1;min-width:0;margin:0;font:700 15px/1 var(--sans);letter-spacing:.18em;white-space:nowrap;overflow:hidden}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 8px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--mid);font:700 13px/1 var(--mono);letter-spacing:.06em;white-space:nowrap}
.bell.on{color:var(--dim);border-color:var(--dim)}
.bell.off{color:var(--amber);border-color:var(--amber)}
.bell.broken{color:var(--hot);border-color:var(--hot)}
.bell.wait{color:var(--dim)}

.why,.notice{flex:none;margin:0;padding:8px 14px;font:var(--w-body) 15px/1.4 var(--sans);color:var(--mid);
  border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.why.hot,.notice.hot{color:var(--hot)}

.strip{flex:none;padding:8px 14px;font:var(--w-body) 15px/1.35 var(--mono);color:var(--mid);
  border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.strip.hot{color:var(--hot);font-weight:700}
.pulse{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:var(--ink);
  vertical-align:1px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* THE LOG. column-reverse puts the newest row at the bottom, under his thumb,
   and keeps the view pinned there as rows arrive. */
#log{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column-reverse;
  padding:6px 0 10px;overscroll-behavior:contain}
.day{align-self:center;margin:16px 0 6px;font:700 13px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.empty{margin:auto 18px;color:var(--dim);font-size:17px;text-align:center}
.row{margin:4px 0;padding:10px 14px 12px 12px;border-left:3px solid var(--ink);min-width:0}
.row.k-ask,.row.k-triage{border-left-color:var(--amber)}
.row.k-failed{border-left-color:var(--hot)}
/* An Almanac alert (card #386) carries a loud fault's weight: the same hot
   token as FAILED, so it reads in NIGHT and in SUN alike. */
.row.k-alert{border-left-color:var(--hot)}
.row.k-alert .tag{color:var(--hot)}
.meta{display:flex;align-items:center;gap:8px;min-width:0;font:700 13px/1.2 var(--mono);letter-spacing:.1em;color:var(--mid)}
.meta time{margin-left:auto;font-weight:var(--w-body);letter-spacing:.04em;color:var(--dim)}
.row.k-failed .tag{color:var(--hot)}
.row.k-ask .tag,.row.k-triage .tag{color:var(--amber)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.title{margin-top:6px;font:var(--w-title) 20px/1.3 var(--sans);overflow-wrap:anywhere}
.body{margin-top:4px;font:var(--w-body) 18px/1.45 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}

.row.me{align-self:flex-end;max-width:86%;margin-right:0;border-left:0;border-right:3px solid var(--dim);
  background:var(--panel);text-align:right;padding:10px 12px 10px 14px}
.row.me .meta{justify-content:flex-end}
.row.me .body{font-size:19px;margin-top:6px}
.st{margin-top:6px;font:var(--w-body) 13px/1.35 var(--mono);color:var(--dim);overflow-wrap:anywhere}
.st.hot{color:var(--hot);font-weight:700}

/* THE SLIP: a batch answered with one word */
.row.slip{margin:8px 10px;padding:12px 14px 14px;border:1px solid var(--line);border-left:3px solid var(--ink);
  border-radius:8px;background:var(--panel)}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 0 8px}
.n{font:700 40px/1 var(--sans);font-variant-numeric:tabular-nums}
.n.hot{color:var(--hot)}
.n.amber{color:var(--amber)}
.nl{margin-top:5px;font:700 12px/1.2 var(--mono);letter-spacing:.04em;color:var(--dim);overflow-wrap:anywhere}
.sline{font:var(--w-body) 18px/1.45 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}
.pre{font:700 13px/1 var(--mono);letter-spacing:.08em;color:var(--mid);margin-right:6px}
.pre.hot{color:var(--hot)}
.pre.amber{color:var(--amber)}
.sub{margin-top:4px;color:var(--mid);font-size:16px;overflow-wrap:anywhere}
.run{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:72px;
  margin-top:14px;border:0;border-radius:8px;background:var(--amber);color:var(--on-amber);
  font:800 24px/1 var(--sans);letter-spacing:.24em;touch-action:manipulation}
.run small{margin-top:6px;font:700 13px/1.1 var(--mono);letter-spacing:.04em;opacity:.85}

/* triage: one chip per runnable card, each sends 'approve <id>' */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.approve{min-height:56px;padding:0 16px;border-radius:8px;border:2px solid var(--amber);background:transparent;
  color:var(--amber);font:700 17px/1 var(--mono);letter-spacing:.04em;touch-action:manipulation}
.hint{margin-top:10px;font:var(--w-body) 14px/1.4 var(--mono);color:var(--dim)}
.retry{min-height:56px;min-width:96px;margin-top:8px;padding:0 16px;border-radius:8px;border:2px solid var(--hot);
  background:transparent;color:var(--hot);font:700 17px/1 var(--sans);letter-spacing:.12em}

/* KEYS: what the line can take right now; every key sends its literal word */
.keys{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 0}
.keys:empty{display:none}
.key{position:relative;overflow:hidden;flex:1 1 120px;min-height:56px;padding:6px 10px;border-radius:8px;
  border:1.5px solid var(--mid);background:transparent;color:var(--ink);font:700 17px/1 var(--sans);letter-spacing:.12em;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.key small{display:block;margin-top:4px;font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--dim)}
.key>span,.key>small{position:relative}
.key.hold{touch-action:none}
/* the fill sweep: it reaches the right edge at the moment the word sends */
.key.hold::before{content:"";position:absolute;inset:0;background:var(--ink);opacity:.24;transform:scaleX(0);
  transform-origin:left center;transition:transform .15s ease-out}
.key.hold.holding::before{transform:scaleX(1);transition:transform .8s linear}

.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px}
textarea{flex:1;min-width:0;min-height:64px;max-height:40dvh;field-sizing:content;resize:none;padding:17px 14px;
  border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  font:var(--w-body) 20px/1.35 var(--sans);overflow-y:auto}
textarea::placeholder{color:var(--dim)}
/* field-sizing sizes the box to its placeholder too, and the placeholder
   wraps at phone width, so an EMPTY box would stand 88px tall on the cover
   screen. While it is empty the placeholder sets smaller and tighter so the
   box keeps the 64px minimum; his words still go in at 20px. */
textarea:placeholder-shown{padding-top:9px;padding-bottom:9px}
textarea:placeholder-shown::placeholder{font-size:17px;line-height:1.25}
textarea:focus{border-color:var(--mid)}
.send{flex:none;width:64px;height:64px;border:0;border-radius:8px;background:var(--ink);color:var(--void);
  font:800 15px/1 var(--sans);letter-spacing:.1em;touch-action:manipulation}
.send:disabled{opacity:.45}
.count{flex:none;padding:0 14px;font:var(--w-body) 13px/1.4 var(--mono);color:var(--dim);text-align:right}
.count.hot{color:var(--hot);font-weight:700}
.ver{flex:none;padding:2px 14px 6px;font:11px/1.2 var(--mono);color:var(--dim);text-align:center}

/* CONNECT and REPLACE: the only two panels, both plain words */
.panel{flex:1 1 auto;overflow-y:auto;padding:22px 16px}
.panel.offer{flex:none;border-bottom:1px solid var(--line);padding:14px 16px}
.panel p{margin:0 0 12px;font-size:18px;overflow-wrap:anywhere}
.panel .lead{font-weight:var(--w-title);font-size:20px}
.panel label{display:block;margin:16px 0 6px;font:700 13px/1 var(--mono);letter-spacing:.1em;color:var(--mid)}
.panel input{width:100%;min-height:56px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);font:var(--w-body) 18px var(--sans)}
.panel .row2{display:flex;gap:8px;margin-top:8px}
.panel .key{margin-top:14px;width:100%}
.panel .msg{margin-top:12px;color:var(--mid)}
.panel .msg.hot{color:var(--hot)}
</style>
</head>
<body>
<div id="app">
  <div id="demo" class="demo" hidden>DEMO — NOT THE LINE</div>
  <header>
    <h1>DISPATCH</h1>
    <button id="theme" class="chip" type="button" aria-label="switch to the sun theme">SUN</button>
    <button id="bell" class="chip bell wait" type="button" aria-label="the bell: checking">BELL …</button>
  </header>
  <p id="why" class="why" hidden></p>
  <p id="notice" class="notice" hidden></p>
  <div id="strip" class="strip"></div>

  <section id="replace" class="panel offer" hidden aria-label="replace this phone's connection">
    <p class="lead">Replace this phone's connection?</p>
    <p id="rnew"></p>
    <p id="rold"></p>
    <div class="row2">
      <button id="rgo" class="key" type="button" aria-label="replace this phone's connection">REPLACE</button>
      <button id="rno" class="key" type="button" aria-label="keep this phone's connection">KEEP</button>
    </div>
  </section>

  <section id="connect" class="panel" hidden aria-label="connect">
    <p class="lead">Not connected. Open the desk once on this phone, or open a dispatch connect code from the Mac.</p>
    <label for="capi">SPINE ADDRESS</label>
    <input id="capi" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://….ts.net:8600">
    <label for="ctok">KEY</label>
    <input id="ctok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="cgo" class="key" type="button" aria-label="check the key with the spine and connect">CONNECT</button>
    <p id="cwhy" class="msg" aria-live="polite"></p>
  </section>

  <main id="log" role="log" aria-live="polite" aria-label="the dispatch line"></main>
  <div id="keys" class="keys" role="group" aria-label="keys"></div>
  <div id="compose" class="compose">
    <textarea id="txt" rows="1" placeholder="Text dispatch — or tap the mic" enterkeyhint="send" autocapitalize="sentences" spellcheck="true" autocomplete="off" aria-label="text to dispatch"></textarea>
    <button id="send" class="send" type="button" aria-label="send">SEND</button>
  </div>
  <div id="count" class="count" aria-live="polite" hidden></div>
  <footer id="ver" class="ver">dispatch …</footer>
</div>
<script src="app.js"></script>
</body>
</html>
