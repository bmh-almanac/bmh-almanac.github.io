<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bik-dispatch moved</title>
<!--
  bik-dispatch MOVED to its own origin, https://bik-dispatch.github.io/ (card #388,
  2026-10-02). Served from here it could never install as its own app: bik-almanac's
  installed scope '/' claimed /dispatch/ on his Fold. This page only sends a visitor
  on; the sw.js beside it is a kill switch that removes the old Dispatch worker and its
  caches from any phone that opened the old address. No hash is forwarded: a connect
  link for Dispatch is minted for the new origin, and a key never rides a redirect.
-->
<meta http-equiv="refresh" content="0; url=https://bik-dispatch.github.io/">
<style>html,body{background:#13110E;color:#E9EDF0;font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px}a{color:#FFA419}</style>
</head>
<body>
<p>bik-dispatch moved to <a href="https://bik-dispatch.github.io/">bik-dispatch.github.io</a>.</p>
<script>
  // Clear the old Dispatch worker AND its caches here, then go: if this page
  // unregisters first, the kill switch beside it may never install, so the
  // caches are deleted by the page too (review of #388).
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.filter(r => r.scope.endsWith('/dispatch/')).map(r => r.unregister()));
      }
      if (self.caches) {
        const ks = await caches.keys();
        await Promise.all(ks.filter(k => k.startsWith('almanac-dispatch-')).map(k => caches.delete(k)));
      }
    } catch (e) {}
    location.replace('https://bik-dispatch.github.io/');
  })();
</script>
</body>
</html>
