/* ══ HOLD TO KEY — the transmission (full latch: idempotent, aborted, wall-clocked) ══ */
function wireKey(){
  const btn = $("key"), rail = $("keyrail"), say = $("say");
  let t0 = 0, T1 = 0, fired = false, key = null, ctrl = null;
  const arm = e => {
    e.preventDefault();
    if(document.visibilityState !== "visible") return;
    if(!say.value.trim()){ toast("nothing to key — the well is empty"); thud(); return; }
    if(!S.run){ toast("tune to a channel first — the log is the ☰, top right"); return; }
    btn.setPointerCapture?.(e.pointerId);
    t0 = performance.now(); fired = false;
    key = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
    keyThump(); buzz([8]); document.body.classList.add("sc-keyed");
    rail.animate({transform:["scaleX(0)","scaleX(1)"]},
      {duration: reduce() ? 260 : 460, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
    T1 = setTimeout(async () => {
      if(performance.now() - t0 < (reduce() ? 240 : 440)) return;   // the wall clock decides
      fired = true;
      $("keycap").textContent = "KEYED";
      const body = say.value.trim();
      try{
        await sendTurn(body, key);
        say.value = "";
      }catch(err){
        btn.dataset.state = "refused"; thud(); buzz([12,70,12]);
        toast((err.name === "AbortError" ? "nine seconds and no answer — " :
               "the channel didn't take it — ") + "nothing was sent; your words stay in the well");
        T.push(setTimeout(() => { delete btn.dataset.state; }, 500));
      }finally{
        $("keycap").textContent = "HOLD TO KEY";
        rail.getAnimations().forEach(x => x.cancel()); rail.style.transform = "scaleX(0)";
        document.body.classList.remove("sc-keyed");
      }
    }, reduce() ? 260 : 460);
  };
  const drop = () => {
    clearTimeout(T1);
    document.body.classList.remove("sc-keyed");
    if(!fired){
      rail.getAnimations().forEach(x => x.cancel()); rail.style.transform = "scaleX(0)";
      if(t0 && performance.now() - t0 > 120)
        toast("released before it keyed — nothing was sent. the key is held, not tapped.");
      t0 = 0;
    }
  };
  btn.addEventListener("pointerdown", arm);
  ["pointerup","pointercancel"].forEach(ev => btn.addEventListener(ev, drop));
  document.addEventListener("visibilitychange", () => { if(document.hidden) drop(); });
}

/* ══ TALK — the road loop (his ruling 2026-08-11: "never gonna be able to
   hold to talk on the road"). One TAP opens the mic; ~1.8s of silence closes
   the take and SENDS it (a conversation turn is reversible and carries zero
   directive weight — the signed acts stay held: →19, the visor); when the
   answer finishes speaking, the mic REOPENS — a hands-free session. The same
   tap is the panic button the cab needs: mute during a take, silence during
   an answer, and a Fold call going fullscreen kills the mic automatically.
   Turn the radio down to key up — the mic hears the cab, same as a CB. ══ */
/* THE SILENCE WINDOW (#256, 2026-09-13). 2,300ms was the old companion's
   cadence, tuned when a take then paid ~4s of transcription and ~2.5s of
   poll — the pause was invisible inside a fifteen-second wait. With the ear
   resident (0.16s) and the answer streamed, the window became the single
   largest stage between his last word and the first sound back. 1,800ms
   still clears a natural mid-sentence breath (under a second) and closes
   the turn half a second sooner. His feel rules this number. */
const SILENCE_MS = 1800;
function wireTalk(){
  const btn = $("talk"), rail = $("vurail"), say = $("say");
  const cap = t => { $("talkcap").textContent = t; };
  const stopTracks = () => {
    if(!S.rec) return;
    try{ S.rec.proc.disconnect(); }catch(e){}
    try{ S.rec.src.disconnect(); }catch(e){}
    try{ S.rec.stream.getTracks().forEach(t => t.stop()); }catch(e){}  // every path — a leaked pill reads as surveillance
    try{ S.rec.ctx.close(); }catch(e){}
    cancelAnimationFrame(S.vuRaf); S.vuRaf = 0;
    rail.style.transform = "scaleX(0)"; deadAir();
    btn.classList.remove("rec"); arc("you", false);
    S.rec = null;
  };
  function endLoop(msg){
    S.loop = false; S.emptyTakes = 0;
    stopTracks(); cap("TALK");
    if(msg) toast(msg);
  }
  async function startTake(){
    if(S.rec || document.visibilityState !== "visible" || !S.loop) return;
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        channelCount:1, echoCancellation:true, noiseSuppression:true } });
    }catch(err){
      endLoop("the mic refused — the keyboard mic is the floor that never breaks");
      thud(); return;
    }
    if(!S.loop){ stream.getTracks().forEach(t => t.stop()); return; }  // muted while asking
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    const mute = ctx.createGain(); mute.gain.value = 0;   // the zero-gain node is load-bearing
    src.connect(analyser); src.connect(proc); proc.connect(mute).connect(ctx.destination);
    const chunks = [];
    proc.onaudioprocess = ev => chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    S.rec = { stream, ctx, src, proc, analyser, chunks, t0: performance.now(),
              rate: ctx.sampleRate, spoke: false, lastVoice: 0 };
    btn.classList.add("rec"); cap("LISTENING · TAP = MUTE");
    keyThump(); buzz([8]); arc("you", true);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const [g, w, h] = traceCtx(); let x = 0;
    g.clearRect(0,0,w,h);
    const vu = () => {
      const rec = S.rec; if(!rec) return;
      analyser.getByteTimeDomainData(data);
      let rms = 0; for(const v of data) rms += (v-128)*(v-128);
      rms = Math.sqrt(rms/data.length)/128;
      rail.style.transform = `scaleX(${Math.min(1, rms*6)})`;   /* his own voice fills the rail */
      const sh = 2 + Math.min(1, rms*7)*(h-6);
      g.fillStyle = "rgba(198,212,228,.6)";
      g.fillRect(x % w, (h-sh)/2, 1.4, sh);
      if(++x % w === 0) g.clearRect(0,0,w,h);
      /* speak, and SILENCE_MS of quiet sends it (his cadence — see the constant) */
      const t = performance.now();
      if(rms > 0.028){ rec.spoke = true; rec.lastVoice = t; }
      if(rec.spoke && t - rec.lastVoice > SILENCE_MS) return finishTake("silence");
      if(!rec.spoke && t - rec.t0 > 9000)      return finishTake("nothing");
      if(t - rec.t0 > 60000)                   return finishTake("cap");
      S.vuRaf = requestAnimationFrame(vu);
    };
    S.vuRaf = requestAnimationFrame(vu);
  }
  async function finishTake(why){
    const rec = S.rec; if(!rec) return;
    const { chunks, rate, spoke } = rec;
    stopTracks();
    if(!spoke || why === "nothing"){
      S.emptyTakes = (S.emptyTakes || 0) + 1;
      if(S.loop && S.emptyTakes < 2){ cap("STILL HERE · TAP = MUTE"); startTake(); }
      else endLoop("the mic closed — tap TALK when you want me");
      return;
    }
    S.emptyTakes = 0;
    const n = chunks.reduce((s,c) => s + c.length, 0);
    if(!n){ if(S.loop) startTake(); return; }
    /* Float32 → Int16 RIFF WAV, client-side; downsample to 16k for the spine */
    const flat = new Float32Array(n); let off = 0;
    for(const c of chunks){ flat.set(c, off); off += c.length; }
    const ratio = rate / 16000, m = Math.floor(n / ratio);
    const pcm = new Int16Array(m);
    for(let i = 0; i < m; i++){
      const v = Math.max(-1, Math.min(1, flat[Math.floor(i*ratio)]));
      pcm[i] = v < 0 ? v*0x8000 : v*0x7FFF;
    }
    const wav = new ArrayBuffer(44 + pcm.length*2), dv = new DataView(wav);
    const ws = (o,s) => { for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
    ws(0,"RIFF"); dv.setUint32(4, 36 + pcm.length*2, true); ws(8,"WAVE");
    ws(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true);
    dv.setUint16(34,16,true); ws(36,"data"); dv.setUint32(40, pcm.length*2, true);
    new Int16Array(wav, 44).set(pcm);
    cap("READING…");
    try{
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 30000);
      const r = await fetch(url("/api/stt"), { method:"POST",
        headers: hdr({"Content-Type":"audio/wav"}), body: wav, signal: ctrl.signal });
      clearTimeout(t);
      const d = await r.json().catch(() => ({}));
      if(!r.ok || !d.text) throw new Error(d.error || "the spine has not answered with the transcript — your take was not kept");
      /* spoken turns SEND — the road cannot review a screen; the words land
         on the glass as they go, and →19 stays the signed act */
      cap("SENT");
      await sendTurn(d.text);
    }catch(err){
      thud(); toast(err.name === "AbortError"
        ? "the transcriber ran past 30s — your take was not kept"
        : (err.message || String(err)));
      if(S.loop){ cap("LISTENING · TAP = MUTE"); startTake(); return; }
    }finally{
      if(!S.rec) cap(S.loop ? "MIC CLOSED · ANSWER COMING" : "TALK");
    }
  }
  btn.addEventListener("click", () => {
    if(document.visibilityState !== "visible") return;
    if(S.rec){ endLoop("muted — tap TALK to open the mic again"); return; }
    if(S.audio && !S.audio.paused){ stopPlayback(); endLoop("quiet — tap TALK to open the mic again"); return; }
    if(S.loop){ endLoop("mic closed — the answer still lands in the run"); return; }
    if(!S.run){ toast("tune to a channel first — the log is the ☰, top right"); return; }
    S.loop = true; S.emptyTakes = 0;
    startTake();
  });
  document.addEventListener("visibilitychange", () => {
    /* hidden = abort: a call taking the screen kills the mic and the loop */
    if(document.hidden && (S.rec || S.loop)) endLoop(null);
  });
  addEventListener("pagehide", () => endLoop(null));
  S.reopenMic = () => {   // the loop's turn-taking: the answer finished — his mic again
    if(S.loop && !S.rec) T.push(setTimeout(() => startTake(), 350));
  };
}

/* ══ the held micro-grammar on rows — visor pin (ATLAS) · →19 (his) ══ */
function wireHold(el, m){
  if(m.kind !== "answer" && m.kind !== "say") return;
  let t = 0, t0 = 0;
  el.addEventListener("pointerdown", e => {
    if(e.target.closest(".play")) return;
    t0 = performance.now();
    t = setTimeout(async () => {
      if(performance.now() - t0 < 440) return;      // the wall clock decides
      buzz([14,26,14]);
      if(m.kind === "answer"){
        try{
          const r = await fetch(url("/api/pins"), { method:"POST",
            headers: hdr({"Content-Type":"application/json"}),
            body: JSON.stringify({ fact: m.body.slice(0, 500), source_thread: S.run }) });
          if(!r.ok) throw new Error("the spine answered " + r.status);
          if(!el.querySelector(".sc-pin")) el.querySelector(".st").insertAdjacentHTML("beforeend",
            `<svg class="sc-pin" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="#5E6870" stroke-width="1.4"/><path d="M3.2 6h5.6" stroke="#5E6870" stroke-width="1.4" transform="rotate(35 6 6)"/></svg>`);
          toast("clipped to the visor — rides in every seat from here.");
        }catch(err){ thud(); toast("not clipped — " + (err.message||err)); }
      }else{
        try{
          const r = await fetch(url(`/api/messages/${m.id}/promote`), { method:"POST",
            headers: hdr({"Content-Type":"application/json"}), body:"{}" });
          const d = await r.json().catch(() => ({}));
          if(!r.ok) throw new Error(d.error || ("the spine answered " + r.status));
          toast("on the channel — the next session reads it at kickoff.");
        }catch(err){ thud(); toast("not promoted — " + (err.message||err)); }
      }
    }, 460);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(t)));
}

      v.hidden = false;
      v.querySelectorAll("[data-un]").forEach(b => b.addEventListener("click", async () => {
        await fetch(url(`/api/pins/${b.dataset.un}/unpin`), { method:"POST",

    const v = $("visor");
    if(!v.hidden && !v.contains(e.target) && e.target.id !== "visorbtn") v.hidden = true;
  });
}

/* KEEP THIS STORAGE, AND PROVE WHETHER IT WAS KEPT (card #222).

   The Fold re-registered from scratch every 9-13 days since July and he had
   to re-scan the QR to get back in — because this origin never ASKED to be
   kept. Without persist(), Chrome files it as "best effort": first evicted
   under storage pressure, fair game for Android's storage manager. Losing
   localStorage loses the token AND the worker registration together, and
   between the wipe and the next scan the device is DARK — the watch, the
   payment chase and the road-approval gate all ring nothing.

   HOW A WIPE IS DETECTED, and why not the obvious way: reading
   almanac_token here cannot tell us, because bootstrap() has already run and
   a #cfg= scan has already written it — a freshly-scanned device would
   always look like it never lost anything. The DEVICE LABEL is the honest
   witness. It lives in the same localStorage, so a wipe takes it too: if we
   had to mint a new one, this profile has no memory of ever being here.
   A stream of one-off labels ~10 days apart IS the eviction, in the open.

   The eviction story is still a hypothesis. This is how it stops being one:
   if persisted comes back false after we asked, we are wrong and we look
   again. Nothing here may throw or block boot — an old browser has no
   navigator.storage at all, and a rejected promise must never take the page
   down over a diagnostic. */
const DEVICE = (() => {
  /* Not a fingerprint — a random id the device picks for itself, so the spine
     can say "the Fold lost its storage" instead of "a device did". */
  try{
    let d = localStorage.getItem("almanac_device");
    if(d) return { label: d, fresh: false };
    d = (navigator.userAgent.match(/SM-[A-Z0-9]+/) || ["device"])[0]
        + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem("almanac_device", d);
    return { label: d, fresh: true };
  }catch(e){ return { label: "unknown", fresh: false }; }
})();
(async function keepStorage(){
  try{
    const st = navigator.storage;
    let asked = false, granted = null, persisted = null;
    if(st && st.persisted){
      persisted = await st.persisted().catch(() => null);
      if(persisted === false && st.persist){
        asked = true;
        granted = await st.persist().catch(() => null);
        if(granted === true) persisted = true;
      }
    }
    let quota = null, usage = null;
    if(st && st.estimate){
      const e = await st.estimate().catch(() => null);
      if(e){ quota = e.quota ?? null; usage = e.usage ?? null; }
    }
    if(typeof configured !== "function" || !configured()) return;   /* unheard anyway */
    fetch(url("/api/device/storage"), { method: "POST",
      headers: hdr({ "Content-Type": "application/json" }),
      body: JSON.stringify({ device: DEVICE.label, fresh: DEVICE.fresh,
                             persisted, asked, granted, quota, usage })
    }).catch(() => {});
  }catch(e){ /* a diagnostic never breaks the page */ }
})();
