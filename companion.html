<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Almanac — the side channel</title>
<meta name="theme-color" content="#07080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" type="image/png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   CH 21 · THE SIDE CHANNEL — card #90, built to SIDECHANNEL-BUILD-SPEC.md.

   When the working channel is no place for a talk, you take it to the side
   channel — and there every exchange strikes an arc across the dark between
   the man and his operation: voice first, the words on the glass lit only
   where the voice has already passed, and the exchange kept afterward as
   tape you can see.

   THE ONE-VERB LAW (bearing 18's hatch, filed in DECISIONS.md): this room
   performs exactly one act — talk. Anything ATLAS names that needs a hand is
   a deep link to that act's own door. A second verb appearing here means the
   bearing fires and the room has become a console. Do not let it.

   Every selector .sc- / --sc-*; storage almanac.sc.* — the .hold and
   .fold/.why collisions are paid-for scars.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --void:#07080A; --glass:rgba(30,36,44,.86); --glass2:rgba(24,29,36,.92);
  --line:rgba(150,170,190,.15); --ink:#E9EDF0; --mid:#AEB8C0; --dim:#8B96A0;
  --etch:#5E6870; --amber:#FFA419; --hot:#FF3B18; --unknown:#6E6E6E;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --key:198,212,228; /* MOONGLASS — the night cab's own light; never touches a letter */
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--void); color:var(--ink); font-family:var(--sans); font-size:15px;
  line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
  user-select:none; -webkit-user-select:none;
}
.sc-shell{height:100svh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}

/* ── masthead ── */
.sc-mast{flex:0 0 auto;display:flex;align-items:baseline;gap:12px;padding:4px 0 8px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
/* the kicker is the TUNER DISPLAY now (card #237): it names the channel he is
   sitting in, which the retired rail used to do. Clipped, never wrapped — a
   long channel name must not push the masthead onto a second line. */
.sc-kick{font:700 10px/1 var(--mono);letter-spacing:.24em;color:var(--dim);
  max-width:min(42ch,52vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-head{font:700 21px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;
  text-shadow:0 0 28px rgba(var(--key),.45)}
.sc-state{margin-left:auto;font:700 10px/1 var(--mono);letter-spacing:.18em;color:var(--etch);
  font-variant-numeric:tabular-nums slashed-zero}
.sc-arc{width:28px;height:18px;flex:0 0 auto;align-self:center}
.sc-arc .p,.sc-arc .arc{fill:none;stroke:var(--etch);stroke-width:2;stroke-linecap:round;
  transition:stroke .3s,filter .3s}
.sc-arc .p.on{stroke:rgb(var(--key))}
.sc-arc .arc.on{stroke:rgb(var(--key));filter:drop-shadow(0 0 6px rgba(var(--key),.5))}
/* the doors travel as ONE group so the hamburger anchors the right edge on
   every width: on the phone the whole group wraps to its own line and stays
   right-aligned, so the log is always the top-right corner he reaches for. */
.sc-doors{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;
  gap:7px;align-items:center}
.sc-door,.sc-visorbtn{font:700 10px/1 var(--mono);letter-spacing:.13em;color:var(--mid);
  background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:7px 11px;
  cursor:pointer}
.sc-door:hover,.sc-visorbtn:hover{color:var(--ink)}

/* ── the mode selector — one set, three voices (card #131) ──
   the dial light IS the mode: every glow on the page rides --key, so
   flipping the mode re-lights the whole room. moonglass = analysis,
   sky = chat, candle = the therapist room. */
body[data-mode="chat"]{--key:126,198,236}
body[data-mode="therapist"]{--key:228,188,140}
/* brass = the chief of staff (card #224): the loads, the money, the web,
   his folders — and the one seat whose acts go to his phone */
body[data-mode="atlas"]{--key:214,178,96}
/* canary = the pad (his ruling 2026-09-13): the legal pad on the passenger
   seat — think out loud, argued back, no voice; what he circles is kept */
body[data-mode="brainstorm"]{--key:240,228,140}
/* a walled channel: the lamp goes to ink and the row carries a hairline bar —
   he should be able to tell at a glance which conversations are not in the open */
.lg-row.walled .lamp{background:#3A3F44;box-shadow:none}
.lg-row.walled{border-left:2px solid rgba(var(--key),.55)}
.lg-act.walled{opacity:.75;letter-spacing:.14em}
.lg-act.arming{background:rgba(var(--key),.22)}
.sc-modes.sub{padding-top:0}
.sc-modes.sub .sc-mode{min-height:26px;padding:6px 10px;font-size:9px}
.sc-atlasnote{font:600 9px/1.4 var(--mono);letter-spacing:.1em;color:var(--dim);margin-left:4px}
.sc-row.tool{padding:4px 10px 4px 12px;margin:1px 0;border-left-color:rgba(var(--key),.25)}
.sc-row.tool .bd{font:400 11px/1.45 var(--mono);color:var(--dim)}
.sc-row.prop{border-left-color:rgba(var(--key),.9);background:rgba(var(--key),.05)}
.sc-row.prop .bd{color:var(--ink)}
.sc-row.prop pre{font:400 11px/1.4 var(--mono);color:var(--dim);white-space:pre-wrap;margin:6px 0 0;
  max-height:220px;overflow:auto}
.sc-row.prop .verdict{font:700 10px/1.4 var(--mono);letter-spacing:.12em;color:rgb(var(--key));margin-top:6px}
.sc-row.live .bd{color:var(--ink)}
.sc-row.live .bd::after{content:"▍";color:rgb(var(--key));animation:sc-blink 1s steps(2) infinite}
@keyframes sc-blink{50%{opacity:0}}
.sc-flag{display:inline-block;font:700 9px/1 var(--mono);letter-spacing:.1em;color:rgb(var(--key));
  border:1px solid rgba(var(--key),.5);border-radius:3px;padding:3px 6px;margin-left:6px}
.sc-modes{flex:0 0 auto;display:flex;gap:6px;padding:8px 0 1px;align-items:center}
.sc-mode{font:700 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--dim);
  background:transparent;border:1px solid var(--line);border-radius:3px;
  corner-shape:bevel;padding:8px 12px;cursor:pointer;min-height:32px;
  transition:color .3s,border-color .3s,background .3s,box-shadow .3s}
.sc-mode:hover{color:var(--ink)}
.sc-mode.on{color:rgb(var(--key));border-color:rgba(var(--key),.55);
  background:rgba(var(--key),.09);box-shadow:0 0 16px -6px rgba(var(--key),.6)}
.sc-mode:focus-visible{outline:2px solid var(--mid);outline-offset:1px}

/* ── the log — runs as tape, never bubbles ── */
.sc-wire{flex:1 1 auto;min-height:0;display:flex;flex-direction:column-reverse;gap:2px;
  overflow-y:auto;padding:6px 2px 10px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 30px),transparent 100%);
          mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 30px),transparent 100%)}
.sc-wire::-webkit-scrollbar{display:none}
.sc-row{padding:9px 10px 9px 12px;border-left:2px solid var(--etch);margin:3px 0;
  content-visibility:auto;contain-intrinsic-size:auto 64px}
.sc-row.atl{border-left-color:rgba(var(--key),.65)}
.sc-row .st{font:600 9.5px/1.6 var(--mono);letter-spacing:.12em;color:var(--etch);
  display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums slashed-zero}
.sc-row .st .sp{flex:1}
.sc-row .bd{margin-top:3px;font:400 14px/1.55 var(--sans);color:var(--ink);
  user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.sc-row.atl .bd{color:var(--dim)}                 /* unspoken until the voice reaches it */
.sc-row.atl.done .bd,.sc-row.atl.heard .bd{color:var(--ink)}
.sc-row.atl .bd .w{transition:color .28s linear}
.sc-row.atl .bd .w.lit{color:var(--ink)}
.sc-row.atl .bd .w.now{color:var(--ink);text-shadow:0 0 12px rgba(var(--key),.38)}
.sc-row.und .bd{color:var(--dim);font-style:italic}
.sc-row .mk{color:rgb(var(--key));font-weight:700}
.sc-row .play{background:rgba(var(--key),.08);border:1px solid var(--line);border-radius:4px;
  color:rgb(var(--key));font:700 14px/1 var(--mono);min-width:48px;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:manipulation}  /* the 40px thumb law — his catch, 08-11 */
.sc-row .play:hover{color:var(--ink);border-color:rgba(var(--key),.5)}
.sc-row .play[disabled]{opacity:.6;cursor:default}
.sc-tape{display:block;margin-top:6px;height:12px;width:min(100%,320px);opacity:.55}
.sc-pin{width:12px;height:12px;flex:0 0 auto;opacity:.8}
@starting-style{ .sc-row{opacity:0;translate:0 6px} }
.sc-row{transition:opacity .28s ease-out,translate .28s ease-out}
.sc-quiet{font:400 13px/1.6 var(--sans);color:var(--dim);font-style:italic;padding:14px 4px}

/* ── the carrier glass ── */
.sc-carrier{flex:0 0 auto;height:44px;position:relative;border-radius:3px;overflow:hidden;
  border:1px solid var(--line);margin:2px 0 8px}
.sc-carrier canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ── the bench ── */
.sc-bench{flex:0 0 auto;border-top:1px solid var(--line);padding-top:9px;display:flex;
  gap:8px;align-items:stretch}
.sc-say{flex:1 1 auto;min-height:2.6em;max-height:6lh;field-sizing:content;resize:none;
  background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:2px;
  corner-shape:bevel;color:var(--ink);font:400 14px/1.4 var(--sans);padding:10px 12px;
  user-select:text;-webkit-user-select:text}
.sc-say:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
.sc-well,.sc-keybtn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;padding:0 16px;border-radius:2px;corner-shape:bevel;
  border:1px solid rgba(var(--key),.5);background:rgba(var(--key),.12);
  color:rgb(var(--key));font:700 9.5px/1 var(--mono);letter-spacing:.14em;cursor:pointer;
  position:relative;overflow:hidden;touch-action:none;min-width:86px}
.sc-well .rail,.sc-keybtn .rail{position:absolute;inset:0;background:rgba(var(--key),.3);
  transform:scaleX(0);transform-origin:left;pointer-events:none}
.sc-well .cap,.sc-keybtn .cap{position:relative;z-index:2}
.sc-well[disabled],.sc-keybtn[disabled]{opacity:.45;cursor:default}
.sc-well.rec{border-color:rgb(var(--key))}
.sc-keybtn[data-state="refused"]{border-color:var(--hot);animation:sc-refuse .46s}
@keyframes sc-refuse{0%,100%{translate:0}25%{translate:-5px}55%{translate:4px}80%{translate:-2px}}
body.sc-keyed .sc-wire{opacity:.55;transition:opacity .28s}
.sc-hint{font:600 8.5px/1 var(--mono);letter-spacing:.18em;color:var(--etch);
  text-align:right;padding:5px 2px 0}

/* ── the visor popover ── */
.sc-visor{position:fixed;inset:auto 14px 14px auto;max-width:min(420px,calc(100vw - 28px));
  max-height:60vh;overflow-y:auto;background:var(--glass2);border:1px solid var(--line);
  border-radius:5px;padding:12px 14px;z-index:40;backdrop-filter:blur(8px)}
.sc-visor h3{font:700 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim);margin:0 0 9px}
.sc-visor .pf{display:flex;gap:9px;align-items:baseline;padding:6px 0;
  border-top:1px dotted var(--line);font:400 13px/1.5 var(--sans);color:var(--ink)}
.sc-visor .pf button{background:none;border:0;color:var(--etch);font:700 9px/1 var(--mono);
  letter-spacing:.1em;cursor:pointer;padding:2px 4px}
.sc-visor .pf button:hover{color:var(--hot)}
.sc-visor .none{color:var(--dim);font:400 13px/1.5 var(--sans);font-style:italic}

/* ── THE LOG — the operator's channel log, pulled off the side of the radio
   (card #237). The law of this panel is the DIAL LIGHT: a channel that is on
   the dial carries a lit lamp, one that is off carries a dead one. Nothing
   here is a delete — off the dial is a page further back in the same book. ── */
.sc-log{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:34px;padding:7px 0}
.sc-log .bars{display:block;width:14px;height:10px;position:relative}
.sc-log .bars::before,.sc-log .bars::after,.sc-log .bars i{content:"";position:absolute;
  left:0;width:100%;height:1.5px;background:currentColor;border-radius:1px;
  transition:background .25s}
.sc-log .bars::before{top:0}
.sc-log .bars i{top:4.25px}
.sc-log .bars::after{bottom:0}
.sc-log[aria-expanded="true"]{color:rgb(var(--key));border-color:rgba(var(--key),.55)}
/* the ambient signal the rail used to carry: another channel has words he has
   not heard. It rides the button, so hiding the list never hides the news. */
.sc-log .lamp{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;
  background:rgb(var(--key));box-shadow:0 0 8px rgba(var(--key),.9)}

.sc-scrim{position:fixed;inset:0;background:rgba(4,6,9,.55);z-index:44;
  opacity:0;transition:opacity .22s}
.sc-scrim.on{opacity:1}
.sc-logpanel{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);z-index:45;
  background:var(--glass2);border-left:1px solid var(--line);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
  translate:100% 0;transition:translate .26s cubic-bezier(.22,.61,.36,1)}
.sc-logpanel.on{translate:0 0}
.lg-head{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding-bottom:9px;
  border-bottom:1px solid var(--line)}
.lg-head h3{font:700 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim);margin:0}
.lg-head .x{margin-left:auto;background:none;border:0;color:var(--etch);cursor:pointer;
  font:700 9px/1 var(--mono);letter-spacing:.14em;padding:3px 2px}
.lg-head .x:hover{color:var(--ink)}
.lg-open{flex:0 0 auto;margin:11px 0 4px;padding:10px;background:rgba(var(--key),.12);
  border:1px solid rgba(var(--key),.42);border-radius:4px;color:rgb(var(--key));
  font:700 10px/1 var(--mono);letter-spacing:.16em;cursor:pointer}
.lg-open:hover{background:rgba(var(--key),.2)}
.lg-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}
.lg-scroll::-webkit-scrollbar{display:none}
.lg-none{color:var(--dim);font:400 12.5px/1.5 var(--sans);font-style:italic;padding:10px 2px}

.lg-row{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:9px;
  padding:9px 2px;border-top:1px dotted var(--line);
  transition:opacity .22s,translate .22s}
.lg-row:first-child{border-top:0}
.lg-row .lamp{width:5px;height:5px;border-radius:50%;justify-self:center;
  background:var(--etch);transition:background .3s,box-shadow .3s}
.lg-row.lit .lamp{background:rgb(var(--key));box-shadow:0 0 7px rgba(var(--key),.75)}
.lg-row.unheard .lamp{animation:lgpulse 2.1s ease-in-out infinite}
@keyframes lgpulse{0%,100%{opacity:1}50%{opacity:.35}}
.lg-row.now{background:rgba(var(--key),.07);border-radius:4px}
.lg-row.going{opacity:0;translate:14px 0}
.lg-tune{text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.lg-tune .nm{display:block;font:600 13px/1.35 var(--sans);color:var(--mid);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row.now .lg-tune .nm{color:var(--ink)}
.lg-tune .meta{display:block;font:600 9px/1.4 var(--mono);letter-spacing:.1em;color:var(--etch);
  font-variant-numeric:tabular-nums}
.lg-acts{display:flex;gap:2px;align-items:stretch}
/* the type stays small and quiet; the PADDING carries the tap target — this
   panel gets used in a moving truck, where an 19px hit box is a miss. */
.lg-act{background:none;border:0;color:var(--etch);cursor:pointer;
  font:700 8.5px/1 var(--mono);letter-spacing:.1em;padding:12px 6px;white-space:nowrap;
  display:flex;align-items:center;min-height:40px}
.lg-act:hover{color:var(--ink)}
.lg-act.off:hover{color:var(--amber)}
.lg-name{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(var(--key),.4);
  border-radius:3px;color:var(--ink);font:400 12.5px/1.3 var(--sans);padding:6px 8px;
  user-select:text;-webkit-user-select:text}
.lg-offhead{flex:0 0 auto;margin-top:10px;padding:9px 2px;background:none;
  border:0;border-top:1px solid var(--line);color:var(--dim);cursor:pointer;
  font:700 9.5px/1 var(--mono);letter-spacing:.16em;text-align:left}
.lg-offhead:hover{color:var(--ink)}
.lg-foot{flex:0 0 auto;padding-top:9px;color:var(--etch);
  font:600 8.5px/1.5 var(--mono);letter-spacing:.1em}

/* ── toast + connect ── */
.sc-toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));
  translate:-50% 0;background:var(--glass2);border:1px solid var(--line);border-radius:5px;
  color:var(--ink);font:600 12px/1.4 var(--sans);padding:10px 16px;opacity:0;
  pointer-events:none;transition:opacity .25s;z-index:60;max-width:86vw;text-align:center}
.sc-toast.on{opacity:1}
.sc-conn{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:80}
.sc-conn .card{background:var(--glass);border:1px solid var(--line);border-radius:6px;
  padding:22px;width:min(360px,90vw)}
.sc-conn h2{font:700 15px/1 var(--sans);margin:0 0 6px}
.sc-conn p{font:400 12px/1.5 var(--sans);color:var(--dim);margin:0 0 12px}
.sc-conn label{display:block;font:700 9px/1 var(--mono);letter-spacing:.16em;color:var(--dim);
  margin:10px 0 4px}
.sc-conn input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);
  border-radius:3px;color:var(--ink);font:400 13px/1.3 var(--mono);padding:9px 11px;
  user-select:text;-webkit-user-select:text}
.sc-conn button{margin-top:14px;width:100%;padding:11px;background:rgba(var(--key),.14);
  border:1px solid rgba(var(--key),.5);border-radius:3px;color:rgb(var(--key));
  font:700 11px/1 var(--mono);letter-spacing:.16em;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  .sc-row{transition:none}
  .sc-row.atl .bd .w{transition:none}
  .sc-row.atl .bd .w.now{text-shadow:none}
  body.sc-keyed .sc-wire{opacity:1}
  .sc-logpanel,.sc-scrim,.lg-row{transition:none}
  .lg-row.unheard .lamp{animation:none}
}
@media (max-width:420px){
  .sc-head{font-size:17px}
  .sc-carrier{height:34px}
  .sc-well,.sc-keybtn{min-width:72px;padding:0 10px}
}
</style>
</head>
<body>
<div class="sc-shell">
  <div class="sc-mast">
    <div>
      <div class="sc-kick" id="kick">CH 21 · TWO SEATS</div>
      <div class="sc-head">The Side Channel</div>
    </div>
    <svg class="sc-arc" viewBox="0 0 28 18" aria-hidden="true" id="arc">
      <path class="p you" d="M5 15V8"/><path class="p atl" d="M23 15V8"/>
      <path class="arc" d="M7 9a8.5 8.5 0 0 1 14 0"/>
    </svg>
    <span class="sc-state" id="state">QUIET</span>
    <div class="sc-doors">
      <button class="sc-visorbtn" id="earbtn" title="the diet's intake — its own instrument, one tap away">EAR</button>
      <button class="sc-visorbtn" id="visorbtn" title="the facts his hand clipped">VISOR</button>
      <button class="sc-door" id="door" title="back to the desk">◂ THE DESK</button>
      <button class="sc-visorbtn sc-log" id="logbtn" aria-haspopup="dialog" aria-expanded="false"
              aria-label="the log — tune, open a channel, put one off the dial"
              title="the log — tune, open a channel, put one off the dial"
        ><span class="bars" aria-hidden="true"><i></i></span
        ><span class="lamp" id="loglamp" hidden></span></button>
    </div>
  </div>

  <div class="sc-modes" role="radiogroup" aria-label="mode" id="modes">
    <button class="sc-mode" data-mode="analysis" role="radio" title="the full read — a voice that knows your numbers">ANALYSIS</button>
    <button class="sc-mode" data-mode="chat" role="radio" title="off the clock — quick voice, no ledger">CHAT</button>
    <button class="sc-mode" data-mode="therapist" role="radio" title="the inner room — walled from the work">THERAPIST</button>
    <button class="sc-mode" data-mode="atlas" role="radio" id="modeAtlas" title="the chief of staff — the loads, the money, the web, your folders; a change goes to your phone">ATLAS</button>
    <button class="sc-mode" data-mode="brainstorm" role="radio" title="the pad — think out loud, it argues back; every few lines it offers your own words to keep">BRAINSTORM</button>
  </div>

<script>
/* ══ plumbing cloned from the desk — one connect, one token, same keys ══ */
const $ = id => document.getElementById(id);
let API = localStorage.getItem("almanac_api") || "";
let TOK = localStorage.getItem("almanac_token") || "";
(function bootstrap(){
  const h = location.hash || "";
  if(h === "#reset" || h === "#nuke"){
    (async () => {
      try{
        const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
        await Promise.all(regs.map(r => r.unregister()));
        const ks = await (caches?.keys?.() ?? []);
        await Promise.all(ks.map(k => caches.delete(k)));
      }catch(e){}
      if(h === "#nuke"){ localStorage.removeItem("almanac_api"); localStorage.removeItem("almanac_token"); }
      location.replace(location.pathname + location.search);
    })();
    return;
  }
  const m = h.match(/[#&]cfg=([^&]+)/);
  if(m){
    try{
      const cfg = JSON.parse(decodeURIComponent(m[1]));
      if(cfg.api)   localStorage.setItem("almanac_api",   API = cfg.api.replace(/\/$/, ""));
      if(cfg.token) localStorage.setItem("almanac_token", TOK = cfg.token);
      history.replaceState(null, "", location.pathname + location.search);
    }catch(e){}
  }
})();
const url = p => (API || "") + p;
const hdr = x => Object.assign({ Authorization: "Bearer " + TOK }, x || {});
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function grab(path){
  const r = await fetch(url(path), { headers: hdr() });
  if(!r.ok) throw new Error("the spine answered " + r.status);
  return r.json();
}
let toastT = 0;
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 3400); }
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const muted  = () => localStorage.getItem("almanac.mute") === "1";
const RTF = new Intl.RelativeTimeFormat("en",{numeric:"auto"});
function rel(at){
  const d = (Date.now() - new Date(at).getTime())/1000;
  if(!isFinite(d) || d < 90) return "now";
  if(d < 3600) return RTF.format(-Math.round(d/60),"minute");
  if(d < 86400) return RTF.format(-Math.round(d/3600),"hour");
  return RTF.format(-Math.round(d/86400),"day");
}
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

/* ══ the instrument's one voice — tone() + the house phrases ══ */
let AC = null;
function ac(){
  if(muted()) return null;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume().catch(()=>{});
  return AC;
}
function tone(freq, ms, gain, type, pan){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + ms/1000);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + ms/1000 + .02);
}
const keyThump  = () => tone(95, 45, .08, "sine");
const rogerBeep = () => tone(2000, 70, .045, "sine");
const thud      = () => tone(70, 90, .1, "sine");
const T = []; // grain timeouts, cleared on pagehide
function squelchTail(){
  /* the channel opening — six jittered grains; the SAME array draws the
     carrier's spike-run (one seed, sound = light) */
  const grains = [];
  for(let i = 0; i < 6; i++){
    const g = { at: i*18 + Math.random()*8, freq: 1400 + Math.random()*1600,
                ms: 14 + Math.random()*10, gain: .05 * (1 - i/6) };
    grains.push(g);
    T.push(setTimeout(() => tone(g.freq, g.ms, g.gain, "sawtooth"), g.at));
  }
  return grains;
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ══ state ══ */
const S = {
  runs: [], archived: [], offOpen: false, run: null, msgs: [],
  waiting: null,          // {sayId, t0, clockT, followT} — the dead-air watch
  audio: null, beamRaf: 0, playingRow: 0,
  gen: 0,                 // playback generation — a stale tap's late fetch is DEAD
  vox: new Map(),         // msg id -> object URL (voice cache; tune/pagehide sweep)
  peaks: new Map(),       // msg id -> [0..1] buckets (this glass's tape memory)
  rec: null,              // {stream, ctx, proc, analyser, chunks, t0, key}
  vuRaf: 0, holdT: 0,
  mode: localStorage.getItem("almanac_sc_mode") || "analysis",  // card #131
  gear: localStorage.getItem("almanac_sc_gear") || "talk",      // card #224: talk | deep
  web:  localStorage.getItem("almanac_sc_web") !== "0",         // card #224: look-ups on
  stream: null,           // the atlas turn's AbortController while its stream is open
  atlas: null,            // GET /api/atlas — armed / seat
};

/* ══ the mode selector — one set, three voices (card #131) ══ */
const MODE_PLACEHOLDER = {
  analysis:  "say it — or tap TALK and just speak; quiet sends it",
  chat:      "shoot the breeze — quick voice, no ledger",
  therapist: "say what's on you — this room holds it",
  atlas:     "say it — the chief of staff reaches for the loads, the money, the web, your folders",
  brainstorm:"work it out loud — the pad keeps what you circle",
};
const MODE_QUIET = {
  analysis:  "a fresh run — say something into the dark. the operation answers in a voice that knows your numbers.",
  chat:      "a fresh run — say anything. off the clock, no ledger, quick voice.",
  therapist: "a fresh run — say what's on you. this room is walled from the work.",
  atlas:     "a fresh run — ask the chief of staff. it looks things up, reads your loads and folders, and files any change for your phone.",
  brainstorm:"a fresh pad — say the half-formed thing. it pushes back, and every few lines it offers your own words back to keep. no voice, no ledger.",
};
function setMode(m, first){
  if(!MODE_PLACEHOLDER[m]) m = "analysis";
  S.mode = m;
  localStorage.setItem("almanac_sc_mode", m);
  document.body.dataset.mode = m;
  for(const b of document.querySelectorAll(".sc-mode")){
    const on = b.dataset.mode === m;
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", on ? "true" : "false");
  }
  $("say").placeholder = MODE_PLACEHOLDER[m];
  $("subdials").hidden = (m !== "atlas");
  if(m === "atlas"){ paintDials(); grabFix(); refreshAtlas().then(() => { if(S.atlas?.armed) warmAtlas(); }); }   // the mode tap lights the stove — only an armed one — and asks where the truck is
  if(!first && !S.msgs.length) renderWire();     // the quiet line speaks the mode
}

/* ══ ATLAS — the chief of staff (card #224): the dials, the stove, the stream ══
   DEEP and WEB are per-turn dials (his tap). The ARM is NOT here — an arm
   control on the talk surface is the bearing-18 tripwire; it lives on the
   spine (python3 spine/atlas.py arm) and this page only REFLECTS it. */
function paintDials(){
  $("dialDeep").classList.toggle("on", S.gear === "deep");
  $("dialDeep").title = S.gear === "deep" ? "DEEP — this turn goes to Claude" : "TALK — local, streamed";
  $("dialWeb").classList.toggle("on", S.web);
  $("dialWeb").title = S.web ? "look-ups on — every one logged and cited" : "look-ups off — ATLAS stays on the book";
}
async function refreshAtlas(){
  try{ S.atlas = await grab("/api/atlas"); }catch(e){ S.atlas = null; }
  const off = !S.atlas || !S.atlas.armed;
  $("modeAtlas").textContent = off ? "ATLAS · OFF" : "ATLAS";
  $("atlasnote").textContent = off ? "off — arm it from the spine" :
    (S.gear === "deep" ? "next turn goes to Claude" : "");
}
/* THE FIX (card #224 road) — the desk's 09-01 pattern, verbatim: pulled once per
   open after the one-time browser grant, held in page state, sent in the POST body
   of each ATLAS turn, used by the spine for that one request and never kept.
   NEVER localStorage, NEVER a query string, NEVER the say text. Geolocation is
   callback-based and can hang, so nothing here may gate the room. */
const GEO = { fix:null, at:null, why:"" };
function grabFix(){
  return new Promise(res => {
    if(!navigator.geolocation){ GEO.why = "this device offers no location"; return res(null); }
    navigator.geolocation.getCurrentPosition(
      p => { GEO.fix = { lat:p.coords.latitude, lng:p.coords.longitude };
             GEO.at = Date.now(); GEO.why = ""; res(GEO.fix); },
      e => { GEO.why = e.message || "the device refused"; res(null); },
      { enableHighAccuracy:false, timeout:10000, maximumAge:300000 });
  });
}
/* a stale fix draws the road from where he WAS. maximumAge 5 min makes a re-grab
   free when the cached one is fresh; a slow one is not waited on — this turn goes
   with what is held, the next turn gets the answer. */
function freshFix(){
  if(GEO.fix && Date.now() - GEO.at < 300000) return Promise.resolve(GEO.fix);
  return Promise.race([grabFix(), new Promise(r => setTimeout(() => r(GEO.fix), 1500))]);
}
function warmAtlas(){
  /* the warm renders the same tool set the next turn will (the tool block is
     part of the prompt prefix the model caches) — so it carries the WEB dial */
  fetch(url("/api/atlas/warm"), { method:"POST", headers: hdr({"Content-Type":"application/json"}),
    body: JSON.stringify({ web: S.web }) }).catch(() => {});
}
function wireDials(){
  $("dialDeep").addEventListener("click", () => {
    S.gear = S.gear === "deep" ? "talk" : "deep";
    localStorage.setItem("almanac_sc_gear", S.gear); buzz([10]); paintDials(); refreshAtlas();
    toast(S.gear === "deep" ? "DEEP — the next turn and its tool results go to Claude; the record stays here"
                            : "TALK — local, streamed");
  });
  $("dialWeb").addEventListener("click", () => {
    S.web = !S.web;
    localStorage.setItem("almanac_sc_web", S.web ? "1" : "0"); buzz([10]); paintDials();
    toast(S.web ? "web on — every look-up is logged and cited" : "web off — ATLAS stays on the book");
  });
}
function wireModes(){
  for(const b of document.querySelectorAll(".sc-mode"))
    b.addEventListener("click", () => { if(b.dataset.mode !== S.mode){ buzz([10]); setMode(b.dataset.mode); } });
  setMode(S.mode, true);
}

/* ══ the arc glyph — a state diagram that cannot lie ══ */
function arc(pole, on){
  const el = $("arc");
  if(pole === "you") el.querySelector(".you").classList.toggle("on", on);
  if(pole === "atl") el.querySelector(".atl").classList.toggle("on", on);
  if(pole === "arc") el.querySelector(".arc").classList.toggle("on", on);
}

/* ══ the carrier glass ══ */
function paintCarrierGlass(){
  const cv = $("cglass"), w = cv.clientWidth, h = cv.clientHeight;
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  g.fillStyle = "#0B0D10"; g.fillRect(0,0,w,h);
  for(let i = 0; i < w*h/38; i++){
    g.fillStyle = `rgba(150,170,190,${Math.random()*.05})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
  const sp = g.createLinearGradient(0, 0, 0, h);
  sp.addColorStop(.32, "rgba(233,237,240,0)");
  sp.addColorStop(.4, "rgba(233,237,240,.05)");
  sp.addColorStop(.48, "rgba(233,237,240,0)");
  g.fillStyle = sp; g.fillRect(0,0,w,h);
  sizeTrace();
}
function sizeTrace(){
  const cv = $("ctrace"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
  cv.getContext("2d").scale(dpr, dpr);
  deadAir();
}
let resizeT = 0;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(paintCarrierGlass, 180); });
function traceCtx(){
  const cv = $("ctrace");
  return [cv.getContext("2d"), cv.clientWidth, cv.clientHeight];
}
function deadAir(){
  /* dead air renders as dead air: one flat etched line, zero rAF running */
  const [g, w, h] = traceCtx();
  g.clearRect(0,0,w,h);
  g.fillStyle = "rgba(94,104,112,.4)";
  g.fillRect(0, h/2, w, 1);
}
function spikeRun(grains){
  /* the tail's own grains spike the glass — one seed drives sound and light */
  const [g, w, h] = traceCtx();
  const span = 150;
  for(const gr of grains){
    const x = w*.5 + (gr.at/span)*w*.45;
    const sh = 3 + gr.gain*260;
    g.fillStyle = `rgba(198,212,228,${.25 + gr.gain*8})`;
    g.fillRect(x, (h-sh)/2, 2, sh);
  }
  T.push(setTimeout(deadAir, 900));
}

/* ══ the log ══ */
function stampFor(m, dur){
  const who = (m.kind === "answer" || m.kind === "undelivered" || m.sender === "operation") ? "ATLAS" : "BRYAN";
  /* the record knows which voice spoke (card #131); analysis stays unbadged —
     it is the old default and the stamp stays clean for the common case */
  const md = (m.mode && m.mode !== "analysis" && who === "ATLAS")
    ? ` · ${esc(String(m.mode).toUpperCase())}` : "";
  if(m.kind === "tool")     return `${who}${md} · LOOKED · ${esc(rel(m.at))}`;
  if(m.kind === "proposal") return `${who}${md} · PROPOSED · ${esc(rel(m.at))}`;
  const len = dur ? ` · ${mmss(dur)}` : "";
  return `${who}${md} · ${esc(rel(m.at))}${len}`;
}
function wireRow(m){
  const el = document.createElement("div");
  const atl = m.sender === "operation";
  el.className = "sc-row " + (m.kind === "undelivered" ? "und" :
                 m.kind === "tool" ? "atl tool" : m.kind === "proposal" ? "atl prop" :
                 atl ? ("atl" + (m.read_at ? " heard" : "")) : "bry");
  el.dataset.id = m.id;
  const st = document.createElement("div"); st.className = "st";
  st.innerHTML = `<span class="who">${stampFor(m)}</span><span class="sp"></span>`;
  const bd = document.createElement("div"); bd.className = "bd";
  if(m.kind === "answer"){
    /* every word pre-wrapped ONCE, at render, through esc() — the beam's rails */
    bd.innerHTML = m.body.split(/(\s+)/).map(t =>
      /^\s+$/.test(t) ? t : `<span class="w">${esc(t)}</span>`).join("");
    const play = document.createElement("button");
    play.className = "play"; play.textContent = "▶";
    play.title = "hear it again";
    play.addEventListener("click", e => { e.stopPropagation(); hearRow(m, el, false); });
    st.insertBefore(play, st.querySelector(".sp").nextSibling);
    st.appendChild(play);
  }else if(m.kind === "undelivered"){
    bd.innerHTML = `<span class="mk">△</span> ${esc(m.body)} — your words hold; promote them if the session should read them.`;
  }else if(m.kind === "tool"){
    bd.textContent = m.body;                       // what ATLAS looked at — the record, small
  }else if(m.kind === "proposal"){
    wireProposal(m, el, bd);
  }else{
    bd.textContent = m.body;
  }
  el.appendChild(st); el.appendChild(bd);
  /* the held micro-grammar: remembering is a write (visor), directive weight
     is a signature (→19) — both are HOLDS, never taps */
  wireHold(el, m);
  return el;
}
/* a proposal row: PIN? is a chip his hold clips (the visor door, never a
   model write); an EDIT shows the diff and waits on his PHONE — the page can
   only watch the verdict land (the token is on the phone, not here) */
const WATCHED = new Map();      // aid → {el, tid}: the row currently on the glass, and its run
function wireProposal(m, el, bd){
  if(/pin\?/.test(m.title || "")){
    bd.innerHTML = `<span class="mk">◉</span> pin this? <em>${esc(m.body)}</em> — hold to clip it to the visor`;
    let t = 0, t0 = 0;
    el.addEventListener("pointerdown", e => {
      t0 = performance.now();
      t = setTimeout(async () => {
        if(performance.now() - t0 < 440) return;      // the wall clock decides
        buzz([14,26,14]);
        try{
          const r = await fetch(url("/api/pins"), { method:"POST",
            headers: hdr({"Content-Type":"application/json"}),
            body: JSON.stringify({ fact: m.body.slice(0, 500), source_thread: S.run }) });
          if(!r.ok) throw new Error("the spine answered " + r.status);
          bd.innerHTML = `<span class="mk">◉</span> clipped to the visor — <em>${esc(m.body)}</em>`;
          toast("clipped to the visor — rides in every seat from here.");
        }catch(err){ thud(); toast("not clipped — " + (err.message||err)); }
      }, 460);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => el.addEventListener(ev, () => clearTimeout(t)));
    return;
  }
  const aid = ((m.title || "").match(/→ ([0-9a-f]{12})/) || [])[1];
  const [summary, ...rest] = (m.body || "").split("\n");
  bd.innerHTML = `<span class="mk">✎</span> ${esc(summary)}` +
    (rest.length ? `<pre>${esc(rest.join("\n"))}</pre>` : "") +
    `<div class="verdict">awaiting your phone — Approve or Deny on the notification</div>`;
  if(aid) watchApproval(aid, el);
}
function watchApproval(aid, el){
  const w = WATCHED.get(aid);
  if(w){ w.el = el; return; }                    // re-rendered after a tune: watch the row that is on the glass now
  WATCHED.set(aid, { el, tid: S.run, t0: Date.now() });
  const tick = async () => {
    const cur = WATCHED.get(aid);
    if(!cur) return;
    if(Date.now() - cur.t0 > 35 * 60 * 1000){ WATCHED.delete(aid); return; }   // past any TTL — the row says expired on the next render
    try{
      const d = await grab(`/api/approvals/${aid}`);
      if(d && d.status && d.status !== "pending"){
        const v = cur.el.querySelector(".verdict");
        if(v) v.textContent = d.status === "expired" ? "EXPIRED — unanswered; nothing written"
                            : d.status.toUpperCase() + " · the receipt is in the run";
        WATCHED.delete(aid);
        if(S.run === cur.tid){
          try{   // the receipt row landed in the run (docs.on_decision) — pick it up
            const r = await grab(`/api/threads/${cur.tid}/messages`);
            const known = new Set(S.msgs.map(x => x.id));
            for(const x of (r.messages || [])) if(!known.has(x.id)) appendTurn(x);
          }catch(e){}
        }
        return;
      }
    }catch(e){ /* the watch never breaks the room */ }
    T.push(setTimeout(tick, document.visibilityState === "visible" ? 5000 : 20000));
  };
  T.push(setTimeout(tick, 5000));
}
function renderWire(){
  const w = $("wire"); w.textContent = "";
  if(!S.msgs.length){
    const q = document.createElement("div"); q.className = "sc-quiet";
    q.textContent = MODE_QUIET[S.mode] || MODE_QUIET.analysis;
    w.appendChild(q);
    /* your thumb — a chief of staff that filed a change reports its fate. Dim,
       unvoiced, glass only; never in the prompt (a verdict must not churn the
       cached prefix), never over a live run. */
    const a = S.mode === "atlas" && S.atlas && S.atlas.asks;
    if(a && Object.keys(a).some(k => k !== "newest_pending")){
      const parts = [];
      if(a.pending) parts.push(`${a.pending} change${a.pending === 1 ? "" : "s"} I filed still on your phone` +
                               (a.newest_pending ? ` (${a.newest_pending.summary})` : ""));
      for(const k of Object.keys(a)) if(k !== "pending" && k !== "newest_pending") parts.push(`${a[k]} ${k}`);
      const t = document.createElement("div"); t.className = "sc-quiet";
      t.textContent = "your thumb · " + parts.join(" · ");
      w.appendChild(t);
    }
    return;
  }
  const rows = S.msgs.slice().reverse();          // column-reverse: first = newest = bottom
  let stag = 0;
  for(const m of rows){
    const el = wireRow(m);
    if(!reduce() && stag < 8){ el.style.transitionDelay = (stag*28) + "ms"; stag++; }
    w.appendChild(el);
  }
  w.scrollTop = 0;
}
function appendTurn(m){
  const w = $("wire");
  if(!S.msgs.length) w.textContent = "";
  S.msgs.push(m);
  w.prepend(wireRow(m));                          // node-append only, never re-render mid-talk
  w.scrollTop = 0;
}

/* ══ THE LOG — the channel log (card #237) ══════════════════════════════
   The rail is retired: every channel lives behind the hamburger, and the
   law of this panel is the DIAL LIGHT — lit means on the dial, dead means
   off it. Off the dial is a MARK, never a delete: the turns are all still
   there and BACK ON returns the channel whole. ═══════════════════════════ */
function ago(iso){
  if(!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(s < 90) return "just now";
  if(s < 5400) return Math.round(s/60) + "m ago";
  if(s < 172800) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}
function logRow(t, live){
  const row = document.createElement("div");
  row.className = "lg-row" + (live ? " lit" : "") + (S.run === t.id ? " now" : "")
                + (t.unheard ? " unheard" : "") + (t.walled_at ? " walled" : "");
  row.dataset.id = t.id;

  const lamp = document.createElement("span"); lamp.className = "lamp";
  const tuneBtn = document.createElement("button");
  tuneBtn.className = "lg-tune";
  tuneBtn.title = live ? "tune to this channel" : "tune to it — it stays off the dial";
  const turns = t.turns === 1 ? "1 TURN" : `${t.turns} TURNS`;
  const when = live ? ago(t.last_at) : "OFF " + ago(t.archived_at);
  tuneBtn.innerHTML = `<span class="nm">${esc(t.name)}</span>`
    + `<span class="meta">${turns}${when ? " · " + when.toUpperCase() : ""}`
    + `${t.unheard ? ` · ${t.unheard} UNHEARD` : ""}</span>`;
  tuneBtn.addEventListener("click", () => { tune(t.id); closeLog(); });

  const acts = document.createElement("div"); acts.className = "lg-acts";
  const name = document.createElement("button");
  name.className = "lg-act"; name.textContent = "NAME";
  name.title = "name this channel";
  name.addEventListener("click", () => startRename(row, t));
  const flip = document.createElement("button");
  flip.className = "lg-act" + (live ? " off" : "");
  flip.textContent = live ? "OFF THE DIAL" : "BACK ON";
  flip.title = live ? "retire it — every turn is kept and one tap brings it back"
                    : "put it back on the dial";
  flip.addEventListener("click", () => flipDial(row, t.id, live));

  /* WALL IT — a HOLD, not a tap (his gesture grammar: a hold is constitutional
     and irreversible in meaning, and this one is). Once walled, every turn in
     the channel — including what he already said — leaves `messages` and lives
     behind the wall; there is no un-wall gesture on the glass, by design. The
     button states what it is rather than asking. */
  const wall = document.createElement("button");
  const isWalled = !!t.walled_at;
  wall.className = "lg-act" + (isWalled ? " walled" : "");
  wall.textContent = isWalled ? "WALLED" : "WALL IT";
  wall.title = isWalled
    ? "walled " + ago(t.walled_at) + " — its words are not in the open"
    : "HOLD to wall this conversation — everything said here, already said or not, goes behind the wall. There is no undo.";
  if(isWalled){
    wall.disabled = true;
  }else{
    let wt = 0, wt0 = 0;
    const armWall = e => {
      e.preventDefault();
      wt0 = performance.now();
      wall.classList.add("arming");
      wt = setTimeout(async () => {
        if(performance.now() - wt0 < 700) return;   // a longer hold than a pin: this one cannot be undone
        buzz([18,30,18,30,18]);
        wall.classList.remove("arming");
        try{
          const r = await fetch(url(`/api/threads/${t.id}/wall`), { method:"POST",
            headers: hdr({"Content-Type":"application/json"}), body: "{}" });
          const d = await r.json().catch(() => ({}));
          if(!r.ok) throw new Error(d.error || ("the spine answered " + r.status));
          wall.textContent = "WALLED"; wall.classList.add("walled"); wall.disabled = true;
          row.classList.add("walled");
          const n = d.moved || 0, w = d.wavs || 0;
          toast(`walled — ${n} turn${n===1?"":"s"} moved behind it`
                + (w ? `, ${w} voice cut${w===1?"":"s"} gathered` : "")
                + ((d.wavs_left_open||[]).length ? ` · ${d.wavs_left_open.length} cut(s) COULD NOT be moved` : ""));
          loadRuns();
        }catch(err){ thud(); toast("not walled — " + (err.message||err)); }
      }, 720);
    };
    wall.addEventListener("pointerdown", armWall);
    ["pointerup","pointerleave","pointercancel"].forEach(ev =>
      wall.addEventListener(ev, () => { clearTimeout(wt); wall.classList.remove("arming"); }));
  }
  acts.append(name, wall, flip);

  row.append(lamp, tuneBtn, acts);
  return row;
}
function renderLog(){
  const live = $("loglive"), off = $("logoff"), head = $("logoffhead");
  live.textContent = "";
  if(!S.runs.length){
    const n = document.createElement("div"); n.className = "lg-none";
    n.textContent = "nothing on the dial — open a channel.";
    live.appendChild(n);
  } else for(const t of S.runs) live.appendChild(logRow(t, true));

  const n = S.archived.length;
  head.hidden = !n;
  if(n){
    head.textContent = `${S.offOpen ? "▾" : "▸"} OFF THE DIAL · ${n}`;
    head.setAttribute("aria-expanded", S.offOpen ? "true" : "false");
  }
  off.hidden = !(n && S.offOpen);
  off.textContent = "";
  if(n && S.offOpen) for(const t of S.archived) off.appendChild(logRow(t, false));

  /* the ambient news the rail used to carry: another channel is holding
     words he has not heard. Only ANOTHER one — the tuned channel settles
     itself the moment he looks at it. */
  const news = S.runs.some(t => t.unheard && t.id !== S.run);
  $("loglamp").hidden = !news;
  paintKick();
}
function paintKick(){
  const t = S.runs.find(r => r.id === S.run) || S.archived.find(r => r.id === S.run);
  $("kick").textContent = t ? `CH 21 · ${t.name.toUpperCase()}` : "CH 21 · TWO SEATS";
}
function openLog(){
  $("logscrim").hidden = false; $("logpanel").hidden = false;
  requestAnimationFrame(() => {
    $("logscrim").classList.add("on"); $("logpanel").classList.add("on");
  });
  $("logbtn").setAttribute("aria-expanded", "true");
  loadRuns().catch(e => toast("the log is what it was — " + (e.message||e)));
  $("logclose").focus();
}
function closeLog(){
  $("logpanel").classList.remove("on"); $("logscrim").classList.remove("on");
  $("logbtn").setAttribute("aria-expanded", "false");
  setTimeout(() => { $("logpanel").hidden = true; $("logscrim").hidden = true; }, 280);
}
function logOpen(){ return !$("logpanel").hidden; }

function startRename(row, t){
  if(row.querySelector(".lg-name")) return;
  const tuneBtn = row.querySelector(".lg-tune");
  const box = document.createElement("input");
  box.className = "lg-name"; box.value = t.title || "";
  box.placeholder = t.name; box.maxLength = 80;
  let done = false;
  const finish = async (commit) => {
    if(done) return; done = true;
    const v = box.value.trim();
    box.replaceWith(tuneBtn);
    if(!commit || v === (t.title || "")) return;
    try{
      const r = await fetch(url(`/api/threads/${t.id}/rename`), { method:"POST",
        headers: hdr({"Content-Type":"application/json"}), body: JSON.stringify({ title: v }) });
      if(!r.ok) throw new Error("the spine said no");
      await loadRuns();
      toast(v ? `named — ${v}` : "name cleared — it goes back to his first words");
    }catch(e){ toast("not renamed — " + (e.message||e)); }
  };
  box.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); finish(true); }
    if(ev.key === "Escape"){ ev.preventDefault(); finish(false); }
  });
  box.addEventListener("blur", () => finish(true));
  tuneBtn.replaceWith(box);
  box.focus(); box.select();
}

async function flipDial(row, tid, live){
  /* the light dies BEFORE the row leaves, and only once the spine has said
     it landed — nothing here animates on hope. The write and the after-work
     are DIFFERENT try blocks on purpose: a failure after the 200 must not
     report "nothing was written" over a mark that landed. */
  try{
    const r = await fetch(url(`/api/threads/${tid}/archive`), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}),
      body: JSON.stringify({ on: live }) });
    if(!r.ok){
      const why = await r.json().catch(() => ({}));
      throw new Error(why.error || `the spine answered ${r.status}`);
    }
  }catch(e){ toast("nothing was written — " + (e.message||e)); return; }

  try{
    row.classList.remove("lit");
    await new Promise(res => setTimeout(res, 190));
    row.classList.add("going");
    await new Promise(res => setTimeout(res, 190));
    const wasHis = live && S.run === tid;
    if(wasHis){
      /* he retired the channel he is sitting in — tune to the next one on
         the dial rather than leaving him keyed to nothing, and if there is
         no next one, clear the glass: the retired channel's words must not
         sit there looking live. */
      S.run = null; S.msgs = []; renderWire();
    }
    await loadRuns();
    if(wasHis && S.runs.length) await tune(S.runs[0].id);
    toast(live ? "off the dial — every turn kept, one tap brings it back"
               : "back on the dial");
  }catch(e){
    toast((live ? "it went off the dial" : "it is back on the dial")
          + ", but the log did not redraw — " + (e.message||e));
  }
}

async function loadRuns(){
  const d = await grab("/api/threads");
  S.runs = d.runs || [];
  S.archived = d.archived || [];
  renderLog();
}
async function tune(tid){
  stopPlayback(); clearWait(); sweepVox();
  if(S.stream){ try{ S.stream.abort(); }catch(e){} S.stream = null; }   // the turn continues on the spine; this glass stops watching
  S.run = tid;
  const d = await grab(`/api/threads/${tid}/messages`);
  S.msgs = d.messages || [];
  renderLog(); renderWire();
  heard();
}
async function newRun(){
  try{
    const d = await fetch(url("/api/threads"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}), body:"{}" }).then(r => r.json());
    if(!d.id) throw new Error("no id");
    await loadRuns(); await tune(d.id);
    if(logOpen()) closeLog();
  }catch(e){ toast("no new channel — " + (e.message||e)); }
}
function heard(){
  /* his eyes on the run — only from a visible document; rendered is not heard */
  if(document.visibilityState !== "visible" || !S.run) return;
  const had = S.msgs.some(m => m.sender === "operation" && !m.read_at);
  if(!had) return;
  fetch(url(`/api/threads/${S.run}/heard`), { method:"POST", headers: hdr({"Content-Type":"application/json"}), body:"{}" })
    .then(() => { S.msgs.forEach(m => { if(!m.read_at) m.read_at = "now"; }); loadRuns(); })
    .catch(()=>{});
}

/* ══ THE BREAK — the hero. tail → 60ms of nothing → the voice, light walking the words ══ */
async function fetchVoice(id){
  /* cached per row — a replay over 5G must not refetch 150KB; the cache owns
     every object URL and tune()/pagehide sweep them */
  if(S.vox.has(id)) return S.vox.get(id);
  const r = await fetch(url(`/api/voice/${id}`), { headers: hdr() });
  if(!r.ok) return null;
  const obj = URL.createObjectURL(await r.blob());
  S.vox.set(id, obj);
  return obj;
}
function sweepVox(){
  S.vox.forEach(o => URL.revokeObjectURL(o));
  S.vox.clear();
}
function wordTimes(el, dur){
  /* char-weighted windows over the clip's REAL duration — Kokoro dwells on
     numbers naturally; the figures become beats without a fabricated ms */
  const ws = [...el.querySelectorAll(".w")];
  const total = ws.reduce((n, w) => n + w.textContent.length, 0) || 1;
  let t = 0;
  return ws.map(w => {
    const span = dur * (w.textContent.length / total);
    const win = { w, from: t, to: t + span };
    t += span; return win;
  });
}
/* sentence clips (card #224): the voice starts on the first finished sentence
   while ATLAS is still generating — buddy's signature moment. Gated like an
   arrival (visible, not muted); a tune, a pagehide or a new turn stops them;
   the ▶ replay is the full WAV cut at the end, never both at once. */
const CLIPS = { q: [], busy: false, gen: 0, audio: null, played: 0, dropped: 0, sayId: null, closed: true, voicedFinal: null, tag: "ATL" };
function stopClips(){
  CLIPS.gen++; CLIPS.dropped += CLIPS.q.length; CLIPS.q.length = 0; CLIPS.busy = false;
  if(CLIPS.audio){ try{ CLIPS.audio.pause(); }catch(e){} CLIPS.audio = null; }
}
function queueClip(sayId, n){
  if(muted() || document.visibilityState !== "visible"){ CLIPS.dropped++; return; }
  CLIPS.q.push({ sayId, n });
  if(!CLIPS.busy) playClips();
}
async function playClips(){
  CLIPS.busy = true;
  const gen = CLIPS.gen;
  while(CLIPS.q.length && gen === CLIPS.gen){
    const { sayId, n } = CLIPS.q.shift();
    let obj = null;
    try{
      const r = await fetch(url(`/api/atlas/voice/${sayId}/${n}`), { headers: hdr() });
      if(!r.ok){ CLIPS.dropped++; continue; }
      obj = URL.createObjectURL(await r.blob());
      if(gen !== CLIPS.gen) break;
      if(CLIPS.played === 0 && !muted()){       // the channel opens once: tail → the cut
        spikeRun(squelchTail());
        await new Promise(res => T.push(setTimeout(res, 190)));
        if(gen !== CLIPS.gen) break;
      }
      const a = new Audio(obj); CLIPS.audio = a;
      arc("arc", true); stateWord(`${CLIPS.tag || "ATL"} · SPEAKING`);
      await new Promise(res => {
        a.addEventListener("ended", res, { once:true });
        a.addEventListener("error", res, { once:true });
        a.play().catch(res);
      });
      if(gen === CLIPS.gen) CLIPS.played++;
    }catch(e){ CLIPS.dropped++; }
    finally{ if(obj) URL.revokeObjectURL(obj); }
  }
  if(gen === CLIPS.gen){ CLIPS.busy = false; CLIPS.audio = null; arc("arc", false); }
}
function stopPlayback(){
  stopClips();
  if(S.audio){ try{ S.audio.pause(); }catch(e){} }
  cancelAnimationFrame(S.beamRaf); S.beamRaf = 0;
  S.audio = null; S.playingRow = 0;
  arc("arc", false); deadAir(); stateWord();
}
async function hearRow(m, el, isArrival){
  /* three-gate law rides the caller for arrivals; a ▶ tap is the gesture gate.
     THE GENERATION TOKEN (his first-contact catch, 08-11): every await below
     is a window for a second tap; a stale invocation must die at each one or
     two voices play over each other. */
  const gen = ++S.gen;
  stopPlayback();
  const pb = el.querySelector(".play");
  if(pb){ pb.textContent = "…"; pb.disabled = true; }   // a slow fetch must read as WORKING
  const restore = () => { if(pb){ pb.textContent = "▶"; pb.disabled = false; } };
  let obj = await fetchVoice(m.id);
  if(gen !== S.gen){ restore(); return; }
  if(!obj && isArrival){
    /* the row lands before the WAV finishes cutting (~5s of synth trails the
       write) — an arrival waits for its voice a few beats before conceding */
    for(let i = 0; i < 4 && !obj; i++){
      await new Promise(res => T.push(setTimeout(res, 2200)));
      if(gen !== S.gen){ restore(); return; }
      obj = await fetchVoice(m.id);
    }
    if(gen !== S.gen){ restore(); return; }
    if(!obj){ restore(); markDone(el); S.reopenMic?.(); return; }   // the text stands; no consolation beep
  }
  if(!obj){ restore(); toast("no voice for this row — the text is the record"); return; }
  if(isArrival && !muted()){
    const grains = squelchTail();          // the channel opens…
    spikeRun(grains);
    await new Promise(res => T.push(setTimeout(res, 190)));  // tail + the cut
    if(gen !== S.gen){ restore(); return; }
  }
  restore();
  const a = new Audio(obj);
  S.audio = a; S.playingRow = m.id;
  try{
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "ATLAS", artist: "SIDE CHANNEL · ALMANAC" });
      navigator.mediaSession.setActionHandler("play",  () => a.play());
      navigator.mediaSession.setActionHandler("pause", () => a.pause());
    }
  }catch(e){}
  if(muted()){ settleRow(m, el, a); S.reopenMic?.(); return; }
  try{ await a.play(); }catch(e){
    /* autoplay refused (no gesture yet) — the row stands, ▶ is the door */
    if(gen === S.gen){ stopPlayback(); markDone(el); }
    S.reopenMic?.(); return;
  }
  if(gen !== S.gen){ try{ a.pause(); }catch(e){} return; }
  arc("arc", true); stateWord("SPEAKING");
  const bd = el.querySelector(".bd");
  /* THE BEAM WALKS (card #210). wordTimes(bd, 0) returned one ZERO-WIDTH
     window PER WORD — a non-empty array — so the `!wins.length` refill
     guard below never fired and every window stayed {from:0,to:0}: every
     word lit on frame one (t >= 0 always) and none ever walked (t < 0
     never). Seed EMPTY so the guard fills it ONCE against the clip's real
     decoded duration — the same fix #91 proved in detent.html. */
  const wins = [];  // filled once a.duration is known (see paint)
  const paint = () => {
    if(!S.audio || S.audio !== a) return;
    const t = a.currentTime, dur = a.duration || 0;
    if(dur && !wins.length && !reduce()) wins.push(...wordTimes(bd, dur));
    if(reduce()){ bd.querySelectorAll(".w").forEach(w => w.classList.add("lit")); }
    else{
      for(const win of wins){
        const on = t >= win.from;
        win.w.classList.toggle("lit", on);
        win.w.classList.toggle("now", on && t < win.to);
      }
    }
    drawPlayhead(m, a);
    if(!a.paused && !a.ended) S.beamRaf = requestAnimationFrame(paint);
  };
  S.beamRaf = requestAnimationFrame(paint);
  a.addEventListener("ended", () => {
    T.push(setTimeout(() => { settleRow(m, el, a);
      if(S.audio === a) stopPlayback();   // never tear down a newer playback
      S.reopenMic?.();                    // the loop: his mic again
    }, 240));
  }, { once:true });
}
function markDone(el){ el.classList.add("done"); el.querySelectorAll(".w").forEach(w => { w.classList.add("lit"); w.classList.remove("now"); }); }
async function settleRow(m, el, a){
  /* SETTLE-TO-TAPE: the exchange is now tape you can see */
  markDone(el);
  const dur = a && a.duration;
  if(dur){ const who = el.querySelector(".who"); if(who) who.textContent = stampFor(m, dur); }
  try{
    const vox = S.vox.get(m.id);
    if(!S.peaks.has(m.id) && vox){
      const buf = await (await fetch(vox)).arrayBuffer();
      const oc = new OfflineAudioContext(1, 16000, 16000);
      const dec = await oc.decodeAudioData(buf.slice(0));
      const ch = dec.getChannelData(0), n = 180, out = new Array(n).fill(0);
      const step = Math.max(1, Math.floor(ch.length / n));
      for(let i = 0; i < n; i++){
        let mx = 0;
        for(let j = i*step; j < Math.min(ch.length, (i+1)*step); j += 16)
          mx = Math.max(mx, Math.abs(ch[j]));
        out[i] = mx;
      }
      S.peaks.set(m.id, out);
    }
  }catch(e){}
  const pk = S.peaks.get(m.id);
  if(pk && !el.querySelector(".sc-tape")){
    const cv = document.createElement("canvas");
    cv.className = "sc-tape"; cv.width = 360; cv.height = 12;
    const g = cv.getContext("2d"); g.fillStyle = "#5E6870";
    pk.forEach((v, i) => { const h = 1 + v*10; g.fillRect(i*2, (12-h)/2, 1.4, h); });
    el.querySelector(".bd").after(cv);
  }
  heard();
}
function drawPlayhead(m, a){
  const pk = S.peaks.get(m.id);
  const [g, w, h] = traceCtx();
  g.clearRect(0,0,w,h);
  const dur = a.duration || 1, frac = Math.min(1, a.currentTime / dur);
  if(pk){
    /* the answer's real peaks scroll past a fixed playhead */
    const px = w*.5;
    pk.forEach((v, i) => {
      const x = px + (i/pk.length - frac) * w * .9;
      if(x < 0 || x > w) return;
      const sh = 2 + v*(h-8);
      g.fillStyle = i/pk.length <= frac ? "rgba(198,212,228,.7)" : "rgba(94,104,112,.5)";
      g.fillRect(x, (h-sh)/2, 1.6, sh);
    });
    g.fillStyle = "rgba(233,237,240,.9)"; g.fillRect(px, 3, 1, h-6);
  }else{
    g.fillStyle = "rgba(198,212,228,.6)";
    g.fillRect(0, h/2, w*frac, 1.5);
  }
}
/* peaks may not exist until first decode — kick a decode as soon as playback starts */
async function primePeaks(m){
  const vox = S.vox.get(m.id);
  if(S.peaks.has(m.id) || !vox) return;
  try{
    const buf = await (await fetch(vox)).arrayBuffer();
    const oc = new OfflineAudioContext(1, 16000, 16000);
    const dec = await oc.decodeAudioData(buf.slice(0));
    const ch = dec.getChannelData(0), n = 180, out = new Array(n).fill(0);
    const step = Math.max(1, Math.floor(ch.length / n));
    for(let i = 0; i < n; i++){
      let mx = 0;
      for(let j = i*step; j < Math.min(ch.length, (i+1)*step); j += 16)
        mx = Math.max(mx, Math.abs(ch[j]));
      out[i] = mx;
    }
    S.peaks.set(m.id, out);
  }catch(e){}
}

/* ══ the dead-air watch — the honest clock, the follow, the arrival ══ */
function stateWord(w){
  const el = $("state");
  if(w){ el.textContent = w; return; }
  if(S.waiting){
    el.textContent = `ATL HAS THE MIC · ${mmss((Date.now() - S.waiting.t0)/1000)}`;
  }else el.textContent = "QUIET";
}
function clearWait(){
  if(!S.waiting) return;
  clearInterval(S.waiting.clockT); clearTimeout(S.waiting.followT);
  S.waiting = null; arc("atl", false); stateWord();
  releaseWake();
}
function startWait(sayId){
  clearWait();
  S.waiting = { sayId, t0: Date.now(), clockT: 0, followT: 0 };
  arc("atl", true); stateWord(); deadAir();
  S.waiting.clockT = setInterval(stateWord, 1000);
  holdWake();
  follow();
}
function follow(){
  if(!S.waiting) return;
  if(Date.now() - S.waiting.t0 > 360000){ clearWait(); return; }   // 6-min cap
  S.waiting.followT = setTimeout(async () => {
    if(!S.waiting) return;
    if(document.visibilityState !== "visible"){ follow(); return } // clock keeps true time
    try{
      const d = await grab(`/api/threads/${S.run}/messages`);
      const known = new Set(S.msgs.map(m => m.id));
      const fresh = (d.messages || []).filter(m => !known.has(m.id));
      /* an ANSWER lands the turn — a tool row or a proposal chip (atlas) is
         the turn still working, never its end */
      const landed = fresh.find(m => m.sender === "operation" && m.id > S.waiting.sayId &&
                                     (m.kind === "answer" || m.kind === "undelivered"));
      if(landed){
        const sayId = S.waiting.sayId; clearWait();
        for(const m of fresh) appendTurn(m);
        const el = $("wire").querySelector(`[data-id="${landed.id}"]`);
        if(landed.kind === "answer" && el && landed.mode === "brainstorm"){
          /* THE PAD HAS NO VOICE (his ruling 2026-09-13): the text IS the turn.
             hearRow would sit ~9s waiting for a clip that is never cut. And the
             read-back files its pin? chips AFTER this row — keep looking. */
          markDone(el); S.reopenMic?.(); afterglow(sayId);
        }else if(landed.kind === "answer" && el && CLIPS.played > 0 && CLIPS.sayId === sayId){
          markDone(el); S.reopenMic?.(); primePeaks(landed).catch?.(() => {});   // the clips already spoke this one
        }else if(landed.kind === "answer" && el && document.visibilityState === "visible"){
          hearRow(landed, el, true).then(() => primePeaks(landed));  // THE BREAK

/* THE DEAD AIR WAS THE POLL, NOT THE MODEL (2026-09-13, his "it was slow").
   The answer row lands in the DB the moment the seat finishes — brain.py writes
   it BEFORE it cuts the voice — and this loop then sat on a flat 5,000ms timer,
   so every turn carried up to five seconds of pure waiting after it was already
   answered, 2.5s on average. Measured against a chat turn that now takes 3-5s of
   model time, the poll was as much of the wait as the thinking.
   Fast while he is watching the arc, backing off as the turn gets long so a slow
   or cold seat does not get hammered for six minutes. */
function followDelay(){
  const waited = S.waiting ? Date.now() - S.waiting.t0 : 0;
  /* 600ms WAS TOO GREEDY AND IT COST HIM THE ROOM (2026-09-13). v159 took this
     from a flat 5,000ms to 600ms, which is EIGHT TIMES the request rate — and
     every one of these is cross-origin from the Pages shell to the tailnet
     spine, so each poll drags a CORS preflight behind it: ~200 requests a
     minute per open tab. His spine's log filled with "Request timed out" on
     /api/threads/<id>/messages, /api/voice/<id> and even POST /api/hotshot/route,
     and the symptom on the glass was exactly what he reported: no answer, and
     the mic's own POST to /api/stt timing out with it. I made the poll faster
     and the room slower.
     1,400ms still halves the old dead air (2.5s average -> 0.7s) at a quarter of
     the traffic. The real fix for snap is the stream, not a tighter loop. */
  if(waited <  20000) return 1400;   // the snap window — most chat turns land here
  if(waited <  60000) return 2500;   // a working turn (tools, a cold seat)
  if(waited < 120000) return 4000;
  return 5000;                       // a long haul: the old cadence
}
/* the pad's afterglow: the read-back runs on the worker after the answer lands
   (every third of his lines), so its chips arrive seconds later than the row
   that ended the wait. Three looks, six seconds apart, appending anything new. */
function afterglow(sayId){
  let looks = 0;
  const look = async () => {
    if(looks++ >= 3 || S.waiting) return;   // never poll on top of a live wait
    try{
      const d = await grab(`/api/threads/${S.run}/messages`);
      const known = new Set(S.msgs.map(m => m.id));
      for(const m of (d.messages || [])) if(!known.has(m.id) && m.id > sayId) appendTurn(m);
    }catch(e){ /* the afterglow never breaks the room */ }
    T.push(setTimeout(look, 6000));
  };
  T.push(setTimeout(look, 6000));
}
let WAKE = null;
async function holdWake(){ try{ WAKE = await navigator.wakeLock?.request("screen"); }catch(e){} }
function releaseWake(){ try{ WAKE?.release(); }catch(e){} WAKE = null; }

/* ══ ATLAS — the streamed turn (card #224). A POST read with a reader, never
   EventSource: the worker copies same-origin GETs. Resolves as soon as the
   say row lands (meta) so the key releases; the stream keeps painting. If the
   stream never opens, the legacy /say door answers in the same voice; if it
   dies mid-turn the row still lands and the poll finishes the job. ══ */
async function sendAtlas(body, key){
  if(S.stream){ try{ S.stream.abort(); }catch(e){} S.stream = null; }
  const ctrl = new AbortController(); S.stream = ctrl;
  const mode = S.mode === "chat" ? "chat" : "atlas";   // #256: chat rides the same reader
  const fix = mode === "atlas" ? await freshFix() : null;   // where the truck is — atlas only, this request only
  /* nine seconds to HEADERS, same as the legacy door — a dead tailnet must
     not hold the key at KEYED; the AbortError lands in wireKey's own words */
  const hdrT = setTimeout(() => ctrl.abort(), 9000);
  let r;
  try{
    r = await fetch(url(`/api/threads/${S.run}/${mode === "atlas" ? "atlas" : "stream"}`), { method:"POST",
      headers: hdr({"Content-Type":"application/json",
        "Idempotency-Key": key || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()))}),
      body: JSON.stringify(mode === "atlas"
        ? { body, gear: S.gear, web: S.web,
            origin: fix ? { lat: fix.lat, lng: fix.lng, age_s: Math.round((Date.now() - GEO.at)/1000) } : null }
        : { body, mode }),
      signal: ctrl.signal });
    clearTimeout(hdrT);
  }catch(err){ clearTimeout(hdrT); S.stream = null; throw err; }
  if(!r.ok){
    S.stream = null;
    const d = await r.json().catch(() => ({}));
    if(r.status === 409 && d.code === "off") refreshAtlas();
    /* the door said no in words and nothing was written: an older spine (405),
       a WALLED channel or a mode this door does not carry (409) — the legacy
       /say door answers in the same voice, its voice path behind the wall */
    if(r.status === 405 || (r.status === 409 && (d.code === "walled" || d.code === "mode")))
      return sendLegacyAtlas(body, key, mode);
    throw new Error(d.error || ("the spine answered " + r.status));
  }
  if(!(r.headers.get("Content-Type") || "").includes("text/event-stream") || !r.body){
    /* a 200 that is not a stream: the say row may still have landed — never
       re-say; find it in the run */
    S.stream = null;
    return recoverAtlas(body, key, true);
  }
  return new Promise((resolve, reject) => {
    let settled = false;
    const meta = ev => { if(!settled){ settled = true; resolve({ id: ev.say_id, answering: true }); } };
    const guard = setTimeout(() => {           // no meta in 20 s: the turn never started
      if(settled) return;
      settled = true; try{ ctrl.abort(); }catch(e){}
      recoverAtlas(body, key, true).then(resolve, reject);   // the POST was a 200: the row exists
    }, 20000);
    readAtlasStream(r, body, ctrl, ev => { clearTimeout(guard); meta(ev); }, mode)
      .then(() => { clearTimeout(guard); if(!settled){ settled = true; resolve({ id: null, answering: false }); } })
      .catch(err => { clearTimeout(guard); if(!settled){ settled = true; reject(err); } });
  });
}
async function readAtlasStream(r, body, ctrl, onMeta, mode = "atlas"){
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", sayId = null, live = null, liveBd = null, text = "", done = false;
  const seen = new Set();
  const tag = mode === "chat" ? "CHAT" : "ATL";   // #256: the same reader, the seat's own name
  CLIPS.tag = tag;
  arc("atl", true); holdWake(); stateWord(`${tag} · LISTENING`);
  const ensureLive = () => {
    if(live) return;
    live = document.createElement("div"); live.className = "sc-row atl live"; live.dataset.id = "live";
    const st = document.createElement("div"); st.className = "st";
    st.innerHTML = `<span class="who">ATLAS${mode === "chat" ? " · CHAT" : S.gear === "deep" ? " · DEEP" : ""} · now</span><span class="sp"></span>`;

    live.appendChild(st); live.appendChild(liveBd);

  };

  const refill = async () => {   // whatever landed in the run that this glass has not seen
    try{
      const d = await grab(`/api/threads/${S.run}/messages`);
      const known = new Set(S.msgs.map(x => x.id));
      for(const x of (d.messages || [])) if(!known.has(x.id)) appendTurn(x);
    }catch(e){}
  };

    if(ev.t === "meta"){
      sayId = ev.say_id; rogerBeep(); buzz([14,26,14]);
      stopClips(); CLIPS.played = 0; CLIPS.dropped = 0; CLIPS.sayId = sayId; CLIPS.closed = false; CLIPS.voicedFinal = null;   // a new turn: whatever was speaking stops
      appendTurn({ id: sayId, at: new Date().toISOString(), sender:"bryan", kind:"say", body, thread_id: S.run, mode });
      ensureLive(); stateWord(ev.gear === "deep" ? `${tag} · DEEP · CLAUDE` : `${tag} · THINKING`);
      onMeta && onMeta(ev);
      T.push(setTimeout(refill, 4000));   // a turn this key abandoned lands its rows on the glass anyway
    }else if(ev.t === "status"){
      const s = String(ev.text || "");
      if(/^DEEP is dark|^answering on the local seat|^Claude declined/.test(s)){
        text = ""; if(liveBd) liveBd.textContent = ""; stopClips();   // Claude's half is not the answer
      }
      stateWord(`${tag} · ` + s.toUpperCase());
    }else if(ev.t === "voiced"){
      CLIPS.voicedFinal = ev.n;                    // the spine's final count of clips actually cut
    }else if(ev.t === "token"){
      ensureLive(); text += ev.c; liveBd.textContent = text; stateWord(`${tag} · SPEAKING`);
    }else if(ev.t === "tool"){
      /* a preface before a tool call is not the answer — the row clears and the
         stamp says what it reaches for */
      text = ""; if(liveBd) liveBd.textContent = "";
      stateWord(`${tag} · ` + (ev.names || []).join(", ").toUpperCase());
    }else if(ev.t === "think"){
      stateWord(`${tag} · THINKING · ` + ev.n);
    }else if(ev.t === "row"){
      if(ev.row && !seen.has(ev.row.id)){ seen.add(ev.row.id); dropLive(); appendTurn(ev.row); }
    }else if(ev.t === "flag"){
      toast("withheld — " + ev.text);
    }else if(ev.t === "voice"){
      queueClip(ev.say_id, ev.n);                 // the first sentence speaks before the last is written
    }else if(ev.t === "done"){
      done = true; dropLive();
      const m = { id: ev.id, at: new Date().toISOString(), sender:"operation", kind:"answer",
                  body: ev.body, thread_id: S.run, mode, read_at: null };
      appendTurn(m);
      const el = $("wire").querySelector(`[data-id="${m.id}"]`);
      if(ev.flags && ev.flags.length && el)
        el.querySelector(".st").insertAdjacentHTML("beforeend",
          `<span class="sc-flag" title="${esc(ev.flags.join(", "))}">FIGURE WITHHELD</span>`);
      arc("atl", false); stateWord(); releaseWake();
      if(ev.voiced && el){
        /* the clips ARE the arrival — wait for the ones still in the air, then
           light the words; the full WAV stays behind ▶ for a replay. The wait
           ends when the spine's final count is met, or when the stream has
           closed and nothing is playing (a clip that never came is not waited
           for), or at 30 s — whichever is first. */
        const t0 = Date.now(); let quietSince = 0;
        const settle = () => {
          const want = CLIPS.voicedFinal ?? ev.voiced;
          const heard = CLIPS.played + CLIPS.dropped;
          const idle = !CLIPS.busy && !CLIPS.q.length;
          if(idle && CLIPS.closed){ if(!quietSince) quietSince = Date.now(); }else quietSince = 0;
          const drained = idle && (heard >= want || (quietSince && Date.now() - quietSince > 1500));
          if(!drained && Date.now() - t0 < 30000){ T.push(setTimeout(settle, 250)); return; }
          markDone(el); arc("arc", false); stateWord(); S.reopenMic?.();
          primePeaks(m).catch?.(() => {});
        };
        settle();
      }else if(el && document.visibilityState === "visible"){
        hearRow(m, el, true).then(() => primePeaks(m));  // THE BREAK
      }
      await refill();      // tool rows or chips this glass missed land now, not at the next tune
      loadRuns();
    }else if(ev.t === "error"){
      done = true; dropLive(); stopClips();
      arc("atl", false); stateWord(); releaseWake(); thud(); buzz([12,70,12]);
      toast(ev.error || "ATLAS could not answer — your words hold");
      if(ev.code === "off") refreshAtlas();

    }

    while(true){

  }finally{

    if(S.stream === ctrl) S.stream = null;
  }
  if(!done && !ctrl.signal.aborted){
    /* the stream died mid-turn — the row still lands; the poll finishes the job.
       Clips that already played are not spoken twice by the poll's arrival. */
    dropLive(); stopClips();
    if(sayId) startWait(sayId); else await recoverAtlas(body, null, true);

}
async function recoverAtlas(body, key, landed){
  /* landed = the atlas POST answered 200, so his words ARE in the run: find the
     row and wait on it — never re-say through the legacy door, or one
     transmission becomes two turns. Only a door that never opened falls back. */
  for(let i = 0; i < (landed ? 3 : 1); i++){
    try{
      const d = await grab(`/api/threads/${S.run}/messages`);
      const mine = (d.messages || []).filter(m => m.sender === "bryan" && m.kind === "say" && m.body === body).pop();
      if(mine){
        if(!S.msgs.some(x => x.id === mine.id)) appendTurn(mine);
        startWait(mine.id);
        return { id: mine.id, answering: true };
      }
      if(landed) break;      // the run answered and the row is not there: nothing to wait on
    }catch(e){ if(landed) await new Promise(res => T.push(setTimeout(res, 2000))); }
  }
  if(landed){
    toast("the spine has your words — the answer lands in the run; tune back if the glass goes quiet");
    T.push(setTimeout(() => tune(S.run), 6000));
    return { id: null, answering: true };
  }
  return sendLegacyAtlas(body, key);
}
async function sendLegacyAtlas(body, key, mode = "atlas"){
  /* the spawn path: /say with the mode → brain.companion's branch for it —
     the same voice (and, for atlas, the tools), painted when it lands rather
     than as it speaks; a walled chat channel always takes this door (#256) */
  const r = await fetch(url(`/api/threads/${S.run}/say`), { method:"POST",
    headers: hdr({"Content-Type":"application/json",
      "Idempotency-Key": key || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()))}),
    body: JSON.stringify({ body, mode }) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || ("the spine answered " + r.status));
  rogerBeep(); buzz([14,26,14]);
  appendTurn({ id: d.id, at: new Date().toISOString(), sender:"bryan", kind:"say", body, thread_id: S.run, mode });
  if(d.answering) startWait(d.id);
  else toast("sent — but ATLAS could not take the mic; the turn stands");
  loadRuns();
  return d;
}

/* ══ the transmission itself — one door for typed and spoken turns ══ */
async function sendTurn(body, key){
  if(S.mode === "atlas" || S.mode === "chat") return sendAtlas(body, key);   // #224 atlas · #256 chat: the streamed doors

      body: JSON.stringify({ body, mode: S.mode }), signal: ctrl.signal });
