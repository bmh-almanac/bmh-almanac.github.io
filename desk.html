<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080A" id="metaTheme">
<title>Almanac — the desk</title>
<script>/* PAPER MODE boots before first paint — a flash of the wrong theme reads
as a broken instrument. The class lands on <html> so every :root.paper rule
and every canvas ink helper can read one source of truth. */
try{ if(localStorage.getItem("almanac_theme")==="paper")
  document.documentElement.classList.add("paper"); }catch(e){}</script>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<!-- Leaflet, vendored (sw-cached): the book's live map — OSM tiles, no key,
     $0 by design. The static-bytes map remains the fallback words. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
/* ══ THE DESK ══════════════════════════════════════════════════════════
   Bryan's ruling, 2026-07-27: the orb field is the world; the rooms live
   underneath it in the same light.

   TWO AXES, NEVER CONFUSED
     HUE         = identity. Which domain you are standing in. This is how
                   depth stays navigable — a new domain is one more orb,
                   never a seventh tab.
     TEMPERATURE = state. The room is cold while the month is covered and
                   the machines answer; it goes hot when SERVED numbers earn
                   it, and the banner names the facts that turned it. Honest,
                   not grim: it cools the moment one load covers the gap.
                   Temperature is DERIVED, never a mood switch.

   THE PAGE COMPUTES NOTHING. Every figure is fetched. Needle positions and
   bar widths are drawn FROM served figures — that is rendering, not
   arithmetic, and no number is ever derived here that the spine did not say.

   A CLOSE IS A WRITE. QA cards close under a held control, never a tap, and
   only Bryan closes them (creed: qa-gate). */
:root{
  --void:#07080A; --glass:rgba(30,36,44,.86); --glass2:rgba(20,25,31,.9);
  --line:rgba(150,170,190,.15);
  --ink:#E9EDF0; --mid:#AEB8C0; --dim:#8B96A0; --etch:#5E6870;
  --amber:#FFA419; --hot:#FF3B18; --unknown:#6E6E6E;
  --key:255,164,25;
  /* triplets so alpha stays local: wash = hairline/label ink over the ground,
     hot-rgb = the signal red, panel/panel2 = tooltip + input surfaces */
  --wash:255,255,255; --hot-rgb:255,59,24;
  --panel:#12161c; --panel2:#101317;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
/* ══ PAPER MODE — the same almanac, printed ═══════════════════════════
   The night desk is the barn after dark; paper is the book itself — aged
   stock, iron-gall ink, ochre where the night ran amber, a deeper signal
   red that still reads on cream. HUE stays identity, TEMPERATURE stays
   state — only the ground changes. Toggled by the masthead lamp, kept in
   localStorage(almanac_theme), booted before first paint in <head>. */
:root.paper{
  --void:#EAE0C9; --glass:rgba(247,240,224,.92); --glass2:rgba(243,235,215,.94);
  --line:rgba(70,56,32,.24);
  --ink:#221A0E; --mid:#4E4230; --dim:#6E5F45; --etch:#8A7A5C;
  --amber:#8F5A00; --hot:#B3271A; --unknown:#7A756B;
  --key:143,90,0;
  --wash:34,26,12; --hot-rgb:179,39,26;
  --panel:#F3EBD6; --panel2:#EFE6CE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{font-family:var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none}

.sky{position:fixed;inset:0;z-index:0;transition:background 1s ease;
  background:radial-gradient(1100px 700px at 50% 40%, rgba(38,48,66,.55), transparent 70%),
             radial-gradient(760px 520px at 14% 76%, rgba(52,34,24,.34), transparent 70%), var(--void)}
body.hot .sky{background:radial-gradient(1200px 760px at 50% 30%, rgba(96,20,10,.55), transparent 70%),
             radial-gradient(760px 520px at 14% 78%, rgba(70,14,8,.42), transparent 70%), #0B0403}
canvas.stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.42;
  background-image:linear-gradient(rgba(130,150,165,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(130,150,165,.05) 1px,transparent 1px);
  background-size:132px 132px}
.stage{position:relative;z-index:2;width:100%;height:100vh;display:flex;flex-direction:column}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:16px 26px;
  transition:padding .5s cubic-bezier(.22,.61,.36,1)}
/* INSIDE A ROOM THE MASTHEAD STANDS DOWN. Bryan, 2026-07-29: "reduce the size
   of top bar to give more real-estate for the info below." On the field the
   chrome is the frame; in a room it is a nameplate over the work, and every
   pixel it holds is a pixel of ledger he cannot see. The orb rail shrinks with
   it — the orbs stay reachable, they just stop being the subject. */
.stage.entered .bar{padding:7px 26px 6px}
.stage.entered .wm{font-size:11.5px;letter-spacing:.3em}
.stage.entered .bar .d,.stage.entered .bar .hand{font-size:8.5px}
.stage.entered .bar .hand{padding:4px 8px 3px}
.stage.entered .why{padding:6px 12px;font-size:11.5px}
.wm{font:700 14px/1 var(--mono);letter-spacing:.38em}
.bar .d{font:700 10px/1 var(--mono);letter-spacing:.19em;color:var(--dim)}
/* The docket door wears a handle (card #86): a bordered pill in the desk's
   own chip language + a chevron that says "opens". A clean docket renders
   empty text — :empty keeps the pill from standing as a hollow lozenge. */
.bar .hand{font:700 10px/1 var(--mono);letter-spacing:.19em;color:var(--amber);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(var(--key),.45);
  border-radius:999px;padding:6px 11px 5px;white-space:nowrap;
  transition:border-color .3s,background .3s}
.bar .hand::after{content:"\25B8";font-size:8px;opacity:.75}
.bar .hand:hover{border-color:var(--amber);background:rgba(var(--key),.08)}
.bar .hand:empty{display:none}
.bar .hand:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
.bar .hand.unk{color:var(--hot);border-color:rgba(255,80,60,.5)}
/* ══ THE DOCKET — the clipboard at the dock ═══════════════════════════ */
.dockwrap{position:fixed;inset:0;z-index:60}
.dockback{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.docket{position:absolute;top:0;right:0;bottom:0;width:min(430px,94vw);
  background:linear-gradient(200deg,rgba(30,26,20,.99),rgba(14,13,11,.99));
  border-left:1px solid rgba(var(--key),.35);box-shadow:-18px 0 48px rgba(0,0,0,.55);
  overflow-y:auto;padding:16px 14px 24px;display:flex;flex-direction:column;gap:10px}
.docket .dhead{display:flex;align-items:baseline;gap:10px}
.docket .dhead .t{font:700 13px/1 var(--mono);letter-spacing:.22em;color:var(--amber)}
.docket .dhead .n{font:400 10px/1 var(--mono);color:var(--dim)}
.docket .dhead .x{margin-left:auto;font:700 11px/1 var(--mono);color:var(--dim);
  background:none;border:1px solid var(--line);border-radius:6px;padding:11px 14px;
  min-height:40px;cursor:pointer}
.docket .tierlab{font:700 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--dim);
  margin-top:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
/* dchip/dwhy/t-front, NOT chip/why/front — the desk styles those names
   globally and the collision uppercased every fold row (review of #84) */
.docket .drow{display:flex;align-items:center;gap:10px;padding:8px 2px;
  border-bottom:1px dashed rgba(var(--wash),.07)}
.docket .drow .dchip{flex:0 0 auto;font:700 8.5px/1 var(--mono);letter-spacing:.08em;
  color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.docket .drow.t-front .dchip{color:var(--hot);border-color:rgba(255,80,60,.5)}
.docket .drow.t-done{opacity:.55}
.docket .drow .body{flex:1 1 auto;min-width:0}
.docket .drow .ti{font:400 11.5px/1.35 var(--sans,system-ui);color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.docket .drow .dwhy{font:400 9.5px/1.3 var(--mono);color:var(--dim);margin-top:2px}
/* thumb law: a write button half thumb-size beside a nav button is a misfire
   waiting for a bump in the truck — 40px minimum, and daylight between them */
.docket .drow .go,.docket .drow .dact{flex:0 0 auto;font:700 9.5px/1 var(--mono);
  letter-spacing:.1em;padding:12px 13px;min-height:40px;border-radius:6px;cursor:pointer}
.docket .drow .go{border:1px solid var(--line);background:transparent;color:var(--dim);margin-left:8px}
.docket .drow .go:hover{border-color:rgba(var(--key),.7);color:var(--ink)}
.docket .drow .dact{border:1px solid rgba(var(--key),.7);background:rgba(var(--key),.14);color:var(--ink)}
.docket .drow .dact:disabled{opacity:.4;cursor:wait}
.docket .dempty{font:400 11px/1.5 var(--mono);color:var(--dim);padding:18px 4px}
.docket .dunknown{font:400 9.5px/1.4 var(--mono);color:var(--hot);padding-top:6px}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:9px}
.readstamp{font:700 8px/1 var(--mono);letter-spacing:.15em;color:var(--etch);
  white-space:nowrap;transition:color .4s;background:none;border:0;cursor:pointer;
  font-family:var(--mono);padding:6px 2px}
.readstamp:hover{color:var(--mid)}
.readstamp.stale{color:var(--hot)}
.readstamp:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
/* a panel's OWN age (card #335) — printed only when the latest read did not
   bring its payload; the masthead stamp speaks for every panel that rode it */
.readage{color:var(--hot)}
div.readage{font:600 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:4px 0 2px}
.pill{font:700 9px/1 var(--mono);letter-spacing:.16em;padding:8px 12px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);transition:all .6s}
.pill.on{color:var(--hot);border-color:rgba(var(--hot-rgb),.55);box-shadow:0 0 18px -5px rgba(var(--hot-rgb),.65)}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:3px;color:var(--mid);
  font:700 9px/1 var(--mono);letter-spacing:.14em;padding:9px 13px;cursor:pointer;backdrop-filter:blur(8px)}
.btn:hover{color:var(--ink);border-color:rgba(var(--key),.5)}
.btn:focus-visible{outline:2px solid var(--mid);outline-offset:2px}

.field{position:relative;flex:0 0 auto;transition:height .75s cubic-bezier(.22,.61,.36,1)}
.orb{position:absolute;cursor:pointer;transform:translate(-50%,-50%);
  transition:left .75s cubic-bezier(.22,.61,.36,1), top .75s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.ball{position:relative;border-radius:50%;transition:width .75s cubic-bezier(.22,.61,.36,1),
  height .75s cubic-bezier(.22,.61,.36,1), box-shadow .4s, filter .3s}
.ball::after{content:"";position:absolute;left:16%;top:9%;width:44%;height:32%;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 70%);filter:blur(1px)}
.orb:hover .ball{filter:brightness(1.18)}
.orb .fig{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .4s}
.orb .fig .n{font:700 20px/1 var(--mono);color:#fff;text-shadow:0 0 16px rgba(0,0,0,.65)}
.orb .fig .u{display:block;margin-top:3px;font:700 7px/1 var(--mono);letter-spacing:.15em;color:rgba(var(--wash),.75)}
.orb .name{font:700 10px/1 var(--mono);letter-spacing:.2em;text-shadow:0 2px 10px rgba(0,0,0,.85);
  transition:font-size .5s,color .3s}
.orb .sig{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--dim);transition:opacity .4s;white-space:nowrap;
  /* the caption hangs OUTSIDE the hit box: a nowrap sig inside the flex column
     made the radio's orb 227px wide in the rail — its box covered THE WORK's
     right half, and a tap on the neighbor opened the constellation
     (his catch, 2026-08-14). Same law as .fig: decoration never takes taps. */
  position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);pointer-events:none}
.orb .sig b{color:var(--amber)}
.orb .sig b.h{color:var(--hot)}
.stage.entered .orb .sig,.stage.entered .orb .fig{opacity:0;pointer-events:none}
.stage.entered .orb .name{font-size:8.5px}
.orb.active .name{color:#fff}
/* THE RADIO SYSTEM (card #93): falling in dims the rest of the sky; the
   children fly out from the parent star. Compositor-friendly, honest. */
.stage.insys .orb:not(.sysorb):not(.active){opacity:.10;pointer-events:none}
.stage.insys .core{opacity:.10}
.consider.dim{opacity:.08;pointer-events:none;transition:opacity .3s}
.orb{transition:opacity .3s}
.sysorb{transition:left .42s cubic-bezier(.22,.61,.36,1), top .42s cubic-bezier(.22,.61,.36,1),
  transform .42s cubic-bezier(.22,.61,.36,1), opacity .34s;
  z-index:5}
.orb.sysparent{transition:left .42s cubic-bezier(.22,.61,.36,1), top .42s cubic-bezier(.22,.61,.36,1), opacity .3s;
  z-index:6}
/* the orbit ring — a lane line, not a decoration; while his hand spins it,
   the seats track the finger raw (no easing fighting the drag) */
.sysring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:1px dashed rgba(198,212,228,.14);pointer-events:none;z-index:4;
  transition:width .42s cubic-bezier(.22,.61,.36,1), height .42s cubic-bezier(.22,.61,.36,1)}
#orbs.spinning .sysorb{transition:opacity .34s}
.stage.insys{touch-action:none}
@media (prefers-reduced-motion: reduce){ .orb,.sysorb,.sysparent,.sysring{transition:none} }
.orb.active .ball{box-shadow:0 0 34px -4px rgba(var(--key),.95),inset 0 -10px 24px rgba(0,0,0,.5),
  inset 0 4px 10px rgba(255,255,255,.16),0 0 0 2px rgba(var(--key),.35)}

.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;
  border-radius:50%;display:grid;place-items:center;pointer-events:none;
  transition:opacity .5s,transform .75s cubic-bezier(.22,.61,.36,1);
  background:radial-gradient(circle at 38% 32%, rgba(215,228,255,.4), rgba(118,142,205,.24) 42%,
    rgba(28,36,58,.55) 72%, rgba(10,14,24,.7));
  box-shadow:0 0 90px -10px rgba(120,150,220,.4), inset 0 0 60px rgba(190,210,255,.14)}
.core .t{font:700 11px/1 var(--mono);letter-spacing:.3em;color:rgba(232,240,255,.92);text-align:center}
.core .s{margin-top:8px;font:600 8px/1.5 var(--mono);letter-spacing:.1em;color:rgba(200,215,245,.55);text-align:center}
.stage.entered .core{opacity:0;transform:translate(-50%,-50%) scale(.5)}

.consider{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(620px,86%);
  background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:15px 19px 14px;
  backdrop-filter:blur(11px);box-shadow:0 26px 60px -20px rgba(0,0,0,.9);
  transition:opacity .45s,transform .45s}
.stage.entered .consider{opacity:0;transform:translateX(-50%) translateY(26px);pointer-events:none}
.consider .lbl{display:inline-block;font:700 8px/1 var(--mono);letter-spacing:.19em;color:var(--amber);
  border:1px solid rgba(var(--key),.35);border-radius:20px;padding:6px 10px}
.consider .q{margin-top:11px;font:600 17px/1.4 var(--sans);text-wrap:balance}
.consider .rz{margin-top:7px;font:400 12px/1.5 var(--sans);color:var(--dim)}
.consider .acts{margin-top:12px;display:flex;gap:8px}
.consider .btn.go{color:var(--amber);border-color:rgba(var(--key),.4)}
.consider .att{margin-top:6px;font:700 8.5px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}

/* THE MIRROR — his own ruling, surfacing. Deliberately NOT the amber key:
   amber on this card means "here is the thing to do", and this is not a task,
   it is a reflection. So it reads as ink on the same page — a hairline rule
   above it the way a ledger separates a margin note from the entry. */
.mirror{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.mirror .mlbl{display:block;font:700 8px/1 var(--mono);letter-spacing:.19em;
  color:var(--etch);margin-bottom:8px}
.mirror .mrule{font:400 13.5px/1.5 var(--sans);color:var(--ink);font-style:italic;
  text-wrap:balance}
.mirror .mwhen{font:700 8.5px/1 var(--mono);letter-spacing:.14em;color:var(--etch);
  margin-left:7px;font-style:normal;white-space:nowrap}
.mirror .mnow{margin-top:7px;font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.mirror .mgo{margin-top:9px;font:700 8.5px/1 var(--mono);letter-spacing:.16em;
  color:var(--etch);background:none;border:0;padding:4px 0;cursor:pointer}
.mirror .mgo:hover{color:var(--ink)}
.mirror.letting .mrule,.mirror.letting .mnow{opacity:.3;transition:opacity .3s}

/* THE DAY (card #171, his ruling 2026-09-02: "the original should be the
   header and then I scroll down to a whole section that will drive my
   day"). The field + canon ARE the header; the fieldwrap scrolls, and the
   day lives below as a full section in the flow — never a floating box
   over the orbs. In a room the wrapper collapses to the rail. */
.fieldwrap{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.stage.entered .fieldwrap{flex:0 0 auto;overflow:hidden}
.daycue{display:block;margin:10px auto 10px;width:max-content;
  font:700 9px/1 var(--mono);letter-spacing:.19em;color:var(--amber);cursor:pointer;
  background:var(--glass);border:1px solid rgba(var(--key),.35);border-radius:20px;
  padding:7px 12px;backdrop-filter:blur(11px)}
.stage.entered .daycue{display:none}
.dayroom{width:min(920px,94%);margin:18px auto 30px}
.stage.entered .dayroom{display:none}
.dayroom .cap2{font:700 10px/1 var(--mono);letter-spacing:.22em;color:var(--amber);
  border-top:1px solid var(--line);padding-top:16px}
.dayroom .basis{margin-top:8px;font:600 14px/1.4 var(--sans)}
.dayroom .warn{margin-top:10px;font:600 13px/1.5 var(--sans);color:var(--amber);
  border:1px solid rgba(var(--key),.4);border-radius:8px;padding:10px 13px}
.dayroom .sub{margin-top:9px;font:400 10px/1.55 var(--mono);color:var(--dim)}
.dayroom .stopline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:12px;
  font:700 12px/1.35 var(--mono)}
.dayroom .stopline .seq{color:var(--amber)}
.dayroom .fieldSel{width:100%;margin-top:10px;padding:11px 12px;background:var(--glass);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;font:600 12px/1.2 var(--mono);letter-spacing:.04em}
.dayroom .fieldSel:focus{outline:none;border-color:rgba(var(--key),.5)}
.dayroom .acts{margin-top:14px;display:flex;gap:10px;align-items:center}
.roadSeg{margin-left:auto;display:flex;gap:6px}
.roadSeg .btn{font-size:9px;letter-spacing:.14em}
.roadSeg .btn.on{color:var(--amber);border-color:rgba(var(--key),.55);background:rgba(var(--key),.10)}
.roadmap{position:relative;z-index:0;height:280px;margin-top:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--glass)}
.doneBtn{margin-left:8px;font-size:8.5px;letter-spacing:.14em;padding:5px 8px;color:var(--amber);border-color:rgba(var(--key),.45)}
.roadmap.night .leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) saturate(.55) brightness(.82) contrast(1.05)}
.roadmap.night .leaflet-control-attribution{background:rgba(10,14,24,.75);color:#9fb0cc}
.roadmap.night .leaflet-control-attribution a{color:#c9d6ee}
@media (max-width:520px){.roadmap{height:220px}}
/* ── THE RADAR (card #198) — weather rides UNDER the line, OVER the map.
   The pane is a SIBLING of .leaflet-tile-pane, which is the whole trick:
   night's invert filter above targets the tile pane by name, so it never
   reaches reflectivity. Inverted radar is a lie told in green. ─────────── */
.leaflet-radar-pane,.leaflet-radarfx-pane{pointer-events:none}
/* RULE 1 made visible (card #216): an EXTRAPOLATED frame is ghosted and
   slightly desaturated, so at a glance it never reads as an observed scan.
   The label says it in words; this says it before you read anything. */
.leaflet-radarfx-pane{filter:saturate(.62) contrast(.88)}
.radarctl .rlab.fx{color:var(--amber);border-color:rgba(var(--key),.5);border-style:dashed}
.radarctl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin:8px 8px 0 0}
.radarctl .rbtn{font:700 8.5px/1 var(--mono);letter-spacing:.14em;padding:5px 8px;cursor:pointer;
  color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 5px rgba(0,0,0,.35)}
.radarctl .rbtn:hover{color:var(--ink)}
.radarctl .rbtn.on{color:var(--amber);border-color:rgba(var(--key),.55);background:rgba(var(--key),.12)}
.radarctl .rlab{font:400 8.5px/1.35 var(--mono);letter-spacing:.06em;color:var(--dim);text-align:right;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;max-width:180px}
.radarctl .rlab.warn{color:var(--amber)}
.radarctl [hidden]{display:none}
.wxbox{margin-top:12px;border-left:3px solid var(--amber);background:rgba(var(--key),.08);border-radius:0 8px 8px 0;padding:10px 13px;font:400 12px/1.65 var(--sans)}

/* ══ THE MONEY ROOM ════════════════════════════════════════════════════
   The strip on top is FLIGHT STATUS, unchanged in meaning from the cockpit
   that earned its trust: one dominant break-even gauge, the clock beside it,
   the month's projection under it. Below the strip the room changes with the
   period toggle; the strip never does, because the nut is monthly and a
   quarterly nut is a number that does not exist.

   A CARD IS A COST THAT HAS NOT BEEN ATTRIBUTED YET. Dragging one onto a load
   is a WRITE — the same latch doctrine as every other write on this surface:
   the card stays standing until a parsed 2xx comes back, and a refusal says
   in words what was not written. Cards that cannot be dragged still SHOW,
   greyed, carrying the reason — an invisible cost is how $300 of cash went
   missing from a break-even line for a month. */
/* ONE SCROLLER, AND IT IS .finbody — not .fin (2026-07-29, third fix on the
   same wound because I never checked the DOM).

   .fin is the room's frame: the toggle bar, the strip, and the body, stacked.
   #finBody ALSO carried class="fin", so putting overflow-y:auto on .fin gave it
   to BOTH — and the inner one, holding 1,898px of floor, was handed the 76px
   the strip left over. A 76px slit reads exactly like "can't scroll", which is
   what Bryan said three times.

   So: .fin never scrolls, it only measures. .finbody is the single scroller and
   it gets every pixel the bar and the strip do not use. */
.fin{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  overflow:hidden}
.finbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.finbody::-webkit-scrollbar{width:6px}
.finbody::-webkit-scrollbar-thumb{background:rgba(var(--wash),.18);border-radius:3px}
.finbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 0 2px}
.finbar .sp{flex:1}
.seg{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:4px;padding:2px}
.seg button{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px 12px;border-radius:3px;
  font:700 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;transition:all .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(var(--key),.16);color:rgba(var(--key),1);
  box-shadow:inset 0 -2px 0 rgba(var(--key),1)}
body.hot .seg button.on{background:rgba(var(--hot-rgb),.16);color:var(--hot);box-shadow:inset 0 -2px 0 var(--hot)}

.strip{flex:0 0 auto;display:grid;gap:9px;
  /* three equal seats, edge to edge (his ruling 08-15) */
  grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1050px){.strip{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .strip .stones{grid-column:1/-1}}
@media(max-width:760px){.strip{grid-template-columns:1fr}}
.strip .gp{padding:8px 10px 4px;justify-content:center}
.hero{width:100%;height:auto;display:block;overflow:visible;max-height:262px}
/* The strip cannot shrink, so on a short screen (or at his zoom) it will take
   whatever it needs and push the floor out of sight. Cap the instrument by
   VIEWPORT HEIGHT so the work below stays on the same screen as the reading
   above it — the gauge is the headline, not the article. */
@media(max-height:900px){.hero{max-height:212px}}

/* SHORT SCREEN — or his zoom, which is the same thing in CSS pixels. Stacking
   the three panels made the strip 386px of a 510px screen: 76% of everything he
   could see, with the actual work below the fold. The reading is the headline;
   it may never crowd out the room. So on a short screen the strip becomes ONE
   compact row that scrolls sideways and is capped at 176px, and the floor is
   the next thing his eye lands on. Measured, not guessed (2026-07-29). */
@media(max-height:760px){
  /* THE STRIP STOPS BEING PINNED. At 510px tall the room is 276px, and pinning
     a 150px strip above it left an 82px slit for 1,956px of floor — which is
     what "still can't scroll" actually felt like. So on a short screen there is
     ONE scroller for the whole room: the bar stays put, the strip becomes the
     first thing you scroll past, and the floor gets the full height the moment
     you do. A headline may be scrolled away; work may not be squeezed. */
  .fin{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .fin::-webkit-scrollbar{width:6px}
  .fin::-webkit-scrollbar-thumb{background:rgba(var(--wash),.18);border-radius:3px}
  .finbody{flex:0 0 auto;overflow:visible}          /* never a scroller inside a scroller */
  .finbar{position:sticky;top:0;z-index:6;padding:2px 0 6px;
    background:linear-gradient(180deg,var(--void) 66%,rgba(7,8,10,0))}
  .strip{grid-template-columns:none;display:flex;gap:8px;overflow-x:auto;
    overscroll-behavior-x:contain;padding-bottom:4px;max-height:180px}
  .strip::-webkit-scrollbar{height:4px}
  .strip::-webkit-scrollbar-thumb{background:rgba(var(--wash),.16);border-radius:3px}
  /* overflow-y:auto, never hidden — a clipped figure is a figure that lied by
     omission. The first pass hid the top and bottom of the readout, so
     "PROJECTED MONTH-END" and the day bar were simply gone. */
  /* three EQUAL seats stretching the full rail (his ruling 08-15: "make all 3
     cards the same size and stretch across the screen"); on a genuinely
     narrow screen the min-widths overflow into the sideways scroller. */
  .strip>.panel{flex:1 1 0;min-width:min(300px,80vw);max-height:176px;overflow-y:auto;
    overflow-x:hidden;padding:9px 11px}
  .strip>.panel::-webkit-scrollbar{width:0}
  .hero{max-height:152px}
  /* Tightened until the readout actually FITS the cap — scrollable-but-clipped
     still reads as broken, and a figure you have to discover by scrolling a
     150px box is a figure you will not read. */
  /* Two columns, not four stacked rows. Four rows measured 168px of content in
     a 140px box; the same four in a 2x2 grid fit with room to spare, and no
     figure has to be discovered by scrolling a 150px panel. */
  .ro{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-content:start}
  .rbig{font-size:21px}.rmid{font-size:13px}.rsub{font-size:9.5px;line-height:1.25}
  .rl{font-size:7px}
  .rr{gap:0}
  .daybar{margin-top:3px;height:4px}
  .strip .stones .ln{font-size:11px;padding:1px 0}
  .strip .cap{font-size:7.5px}
}
@media(max-height:560px){
  .strip{max-height:150px}.strip>.panel{max-height:146px}
  .hero{max-height:126px}.rbig{font-size:19px}
}
/* HIS RULING 2026-08-04 ("fonts still off... having me scroll... same buffers
   as the clock"): the mobile lesson — two columns, fonts that FIT — now
   governs EVERY width. Four stacked rows at 40px type in a 176px box is how
   a figure gets discovered by scrolling, and a figure you scroll for is a
   figure you will not read. The readout breathes like the clock beside it. */
.ro{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;align-content:center}
.rr{display:flex;flex-direction:column;gap:2px}
.rl{font:700 8px/1.3 var(--mono);letter-spacing:.19em;color:var(--etch);text-transform:uppercase}
.rbig{font:600 clamp(21px,1.8vw,29px)/1 var(--mono);letter-spacing:-.01em}
.rmid{font:600 clamp(14px,1.2vw,17px)/1.15 var(--mono);letter-spacing:.02em}
.rsub{font:400 10.5px/1.35 var(--mono);color:var(--mid)}
.daybar{margin-top:5px;height:5px;border-radius:3px;background:rgba(var(--wash),.1);overflow:hidden}
.daybar i{display:block;height:100%;background:var(--mid);
  transition:width 1s cubic-bezier(.16,1,.3,1)}
.strip .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  font:400 11.5px/1.5 var(--sans);color:var(--dim);border-bottom:1px dotted rgba(var(--wash),.07)}
.strip .ln:last-of-type{border-bottom:0}
.strip .ln b{font:600 11.5px var(--mono);color:var(--ink)}
.strip .ln b.up{color:rgba(var(--key),1)}
.strip .ln b.dn{color:var(--hot)}
.band{margin-top:7px;height:5px;border-radius:3px;background:rgba(var(--wash),.09);overflow:hidden}
.band i{display:block;height:100%;background:rgba(var(--key),1)}
.band i.red{background:var(--hot)}

/* The floor scrolls as one surface: the pool and the loads hold a real height
   so both lists are usable at once (the whole point of the drag), and the
   charts sit under them rather than squeezing them to a caption. */
/* not its own scroller any more — .fin owns the scroll so the floor can never
   be sealed off below an un-shrinkable strip */
.finscroll{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}

/* THE FLOOR, as Bryan drew it: expenses stand in a column on the left, the
   loads are big open boxes across the top, and you drag a line into the box
   that caused it. Summary underneath. */
.floor{flex:0 0 auto;display:grid;gap:10px;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media(max-width:900px){.floor{grid-template-columns:1fr}}
.floor>.panel{min-height:0}
.exp{max-height:52vh;overflow-y:auto;padding-right:3px}
.exp::-webkit-scrollbar{width:0}
.eline{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;
  padding:8px 9px;border-bottom:1px dotted rgba(var(--wash),.09);cursor:grab;
  border-radius:3px;transition:background .15s,opacity .15s}
.eline:hover{background:rgba(var(--key),.08)}
.eline.dragging{opacity:.3}
.eline.locked{cursor:not-allowed;opacity:.4}
.eline.locked:hover{background:transparent}
.eline .em{font:600 12.5px/1.3 var(--sans);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eline .ea{font:700 12.5px var(--mono);color:var(--ink)}
.eline .ea.cr{color:#7ec87e}
.eline .ed{grid-column:1;font:400 10px/1.3 var(--mono);letter-spacing:.06em;
  color:var(--etch);text-transform:uppercase}
.eline.refused{border-color:var(--hot);background:rgba(var(--hot-rgb),.12)}
.eline.done{opacity:.62}
.eline.done .em{color:var(--mid)}
.ep{grid-column:1/-1;font:600 9.5px/1.3 var(--mono);letter-spacing:.05em;color:rgba(var(--key),1)}
.ep.auto{color:var(--etch)}
.ep.auto::before{content:"◇ "}
/* his note on a row — quiet, quoted, never the money's colour (card #225).
   :not(.auto) on purpose: the ◆ rule below is .ep:not(.auto)::before and would
   outrank a bare .ep.note::before (same specificity, later in the sheet). */
.ep.note{color:var(--dim);font-weight:400;letter-spacing:0;font-style:italic;white-space:pre-wrap;
  overflow-wrap:anywhere;min-width:0}
.ep.note:not(.auto)::before{content:"“"}
.ep.note::after{content:"”"}
/* the note line inside the row's menu */
.movemenu .nin{display:block;width:100%;box-sizing:border-box;margin:4px 0 6px;padding:8px 9px;
  border:1px solid var(--line);border-radius:4px;background:rgba(var(--wash),.05);
  color:var(--ink);font:400 12px/1.3 var(--sans);outline:none}
.movemenu .nin:focus{border-color:rgba(var(--key),.6)}
.ep:not(.auto)::before{content:"◆ "}
.stab{display:flex;gap:6px;margin:7px 0 2px}
.stab button{flex:1 1 auto;font:700 9.5px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;padding:8px 6px;border-radius:4px;cursor:pointer;
  border:1px solid rgba(var(--key),.5);background:rgba(var(--key),.13);color:var(--ink)}
.stab button:hover:not(:disabled){background:rgba(var(--key),.26)}
.stab button:disabled{opacity:.4;cursor:wait}
.stab button.ghost{flex:0 0 auto;border-color:var(--line);background:transparent;color:var(--dim)}
/* the chase clock — due rows burn, the next one waits in the dim */
.fua{margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.fua .fur{display:flex;align-items:center;gap:8px;padding:4px 2px;
  font:400 11px/1.35 var(--mono);color:var(--dim)}
.fua .fur.due{color:var(--ink)}
.fua .fur .who{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fua .fur .amt{font-weight:700}
.fua .fur.due .amt{color:var(--hot)}
.fua .fur .when{flex:0 1 auto;font-size:10px;color:var(--dim);white-space:nowrap}
.fua .ack{flex:0 0 auto;font:700 9.5px/1 var(--mono);letter-spacing:.1em;padding:5px 9px;
  border:1px solid rgba(var(--key),.7);border-radius:5px;background:rgba(var(--key),.14);
  color:var(--ink);cursor:pointer}
.fua .ack:hover:not(:disabled){background:rgba(var(--key),.26)}
.fua .ack:disabled{opacity:.4;cursor:wait}
.drop-in.auto{border-style:dashed;opacity:.85}
.pt{font-style:normal;font-size:8.5px;letter-spacing:.1em;color:var(--etch);
  border:1px solid var(--line);border-radius:2px;padding:0 3px;margin-left:3px}
.lane .lf b.up{color:rgba(var(--key),1)}
.lane .lf i{font:400 9px/1 var(--mono);color:var(--etch);font-style:normal;margin-left:5px}

/* the move menu */
.movemenu{position:fixed;z-index:40;min-width:250px;max-width:320px;max-height:70vh;
  overflow-y:auto;background:var(--glass2);border:1px solid var(--line);border-radius:7px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);padding:5px;backdrop-filter:blur(14px)}
.movemenu::-webkit-scrollbar{width:0}
.movemenu .mh{padding:7px 9px 8px;font:600 11.5px/1.35 var(--sans);color:var(--ink);
  border-bottom:1px solid var(--line);margin-bottom:4px}
.movemenu .mh span{display:block;font:400 9.5px/1.3 var(--mono);color:var(--etch);margin-top:2px}
.movemenu .mh.bad{color:var(--hot);border:0}
.movemenu .msep{padding:7px 9px 3px;font:700 8px/1 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--etch)}
.mi{display:block;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:4px;
  background:transparent;color:var(--ink);cursor:pointer;font:600 12px/1.3 var(--sans)}
.mi:hover:not(:disabled){background:rgba(var(--key),.16)}
.mi:disabled{opacity:.4;cursor:default}
.mi i{display:block;font:400 9.5px/1.35 var(--mono);color:var(--etch);font-style:normal;margin-top:2px}
.mi.monthly{color:rgba(var(--key),1);border:1px solid rgba(var(--key),.35);
  background:rgba(var(--key),.09);margin-bottom:2px}
.mi.off{color:var(--dim);border-top:1px solid var(--line);border-radius:0;margin-top:4px;
  font-weight:400;font-size:11px}

.lanes{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-height:290px}
.lanes::-webkit-scrollbar{height:5px}
.lanes::-webkit-scrollbar-thumb{background:rgba(var(--wash),.16);border-radius:3px}
.lane{flex:0 0 254px;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:7px;background:rgba(var(--wash),.022);transition:all .18s}
.lane.over{border-color:rgba(var(--key),1);background:rgba(var(--key),.11);
  box-shadow:0 0 0 1px rgba(var(--key),.5) inset}
.lane.deny{border-color:var(--hot);background:rgba(var(--hot-rgb),.09)}
.lane .lh{padding:10px 11px 8px;border-bottom:1px solid var(--line)}
.lane .lb{font:600 13px/1.25 var(--sans);color:var(--ink)}
.lane .lr{float:right;font:700 13px var(--mono);color:var(--ink)}
.lane .lm{margin-top:3px;font:400 10px/1.4 var(--mono);letter-spacing:.05em;
  color:var(--etch);text-transform:uppercase;clear:both}
.lane .lin{flex:1 1 auto;min-height:96px;padding:7px 9px;overflow-y:auto}
.lane .lin::-webkit-scrollbar{width:0}
.lane .empty{height:100%;display:grid;place-items:center;text-align:center;
  font:400 11px/1.5 var(--sans);color:var(--etch);font-style:italic}
.lane .drop-in{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;
  margin-bottom:4px;border-radius:3px;background:rgba(var(--key),.1);
  border:1px solid rgba(var(--key),.26);cursor:pointer}
.lane .drop-in:hover{background:rgba(var(--hot-rgb),.14);border-color:rgba(var(--hot-rgb),.5)}
.lane .drop-in span{font:400 11px/1.3 var(--sans);color:var(--mid);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .drop-in b{font:700 11px var(--mono);color:var(--ink);flex:0 0 auto}
.lane .lf{padding:8px 11px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane .lf span{font:400 10px/1.3 var(--mono);letter-spacing:.06em;color:var(--etch);
  text-transform:uppercase}
.lane .lf b{font:700 15px var(--mono);color:rgba(var(--key),1)}
.lane .lf b.dn{color:var(--hot)}
/* THE VERDICT RIDES ON TOP (Bryan, 2026-08-11: "put summary of contribution to
   the nut at the top of the card"). What the run gave the month is the first
   thing the card says — the costs below are the evidence for it, not the lede.
   It reads before any scroll, so a lane full of drops still answers at a glance. */
.lane .lnut{padding:8px 11px 9px;border-bottom:1px solid var(--line);
  background:rgba(var(--key),.07);display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
.lane .lnut.dn{background:rgba(var(--hot-rgb),.09)}
.lane .lnut span{font:400 9px/1.3 var(--mono);letter-spacing:.07em;
  color:var(--etch);text-transform:uppercase}
.lane .lnut b{font:700 17px var(--mono);color:rgba(var(--key),1);letter-spacing:-.01em}
.lane .lnut b.dn{color:var(--hot)}
.lane .lnut i{display:block;font:400 9px/1.3 var(--mono);color:var(--etch);
  font-style:normal;letter-spacing:.05em;margin-top:2px}

/* MONTHLY stands apart from the loads — it is the other half of the month,
   not another load. Same box, different metal. */
.lane.monthly{flex:0 0 262px;border-color:rgba(var(--key),.4);
  background:linear-gradient(180deg,rgba(var(--key),.07),rgba(var(--wash),.02))}
.lane.monthly .lb{color:rgba(var(--key),1);letter-spacing:.16em;font-weight:700;font-size:12px}
.lane.monthly.over{border-color:rgba(var(--key),1);background:rgba(var(--key),.15)}
.ask{display:flex;flex-direction:column;gap:5px}
.ask .at{font:600 11.5px/1.4 var(--sans);color:var(--ink);margin-bottom:2px}
.acand{display:grid;grid-template-columns:1fr auto;gap:1px 8px;text-align:left;
  padding:6px 8px;border-radius:4px;cursor:pointer;font:inherit;
  border:1px solid rgba(var(--key),.3);background:rgba(var(--key),.08);color:var(--ink)}
.acand:hover{background:rgba(var(--key),.2);border-color:rgba(var(--key),.8)}
.acand span{font:600 11.5px/1.3 var(--sans);color:var(--ink)}
.acand b{font:700 11.5px var(--mono);color:var(--ink)}
.acand i{grid-column:1/-1;font:400 9.5px/1.3 var(--mono);color:var(--etch);font-style:normal}
.acand.cancel{grid-template-columns:1fr;border-color:var(--line);background:transparent;
  color:var(--dim);font:400 10.5px/1.3 var(--sans)}
.eline.writing{opacity:.5}

.drop{flex:0 0 auto;border:1px dashed rgba(150,170,190,.3);border-radius:5px;padding:10px 12px;
  text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px}
.drop:hover,.drop.over{border-color:rgba(var(--key),.7);background:rgba(var(--key),.07)}
.drop.busy{opacity:.6;border-style:solid}
.drop.ok{border-color:rgba(120,200,120,.7);background:rgba(120,200,120,.08)}
.drop.bad{border-color:var(--hot);background:rgba(var(--hot-rgb),.08)}
.drop .dl{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
.drop .ds{margin-top:5px;font:400 11px/1.4 var(--sans);color:var(--dim)}

.card{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:5px;
  background:rgba(var(--wash),.03);cursor:grab;transition:all .18s;position:relative}
.card:hover{border-color:rgba(var(--key),.5);background:rgba(var(--key),.06)}
.card.dragging{opacity:.35;cursor:grabbing}
.card.locked{cursor:not-allowed;opacity:.42;background:rgba(var(--wash),.015)}
.card.locked:hover{border-color:var(--line);background:rgba(var(--wash),.015)}
.card.writing{border-color:rgba(var(--key),1);background:rgba(var(--key),.14)}
.card.refused{border-color:var(--hot);background:rgba(var(--hot-rgb),.1);animation:refuse .4s}
@keyframes refuse{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card .ct{display:flex;justify-content:space-between;gap:9px;align-items:baseline}
.card .cm{font:600 12px/1.3 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ca{font:700 12px var(--mono);color:var(--ink);flex:0 0 auto}
.card .cs{margin-top:3px;font:400 10px/1.4 var(--mono);letter-spacing:.06em;color:var(--etch);
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .why{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:2px;
  padding:6px 9px;border-radius:3px;background:var(--panel);border:1px solid var(--line);
  font:400 10.5px/1.4 var(--sans);color:var(--dim);box-shadow:0 10px 24px rgba(0,0,0,.7)}
.card.locked:hover .why{display:block}

.chart{width:100%;display:block;overflow:visible}
.ltab{width:100%;border-collapse:collapse;font:400 11.5px/1.4 var(--sans)}
.ltab th{font:700 7.5px var(--mono);letter-spacing:.15em;color:var(--etch);text-transform:uppercase;
  text-align:right;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.ltab th:first-child,.ltab td:first-child{text-align:left}
.ltab td{padding:6px 7px;border-bottom:1px dotted rgba(var(--wash),.07);text-align:right;
  color:var(--mid);white-space:nowrap;font-variant-numeric:tabular-nums}
.ltab td.m{font-family:var(--mono);color:var(--ink)}
.ltab td.net{font-family:var(--mono);font-weight:700;color:rgba(var(--key),1)}
.ltab td.unk{color:var(--unknown)}
.ltab tr:hover td{background:rgba(var(--wash),.03)}

/* THE HOLD — his month as stones lying in the bottom of the phone, each body
   sized to its amount. He settles it the way you unload a trailer: one piece
   at a time, by hand, until the floor is bare. */
.hold{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.holdw{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;border-radius:5px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.18))}
.holdw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.waterline{position:absolute;left:0;right:0;pointer-events:none;
  border-top:1px solid rgba(var(--wash),.22)}
.waterline .wn{position:absolute;right:9px;bottom:5px;text-align:right}
.waterline .wn b{font:700 clamp(20px,2.2vw,30px)/1 var(--mono);color:var(--ink)}
.waterline .wn span{display:block;margin-top:2px;font:700 7.5px var(--mono);letter-spacing:.17em;
  color:var(--dim);text-transform:uppercase}
.holdw .clear{position:absolute;left:9px;bottom:5px;font:600 9.5px var(--mono);
  letter-spacing:.1em;color:var(--etch);text-transform:uppercase}
.stone{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.hcard{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:12px;
  width:min(420px,92%);background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:12px 14px;box-shadow:0 20px 50px rgba(0,0,0,.8)}
.hcard .hn{font:600 14px/1.3 var(--sans);color:var(--ink)}
.hcard .ha{margin-top:4px;font:700 24px/1 var(--mono);color:rgba(var(--key),1)}
.hcard .hs{margin-top:6px;font:400 11.5px/1.5 var(--sans);color:var(--dim)}
.hcard .hb{margin-top:11px;display:flex;gap:7px;align-items:center}
/* THE STONES — the strip's passive tracker (his ask 2026-08-14): the month's
   bills pile above the line and drop to the bed below it as his drag settles
   them on the floor. Read-only — the act lives on the floor (08-01 ruling). */
.strip .stones{display:flex;flex-direction:column}
.stw{position:relative;flex:1 1 auto;min-height:118px;border-radius:5px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.15))}
.stw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.sthead{position:absolute;right:7px;top:5px;text-align:right;pointer-events:none}
.sthead b{font:700 15px/1 var(--mono);color:var(--ink)}
.sthead span{display:block;margin-top:2px;font:700 7px/1.25 var(--mono);letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase}
.stonetip{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:6px 8px;font:400 10.5px/1.45 var(--mono);color:var(--ink);
  pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.catchip{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;
  font:600 9px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--mid);background:rgba(var(--key),.1);border:1px solid rgba(var(--key),.22);
  vertical-align:middle}
.catchip.edit{cursor:pointer}
.catchip.edit:hover{background:rgba(var(--key),.25);border-color:rgba(var(--key),.55);
  color:var(--ink)}
.movemenu.cats{max-height:62vh;overflow-y:auto}
.movemenu.cats .mi.on{background:rgba(var(--key),.18)}
/* the books: cash rows and the nut being fed */
.cashrow{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:baseline;
  padding:7px 8px;border-bottom:1px solid var(--line)}
.cashrow span{font:600 13px/1.3 var(--sans);color:var(--ink)}
.cashrow span u{font:400 10px var(--mono);color:var(--etch);text-decoration:none}
.cashrow b{font:700 15px var(--mono);color:var(--ink)}
.cashrow i{grid-column:1/-1;font:400 10px/1.3 var(--mono);letter-spacing:.05em;
  font-style:normal;color:var(--etch)}
.cashrow.tot{background:rgba(var(--key),.07);border:1px solid rgba(var(--key),.25);
  border-radius:4px;margin-bottom:6px}
.cashrow.tot b{color:rgba(var(--key),1);font-size:17px}
.env{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;padding:2px 0 2px 14px}
.env span{font:400 11px/1.3 var(--sans);color:var(--mid);flex:1}
.env b{font:600 11px var(--mono);color:var(--mid)}
.env i{font:400 9.5px var(--mono);font-style:normal;color:var(--etch)}
.nutbar{position:relative;height:34px;border:1px solid var(--line);border-radius:4px;
  background:rgba(0,0,0,.25);overflow:hidden}
.nutseg{position:absolute;top:0;bottom:0;background:rgba(var(--key),.55);
  border-right:1px solid rgba(0,0,0,.5)}
.nutseg:hover{background:rgba(var(--key),.85)}
.nutline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--hot);
  box-shadow:0 0 6px rgba(var(--hot-rgb),.6)}
/* the nut, standing on the left — obligations, not transactions */
.nut{margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.nut .bill{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:baseline;
  padding:5px 7px;margin-bottom:3px;border-radius:3px;cursor:grab;
  background:rgba(var(--key),.05);border:1px solid rgba(var(--key),.18);
  border-left:2px solid rgba(var(--key),.4)}
.nut .bill:hover{background:rgba(var(--key),.12);border-color:rgba(var(--key),.4)}
.nut .bill.dragging{opacity:.3}
.nut .bill.inert{cursor:default;opacity:.6}
.nut .bill.inert:hover{background:rgba(var(--key),.05);border-color:rgba(var(--key),.18)}
.nut .bill span{font:600 12px/1.3 var(--sans);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nut .bill b{font:700 12px var(--mono);color:var(--ink)}
.nut .bill em{grid-column:1/-1;font:400 9.5px/1.3 var(--mono);letter-spacing:.05em;
  font-style:normal;color:var(--etch)}
.nut .bill.late{border-left-color:var(--hot)}
.nut .bill.late em{color:var(--hot)}
/* an arrived bank row, waiting at the top of the bucket to be matched */
.lane .drop-in.arr{background:rgba(255,200,60,.07);border-color:rgba(255,200,60,.35);
  border-style:dashed}
.lane .drop-in.arr:hover{background:rgba(255,200,60,.16);border-color:rgba(255,200,60,.6)}
/* a bill paid, resting in the bucket with its evidence */
.lane .drop-in.paid{cursor:default;background:rgba(120,200,120,.08);
  border-color:rgba(120,200,120,.32)}
.lane .drop-in.paid:hover{background:rgba(120,200,120,.08);
  border-color:rgba(120,200,120,.32)}
.lane .drop-in.paid span{display:block}
.pev{display:block;font:400 9.5px/1.4 var(--mono);letter-spacing:.04em;
  font-style:normal;color:var(--etch)}
.pev.hand::before{content:"◇ "}
.hgrp{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:4px;padding:2px;flex-wrap:wrap}
.hgrp button{background:none;border:0;color:var(--dim);cursor:pointer;padding:5px 9px;border-radius:3px;
  font:700 7.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.hgrp button.on{background:rgba(var(--key),.16);color:rgba(var(--key),1)}
.hgrp button:hover{color:var(--ink)}

.recbar{margin-top:7px;height:6px;border-radius:3px;background:rgba(var(--wash),.09);overflow:hidden}
.recbar i{display:block;height:100%;background:rgba(var(--key),1);transition:width .8s cubic-bezier(.16,1,.3,1)}
.recline{margin-top:7px;display:flex;gap:18px;flex-wrap:wrap;font:400 12px/1.5 var(--sans);color:var(--dim)}
.recline b{font:700 13px var(--mono);color:var(--ink)}
.recline b.hot{color:var(--hot)}
.held{margin-top:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hchip{font:600 10px/1 var(--mono);padding:5px 8px;border-radius:10px;cursor:help;
  border:1px solid rgba(var(--hot-rgb),.35);background:rgba(var(--hot-rgb),.08);color:var(--mid)}
.hchip b{color:var(--ink);font-weight:700}
.basis{margin-top:11px;padding-top:9px;border-top:1px dotted rgba(var(--wash),.1)}
.brow{display:grid;grid-template-columns:1fr auto minmax(0,190px);gap:12px;align-items:baseline;
  padding:3px 0;font:400 12px/1.5 var(--sans);color:var(--dim)}
.brow b{font:700 14px var(--mono);color:var(--ink);text-align:right}
.brow b.key{color:rgba(var(--key),1)}
.brow b.up{color:#00E676}.brow b.dn{color:var(--hot)}
.brow i{font:400 10.5px/1.4 var(--mono);color:var(--etch);font-style:normal}
.brow.tot{margin-top:5px;padding-top:6px;border-top:3px double rgba(var(--wash),.14);color:var(--ink)}

.acts{grid-column:1/-1;grid-row:4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* ── THE SCALE — every price gets weighed before it gets named. The quote
   instrument: the trip goes on the deck, the beam settles at what it truly
   costs, his ask rides above it, and the margin is the daylight between. The
   first instrument in this room his hand can drive. ── */
.qsc{display:flex;flex-direction:column;gap:10px}
.qsc .qlane{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qsc .qlane .nm{font:700 11px/1.3 var(--mono);letter-spacing:.08em;color:var(--ink);cursor:pointer}
.qsc .modes{display:flex;gap:6px;margin-left:auto}
.qsc .mchip,.qsc .cchip{background:none;border:1px solid var(--line);border-radius:3px;color:var(--dim);
  font:700 8px/1 var(--mono);letter-spacing:.14em;padding:6px 10px;cursor:pointer}
.qsc .mchip.on,.qsc .cchip.on{color:#fff;border-color:rgba(var(--key),.9);background:rgba(var(--key),.14)}
body.hot .qsc .mchip.on,body.hot .qsc .cchip.on{border-color:rgba(var(--hot-rgb),.7);background:rgba(var(--hot-rgb),.12)}
.qsc .cchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qsc .cchip.add{border-style:dashed;letter-spacing:0}
.qsc .cchips input{background:rgba(0,0,0,.5);border:1px solid rgba(var(--key),.7);border-radius:3px;
  color:#fff;font:700 10px var(--mono);padding:5px 8px;outline:none;width:150px}
.qsc .route{display:flex;gap:6px;flex-wrap:wrap}
.qsc .route .qchip{flex:1 1 45%;min-width:150px}
.qsc .route .qchip .v{white-space:normal;word-break:break-word;line-height:1.35}
.qsc .route .qchip input{width:100%}
.qsc .chips{display:flex;flex-wrap:wrap;gap:6px}
.qsc .qchip{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:4px;
  padding:6px 9px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:64px}
.qsc .qchip .k{font:600 6.5px/1 var(--mono);letter-spacing:.13em;color:var(--dim);text-transform:uppercase}
.qsc .qchip .v{font:700 11px/1 var(--mono);color:var(--ink)}
.qsc .qchip input{width:76px;background:rgba(0,0,0,.5);border:1px solid rgba(var(--key),.7);
  border-radius:3px;color:#fff;font:700 11px var(--mono);padding:2px 4px;outline:none}
.qsc .beamwrap{padding:16px 6px 44px}
.qsc .rail{position:relative;height:5px;border-radius:3px;background:rgba(var(--wash),.07)}
.qsc .seg{position:absolute;top:0;height:5px;border-radius:3px;transition:left .8s cubic-bezier(.2,1.3,.35,1),width .8s cubic-bezier(.2,1.3,.35,1)}
.qsc .seg.cost{background:rgba(var(--wash),.2)}
.qsc .seg.day{background:linear-gradient(90deg,rgba(var(--key),.55),rgba(var(--key),1));
  box-shadow:0 0 14px -2px rgba(var(--key),.9)}
body.hot .qsc .seg.day{background:linear-gradient(90deg,rgba(var(--key),.55),rgba(var(--key),1));box-shadow:0 0 14px -2px rgba(var(--key),.9)}
.qsc .seg.day.neg{background:linear-gradient(90deg,rgba(var(--hot-rgb),.55),rgba(var(--hot-rgb),1));box-shadow:0 0 14px -2px rgba(var(--hot-rgb),.95)}
.qsc .mark{position:absolute;top:-5px;width:2px;height:15px;background:var(--ink);
  transition:left .8s cubic-bezier(.2,1.3,.35,1)}
.qsc .mark i{position:absolute;top:17px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:none;
  font:600 6.5px/1.3 var(--mono);letter-spacing:.11em;color:var(--dim);font-style:normal;text-transform:uppercase}
.qsc .mark b{position:absolute;top:26px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font:700 9px/1 var(--mono);color:var(--mid)}
.qsc .mark[data-edge="r"] i,.qsc .mark[data-edge="r"] b{left:auto;right:-4px;transform:none;text-align:right}
.qsc .mark[data-edge="l"] i,.qsc .mark[data-edge="l"] b{left:-4px;transform:none;text-align:left}
@media (max-width:520px){
  .qsc .asknum{font-size:18px}
  .qsc .qchip{min-width:56px;padding:5px 7px}
  .qsc .verdict{flex-basis:100%;text-align:left;margin-left:0}
}
.qsc .mark.ask{background:rgba(var(--key),1);box-shadow:0 0 10px rgba(var(--key),.9)}
body.hot .qsc .mark.ask{background:var(--hot);box-shadow:0 0 10px rgba(var(--hot-rgb),.9)}
.qsc .askrow{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
.qsc .askrow .lbl{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.qsc .step{background:none;border:1px solid var(--line);border-radius:3px;color:var(--mid);
  font:700 12px/1 var(--mono);width:30px;height:30px;cursor:pointer}
.qsc .step:hover{color:rgba(var(--key),1);border-color:rgba(var(--key),.6)}
.qsc .asknum{font:700 22px/1 var(--mono);color:#fff;cursor:pointer}
.qsc .permile{font:600 9.5px/1.4 var(--mono);color:var(--dim)}
.qsc .verdict{margin-left:auto;text-align:right;font:600 10px/1.5 var(--sans);color:var(--dim)}
.qsc .verdict b{font:700 11px var(--mono);color:rgba(var(--key),1)}
body.hot .qsc .verdict b{color:var(--amber)}
.qsc .verdict.neg b{color:var(--hot)}
.qsc .fold{border-top:1px double var(--line);padding-top:7px;cursor:pointer;
  font:600 8.5px/1 var(--mono);letter-spacing:.13em;color:var(--dim);text-transform:uppercase}
.qsc .fold:hover{color:var(--mid)}
.qsc .ticket .tr{display:flex;justify-content:space-between;gap:12px;padding:3px 0;
  border-bottom:1px dotted rgba(var(--wash),.07);font:400 10.5px/1.5 var(--sans);color:var(--mid)}
.qsc .ticket .tr b{font:600 10.5px var(--mono);color:var(--ink)}
.qsc .ticket .how{font:400 8.5px/1.4 var(--sans);color:var(--dim)}
.qsc .ticket .basis{margin-top:6px;font:600 7.5px/1.5 var(--mono);letter-spacing:.09em;
  color:var(--etch);text-transform:uppercase}
.qsc .capnote{font:600 9px/1.5 var(--mono);color:var(--dim)}
.qsc .unk{color:var(--dim);font:400 11px/1.6 var(--sans)}
@media (prefers-reduced-motion: reduce){ .qsc .seg,.qsc .mark{transition:none} }
.act{background:var(--glass2);border:1px solid var(--line);border-radius:7px;padding:11px 13px;
  display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px);transition:border-color .6s}
body.hot .act{border-color:rgba(var(--hot-rgb),.26)}
.act .h{display:flex;align-items:baseline;gap:9px}
.act .h .n{font:700 8px/1 var(--mono);letter-spacing:.15em;color:rgba(var(--key),1)}
body.hot .act .h .n{color:var(--hot)}
.act .h .imp{margin-left:auto;font:700 12.5px/1 var(--mono)}
.act .t{font:600 12.5px/1.35 var(--sans)}
.act .w{font:400 10.5px/1.45 var(--sans);color:var(--dim)}
.act .go{margin-top:auto;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:3px;
  color:var(--mid);font:700 8px/1 var(--mono);letter-spacing:.14em;padding:7px 11px;cursor:pointer}
.act .go:hover{color:rgba(var(--key),1);border-color:rgba(var(--key),.6)}

.board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;min-height:0}
.colhead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
.colhead .t{font:700 8.5px/1 var(--mono);letter-spacing:.19em;color:var(--dim)}
.colhead .n{font:700 8.5px/1 var(--mono);color:var(--etch)}
.col.qa .colhead{border-bottom-color:rgba(var(--key),.9)}
.col.qa .colhead .t{color:rgba(var(--key),1)}
.cards{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.cards::-webkit-scrollbar{width:0}
.kc{flex:0 0 auto;background:var(--glass2);border:1px solid var(--line);border-radius:5px;padding:9px 11px;
  backdrop-filter:blur(8px);cursor:pointer}
.kc .t{font:600 12px/1.32 var(--sans)}
.kc .m{display:flex;align-items:center;gap:7px;margin-top:6px;font:700 8px/1 var(--mono);
  letter-spacing:.1em;color:var(--etch)}
/* .pb, not .bar — the top bar owns .bar and its padding would swallow this */
.kc .m .pb{flex:1;height:2px;background:rgba(var(--wash),.1);border-radius:2px;overflow:hidden;min-width:14px}
.kc .m .pb i{display:block;height:100%;background:var(--mid)}
.kc .m .hi{color:var(--hot)}
.kc .m .bry{color:var(--amber)}
.kc.nowc{border-left:2px solid rgba(var(--key),.9)}
.kdetail{margin-top:9px;padding-top:9px;border-top:1px dotted var(--line);font:400 12.5px/1.6 var(--sans);
  color:var(--mid);cursor:auto;max-height:260px;overflow-y:auto}
.kdetail b{color:var(--ink)}
.kdetail code{font:600 11.5px var(--mono);color:var(--ink);background:rgba(0,0,0,.4);padding:1px 4px;border-radius:2px}
.kdetail ul{margin:6px 0;padding-left:18px}
.kdetail .kimp{font-style:italic;color:var(--dim)}
.closer{position:relative;margin-top:8px;height:27px;border-radius:4px;overflow:hidden;cursor:pointer;
  background:rgba(var(--wash),.05);border:1px solid var(--line);width:100%;display:grid;place-items:center;
  touch-action:none}
.closer .r2{position:absolute;inset:0;background:rgba(var(--key),.5);transform:scaleX(0);transform-origin:left center}
.closer .cc{position:relative;z-index:2;font:700 8.5px/1 var(--mono);letter-spacing:.15em;color:var(--mid)}
.closer[disabled]{opacity:.45;cursor:default}
.kc.closed{opacity:.42}
.kc.closed .t{text-decoration:line-through;text-decoration-color:var(--etch)}

/* ── THE SHIPPED LEDGER (card #283) — finished work, read as a record and
   not as a board. One column, not four: these are not states any more, they
   are weeks, and a week is the unit he actually works and QAs in. */
.shipwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px}
.shiphead{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;flex-wrap:wrap;font:700 8.5px/1.5 var(--mono);letter-spacing:.16em;color:var(--dim)}
.shiphead b{color:var(--ink);font-size:11px}
.shiphead .gaps{color:var(--hot);letter-spacing:.1em}
.ships{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:3px}
.ships::-webkit-scrollbar{width:0}
.swk{flex:0 0 auto;display:flex;flex-direction:column;gap:7px}
.swkh{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:5px;position:sticky;top:0;
  background:var(--bg);z-index:1}
.swkh .t{font:700 10px/1 var(--mono);letter-spacing:.19em;color:rgba(var(--key),1)}
.swkh .n{font:700 8.5px/1 var(--mono);color:var(--etch)}
.sep{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding-left:9px;
  border-left:1px solid var(--line)}
.seph{font:700 8px/1.4 var(--mono);letter-spacing:.16em;color:var(--dim);margin-top:4px}
.sc{background:var(--glass2);border:1px solid var(--line);border-radius:5px;padding:8px 11px}
.sct{font:600 12px/1.35 var(--sans)}
.sct .sid{font:700 10px var(--mono);color:var(--etch);margin-right:5px}
.scm-row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.sm{font:700 7.5px/1 var(--mono);letter-spacing:.13em;color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:3px 5px}
.sm.dt{border-color:transparent;padding-left:0;color:var(--etch)}
.sm.hi{color:var(--hot);border-color:rgba(255,59,24,.3)}
/* NEVER IN QA is the one mark that is a JUDGEMENT, so it is the one that is
   loud: it says a card reached done without the column that exists to prove
   it was finished. */
.sm.bad{color:var(--amber);border-color:rgba(255,164,25,.35)}
.scm{font:400 10.5px/1.5 var(--mono);color:var(--dim);margin-top:5px;padding-left:2px}
.scm code{color:rgba(var(--key),1);margin-right:6px}
.shipmore{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:4px;
  color:var(--dim);cursor:pointer;padding:9px;font:700 8.5px/1 var(--mono);letter-spacing:.19em}
.shipmore:hover{color:var(--ink);border-color:var(--mid)}
.wkct{font:700 8.5px/1 var(--mono);letter-spacing:.16em;color:var(--etch)}
/* ── THE EPIC AXIS (card #288) — collapsed by default, because the header
   alone has to answer how big the body of work is and how much is done. If
   it does not, expanding is not a choice, it is the only way to read it. */
/* .epk, NOT .ep — the money room has owned `.ep` since card #225 for its
   transaction annotations ("paid X · monthly", an expired pre-auth, his
   own note). My rule sat later in the sheet and was handing every one of
   those a border, a panel background and rounded corners. Caught by
   grepping my own new class names against the existing sheet, which is a
   thing worth doing every time a file this size gains a component.

   flex:0 0 auto IS LOAD-BEARING, not tidiness. .ships is a column flex box
   with overflow-y:auto, so a child left at the default 0 1 auto SHRINKS to
   fit a tall sibling instead of overflowing. Expand one epic and every
   other row was crushed from 57px to 26px while scrollHeight collapsed to
   clientHeight — a list that cannot scroll because it has nowhere to
   scroll TO. He hit it in one tap. I had seen the thin bars in a
   screenshot an hour earlier and called them a capture artifact. */
.epk{flex:0 0 auto;border:1px solid var(--line);border-radius:6px;
  background:var(--glass2);margin-bottom:7px;overflow:hidden}
.epk.on{border-color:rgba(var(--key),.45)}
.eph{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  flex-wrap:wrap}
.eph:hover{background:rgba(var(--wash),.03)}
.eph .cav{font:700 10px/1 var(--mono);color:rgba(var(--key),1);flex:0 0 auto;width:9px}
.eph .ept{font:600 13.5px/1.3 var(--sans);flex:1 1 200px;min-width:0}
.eph .epn{font:700 11px/1 var(--mono);color:var(--ink);flex:0 0 auto}
.eppb{flex:0 0 74px;height:3px;background:rgba(var(--wash),.1);border-radius:2px;
  overflow:hidden}
.eppb i{display:block;height:100%;background:rgba(var(--key),.85)}
.sm.epo{color:var(--amber);border-color:rgba(255,164,25,.35)}
.sm.epc{color:var(--mid)}
.epb{padding:2px 13px 12px;display:flex;flex-direction:column;gap:6px;
  border-top:1px dotted var(--line)}
.epwhy{font:400 12px/1.6 var(--sans);color:var(--dim);font-style:italic;
  padding:9px 0 3px}
.wkall{background:none;border:1px solid var(--line);border-radius:4px;
  color:var(--dim);cursor:pointer;padding:7px 11px;
  font:700 8.5px/1 var(--mono);letter-spacing:.17em}
.wkall:hover{color:var(--ink);border-color:var(--mid)}
@media (max-width:640px){ .eppb{display:none} }
/* the door out to the record — a LINK, not a tab, because it leaves */
.recdoor{text-decoration:none;background:none;border:1px solid rgba(var(--key),.35);
  border-radius:4px;color:rgba(var(--key),1);padding:7px 11px;
  font:700 8.5px/1 var(--mono);letter-spacing:.17em}
.recdoor:hover{background:rgba(var(--key),.12)}
/* ── THE RULING (cards #87/#100): a HOLD wearing the needs-bryan amber — the
   same ring the close uses, the same tokens YOUR HAND and the docket's breath
   already wear. No new colour, no new metaphor: the sheet is the desk's own
   glass, the caption breathes the way the masthead does when he is asked. */
/* pan-y, not the .closer default of none: the RULE bar rides EVERY flagged
   card — 29 of them today, most in NEXT — so a full-width dead zone would
   mean a thumb that starts its scroll on a bar cannot pan the column at
   all, and past 640 ms opens a sheet he never asked for. pan-y lets the
   scroll through; the browser then fires pointercancel, which the hold
   already clears itself on. */
.closer.ruler{border-color:rgba(var(--key),.45);touch-action:pan-y}
.closer.ruler .cc{color:var(--amber)}
.drow .closer{width:auto;flex:0 0 auto;height:24px;margin:0 0 0 8px;padding:0 10px}
.rsheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;
  align-items:center;justify-content:center;padding:18px}
.rsbox{width:min(440px,94vw);display:flex;flex-direction:column;gap:9px;padding:14px;

.pl-ytab.on{color:var(--amber);border-bottom-color:var(--amber)}
/* the bik format: months as rows, weekday-aligned columns, one picture.
   Wide by nature — it scrolls in its own container, never the page. */
.pl-yearwrap{overflow-x:auto;padding-bottom:4px}
.pl-yrow{display:grid;grid-template-columns:30px repeat(37,20px);gap:2px;align-items:center;margin-top:2px;width:max-content}
.pl-ymon{font:700 9px/1 var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.pl-yhdr .pl-ywd{font:700 7.5px/1 var(--mono);color:var(--etch);text-align:center}
.pl-yhdr .pl-ywd.we{color:var(--amber);opacity:.75}
.pl-yc{position:relative;height:20px;border:1px solid var(--line);border-radius:2px;cursor:pointer;font:600 7.5px/18px var(--mono);color:var(--etch);text-align:center;overflow:hidden}
.pl-yc.pad{border:none;cursor:default}
.pl-yc.dst{background:#7f1d1d;color:#fca5a5}
.pl-yc.today{background:var(--amber);color:#000;font-weight:700}
/* WORKOUT IS A BAR ALONG THE BASE, NOT A FILL (his ask 2026-09-15). A green
   cell swallowed a green check whole — the one day he did the most read as
   the day he did nothing. The bar leaves the cell's interior to the mark,
   and it frees his COLOR to paint a workout day like any other. */
.pl-yc.wk::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:#16a34a;box-shadow:0 -1px 0 rgba(0,0,0,.45)}
.pl-yc.picked{outline:2px solid rgb(var(--key));outline-offset:1px}
/* ══ THE MARKS — pressed on the wall, readable from across the barn ══════
   A month row should read as a STREAK without reading a single glyph, so
   the marks are drawn rather than typed: 7.5px mono characters were the
   defect. Every mark carries a dark halo, because the cell underneath can
   be his color, the dark season, today's amber, or nothing at all, and a
   mark that only survives one of those is a mark he cannot trust. */
.ym{position:absolute;inset:0;pointer-events:none}
.ym::before{content:"";position:absolute;left:50%;top:50%}
/* ALL SEVEN — the gold star. His word: "stars are good." */
.ym.star::before{content:"★";left:0;top:0;width:100%;margin:0;
  font:400 15px/19px var(--mono);color:#fbbf24;text-align:center;
  -webkit-text-stroke:.7px #fbbf24;                /* the best day is the heaviest mark */
  text-shadow:0 0 2px #000,0 0 5px rgba(0,0,0,.95)}
/* MORNING DONE — a thick green check, two borders and a rotation */
.ym.chk::before{width:5px;height:10px;
  border:2.5px solid #4ade80;border-top:0;border-left:0;border-radius:1px;
  transform:translate(-50%,-58%) rotate(41deg);
  filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 0 3px rgba(0,0,0,.85))}
/* PARTIAL — a thick white dash: he showed up and did not finish */
.ym.dash::before{width:11px;height:3.5px;border-radius:2px;background:#f1f5f9;
  transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.75)}
/* the one background gold cannot survive is today's gold */
.pl-yc.today .ym.star::before{color:#231400;text-shadow:none}

.pl-retime{min-height:34px;padding:0 9px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--dim);font:700 8px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;flex:0 0 auto}
.pl-del{min-width:34px;min-height:34px;border:none;background:none;color:var(--etch);font-size:12px;cursor:pointer;flex:0 0 auto}
.pl-fin{display:block;width:100%;text-align:left;min-height:40px;margin-top:10px;border:none;border-top:1px solid var(--line);background:none;color:var(--dim);font:700 9px/1 var(--mono);letter-spacing:.14em;cursor:pointer}

/* ── THE BULLETIN — the hotshot room's regulatory ticker ──────────── */
.hb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line);text-decoration:none;min-height:40px}
.hb-tag{flex:0 0 auto;font:700 8px/1 var(--mono);letter-spacing:.11em;border:1px solid var(--line);border-radius:10px;padding:5px 8px;color:var(--dim)}
.hb-tag.ru{color:var(--hot);border-color:rgba(var(--hot-rgb),.5)}
.hb-tag.pr{color:var(--amber);border-color:rgba(var(--key),.45)}
.hb-tag.no{color:var(--etch)}
.hb-tag.nw{color:#60a5fa;border-color:rgba(96,165,250,.35)}
.hb-t{flex:1;font:600 13px/1.4 var(--sans);color:var(--ink);min-width:0}
.hb-src{flex:0 0 auto;font:700 8px/1 var(--mono);letter-spacing:.1em;color:var(--etch)}
.hb-tgt{display:flex;justify-content:space-between;gap:10px;font:400 12.5px/1.6 var(--sans);color:var(--mid);padding:5px 0;border-bottom:1px dotted var(--line)}
.hb-tgt i{font:700 8px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--etch);font-style:normal}
/* the practice on the canon card — below THE PAGE and ON AIR, his ask */
.cml{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dotted var(--line)}
.cml[hidden]{display:none}
.cmli{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.cmli input{width:17px;height:17px;accent-color:rgb(90,160,255);cursor:pointer}
.cmli span{font:600 12.5px/1 var(--sans);color:var(--ink)}
.cmli.on span{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(90,160,255,.5)}
.cmls{font:700 9px/1 var(--mono);letter-spacing:.14em;color:var(--etch);margin-left:auto}

/* THE RECORD AS A LEDGER — Bryan, 2026-08-03: "it should read Date | Category |
   Payee | Amount | Notes | Status." A ledger line reads left to right in the
   order a bookkeeper writes it: when, what kind, who, how much, what became of
   it, where the bank stands. */
.lghead,.lgr{display:grid;grid-template-columns:44px 118px minmax(0,1.1fr) 84px minmax(0,1.45fr) 58px;
  gap:0 12px;align-items:center}
.lghead{padding:2px 0 7px;border-bottom:1px solid var(--line);
  font:700 7.5px/1 var(--mono);letter-spacing:.18em;color:var(--etch);text-transform:uppercase}
.lghead .ra{text-align:right}
.lgr{padding:8px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.lgr:hover{background:rgba(var(--key),.04)}
.lgr.dim{opacity:.5}
.lgr .ld{font:600 10.5px var(--mono);color:var(--dim);letter-spacing:.03em}
.lgr .lp{font:600 12.5px/1.3 var(--sans);color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lgr .la{font:600 12.5px var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.lgr .la.cr{color:#7ec87e}
.lgr .ln{font:400 11px/1.4 var(--sans);color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lgr .lst{font:700 8px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--etch);text-align:right}
.lgr .lst.pending{color:var(--amber)}
.lgr .lst.expired{color:var(--unknown);text-decoration:line-through}
.lgr .lsub{display:none}
@media(max-width:760px){
  /* the cover screen folds the ledger back to two lines — same order, stacked */
  .lghead{display:none}
  .lgr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:
    "cat amt" "payee amt" "sub sub";row-gap:2px}
  .lgr .lc{grid-area:cat}.lgr .lp{grid-area:payee}.lgr .la{grid-area:amt;align-self:center}
  .lgr>.ld,.lgr>.ln,.lgr>.lst{display:none}
  .lgr .lsub{display:block;grid-area:sub;font:400 10.5px/1.4 var(--sans);color:var(--dim)}
}

/* WHERE THE MONEY GOES — the books' breakdown: the window's five biggest
   categories, each with its trailing six windows etched like level marks on
   glass. The viewed window burns amber; the dashed line is the trailing
   average — the waterline the month is filling toward. Each trend wears its
   own scale; the NUMBERS carry cross-category size, the bars carry shape. */
.bookslow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;
  margin-top:10px;align-items:start}
@media(max-width:900px){.bookslow{grid-template-columns:1fr}}
.scat{padding:10px 0 7px;border-bottom:1px dotted var(--line);cursor:pointer;
  margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:5px;
  transition:background .25s}
.scat:hover{background:rgba(var(--key),.05)}
.scat.picked{background:rgba(var(--key),.09);box-shadow:inset 2px 0 0 var(--amber)}
.scat .sr1{display:flex;align-items:baseline;gap:8px}
.scat .rank{font:700 9px var(--mono);color:var(--etch);letter-spacing:.08em}
.scat .scn{font:600 12.5px/1.2 var(--sans);color:var(--ink);flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scat .scn.uncat{font-style:italic;color:var(--amber)}
.scat .sca{font:600 12px var(--mono);color:var(--ink);white-space:nowrap}
.scat .sca i{font:400 9px var(--mono);font-style:normal;color:var(--dim);margin-left:6px}
.strough{position:relative;display:flex;align-items:flex-end;gap:2px;height:44px;
  margin-top:7px;padding-bottom:1px;border-bottom:1px solid var(--line)}
.strough .sb{flex:1 1 0;height:100%;display:flex;align-items:flex-end;min-width:8px}
.strough .sb i{display:block;width:100%;min-height:1px;border-radius:2px 2px 0 0;
  background:rgba(var(--key),.30);transition:height .5s cubic-bezier(.22,.61,.36,1)}
.strough .sb.on i{background:var(--amber);box-shadow:0 0 14px rgba(var(--key),.4)}
.strough .sb:hover i{background:rgba(var(--key),.55)}
.strough .sb.on:hover i{background:var(--amber)}
.strough .wline{position:absolute;left:0;right:0;border-top:1px dashed rgba(233,237,240,.35);
  pointer-events:none;z-index:1}
.sxl{display:flex;gap:2px;margin-top:3px}
.sxl span{flex:1 1 0;font:600 7px/1 var(--mono);letter-spacing:.06em;color:var(--etch);
  text-align:center;text-transform:uppercase}
.sfoot{margin-top:9px;font:400 9.5px/1.6 var(--mono);color:var(--etch)}
.acctpick{display:flex;gap:5px;justify-content:center;margin-top:7px}
.acctpick button{font:700 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  padding:5px 9px;border-radius:11px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;transition:all .25s}
.acctpick button.on{color:var(--amber);border-color:rgba(var(--key),.55);
  background:rgba(var(--key),.09)}

/* THE BUDGET — a reference wall, not a workbench: every standing obligation
   detailed, cards in HIS kill order, loans wearing their paydown. Paying
   still happens on the floor, by his hand. */
.bhero{display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.bhero span{font:700 8px/1 var(--mono);letter-spacing:.18em;color:var(--etch);
  text-transform:uppercase;display:block;margin-bottom:4px}
.bhero b{font:700 21px/1 var(--mono);color:var(--ink)}
.bhero .owe b{color:var(--amber)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
@media(max-width:1100px){.bgrid{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;
  padding:9px 0;border-bottom:1px dotted var(--line)}
.brow .bn{font:600 12.5px/1.3 var(--sans);color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.brow .bn .rank{font:700 9px var(--mono);color:var(--etch);letter-spacing:.08em;margin-right:7px}
.brow .bm{font:600 12.5px var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.brow .bm em{font:600 8px var(--mono);color:var(--etch);font-style:normal;margin-left:2px}
.brow .bs{grid-column:1/-1;font:400 10.5px/1.5 var(--sans);color:var(--dim)}
.brow.retired{opacity:.4}
.bpay{color:var(--amber);font:600 9.5px var(--mono);letter-spacing:.05em}
.bdrift{color:#e2b45a}.bdrift.light{color:rgba(255,120,90,.95)}.bdrift.never{color:rgba(255,120,90,.95);font-weight:700}
.bnote{margin:2px 0 8px;font:600 11px/1.45 var(--mono);color:var(--etch)}.bnote.heavy{color:#e2b45a}
.butil{height:3px;background:rgba(150,170,190,.12);border-radius:2px;margin-top:5px;overflow:hidden}
.butil i{display:block;height:100%;border-radius:2px;background:rgba(var(--key),.55)}
.brow[data-bt]{cursor:pointer;transition:background .25s;margin:0 -6px;
  padding-left:6px;padding-right:6px;border-radius:5px}
.brow[data-bt]:hover{background:rgba(var(--key),.05)}
.badd{margin-left:10px;font:700 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer}
.badd:hover{color:var(--amber);border-color:rgba(var(--key),.5)}
.minrow{display:flex;gap:6px;padding:6px 9px}
.minput{flex:1 1 auto;min-width:0;background:rgba(150,170,190,.08);border:1px solid var(--line);
  border-radius:5px;color:var(--ink);font:600 12.5px var(--mono);padding:7px 9px;outline:none}
.minput:focus{border-color:rgba(var(--key),.55)}
.minrow .mi{flex:0 0 auto;width:auto}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:8px 10px;border-bottom:1px dotted var(--line);cursor:pointer}
.srow:hover{background:rgba(var(--key),.06)}
.srow input{accent-color:var(--amber);width:15px;height:15px;flex:0 0 auto;cursor:pointer}
.srow span{font:600 11.5px/1.35 var(--sans);color:var(--ink)}
.srow span i{display:block;font:400 9.5px/1.3 var(--mono);color:var(--etch);font-style:normal}
.srow .samt{font:700 11.5px var(--mono);color:var(--amber);white-space:nowrap}
.fold{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:10px 2px 9px;border-top:3px double rgba(var(--wash),.14);margin-top:4px;
  cursor:pointer;transition:background .25s}
.fold:hover{background:rgba(var(--key),.05)}
.fold span{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim)}
.fold i{font:700 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);font-style:normal;flex:0 0 auto}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
.scroll::-webkit-scrollbar{width:0}
/* ── THE STOPS BOOK (hotshot · stops tab) ─────────────────────────────
   Rows are their own markup — .ltab is a table and was not built for this.
   Thumb law: every tap ≥44px (judged from the Fold at highway speed). The
   dog flag paints the SERVED field only; UNKNOWN never reads as no. */
.stops{display:flex;flex-direction:column;gap:10px}
.stopbar{display:flex;gap:9px;margin:6px 0 8px}
.stopbar input,.handadd input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);
  border-radius:4px;color:var(--ink);font:400 13px/1.3 var(--sans);padding:11px 13px;min-height:44px;
  user-select:text;-webkit-user-select:text}
.stopbar input:focus-visible,.handadd input:focus-visible{outline:2px solid rgba(var(--key),.6);outline-offset:1px}
.sgo{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:4px;border:1px solid rgba(var(--key),.5);
  background:rgba(var(--key),.14);color:rgba(var(--key),1);font:700 9.5px/1 var(--mono);
  letter-spacing:.16em;cursor:pointer}
