function finCharts(){
  const ro = State.fin.rollup;
  if(!ro) return "";
  const S = ro.series || [], rawCats = ro.road_by_category || {};
  // THE BARS AND THE CAPTION HAVE TO NAME THE SAME MONEY (card #350). The
  // spine serves this breakdown unshifted but captions it with road_total,
  // which is load-shifted — road follows the load, so a fill-up posted this
  // month rides OUT if its load delivered last month, and an earlier
  // month's fuel rides IN if its load delivered this month. Walk that same
  // shift onto the categories before drawing, reading off_by_cat/on_by_cat
  // straight off the payload rather than re-deriving a shift here, or the
  // client can disagree with the spine about its own arithmetic. The words
  // for this shift already live one panel up (finReconcile's "road follows
  // the load" line) — this panel only has to add up to what that one says.
  const shift = ro.reconciliation && ro.reconciliation.road_shift;
  let cats = rawCats, roadCap = ro.road_total || 0;
  if(shift){
    const off = shift.off_by_cat || {}, on = shift.on_by_cat || {};
    const keys = new Set([...Object.keys(rawCats), ...Object.keys(off), ...Object.keys(on)]);
    cats = {};
    for(const c of keys){
      const v = Math.round(((rawCats[c]||0) - (off[c]||0) + (on[c]||0)) * 100) / 100;
      if(v) cats[c] = v;
    }
  } else {
    // no shift on this payload — an older cache, or the spine couldn't
    // compute one this time. Draw the unshifted bars under their own
    // unshifted total instead of pairing them with road_total, so a
    // missing key can never reproduce the mismatch this card exists to
    // kill (a half-shifted panel is worse than an honestly unshifted one).
    roadCap = Object.values(rawCats).reduce((a,b)=>a+b,0);
  }
  const mx = Math.max(1, ...S.map(s => Math.max(s.revenue||0, s.road||0)));
  const W = 640, H = 132, pad = 22, bw = S.length ? (W-2*pad)/S.length : 0;
  const bars = S.map((s,i) => {
    const x = pad + i*bw, w = Math.max(3, bw*0.34);
    const hr = ((s.revenue||0)/mx)*(H-40), hc = ((s.road||0)/mx)*(H-40);
    /* BEFORE THE LOAD BOOK (card #341): a bucket the book does not cover has
       no revenue to draw — unknown, not $0 — so it is hatched, its reason
       rides the title, and its road bar stays real. A bucket the book
       begins inside keeps its bars and wears a mark that names the day. */
    const rev = s.uncovered
      ? `<rect x="${x.toFixed(1)}" y="${(H-22-(H-40)*.55).toFixed(1)}" width="${w.toFixed(1)}"
          height="${((H-40)*.55).toFixed(1)}" rx="1.5" fill="url(#bookhatch)"><title>${
          esc(s.uncovered_basis || "before the load book")}</title></rect>`
      : `<rect x="${x.toFixed(1)}" y="${(H-22-hr).toFixed(1)}" width="${w.toFixed(1)}"
          height="${Math.max(1,hr).toFixed(1)}" rx="1.5" fill="rgba(var(--key),${s.partial?".45":".85"})">${
          s.partial_book ? `<title>${esc(s.partial_book_basis || "")}</title>` : ""}</rect>`;
    return rev + `<rect x="${(x+w+2).toFixed(1)}" y="${(H-22-hc).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(1,hc).toFixed(1)}" rx="1.5" fill="${hotc(s.partial?.3:.55)}"/>${
      s.partial_book ? `<circle cx="${(x+w/2).toFixed(1)}" cy="${H-30}" r="2.2" fill="var(--etch)"><title>${
        esc(s.partial_book_basis || "")}</title></circle>` : ""}
      <text x="${(x+w+1).toFixed(1)}" y="${H-8}" fill="var(--etch)" font-size="8"
        font-family="ui-monospace,Menlo,monospace" text-anchor="middle">${esc(s.label)}</text>`;
  }).join("");
  const unc = S.some(s => s.uncovered), part = S.some(s => s.partial_book);
  const ct = Object.values(cats).reduce((a,b)=>a+b,0) || 1;
  return `<div class="panel" style="flex:0 0 auto">
    <div class="cap">earned vs the road it took · last ${S.length} ${esc(FIN.period)}${
      S.length===1?"":"s"} · faded = still running${
      unc ? ` · hatched = before the load book (begins ${esc(ro.book_begins || "?")})` : ""}${
      part && !unc ? ` · dot = the book begins inside it (${esc(ro.book_begins || "?")})` : ""}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="max-height:132px;margin-top:6px"><defs>
      <pattern id="bookhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--etch)" stroke-width="1.4"/></pattern></defs>${bars}</svg>
    <div class="cap" style="margin-top:6px">the road, this ${esc(FIN.period)} — ${
      money(roadCap)}</div>
    <div class="rows" style="margin-top:5px">${Object.entries(cats).sort((a,b)=>b[1]-a[1])
      .map(([c,v]) => `<div class="rw"><span style="width:74px">${esc(c)}</span>
        <span class="b"><i class="k" style="width:${Math.round(100*v/ct)}%"></i></span>
        <span class="v">${money(v)}</span></div>`).join("")
      || `<p class="nodata">no road cost in the window</p>`}</div>
    ${finTable(ro)}
  </div>`;
}

/* Stones are laid on the floor by size, largest first, packed in rows from the
   bottom — a load of stone, not a chart. Positions are DERIVED FROM SERVED
   AMOUNTS; nothing here invents a figure. The engine below is shared by the
   hold and the strip's stones — one packer, one body, never forked. */

/* SIZE IS RANK, NOT RATIO — and the code says so rather than pretending.
   Radius grows with √amount so weight reads by AREA rather than width, but
   rMin is a hard floor: a $1 subscription beside a $1,500 truck payment
   would be a 1px target, and an obligation he cannot tap is an obligation
   he cannot settle. So a small stone is BIGGER than its share. The number
   on the stone is the truth; the size is only the ordering. */
function packStones(items, W, floorY, o){
  const rMin = o.rMin, rMax = o.rMax, x0 = o.x0 ?? 14, gap = o.gap ?? 7,
        rowGap = o.rowGap ?? 8, xMax = o.xMax ?? (W - 10);
  const mx = Math.max(1, ...items.map(s => s.amount));
  const rad = a => rMin + (rMax - rMin)*Math.sqrt(a/mx);
  const sorted = [...items].sort((a,b) => b.amount - a.amount);
  const placed = [];
  let x = x0, y = floorY, rowH = 0;
  for(const s of sorted){
    const R = rad(s.amount);
    if(x + R*2 > xMax){ x = x0; y -= rowH + rowGap; rowH = 0; }
    placed.push({s, cx: x + R, cy: y - R, R});
    x += R*2 + gap; rowH = Math.max(rowH, R*2);
  }
  return placed;
}

function drawStone(g, p, o){
  o = o || {};
  const a = o.faded ? 0.42 : 1;
  const grd = g.createRadialGradient(p.cx - p.R*0.34, p.cy - p.R*0.36, p.R*0.1,
                                     p.cx, p.cy, p.R);
  if(o.hot){ grd.addColorStop(0,`rgba(255,120,90,${0.98*a})`); grd.addColorStop(.55,`rgba(196,39,26,${0.8*a})`);
             grd.addColorStop(1,`rgba(60,12,8,${0.95*a})`); }
  else if(PAPER()){ /* warm river stone — light crown keeps the dark figure legible */
             grd.addColorStop(0,`rgba(206,192,160,${0.95*a})`); grd.addColorStop(.55,`rgba(148,132,102,${0.8*a})`);
             grd.addColorStop(1,`rgba(66,54,36,${0.96*a})`); }
  else     { grd.addColorStop(0,`rgba(214,222,232,${0.95*a})`); grd.addColorStop(.55,`rgba(140,152,166,${0.72*a})`);
             grd.addColorStop(1,`rgba(22,28,36,${0.96*a})`); }
  g.fillStyle = grd;
  g.beginPath(); g.arc(p.cx, p.cy, p.R, 0, 7); g.fill();
  if(o.ring){ g.strokeStyle = o.ring; g.lineWidth = 2;
              g.beginPath(); g.arc(p.cx, p.cy, p.R+2, 0, 7); g.stroke(); }
}

function paintHold(){
  const cv = $("holdC"), w = $("holdW"); if(!cv || !w) return;
  const st = (State.fin.stones || []).filter(s => s.state !== "settled" && s.amount);
  const r = w.getBoundingClientRect();
  const W = Math.max(200, r.width), H = Math.max(160, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  g.clearRect(0,0,W,H);
  const hcs = getComputedStyle(document.documentElement);
  const key = HOT ? (hcs.getPropertyValue("--hot-rgb").trim() || "255,59,24")
                  : (hcs.getPropertyValue("--key").trim() || "255,164,25");
  const placed = packStones(st, W, H - 16, {rMin: 13, rMax: Math.min(52, H*0.2)});
  State.fin.placed = placed;
  const top = placed.length ? Math.min(...placed.map(p => p.cy - p.R)) : H - 20;
  const line = $("holdLine");
  if(line) line.style.bottom = Math.max(28, H - top + 8) + "px";
  for(const p of placed){
    const sel = FIN.pick === p.s.id;
    drawStone(g, p, {hot: p.s.severity === "short",
                     ring: sel ? `rgba(${key},1)` : null});
    /* The number is the truth the size cannot carry, so it goes on every stone
       that can hold legible type — short form under 18px, and the drill-in
       card carries the rest. */
    g.fillStyle = "rgba(10,12,16,.84)";
    g.textAlign = "center"; g.textBaseline = "middle";
    if(p.R >= 22){
      g.font = "700 10px ui-monospace,Menlo,monospace";
      g.fillText(money(p.s.amount), p.cx, p.cy);
    }else if(p.R >= 16){
      g.font = "700 9px ui-monospace,Menlo,monospace";
      g.fillText(short(p.s.amount), p.cx, p.cy);
    }
  }
}

/* THE STONES — the strip's passive tracker, now a YARD with real bodies (his
   word 2026-08-15: "should look more like rocks piled up... land like maybe a
   game filling up and they land where ever they fall"). A tiny verlet sim:
   gravity, walls, the line as the unpaid pile's floor, circle collisions —
   and SLEEP. The sim runs only while something moves, then the yard is a
   still painting; a phone must never pay battery for resting rocks. Paid
   rocks fall through the line and tumble onto the bed. Play is free — fling
   a rock, it comes home — but data stays read-only: the act lives on the
   floor (08-01 ruling). */
let SIM = null, SIM_RAF = 0, SIM_CALM = 0;
const stoneKey = s => (s.bill_type || "") + ":" + (s.bill_id ?? s.id ?? s.title);

/* every rock's lumps are carved from its OWN name — stable across paints,
   never random per frame (a rock that shimmers is a chart pretending) */
function rockLumps(key){
  let h = 2166136261;
  for(const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const out = [];
  for(let i = 0; i < 9; i++){
    h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
    out.push(0.82 + ((h >>> 8) % 1000) / 1000 * 0.3);
  }
  return out;
}

function drawRock(g, x, y, R, lumps, o){
  o = o || {};
  const a = o.faded ? 0.45 : 1, n = lumps.length;
  g.beginPath();
  for(let i = 0; i <= n; i++){
    const t0 = (i % n) / n * Math.PI*2, r0 = R * lumps[i % n];
    const t1 = ((i + 0.5) % n) / n * Math.PI*2,
          r1 = R * (lumps[i % n] + lumps[(i+1) % n]) / 2;
    if(i === 0) g.moveTo(x + Math.cos(t0)*r0, y + Math.sin(t0)*r0);
    else g.quadraticCurveTo(x + Math.cos(t1 - Math.PI/n)*r1*1.04,
                            y + Math.sin(t1 - Math.PI/n)*r1*1.04,
                            x + Math.cos(t0)*r0, y + Math.sin(t0)*r0);
  }
  g.closePath();
  const grd = g.createRadialGradient(x - R*0.34, y - R*0.36, R*0.1, x, y, R*1.05);
  if(o.hot){ grd.addColorStop(0,`rgba(255,120,90,${0.98*a})`); grd.addColorStop(.55,`rgba(196,39,26,${0.8*a})`);
             grd.addColorStop(1,`rgba(60,12,8,${0.95*a})`); }
  else if(PAPER()){ /* warm river stone — light crown keeps the dark figure legible */
             grd.addColorStop(0,`rgba(206,192,160,${0.95*a})`); grd.addColorStop(.55,`rgba(148,132,102,${0.8*a})`);
             grd.addColorStop(1,`rgba(66,54,36,${0.96*a})`); }
  else     { grd.addColorStop(0,`rgba(214,222,232,${0.95*a})`); grd.addColorStop(.55,`rgba(140,152,166,${0.72*a})`);
             grd.addColorStop(1,`rgba(22,28,36,${0.96*a})`); }
  g.fillStyle = grd; g.fill();
}

function simAdopt(){
  /* build or refresh the yard from the ONE producer — positions survive
     re-renders; a bill that flipped paid keeps its body and simply falls */
  const ps = payState(); if(!ps) return null;
  const cv = $("stonesC"), w = $("stonesW"); if(!cv || !w) return null;
  const r = w.getBoundingClientRect();
  const W = Math.max(180, r.width), H = Math.max(110, r.height);
  const all = [...ps.open.filter(s => s.amount).map(s => [s, false]),
               ...ps.settled.filter(s => s.amount).map(s => [s, true])];
  const mx = Math.max(1, ...all.map(([s]) => s.amount));
  const rMax = Math.min(26, H*0.17), rMin = 7;
  const fresh = !SIM;
  if(fresh) SIM = {rocks: new Map()};
  SIM.cv = cv; SIM.W = W; SIM.H = H; SIM.lineY = Math.round(H*0.6);
  SIM.g = cv.getContext("2d");
  cv.width = W*2; cv.height = H*2; SIM.g.scale(2,2);
  const seen = new Set();
  let born = 0;
  for(const [s, paid] of all){
    const k = stoneKey(s); seen.add(k);
    const R = (rMin + (rMax - rMin)*Math.sqrt(s.amount/mx)) * (paid ? 0.72 : 1);
    let rk = SIM.rocks.get(k);
    if(!rk){
      /* born above its TYPE's ground (his eye 08-15: "i like it clustered by
         type") — the rain sorts itself: fixed monthly left, cards center,
         loans right; the in-flight steer below keeps a flung rock's homing */
      const ax = W * typeAnchor(s.bill_type);
      const x = Math.max(10, Math.min(W - 10, ax + (Math.random()-.5)*W*0.22));
      const y = -R - 6 - born*18; born++;
      rk = {k, x, y, ox: x - (Math.random()-.5)*2, oy: y, grab: null, lumps: rockLumps(k)};
      SIM.rocks.set(k, rk);
    }
    if(rk.paid === true && !paid){ /* a settle undone — it climbs back? no: it is re-born above */
      rk.y = -R - 6; rk.oy = rk.y; }
    rk.s = s; rk.R = R; rk.paid = paid;
  }
  for(const k of [...SIM.rocks.keys()]) if(!seen.has(k)) SIM.rocks.delete(k);
  return SIM;
}

/* each bill type owns a stretch of ground — clusters read at a glance */
const typeAnchor = bt => bt === "fixed_monthly" ? 0.18
                       : bt === "credit_card"   ? 0.5
                       : bt === "loan"          ? 0.82 : 0.5;

function simStep(){
  const {rocks, W, H, lineY} = SIM;
  const GRAV = 0.42, DAMP = 0.985;
  for(const r of rocks.values()){
    if(r.grab) continue;
    let vx = (r.x - r.ox) * DAMP;
    const vy = (r.y - r.oy) * DAMP + GRAV;
    /* the steer home fires only on a MOVING rock — a resting pile must owe
       the battery nothing, so sleep stays reachable */
    if(Math.abs(vx) + Math.abs(vy) > 0.2)
      vx += (W * typeAnchor(r.s.bill_type) - r.x) * 0.004;
    r.ox = r.x; r.oy = r.y; r.x += vx; r.y += vy;
  }
  const rs = [...rocks.values()];
  for(let it = 0; it < 3; it++){
    for(const r of rs){
      if(r.x < r.R + 3) r.x = r.R + 3;
      if(r.x > W - r.R - 3) r.x = W - r.R - 3;
      const floor = r.paid ? H - r.R - 4 : lineY - r.R - 1;
      if(r.y > floor) r.y = floor;
    }
    for(let i = 0; i < rs.length; i++) for(let j = i+1; j < rs.length; j++){
      const a = rs[i], b = rs[j];
      if(a.paid !== b.paid) continue;       /* a falling paid rock passes the pile */
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01, min = (a.R + b.R)*0.92;
      if(d < min){
        const push = (min - d)/2, nx = dx/d, ny = dy/d;
        if(!a.grab){ a.x -= nx*push; a.y -= ny*push; }
        if(!b.grab){ b.x += nx*push; b.y += ny*push; }
      }
    }
  }
}

function simPaint(){
  const {g, W, H, lineY, rocks} = SIM;
  g.clearRect(0,0,W,H);
  g.strokeStyle = wash(.22); g.lineWidth = 1;
  g.beginPath(); g.moveTo(6, lineY + .5); g.lineTo(W - 6, lineY + .5); g.stroke();
  for(const r of rocks.values()){
    drawRock(g, r.x, r.y, r.R, r.lumps,
      {hot: !r.paid && (r.s.state === "unmarked" || r.s.severity === "short"),
       faded: r.paid});
    if(r.R >= 15 && !r.paid){
      g.fillStyle = "rgba(10,12,16,.84)";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.font = `700 ${r.R >= 22 ? 10 : 9}px ui-monospace,Menlo,monospace`;
      g.fillText(r.R >= 22 ? money(r.s.amount) : short(r.s.amount), r.x, r.y);
    }
  }
}

function simWake(){
  if(SIM_RAF || !SIM) return;
  SIM_CALM = 0;
  const step = () => {
    SIM_RAF = 0;
    if(!SIM || !document.getElementById("stonesC")){ return; }
    simStep(); simPaint();
    /* sleep when the yard is still — resting rocks cost nothing */
    let live = 0;
    for(const r of SIM.rocks.values())
      if(Math.abs(r.x - r.ox) + Math.abs(r.y - r.oy) > 0.08) live++;
    SIM_CALM = live ? 0 : SIM_CALM + 1;
    if(SIM_CALM < 24) SIM_RAF = requestAnimationFrame(step);
  };
  SIM_RAF = requestAnimationFrame(step);
}

function paintStripStones(){
  if(!simAdopt()) return;
  simPaint(); simWake();
}

function wireStripStones(){
  const cv = $("stonesC"); if(!cv) return;
  const hide = () => { const t = $("stoneTip"); if(t) t.remove(); };
  const at = ev => {
    const r = cv.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null;
    if(SIM) for(const rk of SIM.rocks.values())
      if(Math.hypot(rk.x - x, rk.y - y) <= rk.R + 3) best = rk;
    return {x, y, rk: best};
  };
  const speak = rk => {
    let t = $("stoneTip");
    if(!t){ t = document.createElement("div"); t.id = "stoneTip";
            t.className = "stonetip"; document.body.appendChild(t); }
    t.innerHTML = `<b>${esc(rk.s.title)}</b> · ${rk.s.amount == null ? "——" : money(rk.s.amount)}<br>${
      rk.paid ? "paid — on the bed" : esc(rk.s.sub || "due")}`;
    return t;
  };
  cv.addEventListener("pointerdown", ev => {
    const {x, y, rk} = at(ev);
    if(!rk){ hide(); return; }
    cv.setPointerCapture(ev.pointerId);
    rk.grab = {dx: rk.x - x, dy: rk.y - y};
    const t = speak(rk);
    t.style.left = Math.min(innerWidth - 200, ev.clientX + 10) + "px";
    t.style.top = Math.max(6, ev.clientY - 40) + "px";
    simWake();
  });
  cv.addEventListener("pointermove", ev => {
    if(!SIM) return;
    let grabbed = null;
    for(const rk of SIM.rocks.values()) if(rk.grab) grabbed = rk;
    if(grabbed){
      const r = cv.getBoundingClientRect();
      /* his hand carries it; ox/oy trail so release inherits the throw */
      grabbed.ox = grabbed.x; grabbed.oy = grabbed.y;
      grabbed.x = ev.clientX - r.left + grabbed.grab.dx;
      grabbed.y = ev.clientY - r.top + grabbed.grab.dy;
      simWake();
      return;
    }
    if(ev.pointerType === "mouse"){
      const {rk} = at(ev);
      if(rk){ const t = speak(rk);
        t.style.left = Math.min(innerWidth - 200, ev.clientX + 10) + "px";
        t.style.top = Math.max(6, ev.clientY - 40) + "px";
      } else hide();
    }
  });
  const drop = () => {
    if(!SIM) return;
    for(const rk of SIM.rocks.values()) rk.grab = null;
    simWake();
  };
  cv.addEventListener("pointerup", drop);
  cv.addEventListener("pointercancel", drop);
  cv.addEventListener("pointerleave", () => hide());
}

/* THE BOOKS — Bryan, 2026-08-02: "repurpose the standing tab for an overview
   of my accounts cash status, visuals on contributions from loads to the nut.
   this is where i will go to deep dive on my finances."

   Two facts side by side: what is IN THE TANKS right now (accounts + their
   envelopes, served whole from the one finance store), and WHO FED THE NUT —
   each load's surviving contribution laid as a filling bar against the
   month's fixed cost. The standings list this replaced lives on where it
   belongs now: open bills in the nut checklist, settled ones in the bucket. */
function finBooks(){
  const A = State.fin.accounts, ro = State.fin.rollup, l = State.fin.loads;
  const R = (ro && ro.reconciliation) || {};
  /* ── cash ── */
  /* AVAILABLE IS THE CALLOUT (Bryan, 2026-08-02): available is what he can
     actually spend today; the ledger figure is context and rides tiny. */
  let cash;
  if(!A) cash = `<div class="gen" style="min-height:80px"><span class="nodata">${
    esc(State.fin.acctErr || "the spine has not answered with the accounts")}</span></div>`;
  else cash = `<div class="cashrow tot"><span>all accounts — available</span>
      <b>${A.available_total == null ? "——" : money(A.available_total)}</b>
      <i>${A.total == null ? "" : "ledger " + money(A.total)}</i></div>`
    + (A.accounts||[]).map(a => {
      const avail = a.available_balance != null ? a.available_balance : a.balance;
      return `<div class="cashrow">
      <span>${esc(a.name || a.id || "?")}${a.last4 ? ` <u>·${esc(a.last4)}</u>` : ""}</span>
      <b>${avail == null ? "——" : money(avail)}</b>
      <i>${a.balance == null ? "" : "ledger " + money(a.balance) + " · "}${
        a.updated_at ? "as of " + esc(String(a.updated_at).slice(0,10)) : "as-of unknown"}</i>
      ${(a.envelopes||[]).map(en => `<div class="env"><span>${esc(en.name)}</span>
        <b>${en.balance == null ? "——" : money(en.balance)}</b>${
        en.target ? `<i>of ${money(en.target)}</i>` : ""}</div>`).join("")}
    </div>`;}).join("");
  /* ── the nut, being fed ── */
  /* the rollup rows already CARRY broker/city/date served — the loads join
     only freshens them; when the loads fetch failed the served values stand
     (panel finding: the join was clobbering served fields with undefined) */
  const rows = (ro && ro.loads || [])
    .map(r => {
      const id = (l && (l.loads||[]).find(x => x.sheet_row === r.sheet_row)) || {};
      return {...r, broker: id.broker || r.broker,
              city: id.delivery_city || r.delivery_city,
              date: id.delivery_date || r.delivery_date};
    })
    .sort((a,b) => (a.date||"") < (b.date||"") ? -1 : 1);
  /* KNOWN AND UNKNOWN KEPT APART (card #343): a load whose fee no deposit has
     fixed carries no contribution — it is listed under what it would feed if
     no fee was taken, never summed into the known total */
  const unk = rows.filter(r => r.nut_contribution == null && r.net_if_no_fee != null);
  const known = rows.filter(r => r.nut_contribution != null);
  const nut = R.nut;
  let feed;
  if(!ro) feed = `<div class="gen" style="min-height:80px"><span class="nodata">${
    esc(State.fin.err || "the spine has not answered with the rollup")}</span></div>`;
  else if(nut == null) feed = `<div class="nodata">the nut is unreadable — nothing to measure against</div>`;
  else {
    /* the totals are SERVED by the rollup (card #343) — one home; the page
       used to sum every load with the fee taken as $0 */
    const fed = ro.fed_to_nut_known, gave = ro.given_back_known || 0;
    const unkN = ro.fed_to_nut_unknown_n || 0, unkUp = ro.fed_to_nut_if_no_fee, unkBack = ro.given_back_if_no_fee || 0;
    const scale = Math.max(nut, fed || 0, 1);
    let x = 0;
    const segs = known.filter(r => r.nut_contribution > 0).map(r => {
      const w = r.nut_contribution / scale * 100, x0 = x; x += w;
      return `<div class="nutseg" style="left:${x0}%;width:${Math.max(w,.4)}%"
        title="${esc(r.broker || "?")} · ${esc(r.date || "")} · ${money(r.nut_contribution)}${
        r.nut_pct != null ? " · " + r.nut_pct + "% of the nut" : ""}"></div>`;
    }).join("");
    feed = `<div class="nutbar">
        ${segs}
        <div class="nutline" style="left:${Math.min(nut/scale*100, 99.7)}%"></div>
      </div>
      <div class="recline" style="margin-top:6px">
        <span><b>${fed == null ? "——" : money(fed)}</b> fed to the nut${
          ro.fed_to_nut_known_n != null ? ` · ${ro.fed_to_nut_known_n} load${ro.fed_to_nut_known_n===1?"":"s"} with a measured fee` : ""}</span>
        ${gave < 0 ? `<span><b class="hot">${money(gave)}</b> given back</span>` : ""}
        ${unkN ? `<span class="unk" title="${esc(ro.fed_to_nut_basis || "")}">${unkN} load${unkN===1?"":"s"}, fee unknown — up to <b>${
          money(unkUp || 0)}</b> if no fee${unkBack < 0 ? `, −${money(Math.abs(unkBack))} given back` : ""}</span>` : ""}
        <span>the nut: <b>${money(nut)}</b></span>
      </div>
      <div class="scroll" style="margin-top:9px;max-height:38vh">${
        known.slice().sort((a,b) => b.nut_contribution - a.nut_contribution).map(r =>
        `<div class="lrow${r.nut_contribution < 0 ? " short" : ""}">
          <div class="t">${esc(r.broker || "—")}${r.city ? " · " + esc(r.city) : ""}</div>
          <div class="a">${(r.nut_contribution >= 0 ? "+" : "−") + money(Math.abs(r.nut_contribution))}</div>
          <div class="s">${esc(r.date || "")}${
            r.nut_pct != null ? ` · ${r.nut_pct}% of the nut` : ""}</div></div>`).join("")
        + unk.slice().sort((a,b) => b.net_if_no_fee - a.net_if_no_fee).map(r =>
        `<div class="lrow unk" title="${esc(r.net_basis || "")}">
          <div class="t">${esc(r.broker || "—")}${r.city ? " · " + esc(r.city) : ""}</div>
          <div class="a">——</div>
          <div class="s">${esc(r.date || "")} · fee unknown · ${r.net_if_no_fee < 0 ? "−" : "up to +"}${money(Math.abs(r.net_if_no_fee))} if no fee</div></div>`).join("")
        || `<p class="nodata">no loads with a contribution in this window</p>`}</div>`;
  }
  /* faults — the spine still names them; since the standings list left this
     tab, the books are their one home (panel finding: they rendered nowhere) */
  const faults = (State.standings && State.standings.faults) || [];
  const faultStrip = !faults.length ? "" :
    `<div class="panel" style="margin-bottom:10px"><div class="cap">faults — the spine cannot place these</div>${
      faults.map(f => `<div class="hotline">${esc(f.name||f.bill_id||"?")}${
        f.amount != null ? " · " + money(f.amount) : ""} — ${esc(f.why||f.kind||"")}</div>`).join("")}</div>`;
  /* THE RECORD — Bryan, 2026-08-02: "where are the individual transactions
     with categories... we will use the running list as all transactions with
     categories." 2026-08-03: reordered to read like a ledger line — Date |
     Category | Payee | Amount | Notes | Status, the order a bookkeeper
     writes: when, what kind, who, how much, what became of it, where the
     bank stands — and given two thirds of the row, WHERE THE MONEY GOES
     standing beside it. Read-only here — the floor is where rows get worked. */
  const txAll = (State.fin.expenses && State.fin.expenses.transactions) || [];
  const sift = FIN.catFilter;
  const tx = sift ? txAll.filter(t => (t.category || "uncategorized") === sift) : txAll;
  const note = t => (
    (t.placements||[]).length ? (t.placements.length > 1
      ? `split ${t.placements.length} ways on loads` : "placed on a load")
    : (t.monthly_pay||[]).length ? `paid ${esc(t.monthly_pay[0].name)} — monthly`
    : t.accounted ? "already accounted for — your hand"
    : t.deposit ? (t.deposit_refund
        ? "deposit — refunded " + esc(t.deposit_refund.refund_date || "")
          + (t.filed_at ? " — filed by your hand" : "")
        : "deposit — awaiting the refund")
    : t.expired ? (t.filed_at ? "the bank never settled it — filed by your hand"
                              : "the bank never settled it — held out")
    : t.credit ? "credit — place it on the load it belongs to"
    : t.personal ? "tagged personal"
    : t.transfer ? "money moved between your accounts — not spend"
    /* the same words the floor and the spine use for a cash draw — one story */
    : (t.undraggable_because || "").startsWith("cash")
      ? (t.filed_at ? "cash — filed by your hand" : "cash — what it bought is invisible until itemized")
    /* the record is the one home a filed one-off keeps (card #225) — it
       must say so here, and carry his note, or the mark is invisible */
    : t.filed_at ? "filed by your hand — a one-off, no bill"
    : t.filed_aside ? "unplaced — a one-off filing stands aside behind this row's newer ruling"
    : "unplaced") + (t.note ? ` · “${esc(t.note)}”` : "");
  const bank = t => t.expired ? "expired" : t.pending ? "pending" : "posted";
  /* the ask lives here too now — a MONTHLY answer begun from the record must
     come back to the record, not to a bucket on another tab */
  const ask = FIN.ask ? `<div class="ask" style="margin-bottom:9px">
      <div class="at">${FIN.ask.no_match
        ? `no bill matches ${esc(FIN.ask.txn.merchant || "this row")} ${
            money(FIN.ask.txn.amount)} — name it yourself`
        : `which bill did ${esc(FIN.ask.txn.merchant || "this")} ${
            money(FIN.ask.txn.amount)} pay?`}</div>
      ${FIN.ask.candidates.map(c => `<button class="acand" data-txn="${FIN.ask.txn.id}"
        data-bt="${esc(c.bill_type)}" data-bid="${esc(c.bill_id)}">
        <span>${esc(c.name)}</span><b>${money(c.due)}</b>
        <i>${esc(c.why)}</i></button>`).join("")}
      ${askExtras(FIN.ask)}
      <button class="acand cancel">none of these — put it back</button>
    </div>` : "";
  const record = `<div class="panel" style="min-width:0">
    <div class="cap">the record — ${tx.length}${sift ? ` of ${txAll.length}` : ""} transaction${
      tx.length===1?"":"s"} in ${esc(FIN.period)}${
      sift ? ` · sifted to ${esc(sift)} — tap it again to clear` : ", every one with its category"}</div>
    ${ask}
    <div class="lghead"><span>date</span><span>category</span><span>payee</span>
      <span class="ra">amount</span><span>notes</span><span style="text-align:right">status</span></div>
    <div class="scroll" style="max-height:52vh">${
      tx.length ? tx.map(t => `<div class="lgr${t.accounted ? " dim" : ""}" data-txn="${t.id}"
        title="tap the row for its moves — MONTHLY, a load, accounted, deposit">
        <span class="ld" title="${esc(t.date)}">${esc(String(t.date||"").slice(5))}</span>
        <span class="lc"><span class="catchip edit" data-cat-txn="${t.id}"
          title="tap to change the category — the rules learn it">${
          esc(t.category || "uncategorized")}</span></span>
        <span class="lp" title="${esc(t.description || "")}">${esc(t.merchant || t.description || "—")}</span>
        <span class="la${t.credit ? " cr" : ""}">${
          t.credit ? "+" + money(Math.abs(t.amount)) : money(t.amount)}</span>
        <span class="ln">${note(t)}</span>
        <span class="lst ${bank(t)}">${bank(t)}</span>
        <span class="lsub">${esc(String(t.date||"").slice(5))} · ${note(t)} · ${bank(t)}</span></div>`).join("")
      : `<p class="nodata">${sift ? `nothing in ${esc(sift)} this window` :
          "nothing in the window — drop a csv up on the floor"}</p>`}</div></div>`;
  /* WHERE THE MONEY GOES — the window's five biggest categories, trailing
     six windows etched like level marks on glass; the viewed window burns
     amber, the dashed line is the trailing average. The producer computed
     all of it; this only draws. Each trend wears its OWN scale — the
     numbers carry size across categories, the bars carry shape within one. */
  const sp = State.fin.spend;
  let goes;
  if(!sp) goes = `<span class="nodata">the spine has not answered with the breakdown</span>`;
  else if(!(sp.categories||[]).length) goes = `<span class="nodata">no spend in the window yet</span>`;
  else goes = sp.categories.map((c,ix) => {
      const mx = Math.max(...c.series.map(v => Math.max(v,0)), 1);
      const bars = c.series.map((v,i) => {
        const on = i === sp.windows.length - 1;
        const h = v > 0 ? Math.max(v/mx*100, 3) : 0;
        return `<div class="sb${on ? " on" : ""}" title="${esc(sp.windows[i].label)} · ${
          money(Math.max(v,0))}${v < 0 ? " net credit" : ""}"><i style="height:${h}%"></i></div>`;
      }).join("");
      const wl = c.avg > 0 ? Math.min(c.avg/mx*100, 100) : null;
      const un = c.name === "uncategorized";
      return `<div class="scat${FIN.catFilter===c.name ? " picked" : ""}" data-spend-cat="${esc(c.name)}"
        title="tap to sift the record to ${esc(c.name)}">

        <div class="sxl">${sp.windows.map(w => `<span>${esc(w.label)}</span>`).join("")}</div>

  const spend = `<div class="panel" style="min-width:0">

    <div class="scroll" style="max-height:58vh">${goes}</div>
    ${sp && (sp.categories||[]).length ? `<div class="sfoot">${money(sp.window_total)} spent in the
       window · dashed line = the trailing average · held out: ${esc(sp.held_out)} ·
       each trend on its own scale · tap a category to sift the record</div>` : ""}</div>`;
  /* the intake lives HERE now (Bryan, 2026-08-02: "move the drop cards from
     the floor to the books") — dropping feeds the record and the tanks, and
     both of those live on this tab. Moved, not copied. */
  const intake = `<div class="panel" style="margin-bottom:10px;display:grid;
      grid-template-columns:1fr 1fr;gap:8px">
    <div class="drop" id="dropCsv" style="margin:0">
      <div class="dl">drop a transactions csv</div>
      <div class="ds">LoadPay, PNC or Gemini card · deduped by the importer</div></div>
    <div class="drop" id="dropShot" tabindex="0" style="margin:0">
      <div class="dl">balances &amp; statements</div>
      <div class="ds">click then &#8984;V, or drop an image</div>
      <div class="acctpick" title="whose transactions are in this image — pendings ride in under the right account">${
        ["pnc","loadpay"].map(a => `<button data-acct="${a}" class="${
          (FIN.shotAcct||"pnc")===a ? "on" : ""}">${a}</button>`).join("")}</div></div>
  </div>`;
  /* ── MONEY IN — the deposits ledger (card #103) ──────────────────────
     The record above is the SPEND lane by design (its producer holds
     amount<0 plus road credits; "deposit" there means a hotel hold), so
     income rendered NOWHERE once categorized — his 2026-08-12 ask:
     "where am i validating deposits." Every positive row in its window,
     category chip tappable through the SAME writer the record uses.
     Rows carry no data-txn on purpose: the spend row-menu (MONTHLY,
     loads, deposit) has no business on money in — the chip is the act. */

function lrDrawScope(animate){

  cv.width = cv.clientWidth * dpr; cv.height = 84 * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.clientWidth, H = 84, Y = H - 18;
  const sx = id => 14 + (lrHash(id) % 1000) / 1000 * (W - 28);
  const still = () => {
    g.clearRect(0, 0, W, H);
    g.strokeStyle = "rgba(150,170,190,.25)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(8, Y + .5); g.lineTo(W - 8, Y + .5); g.stroke();
    dial.forEach(s => { g.fillStyle = s.active ? "rgba(150,90,220,.9)" : "rgba(94,104,112,.7)";
      g.fillRect(sx(s.id) - .75, Y - 5, 1.5, 10); });
    heard.forEach(k => { g.fillStyle = "rgba(150,90,220,.35)";
      g.beginPath(); g.arc(sx(k.source_id), Y - 9, 1.6, 0, 7); g.fill(); });
    fresh.forEach(k => { const a = .35 + .55 * (k.score || 0) / 100;   /* brightness IS score */
      g.shadowColor = "rgba(150,90,220,.35)"; g.shadowBlur = 3;
      g.fillStyle = `rgba(150,90,220,${a})`;
      g.beginPath(); g.arc(sx(k.source_id), Y - 9, 1.6, 0, 7); g.fill();
      g.shadowBlur = 0; });
  };
  if(!animate){ still(); return; }
  /* THE LANDING — one-shot, strongest first, ≤1.4s, then a still instrument */
  const seen = LR.seen();
  const arcs = fresh.filter(s => lrCreatedMs(s) > seen).slice(0, 9);
  if(!arcs.length){ still(); return; }
  const cold = $("lrCold"); if(cold){ cold.classList.add("pre");
    setTimeout(() => cold.classList.remove("pre"), 550); }
  const t0 = performance.now(), DUR = 620, STAG = 90;
  const step = now => {
    still();

    arcs.forEach((k, i) => {
      const p = Math.min(1, Math.max(0, (now - t0 - i * STAG) / DUR));
      if(p < 1) live = true;
      if(p <= 0 || p >= 1){
        if(p >= 1 && now - t0 - i * STAG < DUR + 180){   /* amber touchdown spark */
          const f = 1 - (now - t0 - i * STAG - DUR) / 180;
          g.fillStyle = `rgba(255,196,90,${.95 * f})`;
          g.beginPath(); g.arc(sx(k.source_id), Y - 9, 2 + (1 - f) * 1.2, 0, 7); g.fill();
          live = true;

      }
      const x1 = sx(k.source_id), x0 = x1 + (i % 2 ? -1 : 1) * W * .3;
      const e = 1 - Math.pow(1 - p, 3);
      const x = x0 + (x1 - x0) * e, y = 6 + (Y - 9 - 6) * e * e;
      g.strokeStyle = `rgba(150,90,220,${(.55 * (1 - p) + .2) * (.5 + .5 * (k.score || 0) / 100)})`;

      g.fillStyle = "rgba(255,196,90,.95)";
      g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill();

  };

}
/* WAV byte envelope — DataView chunk-walk; LIST chunks handled, data never
   assumed at 44. No AudioContext anywhere near playback (spec ruling). */
function lrEnvelope(ab){
  try{
    const v = new DataView(ab);
    if(v.getUint32(0) !== 0x52494646) return null;
    let off = 12, dataOff = 0, dataLen = 0, bps = 16;
    while(off + 8 <= v.byteLength){
      const id = v.getUint32(off), len = v.getUint32(off + 4, true);
      if(id === 0x666d7420) bps = v.getUint16(off + 22, true);
      else if(id === 0x64617461){ dataOff = off + 8; dataLen = Math.min(len, v.byteLength - dataOff); break; }
      off += 8 + len + (len & 1);
    }
    if(!dataOff || bps !== 16) return null;
    const n = Math.floor(dataLen / 2), B = 160, per = Math.max(1, Math.floor(n / B));
    const peaks = new Float32Array(B);
    for(let b = 0; b < B; b++){
      let m = 0; const stride = Math.max(1, Math.floor(per / 64));
      for(let i = 0; i < per; i += stride){
        const p = dataOff + (b * per + i) * 2;
        if(p + 1 >= dataOff + dataLen) break;
        const s = Math.abs(v.getInt16(p, true)) / 32768; if(s > m) m = s;
      }
      peaks[b] = m;
    }
    return peaks;
  }catch(_){ return null; }
}
function lrPaintCarrier(){

/* ═══ THE PLANNER — the almanac's own pages (card #120) ═════════════════
   The day's chores up top, and the year written as weather in his own
   colors. Practice + weather + the list — bik's Planning and Tasks tabs,
   absorbed. His labels, his colors, verbatim — never paraphrased. */
const LP = {
  date: null,            // the practice day being viewed (null = today)
  y: null,               // the weather year being viewed (his tee: plan at a year glance)
  pick: null,            // date awaiting a color
  finOpen: new Set(),    // per-column finished folds
};
function lpToday(){ const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function lpShift(dateS, days){ const d = new Date(dateS + "T12:00:00");
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
/* DST danger zones — ported verbatim from his bik planning tab: 2nd Sunday
   of March and 1st Sunday of November, seven days either side. */
function lpDstDates(year){
  const nth = (month, n) => { const d = new Date(year, month, 1); let c = 0;
    while(c < n){ if(d.getDay() === 0) c++; if(c < n) d.setDate(d.getDate()+1); }
    return d; };
  const out = {};
  for(const pivot of [nth(2,2), nth(10,1)])
    for(let o = -7; o <= 7; o++){ const d = new Date(pivot);
      d.setDate(d.getDate()+o);
      out[`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`] = true; }
  return out;
}
async function lpWrite(path, bodyObj){
  const r = await fetch(url(path), { method:"POST",
    headers: hdr({"Content-Type":"application/json"}),
    body: JSON.stringify(bodyObj) });
  const out = await r.json().catch(() => ({}));
  if(!r.ok || out.error) throw new Error(out.error || ("HTTP " + r.status));
  return out;
}
async function lpRefetch(){
  try{ State.planner = await grab("/api/planner" + (LP.y ? "?year=" + LP.y : "")); }catch(_){}
}
function lpDayView(){
  const pl = State.planner, date = LP.date || lpToday();
  if(date === (pl.today || {}).date) return pl.today;
  /* a past day edits only once its year is actually LOADED — a save built
     from an unloaded blank would overwrite real history with nothing */
  const loaded = pl.year && pl.year.y === +date.slice(0, 4);
  const hit = loaded ? (pl.year.days || {})[date] : null;
  return { date,
           checks: hit ? (hit.checks || []) : (loaded ? [] : null),
           workout: hit ? hit.workout : 0, above: hit ? hit.above : 0,
           morning: hit ? hit.m : 0, daily: hit ? hit.d : 0,
           thin: !loaded };
}

  /* YEAR AT A GLANCE — the bik format, his tee (card #123): months as

  const thisY = +today.slice(0, 4);

  let grid = "";
  for(let m = 1; m <= 12; m++){

    let row = `<span class="pl-ymon">${MON[m-1]}</span>`;
    for(let col = 0; col < 37; col++){

      const ds = `${Y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const x = yd[ds];
      /* the mark is DRAWN, not typed — see .ym in the sheet. A marked day
         trades its number for the mark, so the title carries what it means. */
      const mk = x ? (x.all7 ? "star" : x.m >= 3 ? "chk" : (x.m || x.d) ? "dash" : "") : "";
      const mark = mk ? `<i class="ym ${mk}"></i>` : "";
      const meansW = { star: "all 7", chk: "morning done", dash: "partial" };
      const cls = "pl-yc" + (dst[ds] ? " dst" : "") + (ds === today ? " today" : "")
        + (x && x.workout ? " wk" : "") + (LP.pick === ds ? " picked" : "");
      /* workout is a BAR now, so it no longer blocks his color from painting */
      const paint = (x && x.color && !dst[ds] && ds !== today)

      const tt = ds + (mk ? ` — ${meansW[mk]}` : "") + (x && x.workout ? " · workout" : "");

    }
    grid += `<div class="pl-yrow">${row}</div>`;
  }
  const pickerHTML = LP.pick ? `<div class="pl-picker">
      <span class="cap" style="margin-right:4px">${esc(LP.pick)} —</span>
      ${(pl.colors || []).map(c => `<button class="pl-swatch" data-c="${c.hex}"
        style="background:${c.hex}" title="${esc(c.name)} — ${esc(c.means)}"></button>`).join("")}
      <button class="pl-swatch clear" data-c="" title="clear the day">✕</button></div>` : "";
  const weatherHTML = `<div class="panel pl-weather">

    <div class="pl-yearwrap">${wdHdr}${grid}</div>
    ${pickerHTML}
    <div class="pl-legend"><span class="tdk">today</span><span class="wkk">workout</span><span class="dstk">dst zone</span><span class="lgk"><i class="ymk"><i class="ym star"></i></i>all 7</span><span class="lgk"><i class="ymk"><i class="ym chk"></i></i>morning</span><span class="lgk"><i class="ymk"><i class="ym dash"></i></i>partial</span><span>tap a day for its color</span></div>
  </div>`;
  /* THE LISTS — the bik Tasks layout, his ruling: quick inbox + shopping
     up top, then vertical category COLUMNS each carrying the four
     timeframe buckets. Life tasks stay separate from the work board. */
  const open = (pl.tasks && pl.tasks.open) || [];
  const doneR = (pl.tasks && pl.tasks.done_recent) || [];
  const byCat = {};
  open.forEach(t => (byCat[t.category] = byCat[t.category] || []).push(t));
  const TFS = [["weekly","this week","w"],["monthly","this month","m"],
               ["quarterly","this quarter","q"],["annual","this year","y"]];
  const TFL = { weekly:"week", monthly:"month", quarterly:"quarter", annual:"year" };
  const mmdd = iso => iso ? esc(String(iso).slice(5,10).replace("-","/")) : "";
  const taskRow = t => {
    const subs = t.subtasks || [];
    const subChip = subs.length
      ? `<span class="pl-subc">${subs.filter(s => s && s.done).length}/${subs.length}</span>` : "";
    /* HIS HAND ON THE LISTS (card #232): a real checkbox finishes it; the
       text is the door to its moves (tap or right-click); the row drags on
       the desk. The chip keeps its quick cycle. */
    return `<div class="pl-task" data-id="${t.id}" data-cat="${esc(t.category)}" data-tf="${esc(t.timeframe)}" draggable="true">
      <input type="checkbox" class="pl-done" data-id="${t.id}" title="done">
      <span class="pl-tx" data-id="${t.id}" title="tap for its moves — reorder, another bucket, another list">${esc(t.text)}<i class="pl-dt">${mmdd(t.created_at)}</i></span>${subChip}
      <button class="pl-retime" data-id="${t.id}" data-tf="${esc(t.timeframe)}"

  };
  /* every bucket is a CONTAINER (data-cat, data-tf) so a drop lands somewhere:
     the inboxes are one flat weekly bucket each; the columns carry four */
  const bucket = (cat, tf, rows, ghost) =>
    `<div class="pl-bucket" data-cat="${cat}" data-tf="${tf}">${rows.map(taskRow).join("") || `<div class="pl-ghost">${ghost}</div>`}</div>`;
  const inboxPanel = (cat, icon, label, ph, cls) => {
    const rows = byCat[cat] || [];
    return `<div class="panel pl-col ${cls}">
      <div class="pl-colhead"><span>${icon} ${label}</span><b>${rows.length}</b></div>
      <input class="pl-addin" data-cat="${cat}" placeholder="${ph}" autocapitalize="off">
      ${bucket(cat, "weekly", rows, "nothing waiting")}</div>`;
  };
  const colPanel = (cat, icon, cls) => {
    const list = byCat[cat] || [];
    const fin = doneR.filter(t => t.category === cat);
    const finOpen = LP.finOpen && LP.finOpen.has(cat);
    let buckets = "";
    for(const [tf, lbl, k] of TFS){
      const rows = list.filter(t => t.timeframe === tf);

    }
    return `<div class="panel pl-col ${cls}">
      <div class="pl-colhead"><span>${icon} ${cat}</span><b>${list.length}</b></div>

     2/3 calendar — the bik proportion) and stack back to a column on the

  return whyBar() + `<div class="scroll pl-page" id="plScroll">`
    + `<div class="pl-duo">` + practiceHTML + weatherHTML + `</div>`

async function lpSavePractice(t, patch){

    { date: next.date, checks: next.checks, workout: next.workout, above: next.above });

  if(State.planner && out.practice && out.practice.date === (State.planner.today || {}).date)
    State.planner.today = out.practice;
  await lpRefetch();
  paintField();

}
function wirePlanner(){

      catch(err){ toast(String(err.message || err)); } }));

     cycles week→month→quarter→year, ✕ removes. Never optimistic. */

    inp.addEventListener("keydown", async e => {

      catch(err){ inp.disabled = false; toast(String(err.message || err)); }

      catch(err){ cb.checked = false; cb.disabled = false; toast(String(err.message || err)); } }));

          { timeframe: NEXT[b.dataset.tf] || "weekly" });

      catch(err){ b.disabled = false; b.textContent = "✕"; toast(String(err.message || err)); } }));
  R.querySelectorAll(".pl-fin").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation();
      const c = b.dataset.cat;
      LP.finOpen.has(c) ? LP.finOpen.delete(c) : LP.finOpen.add(c);

/* HIS HAND ON THE LISTS (card #232): one menu for a task's every move —
   its place, its bucket, its list — reachable by TAP, because the Fold has
   no drag. The same house menu the money floor uses. */
const PL_TF = [["weekly","this week"],["monthly","this month"],["quarterly","this quarter"],["annual","this year"]];
const PL_CATS = [["quick","⚡ quick inbox"],["shopping","🛒 shopping"],["business","💼 business"],
                 ["personal","👤 personal"],["spiritual","🙏 spiritual"]];
const plTfWord = tf => (Object.fromEntries(PL_TF)[tf] || tf);
function plMenu(ev, t){

/* the desk's shortcut: drag a row onto a bucket (end of it) or onto another
   row (above its midline = before it, below = after it); the order the eye
   sees is the order the spine writes */
function plWireDrag(R){
  R.querySelectorAll(".pl-task[draggable]").forEach(row => {
    row.addEventListener("dragstart", ev => {
      LP.drag = Number(row.dataset.id); row.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", row.dataset.id);
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging"); LP.drag = null;
      R.querySelectorAll(".pl-bucket.over").forEach(b => b.classList.remove("over"));
    });
  });
  R.querySelectorAll(".pl-bucket").forEach(bk => {
    bk.addEventListener("dragover", ev => {
      if(LP.drag == null) return;
      ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; bk.classList.add("over");
    });
    bk.addEventListener("dragleave", ev => { if(!bk.contains(ev.relatedTarget)) bk.classList.remove("over"); });
    bk.addEventListener("drop", async ev => {
      ev.preventDefault(); bk.classList.remove("over");
      const id = LP.drag != null ? LP.drag : Number(ev.dataTransfer.getData("text/plain"));
      LP.drag = null;
      if(!id) return;
      const ids = [...bk.querySelectorAll(".pl-task")].map(r => Number(r.dataset.id)).filter(x => x !== id);
      const onRow = ev.target.closest(".pl-task");
      if(onRow && Number(onRow.dataset.id) !== id){
        const i = ids.indexOf(Number(onRow.dataset.id));
        const r = onRow.getBoundingClientRect();
        ids.splice(ev.clientY < r.top + r.height / 2 ? i : i + 1, 0, id);
      } else ids.push(id);
      await plMove(id, { category: bk.dataset.cat, timeframe: bk.dataset.tf, order: ids });
    });
  });
}

     scrolls back to the top throws away where he was working — drop an expense
     on the eleventh load and the answer arrives at the top of the page. The
     scroll position is his, not the render's. */
  const keep = [];

      keep.push([el.className, el.scrollTop, el.scrollLeft]);

     and drops the Fold's keyboard — the caret is his, not the render's.

  const fo = document.activeElement;

/* ── THE RULING (cards #87/#100) ─────────────────────────────────────
   'Nothing closes but by his hand' — and 'the gesture grammar: HOLD is
   constitutional (a close, a confirm, the acts that are yours alone and
   irreversible in meaning); TAP is a reversible ack; a 409 WITH CANDIDATES
   is the machine asking'. A RULING is his highest-stakes act — it is a HOLD,
   twice: once on the card to open the sheet, once on RECORD to write his
   words. A tap does nothing on either. The words go to the spine verbatim
   and the SPINE lowers needs_bryan — the desk never clears a flag itself. */

/* ONE HOLD, THREE ACTS. The close's mechanics — the 640 ms ring, the 620 ms
   guard against a stale timer, the visibility guard, the release toast —
   sat inline in wireCards; they are one body now, so RULE and RECORD are
   the same gesture as CLOSE and not a near copy of it. onHeld(cc) runs once
   the hold lands: return false to re-arm quietly (the sheet opened); throw
   to refuse in words (the toast carries o.refused + the reason); return
   anything else to leave the button as it set itself (CLOSED, RECORDED).
   holdToAct, not wireHold — the money room owns wireHold (its drag-to-read
   hold, ~7860), and a second declaration of that name would hoist over it. */
function holdToAct(btn, o, onHeld){
  let t = 0, anim = null;
  const r2 = btn.querySelector(".r2"), cc = btn.querySelector(".cc");
  const rest = () => { btn.disabled = false; cc.textContent = o.idle;
    r2.getAnimations().forEach(a => a.cancel()); r2.style.transform = "scaleX(0)"; };
  btn.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    if(btn.disabled || document.visibilityState !== "visible") return;
    cc.textContent = "HOLDING";
    anim = r2.animate({transform:["scaleX(0)","scaleX(1)"]},
      {duration:640, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
    const t0 = performance.now();
    t = setTimeout(async () => {
      if(performance.now() - t0 < 620) return;
      if(document.visibilityState !== "visible") return;
      btn.disabled = true; cc.textContent = o.busy;
      let took = false;
      try{ took = (await onHeld(cc)) !== false; }
      catch(err){ toast(o.refused + " — " + (err.message || err)); }
      if(!took) rest();
    }, 640);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, e => {
    clearTimeout(t); if(anim) anim.cancel();
    /* a CANCEL is the browser taking the gesture for a scroll, not his
       release — panning past a RULE bar must not toast a refusal at him */
    if(cc.textContent === "HOLDING"){ rest(); if(e.type !== "pointercancel") toast(o.released); }
  }));
}
