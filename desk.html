    if(!words){
      err.textContent = "a ruling needs your words — the field is empty"; err.hidden = false;
      return false;
    }
    /* the spine says whether the day's page took the decision line; declared
       out here because the toast below has to be able to say it */
    let book = null;
    try{
      const res = await fetch(url(`/api/cards/${id}/rule`), {
        method:"POST", headers: hdr({"Content-Type":"application/json"}),
        body: JSON.stringify({ words })
      });
      const out = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(out.error || ("the spine answered " + res.status));
      book = out.logged_to_entry;
    }catch(e){
      /* the refusal renders IN the sheet too — a toast is gone in 2.4 s and a
         tooltip does not exist under a thumb (review of #84); his words stay */
      err.textContent = String(e.message || e); err.hidden = false;
      throw e;
    }
    cc.textContent = "RECORDED";
    /* A RULING THAT MISSED THE BOOK SAYS SO, HERE (review of #87). The spine
       only logs the decision move when exactly ONE entry lies open, and it
       shouts the skip to its own stderr — which he never sees from a phone.
       Today NO entry is open, so that is EVERY ruling made from the road: the
       card would carry it and the day's page would not, and nothing on the
       glass would tell him. So the toast carries it. */
    toast("#" + id + " RULED BY YOUR HAND" +
          (book ? "" : " — no entry open; the card holds it, the day does not"));
    /* THE WRITE LANDED — nothing past this line may claim otherwise (the
       same rule the .dact handler keeps, ~2899). The repaints — the board
       with the flag down and the RULED block, the masthead's docket count,
       the drawer if open — degrade quietly; a phone that drops off the
       tailnet after the 2xx must never toast NOT RECORDED over a ruling
       that is already in the book, or he holds again and rules twice. */
    try{
      closeRuleSheet();
      await load(true);
      if(!$("dockWrap").hidden) renderDocket();
    }catch(_){}
  });
}
function wireCapMedia(){
  /* 🕶 capture rows carrying media open it full-screen. Fetch with the Bearer,
     never a bare link — the token must not ride a URL, and the Pages origin
     holds no spine cookie. Tap anywhere on the overlay to dismiss. */
  const chan = document.querySelector(".chan");
  if(!chan || chan.dataset.capwired) return;
  chan.dataset.capwired = "1";
  chan.addEventListener("click", async e => {
    const row = e.target.closest(".capm");
    if(!row || !row.dataset.url) return;
    try{
      const res = await fetch(url(row.dataset.url), { headers: hdr() });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const obj = URL.createObjectURL(await res.blob());
      const ov = document.createElement("div");
      ov.className = "capview";
      ov.innerHTML = `<img src="${obj}" alt="road capture">`;
      ov.addEventListener("click", () => { URL.revokeObjectURL(obj); ov.remove(); });
      document.body.appendChild(ov);
    }catch(err){ toast("couldn't fetch the capture — " + err.message); }
  });
}

/* fetch-on-open (the stops-book law): the thread he sees is the thread that
   IS — a row that landed while the room was closed must not hide behind
   boot-time state. The 15s stamp keeps write-triggered re-renders from
   looping the fetch. */
function freshenRadio(){
  if(Date.now() - (State.radioAt || 0) < 15000) return;
  grab("/api/messages").then(r => {
    State.radio = r; State.radioAt = Date.now();
    if(ACTIVE !== null && D[ACTIVE].room === "radio"){ renderRoom(); markRead(); }
  }).catch(() => {});
}
function wireKeyup(){
  const btn = $("hold"), mic = $("mic"); if(!btn) return;
  let t = 0, anim = null;
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if(!mic.value.trim()){ toast("nothing to send — the mic is empty"); return; }
    if(document.visibilityState !== "visible") return;
    const r3 = btn.querySelector(".r3");
    anim = r3.animate({transform:["scaleX(0)","scaleX(1)"]},
      {duration:620, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
    const t0 = performance.now();
    t = setTimeout(async () => {
      if(performance.now() - t0 < 600) return;
      const body = mic.value.trim();
      $("holdcap").textContent = "SENDING";
      try{
        const res = await fetch(url("/api/messages"), { method:"POST",
          headers: hdr({"Content-Type":"application/json"}), body: JSON.stringify({ body }) });
        if(!res.ok) throw new Error("the spine answered " + res.status);
        mic.value = "";
        State.radio = await grab("/api/messages");
        State.radioAt = Date.now();
        renderRoom();
        toast("SENT — the next session reads it at kickoff");
      }catch(err){ toast("NOT SENT — " + (err.message || err)); }
      finally{
        $("holdcap") && ($("holdcap").textContent = "HOLD TO KEY UP");
        r3.getAnimations().forEach(a => a.cancel()); r3.style.transform = "scaleX(0)";
      }
    }, 620);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, () => {
    clearTimeout(t); if(anim) anim.cancel();
    const r3 = btn.querySelector(".r3"); r3.style.transform = "scaleX(0)";
  }));
}
/* opening the radio IS reading it — the mark is his eyes, not a fetch */
function markRead(){
  if(!(State.radio && State.radio.unread > 0)) return;
  fetch(url("/api/messages/read"), { method:"POST",
    headers: hdr({"Content-Type":"application/json"}), body:"{}" })
    .then(() => grab("/api/messages")).then(r => { State.radio = r; paintField(); }).catch(()=>{});
}

/* ══ THE MONEY ROOM — wiring ═══════════════════════════════════════════
   Every gesture here is a WRITE or a fetch; nothing is optimistic. A drag
   that cannot be written leaves the card exactly where it was and says why
   in the spine's own words. */
function wireFin(){
  swingGauge();
  const R = $("room");

  R.querySelectorAll("#finView button").forEach(b => b.addEventListener("click", () => {
    FIN.view = b.dataset.v; FIN.pick = null;
    /* the books measure against the NUT, and the nut is monthly — entering
       them on a week/quarter toggle would draw a monthly line under a
       non-month window. Snap to month, refetch, redraw. */
    if(FIN.view === "ledger" && FIN.period !== "month"){
      FIN.period = "month";
      loadFin().then(renderRoom).catch(()=>{});
    }
    renderRoom();
  }));
  R.querySelectorAll("#finPeriod button").forEach(b => b.addEventListener("click", () => {
    FIN.period = b.dataset.p; loadFin(); renderRoom();
  }));
  R.querySelectorAll("#holdGrp button").forEach(b => b.addEventListener("click", () => {
    FIN.group = b.dataset.g; FIN.pick = null; renderRoom();
  }));

  if(FIN.view === "hold"){ paintHold(); wireHold(); return; }
  /* the intake wells live in THE BOOKS now (Bryan, 2026-08-02: "move the
     drop cards from the floor to the books") — wire them there, along with
     the record's tap-to-edit category chips */
  if(FIN.view === "ledger"){
    wireIntake();
    R.querySelectorAll(".catchip.edit[data-cat-txn]").forEach(ch =>
      ch.addEventListener("click", ev => {
        /* the window's click-closes-the-menu listener fires on this SAME
           click once the categories are cached (the menu builds synchronously
           and dies as it is born — "works for one, not the next"). The chip's
           click must not reach it. */
        ev.stopPropagation();
        /* the chip lives on TWO ledgers now — the record (spend) and
           MONEY IN (deposits, card #103); one writer serves both */
        const t = [...(((State.fin.expenses||{}).transactions)||[]),
                   ...(((State.fin.income||{}).deposits)||[])]
          .find(x => x.id === Number(ch.dataset.catTxn));
        if(t) openCat(ev, t);
      }));
    /* MONEY IN's own window — deposits are sparse; a month that reset
       yesterday hides the very rows he came to validate */
    R.querySelectorAll("#incPeriod button").forEach(b =>
      b.addEventListener("click", async () => {
        FIN.incPeriod = b.dataset.incp;
        try{ State.fin.income = await grab("/api/fin/income?period="+FIN.incPeriod);
             State.fin.incErr = null; }
        catch(e){ State.fin.income = null; State.fin.incErr = String(e.message||e); }
        renderRoom();
      }));
    /* the breakdown sifts the ledger — tap a category, read only its rows;
       tap it again and the whole record comes back */
    R.querySelectorAll("[data-spend-cat]").forEach(el =>
      el.addEventListener("click", () => {
        const c = el.dataset.spendCat;
        FIN.catFilter = FIN.catFilter === c ? null : c;
        renderRoom();
      }));
    /* THE RECORD WORKS ROWS NOW (Bryan, 2026-08-03: "not letting me drag or
       use the right click" — he was in the books, where the ledger was
       read-only, and on the Fold there is no HTML5 drag at all). Tap or
       right-click a row: the same menu the floor's rows carry — MONTHLY, the
       last loads, accounted, deposit. The chip keeps its own tap. */
    R.querySelectorAll(".lgr[data-txn]").forEach(c => {
      const route = ev => {
        if(ev.target.closest(".catchip")) return;   // the chip's tap is the chip's
        ev.preventDefault();
        ev.stopPropagation();                        // the menu must outlive this click
        const t = ((State.fin.expenses||{}).transactions||[])
          .find(x => x.id === Number(c.dataset.txn));
        if(!t) return;
        if((t.placements||[]).length){
          openMove(ev, t.id, t.sheet_row != null ? t.sheet_row : t.placements[0].sheet_row);
          return;
        }
        openAcct(ev, t);
      };
      c.addEventListener("click", route);
      c.addEventListener("contextmenu", route);
    });
    /* the ask, answered from the record — same buttons as the bucket */
    R.querySelectorAll(".ask .acand").forEach(b =>
      b.addEventListener("click", () => {
        if(b.classList.contains("cancel")){ FIN.ask = null; renderRoom(); return; }
        if(b.classList.contains("flip")) return flipAndPay(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, null);
        if(b.classList.contains("oneoff")) return fileOneoff(Number(b.dataset.txn));
        payMonthly(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, null);
      }));
    return;
  }
  if(FIN.view === "budget"){
    /* the wall answers his tap — the menu must survive its own click */
    R.querySelectorAll(".brow[data-bt]").forEach(row =>
      row.addEventListener("click", ev => {
        ev.stopPropagation();
        budgetMenu(ev, row.dataset.bt, row.dataset.bid, row.dataset.bname,
                   parseFloat(row.dataset.bfig || "0"), row.dataset.bdue || "",
                   row.dataset.bbal == null ? null : parseFloat(row.dataset.bbal));
      }));
    const add = R.querySelector("#bgtAdd");
    add && add.addEventListener("click", ev => { ev.stopPropagation(); budgetAdd(ev); });
    return;
  }
  if(FIN.view !== "floor") return;

  /* the fold answers his tap — placed & marked rows tuck behind their count */
  const fold = R.querySelector("#pileFold");
  fold && fold.addEventListener("click", () => {
    FIN.pileOpen = !FIN.pileOpen;
    renderRoom();
  });
  /* the drag: one expense line, one load box, one write */
  R.querySelectorAll(".eline[draggable]").forEach(c => {
    c.addEventListener("dragstart", ev => {
      FIN.drag = c.dataset.txn; c.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", c.dataset.txn);
    });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); FIN.drag = null; });
  });
  /* RIGHT-CLICK ON ANY COLUMN ROW — "already accounted for" (2026-08-02).
     Some pasted rows are covered by a bill card he already dragged at pay
     time. The mark sinks the row and shrinks the pool; it never deletes —
     the column doubles as the running record of all transactions with their
     categories. Reversible from the same menu. */
  R.querySelectorAll(".exp .eline[data-txn]").forEach(c => {
    const route = ev => {
      ev.preventDefault();
      /* opening from a TAP: the window's click-closes-the-menu listener fires
         on this SAME click (the picker died as it was born, 2026-08-02) — the
         row's tap must not reach it */
      ev.stopPropagation();
      const t = ((State.fin.expenses||{}).transactions||[]).find(x => x.id === Number(c.dataset.txn));
      if(!t) return;
      /* a SPLIT row serves sheet_row null — hand the menu its first portion's
         load or every action 500s (panel finding, 2026-08-02) */
      if((t.placements||[]).length){
        openMove(ev, t.id, t.sheet_row != null ? t.sheet_row : t.placements[0].sheet_row);
        return;
      }
      openAcct(ev, t);
    };
    /* TAP IS THE GESTURE (Bryan, 2026-08-03: "not letting me drag or use the
       right click") — on the Fold there IS no HTML5 drag, and long-press on a
       draggable row feeds Chrome's drag ghost instead of the menu. The same
       menu right-click opens now opens on a plain tap; drag stays for the
       desk. A real drag suppresses the click, so the two never collide. */
    c.addEventListener("contextmenu", route);
    c.addEventListener("click", route);
  });
  /* the bills — his hand at pay time. A bill drags into MONTHLY and nowhere
     else; a load lane refuses it in words. */
  R.querySelectorAll(".nut .bill[draggable]").forEach(c => {
    c.addEventListener("dragstart", ev => {
      FIN.drag = `bill:${c.dataset.bt}:${c.dataset.bid}`; c.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", FIN.drag);
    });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); FIN.drag = null; });
  });
  R.querySelectorAll(".lane").forEach(z => {
    z.addEventListener("dragover", ev => { ev.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", async ev => {
      ev.preventDefault(); z.classList.remove("over");
      const data = ev.dataTransfer.getData("text/plain") || FIN.drag;
      if(!data) return;
      if(String(data).startsWith("bill:")){
        const [, bt, bid] = String(data).split(":");
        if(z.dataset.row !== "monthly"){
          finSay("a bill lands in MONTHLY, not on a load — nothing was written", true);
          return;
        }
        await payMonthlyByHand(bt, bid, z);
        return;
      }
      if(String(data).startsWith("move:")){
        /* a placed portion re-aimed (card #136): same drag, new assertion */
        const [, txn, from] = String(data).split(":");
        if(z.dataset.row === "monthly"){
          finSay("that's a placed cost, not a bill — take it off the load first if it should settle MONTHLY", true);
          return;
        }
        await movePlacement(Number(txn), Number(from), Number(z.dataset.row), z);
        return;
      }
      if(z.dataset.row === "monthly") await payMonthly(Number(data), null, null, z);
      else await assignTxn(Number(data), Number(z.dataset.row), z);
    });
  });
  /* click something already in a box to take it back out; RIGHT-click to send
     it somewhere else without first putting it down; DRAG it to the load it
     actually belongs to (his ask 08-22, card #136) — placing wrong is fixed
     by the same gesture that placed it, aimed again. Fold path stays the
     tap/right-click menu (the 08-03 ruling: no HTML5 drag on the phone). */
  R.querySelectorAll(".lane .drop-in[data-txn]").forEach(p => {
    const lane = p.closest(".lane");
    const txn = Number(p.dataset.txn);
    const from = lane.dataset.row === "monthly" ? null : Number(lane.dataset.row);
    p.addEventListener("click", () => {
      if(from == null) return;                 // monthly rows are settled, not placed
      movePlacement(txn, from, null, lane);
    });
    p.addEventListener("contextmenu", ev => { ev.preventDefault(); openMove(ev, txn, from); });
    if(from != null){
      p.draggable = true;
      p.addEventListener("dragstart", ev => {
        FIN.drag = `move:${txn}:${from}`; p.classList.add("dragging");
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", FIN.drag);
        ev.stopPropagation();                  // the lane under it must not also drag
      });
      p.addEventListener("dragend", () => { p.classList.remove("dragging"); FIN.drag = null; });
    }
  });

  /* THE STAB. The machine fills the sheet in; he checks it. Both are one call
     and both are reversible — 'clear the machine's' never touches a placement
     he made by hand. */
  const stab = async (path, verb) => {
    const b = R.querySelector("#placeAll"), c = R.querySelector("#clearAuto");
    [b,c].forEach(x => x && (x.disabled = true));
    try{
      const r = await fetch(url(path), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({period: FIN.period})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status})`, true); return; }
      await loadFin(); renderRoom();
      finSay(out.cleared != null
        ? `${out.cleared} machine placements cleared — yours untouched`
        : `${verb} ${out.written} rows across ${out.txns_placed} transactions · ${
            out.split_txns} split across loads${
            out.kept_manual ? ` · ${out.kept_manual} of yours kept` : ""}${
            out.skipped && out.skipped.length ? ` · ${out.skipped.length} left alone` : ""}`,
        false);
    }catch(err){ finSay("the spine did not answer — nothing was written: " + (err.message||err), true); }
    finally{ [b,c].forEach(x => x && (x.disabled = false)); }
  };
  const pa = R.querySelector("#placeAll"), ca = R.querySelector("#clearAuto");
  pa && pa.addEventListener("click", () => stab("/api/fin/place", "placed"));
  ca && ca.addEventListener("click", () => stab("/api/fin/place/clear", "cleared"));

  /* the chase clock's ack — his hand, one tap, never optimistic */
  R.querySelectorAll(".fua .ack").forEach(b =>
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "writing…";
      try{
        const r = await fetch(url("/api/fin/followup/ack"), {method:"POST",
          headers: hdr({"Content-Type":"application/json"}),
          body: JSON.stringify({sheet_row: Number(b.dataset.fua)})});
        const out = await r.json().catch(() => ({}));
        if(!r.ok) throw new Error(out.error || ("HTTP " + r.status));
        State.fin.followups = await grab("/api/fin/followups");
        /* this path never calls loadFin(), so the docket kept shouting the
           old N NEED YOUR HAND after the ack decremented it (audit 08-11) */
        await refreshStanding();
      }catch(err){ finSay("the ack was not written: " + (err.message||err), true); }
      renderRoom();
    }));

  /* an arrived bank row at the top of the bucket — his tap asks which bill */
  R.querySelectorAll(".lane.monthly .drop-in.arr").forEach(p =>
    p.addEventListener("click", () =>
      payMonthly(Number(p.dataset.arr), null, null, p.closest(".lane"))));
  /* the monthly box asked which bill; his tap is the answer and the write */
  R.querySelectorAll(".lane.monthly .acand").forEach(b =>
    b.addEventListener("click", () => {
      if(b.classList.contains("cancel")){ FIN.ask = null; renderRoom(); return; }
      if(b.classList.contains("flip")) return flipAndPay(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, b.closest(".lane"));
      if(b.classList.contains("oneoff")) return fileOneoff(Number(b.dataset.txn));
      payMonthly(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, b.closest(".lane"));
    }));
}

/* A drop on MONTHLY asserts a bill was paid. Same refusal doctrine as every
   other write here — but with a third outcome the load boxes do not have: the
   spine can come back and ASK. A 409 is not a failure, it is the machine
   refusing to guess which bill this was; the box then shows the candidates and
   his tap becomes the write. Nothing is recorded until he answers. */
/* THE MOVE MENU — Bryan, 2026-07-29: "a right click option to move an expense
   to another load...monthly at top and then most adjacent loads."

   MONTHLY sits at the top because it is the other KIND of answer: this was not
   a road cost for a load at all, it was a bill. Under it the loads are ordered
   by how many days separate the expense from the delivery, because the load he
   means is nearly always the one he was running that day — the ordering does
   the remembering so he does not have to. The list is served, not sorted here. */
let MOVEMENU = null;
/* THE CATEGORY PICKER — the books' tap-to-edit chip (2026-08-02: "categories
   need to be editable from books...same categories as bik"). The vocabulary
   is SERVED (/api/fin/categories = bik's canon ∪ the ledger); the write goes
   through the one writer, which learns a rule so this merchant's next
   arrival categorizes itself. */
async function openCat(ev, t){
  closeMove();
  if(!State.fin.cats){
    try{ State.fin.cats = (await grab("/api/fin/categories")).categories || []; }
    catch(e){ finSay("the spine has no category list: " + (e.message||e), true); return; }
  }
  const m = document.createElement("div");
  m.className = "movemenu cats";
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(t.amount)}
       <span>${esc(t.category || "uncategorized")}</span></div>` +
    State.fin.cats.map(c => `<button class="mi${c === t.category ? " on" : ""}"
        data-cat="${esc(c)}"><span>${esc(c)}</span>${
        c === t.category ? "<i>it is this now</i>" : ""}</button>`).join("") +
    `<button class="mi off" data-cat="">never mind</button>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
  m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", async () => {
    const cat = b.dataset.cat;
    closeMove();
    if(!cat || cat === t.category) return;
    try{
      const r = await fetch(url("/api/fin/categorize"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, category: cat})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(`${t.merchant || "row"} → ${cat}${out.learned ? " · the rules learned it" : ""}`, false);
    }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
  }));
}

/* the row menu — right-click on an unplaced row (2026-08-02: "give the last 4
   loads on right click to send to a specific load"). MONTHLY first when the
   row looks like a bill's bank row, then the four loads nearest the expense's
   own date (cross-month — an Aug-2 fuel stop usually belongs to a July load),
   then the accounted mark and its undo. Every action is a producer write and
   refuses in the spine's words when the ruling excludes it. */
async function openAcct(ev, t){
  closeMove();
  const m = document.createElement("div");
  m.className = "movemenu";
  m.innerHTML = `<div class="mh">loading…</div>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const place = () => {
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
    m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  };
  place();
  let loads = [], weekly = false;
  try{
    const r = await fetch(url("/api/fin/move/targets"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id: t.id})});
    const d = await r.json().catch(() => ({}));
    /* the spine says how many to offer (card #303): five nearest for a
       single stop, the last ten for a Pilot weekly draft — one ACH, a
       week of fuel. The hard 5 that sat here was the cap that made his
       rule impossible even after the spine returned more. */
    if(r.ok){ loads = (d.loads || []).slice(0, d.offer || 5); weekly = !!d.weekly_draft; }
  }catch(e){ /* the menu still offers the mark — loads just stay absent */ }
  /* a TERMINAL row is one the 2-day shelf files on its own (filed() above):
     an expired pre-auth, a deposit whose refund paired, a cash draw. Only
     those may be filed by hand — the spine holds the same line. */
  const terminal = !!t.expired || !!t.deposit_refund
    || (t.undraggable_because || "").startsWith("cash");
  /* ...and a month-level row he rules NO BILL — the dental visit the matcher
     bound to 'Dental Insurance' on a name alone (his ruling 09-12) — files
     as a one-off: out of the tray and the pile, the books tab keeps it. */
  const oneoff = !terminal && !t.trip_direct && !t.transfer && !t.credit
    && !t.personal && !t.accounted && !t.deposit
    && !(t.monthly_pay || []).length && !(t.placements || []).length
    && !!(t.category || "").trim()            /* a one-off's category IS its accounting */
    && t.category !== "Credit Card Repayment";
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(t.amount)}
       <span>${esc(t.date)}</span></div>` +
    /* the ask is never closed to his hand (card #226): a one-off the tray
       refused can still be NAMED against a bill — can_ask is the spine's word */
    ((t.monthly_candidate || t.can_ask)
      ? `<button class="mi monthly" data-act="monthly">MONTHLY<i>say which bill this paid</i></button>` : "") +
    (loads.length ? `<div class="msep">${weekly
        ? "the last " + loads.length + " loads — this draft covers the week"
        : "the last loads, nearest this date"}</div>` +
      loads.map(l => `<button class="mi" data-act="load" data-row="${l.sheet_row}">
        <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
          l.delivery_state ? ", " + esc(l.delivery_state) : ""}</span>
        <i>${l.days_away === 0 ? "same day" :
            l.days_away === 1 ? "1 day away" : l.days_away + " days away"} · ${
            esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}</i></button>`).join("") : "") +
    (t.trip_direct && loads.length >= 2
      ? `<button class="mi" data-act="split">split across these loads
          <i>one draft, several fill-ups — checkboxes decide, equal shares to the penny</i></button>` : "") +
    (t.accounted
      ? `<button class="mi" data-act="off">take it back into the pile<i>it will count as work again</i></button>`
      : `<button class="mi" data-act="on">already accounted for<i>a card covers it — it stays in the record, marked</i></button>`) +
    (t.deposit
      ? `<button class="mi" data-act="dep-off">not a deposit<i>count it as spend again</i></button>`
      : `<button class="mi" data-act="dep-on">deposit — wait for the refund<i>parked with the hotel; it comes back and the pair cancels</i></button>`) +
    /* HIS MONEY (card #233): the pin that only MI's UI could set is the row's
       own menu now — held out of road, the pile, the reserve and the placer */
    (t.personal
      ? `<button class="mi" data-act="pers-off">not personal after all<i>back into the business — road, the pile, the reserve</i></button>`
      : `<button class="mi" data-act="pers-on">personal — your money<i>held out of road, the pile and the reserve; never a load</i></button>`) +
    /* HIS HAND ON THE SHELF (card #225): a dead row leaves the floor on his
       word, not the shelf's clock. Offered only where the shelf would file it
       anyway (the spine refuses the rest in words); reversible from the fold. */
    (t.filed_at
      ? (terminal
        ? `<button class="mi" data-act="unfile">back to the floor<i>the 2-day shelf rules it again</i></button>`
        : `<button class="mi" data-act="unfile">not a one-off after all<i>back to the tray and the pile</i></button>`)
      : t.filed_aside
      /* the mark stood aside behind a newer ruling on this row (accounted,
         placed, re-dressed as road, a deposit awaiting its refund) — it is
         not hidden: here is the hand that clears it */
      ? `<button class="mi" data-act="unfile">clear the one-off filing<i>it stands aside behind this row's newer ruling — clear it so it never comes back</i></button>`
      : terminal
      ? `<button class="mi" data-act="file">file it now<i>off the floor, into the fold — with a note if you want one</i></button>`
      : oneoff
      ? `<button class="mi" data-act="file">not a bill — a one-off<i>out of the tray and the pile; the books tab keeps it</i></button>`
      : "") +
    `<button class="mi" data-act="note">${t.note ? "edit the note" : "add a note"}<i>${
      t.note ? esc(t.note) : "a line for why — it rides the row"}</i></button>` +
    `<button class="mi off" data-act="x">never mind</button>`;
  place();
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", async ev => {
    const act = b.dataset.act, row = b.dataset.row;
    if(act === "split"){
      /* the menu LIVES ON as the checkbox panel — this click must not reach
         the window's menu-closer (the picker died as it was born, third time) */
      ev.stopPropagation();
      splitPanel(m, t, loads, place);
      return;
    }
    if(act === "file" || act === "note"){
      ev.stopPropagation();               /* same law: the menu lives on as the note line */
      notePanel(m, t, place, act === "file" ? (terminal ? "shelf" : "oneoff") : "");
      return;
    }
    closeMove();
    if(act === "x") return;
    if(act === "unfile") return noteTxn(t, {filed: false}, out => t.filed_aside
      ? `${out.merchant || "row"} — the one-off filing is cleared; this row's newer ruling stands alone`
      : terminal
      ? `${out.merchant || "row"} is back on the floor — the shelf's clock rules it again`
      : `${out.merchant || "row"} is back in the tray and the pile`);
    if(act === "monthly") return payMonthly(t.id, null, null, null);
    if(act === "load") return assignTxn(t.id, Number(row), null);
    if(act === "pers-on" || act === "pers-off"){
      try{
        const r = await fetch(url("/api/fin/personal"), {method:"POST",
          headers:{...hdr(), "Content-Type":"application/json"},
          body: JSON.stringify({txn_id: t.id, on: act === "pers-on"})});
        const out = await r.json().catch(() => ({}));
        if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
        await loadFin(); renderRoom();
        try{ State.standings = await grab("/api/standings"); }catch(_){}
        finSay(act === "pers-on"
          ? `${out.merchant || "row"} is your money — held out of road, the pile and the reserve`
          : `${out.merchant || "row"} is the business's again`, false);
      }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
      return;
    }
    if(act === "dep-on" || act === "dep-off"){
      try{
        const r = await fetch(url("/api/fin/deposit"), {method:"POST",
          headers:{...hdr(), "Content-Type":"application/json"},
          body: JSON.stringify({txn_id: t.id, on: act === "dep-on"})});
        const out = await r.json().catch(() => ({}));
        if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
        await loadFin(); renderRoom();
        finSay(act === "dep-on"
          ? `${out.merchant || "row"} flagged as a deposit — watching for the refund`
          : `${out.merchant || "row"} counts as spend again`, false);
      }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
      return;
    }
    try{
      const r = await fetch(url("/api/fin/accounted"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, on: act === "on"})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(act === "on"
        ? `${out.merchant || "row"} marked already accounted for — it stays in the record`
        : `${out.merchant || "row"} is back in the pile`, false);
    }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
  }));
}

/* THE NOTE LINE (card #225) — the menu lives on as one input: a line for why.
   Filing sends filed:true with it; a plain note sends the note alone. The
   spine decides whether the row MAY be filed and says so in words. */
function notePanel(m, t, place, mode){
  /* mode: "shelf" files a terminal row now, "oneoff" files a no-bill row out of
     the tray and the pile, "" is a bare note */
  const filing = !!mode;
  m.innerHTML = `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(Math.abs(t.amount))}
      <span>${mode === "oneoff" ? "not a bill — a one-off; the books tab keeps it"
            : mode === "shelf" ? "file it now — off the floor, into the fold"
            : "a note rides the row — why, in a line"}</span></div>
    <input class="nin" type="text" maxlength="500" autocomplete="off"
      placeholder="${mode === "oneoff" ? "what it was — optional" : filing ? "why it is dead — optional" : "the note"}" value="${esc(t.note || "")}">
    <button class="mi mnote">${mode === "oneoff" ? "file it as a one-off" : filing ? "file it" : (t.note ? "keep the note" : "add the note")}</button>
    ${t.note && !filing ? `<button class="mi" data-act="clear">clear the note</button>` : ""}
    <button class="mi off" data-act="x">never mind</button>`;
  place();
  const inp = m.querySelector(".nin");
  const go = async () => {
    const note = inp.value.trim();
    closeMove();
    await noteTxn(t, filing ? {note, filed: true} : {note}, out => mode === "oneoff"
      ? `${out.merchant || "row"} filed as a one-off — out of the tray and the pile; the books tab keeps it${out.note ? ", with your note" : ""}`
      : filing
      ? `${out.merchant || "row"} filed — into the fold; it stays in the record${out.note ? ", with your note" : ""}`
      : out.note ? `note kept on ${out.merchant || "the row"}` : `note cleared on ${out.merchant || "the row"}`);
  };
  m.querySelector('[data-act="x"]').addEventListener("click", closeMove);
  const clr = m.querySelector('[data-act="clear"]');
  clr && clr.addEventListener("click", () => { inp.value = ""; go(); });
  m.querySelector(".mnote").addEventListener("click", go);
  inp.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); go(); } });
  inp.focus();
}

/* one write, the spine's words either way — the same contract as every mark */
async function noteTxn(t, body, said){
  try{
    const r = await fetch(url("/api/fin/note"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id: t.id, ...body})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return false; }
    await loadFin(); renderRoom();
    finSay(said(out), false);
    return true;
  }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); return false; }
}

/* THE ASK'S TWO EXTRA ANSWERS (card #226). Both ask panels — the monthly lane's
   and the record's — carry them, one definition:
   FLIP: the spine named a card the row LOOKS like (best buy auto pymt wearing
   Office Supplies). His tap dresses the row in Credit Card Repayment first
   (the rules learn it), then settles that card — the 08-29 ruling holds
   because the row rides the lane only once it wears the category.
   ONE-OFF: no bill at all — file it out of the tray and the pile; the
   books tab keeps it. */
function askExtras(ask){
  if(!ask || !ask.txn) return "";
  /* every card at the top name-overlap rides (a tie is said aloud by the
     spine's own words); one flip per card, his tap picks */
  const hs = (ask.card_hints && ask.card_hints.length) ? ask.card_hints
           : ask.card_hint ? [ask.card_hint] : [];
  const payoff = ask.txn.category === "Transfer" || ask.txn.category === "Credit Card Repayment";
  return hs.map(h => `<button class="acand flip" data-txn="${ask.txn.id}"
        data-bt="${esc(h.bill_type)}" data-bid="${esc(h.bill_id)}">
        <span>it paid the ${esc(h.name)} card</span><b>${h.due == null ? "" : money(h.due)}</b>
        <i>${esc(h.why)} — your tap dresses it, the rules learn it, then the card is settled</i></button>`).join("")
    + (payoff ? "" : `<button class="acand oneoff" data-txn="${ask.txn.id}">
        <span>not a bill — a one-off</span><b>&nbsp;</b>
        <i>out of the tray and the pile; the books tab keeps it</i></button>`);
}
async function flipAndPay(txn_id, bill_type, bill_id, box){
  FIN.ask = null;
  try{
    const r = await fetch(url("/api/fin/categorize"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, category: "Credit Card Repayment", learn: true})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){ finSay(out.error || `the spine refused the category (${r.status}) — nothing was written`, true); renderRoom(); return; }
  }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); renderRoom(); return; }
  /* the row now wears the payoff category — the named card is his tap. If
     the settle then refuses, the FIRST write still landed: say so, and show
     the row as it now is rather than 'nothing was written'. */
  const ok = await payMonthly(txn_id, bill_type, bill_id, box);
  if(!ok && !FIN.ask){
    await loadFin(); renderRoom();
    finSay("the row now wears Credit Card Repayment (that write landed) — the card was not settled; tap MONTHLY on it again and pick the card", true);
  }
  return ok;
}
async function fileOneoff(txn_id){
  /* the ask comes down only when the write lands — on a refusal it is put
     back and repainted, so the panel and FIN.ask never disagree */
  const ask = FIN.ask;
  FIN.ask = null;
  const t = ((State.fin.expenses||{}).transactions||[]).find(x => x.id === txn_id) || {id: txn_id};
  const ok = await noteTxn(t, {filed: true}, out =>
    `${out.merchant || "row"} filed as a one-off — out of the tray and the pile; the books tab keeps it (a note is one tap away there)`);
  if(!ok){ FIN.ask = ask; renderRoom(); }
  return ok;
}

/* THE SPLIT PANEL — Bryan, 2026-08-04: "i have a deal with pilot to pay for my
   fill ups twice a week... be presented with the last 5 loads and have check
   boxes to split between." One draft, several loads' fuel: check the loads it
   fueled and the whole divides in equal shares to the penny — the last share
   absorbs the rounding, so the parts always sum to exactly what left the
   account. The writer (split_manual) refuses invented money regardless. */
function splitPanel(m, t, loads, place){
  const whole = Math.abs(t.amount);
  m.innerHTML = `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(whole)}
      <span>check the loads this draft fueled — equal shares, to the penny</span></div>
    ${loads.map(l => `<label class="srow">
      <input type="checkbox" data-row="${l.sheet_row}">
      <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
        l.delivery_state ? ", " + esc(l.delivery_state) : ""}
        <i>${esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}</i></span>
      <b class="samt">—</b></label>`).join("")}
    <button class="mi msplit" disabled>check at least two loads</button>
    <button class="mi off" data-act="x">never mind</button>`;
  place();
  m.querySelector('[data-act="x"]').addEventListener("click", closeMove);
  const boxes = [...m.querySelectorAll('input[type="checkbox"]')];
  const btn = m.querySelector(".msplit");
  const shares = () => {
    const on = boxes.filter(b => b.checked), n = on.length;
    const base = n ? Math.floor(whole / n * 100) / 100 : 0;
    return {on, n, base, last: n ? Math.round((whole - base * (n - 1)) * 100) / 100 : 0};
  };
  const recalc = () => {
    const {on, n, base, last} = shares();
    boxes.forEach(b => {
      const el = b.closest(".srow").querySelector(".samt");
      el.textContent = b.checked
        ? money(on.indexOf(b) === n - 1 ? last : base) : "—";
    });
    btn.disabled = n < 2;
    btn.textContent = n < 2 ? "check at least two loads"
      : `split ${money(whole)} across ${n} loads`;
  };
  boxes.forEach(b => b.addEventListener("change", recalc));
  recalc();
  btn.addEventListener("click", async () => {
    const {on, n, base, last} = shares();
    if(n < 2) return;
    const parts = on.map((b, i) => ({sheet_row: Number(b.dataset.row),
                                     amount: i === n - 1 ? last : base}));
    closeMove();
    try{
      const r = await fetch(url("/api/fin/split"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, parts})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(`${t.merchant || "the draft"} split ${n} ways — ${money(whole)} across the loads`, false);
    }catch(e){
      finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    }
  });
}

async function openMove(ev, txn_id, from_row){
  closeMove();
  const m = document.createElement("div");
  m.className = "movemenu";
  m.innerHTML = `<div class="mh">loading…</div>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const place = () => {
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
    m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  };
  place();
  let d;
  try{
    const r = await fetch(url("/api/fin/move/targets"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, period: FIN.period})});
    d = await r.json();
    if(!r.ok) throw new Error(d.error || `the spine refused (${r.status})`);
  }catch(err){
    m.innerHTML = `<div class="mh bad">${esc(err.message || String(err))}</div>`;
    place(); return;
  }
  const t = d.txn;
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || "this")} · ${money(t.amount)}
       <span>${esc(t.date)}</span></div>` +
    `<button class="mi monthly" data-to="monthly">MONTHLY<i>a bill, not a load's road cost</i></button>` +
    `<div class="msep">${d.weekly_draft
        ? "the last " + (d.loads || []).length + " loads — this draft covers the week"
        : "the loads, nearest first"}</div>` +
    (d.loads || []).map(l =>
      `<button class="mi" data-to="${l.sheet_row}"${
        l.sheet_row === from_row ? ' disabled' : ''}>
        <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
          l.delivery_state ? ", " + esc(l.delivery_state) : ""}</span>
        <i>${l.days_away === 0 ? "same day" :
            l.days_away === 1 ? "1 day away" : l.days_away + " days away"} · ${
            esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}${
            l.sheet_row === from_row ? " · it is here now" : ""}</i></button>`).join("") +
    `<button class="mi off" data-to="off">take it off — back to the column</button>`;
  place();
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", () => {
    const to = b.dataset.to;
    closeMove();
    if(to === "monthly") return payMonthly(txn_id, null, null, null);
    movePlacement(txn_id, from_row, to === "off" ? null : Number(to), null);
  }));
}
function closeMove(){ if(MOVEMENU){ MOVEMENU.remove(); MOVEMENU = null; } }
addEventListener("click", e => { if(MOVEMENU && !MOVEMENU.contains(e.target)) closeMove(); });
addEventListener("keydown", e => { if(e.key === "Escape") closeMove(); });

/* Moving carries the PORTION, not the transaction — the $22.09 that landed on
   Axle moves as $22.09 and the other five portions of that Pilot week stay put.
   Same refusal doctrine as every write here. */
async function movePlacement(txn_id, from_row, to_row, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/move"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, from_row, to_row})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    await loadFin(); renderRoom();
    finSay(out.to == null
      ? `${money(out.amount)} taken off load ${out.from} — back in the column`
      : `${money(out.amount)} moved from load ${out.from} to load ${out.to}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

/* HIS HAND, AT PAY TIME — he pays the bill in the real world and drags the
   BILL across the moment it happens; the bank row is often days from import.
   Same endpoint, no transaction: a named bill and his gesture. The bucket
   reads "awaiting the bank row" until the row lands — then dropping it on
   MONTHLY attaches it as the evidence. */
async function payMonthlyByHand(bill_type, bill_id, box){
  try{
    const r = await fetch(url("/api/fin/monthly"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({bill_type, bill_id})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      return false;
    }
    await loadFin();
    try{ State.standings = await grab("/api/standings"); }catch(_){}
    renderRoom();
    finSay(out.already
      ? `${out.name} was already recorded paid for ${out.cycle_key}`
      : `${out.name} recorded paid for ${out.cycle_key}${
          out.amount != null ? ` — ${money(out.amount)}` : ""} · drag its bank row in when it lands`, false);
    return true;
  }catch(e){
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    return false;
  }
}

async function payMonthly(txn_id, bill_type, bill_id, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/monthly"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, bill_type, bill_id})});
    const out = await r.json().catch(() => ({}));
    if(r.status === 409 && out.ask){
      /* card_hint rides the ask (card #226) — dropping it here is what would
         make the FLIP unreachable while the spine had named the card */
      FIN.ask = {txn: out.txn, candidates: out.candidates, no_match: out.no_match,
                 card_hint: out.card_hint || null, card_hints: out.card_hints || []};
      card && card.classList.remove("writing");
      renderRoom();
      finSay(out.no_match
        ? `no bill matches that row — the full list is up, name it yourself`
        : `which bill did this pay? nothing recorded yet`, "ask");
      return false;
    }
    if(!r.ok){
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    FIN.ask = null;
    await loadFin();
    try{ State.standings = await grab("/api/standings"); }catch(_){}
    renderRoom();
    /* evidenced:false is the spine saying the PAYMENT was recorded but the
       evidence join was not — the one thing this drag exists to persist. A
       clean "recorded paid" here would swallow a failed write, and the bucket
       would then read "recorded without a bank row" about a row he just
       dragged. Loud, in red, with the true split: payment yes, evidence no. */
    if(out.evidenced === false && !out.already){
      finSay(`${out.name} recorded paid for ${out.cycle_key} — but saving WHICH `
        + `bank row paid it FAILED. the bucket will not show the evidence; `
        + `drop the row on it again to retry`, true);
      return true;
    }
    /* additive evidence: the second ACH debit lands as "2 bank rows now carry
       669.65 of 700.00" — coverage said out loud, drift left visible */
    const cover = out.evidence_n > 1 && out.covered != null
      ? ` · ${out.evidence_n} bank rows now carry ${money(out.covered)}${
          out.due != null ? " of " + money(out.due) : ""}`
      : "";
    finSay(out.already
      ? (out.evidenced
          ? `bank row attached — ${out.name} already recorded paid for ${out.cycle_key}${cover}`
          : `${out.name} was already recorded paid for ${out.cycle_key}`)
      : `${out.name} recorded paid for ${out.cycle_key} — ${money(out.amount)}${cover}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

async function assignTxn(txn_id, sheet_row, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/assign"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, sheet_row})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      /* REFUSED — nothing was written. Say so in the spine's words and leave
         the card standing exactly where it was. */
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    /* say it AFTER the re-render, or the confirmation is wiped by the very
       repaint that proves it — a write nobody saw reads as a write that did
       not happen */
    await loadFin(); renderRoom();
    finSay(sheet_row == null
      ? `${out.category} ${money(out.amount)} taken back off the load`
      : `${out.category} ${money(out.amount)} attributed to load ${out.sheet_row}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

/* THREE states, because two was a lie. The monthly box can come back ASKING —
   nothing written, nothing refused — and stamping that "WRITTEN" put the one
   word that means a record exists on top of the sentence "nothing recorded
   yet". On a money surface that is the worst available defect. Pass "ask" for
   the question, true for a refusal, false for a real write. */
function finSay(msg, state){
  const w = $("room").querySelector(".why");
  if(!w) return;
  const tag = state === "ask" ? "ASKING" : state ? "REFUSED" : "WRITTEN";
  w.innerHTML = `<span class="tag">${tag}</span><span>${esc(msg)}</span>`;
}

/* ── the intake: same doors bik has, new mouth ─────────────────────── */
function wireIntake(){
  const csv = $("dropCsv"), shot = $("dropShot");

    csv.addEventListener("dragleave", () => csv.classList.remove("over"));

      e.preventDefault(); csv.classList.remove("over");
      const f = e.dataTransfer.files[0]; if(f) sendCsv(f);
    });
  }
  if(shot){
    /* WHOSE IMAGE IS THIS — his hand names the account before the paste
       (2026-08-04: "we will need to pull all pending in the future" — LoadPay
       pendings ride the same paste lane, and a pending mislabeled pnc would
       settle under the wrong account forever). The picker's tap must not

    shot.querySelectorAll(".acctpick button").forEach(b =>
      b.addEventListener("click", ev => {

function finPaste(e){
  const shot = $("dropShot"); if(!shot || FIN.view !== "ledger") return;
  for(const it of (e.clipboardData || {}).items || []){
    if(it.type.startsWith("image/")){
      const f = it.getAsFile();
      if(f){ e.preventDefault(); fileToDataUrl(f).then(sendShot); }
      return;
    }
  }
}
const fileToDataUrl = f => new Promise((res,rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej;
  r.readAsDataURL(f);
});
function dropState(el, cls, msg, sub){
  el.className = "drop " + cls;
  el.querySelector(".dl").textContent = msg;
  if(sub != null) el.querySelector(".ds").textContent = sub;
}
async function sendCsv(file){
  const el = $("dropCsv");
  /* The source decides which parser runs. Guessing it would silently mangle a
     LoadPay export through the PNC reader, so it is READ from the file's own
     header rather than assumed. */
  const text = await file.text();
  const head = (text.split("\n")[0] || "").toLowerCase();
  const source = head.includes("transaction id") || /loadpay/i.test(file.name) ? "loadpay"
               : head.includes("reference number") && head.includes("post date") ? "gemini"
               : /pnc|account\s*activity/i.test(file.name) || head.includes("balance") ? "pnc" : null;
  if(!source){
    dropState(el, "bad", "cannot tell which bank this is",
      "name it LoadPay…, PNC… or a Gemini statement — the parsers are not interchangeable");
    return;
  }
  dropState(el, "busy", `importing ${source}…`, file.name);
  try{
    const r = await fetch(url("/api/fin/intake/csv"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({source, csv:text, account:source})});
    const o = await r.json().catch(() => ({}));
    if(!r.ok){ dropState(el,"bad","not imported", o.error || `the writer said ${r.status}`); return; }
    dropState(el, "ok", `${o.imported||0} in · ${o.skipped||0} already had`,
      `${o.reconciled||0} settled from pending · ${o.uncategorized||0} uncategorized`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was imported", String(e.message||e)); }
}
async function sendShot(dataUrl){
  const el = $("dropShot");
  dropState(el, "busy", "reading the image…", "balance first, then transactions");
  try{
    /* Try it as a BALANCE first — that is the common case and it updates the
       cash line the clock reads. If the image has none, fall through to the
       transaction reader rather than telling him it failed. */
    let r = await fetch(url("/api/fin/intake/balance"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl, account:"loadpay"})});
    let o = await r.json().catch(() => ({}));
    /* The reader answers {ok, extracted:{accounts:[...]}} (or the old
       single-account {balance,...}). Checking the WRONG keys here made a
       SUCCESSFUL balance write fall through to the transaction reader and
       report "nothing found" about balances already saved (2026-08-02 —
       Bryan's PNC paste landed while the surface said it hadn't). */
    const got = (o.extracted && (o.extracted.accounts
                 || (o.extracted.total_balance != null || o.extracted.balance != null
                     ? [o.extracted] : []))) || [];
    if(r.ok && (o.ok || o.updated) && got.length){
      dropState(el, "ok", `balances read — ${got.length} account${got.length===1?"":"s"}`,
        got.map(a => (a.account_name || a.name || "account")
          + (a.total_balance != null ? " " + money(a.total_balance)
             : a.balance != null ? " " + money(a.balance) : "")).join(" · ").slice(0,90));
      await loadFin(); renderRoom(); return;
    }
    r = await fetch(url("/api/fin/intake/screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl, account: FIN.shotAcct || "pnc"})});
    o = await r.json().catch(() => ({}));
    const txns = o.transactions || [];
    if(!r.ok || !txns.length){
      dropState(el,"bad","nothing was read", o.error || "no transactions found in that image");
      return;
    }
    /* the chip's account rides the SAVE too — the runner stamps every row with
       this value, and a hardcoded pnc here filed a LoadPay paste under the
       wrong book (caught 2026-08-04 before it bit) */
    const s = await fetch(url("/api/fin/intake/save-screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({transactions:txns, account: FIN.shotAcct || "pnc"})});
    const so = await s.json().catch(() => ({}));
    if(!s.ok){ dropState(el,"bad","read but not saved", so.error || `the writer said ${s.status}`); return; }
    dropState(el, "ok", `${so.saved||0} saved · ${so.skipped||0} already had`,
      `${txns.length} rows read from the image`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was saved", String(e.message||e)); }
}

/* ── THE HOLD: drag to read — paying happens on the floor ──────────── */
function wireHold(){
  const cv = $("holdC"); if(!cv) return;
  const hit = ev => {
    const r = cv.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    return (State.fin.placed||[]).find(p =>
      Math.hypot(p.cx - x, p.cy - y) <= p.R + 3);
  };
  const read = ev => {
    const p = hit(ev);
    if(p && FIN.pick !== p.s.id){ FIN.pick = p.s.id; paintHold(); showStone(p.s); }
  };
  cv.addEventListener("pointerdown", read);
  cv.addEventListener("pointermove", e => { if(e.buttons) read(e); });
}

function showStone(s){

/* ── the room's own fetches ────────────────────────────────────────── */
async function loadFin(){
  /* the last fetch wins, not the last to ARRIVE — the books' month-snap can
     fire while a week fetch is in flight, and the stale answer must not
     overwrite the fresh one (panel finding, 2026-08-02) */
  const seq = FIN._seq = (FIN._seq || 0) + 1;
  const q = `?period=${FIN.period}`;
  /* MONEY IN rides its OWN window (mo/qtr on the block) — deposits are
     sparse, and the month resetting on the 1st would hide the very rows
     he came to validate. The block announces its window; the nut is not
     measured here, so the books' month-snap law is untouched. */
  const [sum, ld, ex, ro, ac, sp, bd, fw, inc] = await Promise.allSettled([
    grab("/api/fin/summary"), grab("/api/fin/loads"+q),
    grab("/api/fin/expenses"+q), grab("/api/fin/rollup"+q),
    grab("/api/fin/accounts"), grab("/api/fin/spend"+q),
    grab("/api/fin/budget"), grab("/api/fin/followups"),
    grab("/api/fin/income?period="+(FIN.incPeriod||"month"))]);
  if(seq !== FIN._seq) return;               // a newer fetch superseded this one
  State.fin.income = inc.status === "fulfilled" ? inc.value : null;
  State.fin.incErr = inc.status === "rejected" ? String(inc.reason.message||inc.reason) : null;
  State.fin.spend = sp.status === "fulfilled" ? sp.value : null;
  State.fin.budget = bd.status === "fulfilled" ? bd.value : null;
  State.fin.summary = sum.status === "fulfilled" ? sum.value : null;
  State.fin.summaryErr = sum.status === "rejected" ? String(sum.reason.message||sum.reason) : null;
  State.fin.loads = ld.status === "fulfilled" ? ld.value : null;
  State.fin.expenses = ex.status === "fulfilled" ? ex.value : null;
  State.fin.rollup = ro.status === "fulfilled" ? ro.value : null;
  State.fin.followups = fw.status === "fulfilled" ? fw.value : null;
  State.fin.accounts = ac.status === "fulfilled" ? ac.value : null;
  State.fin.acctErr = ac.status === "rejected" ? String(ac.reason.message||ac.reason) : null;
  State.fin.err = [ld,ex,ro].filter(x => x.status === "rejected")
    .map(x => String(x.reason.message||x.reason))[0] || null;
  /* A mirror nobody refreshed reads as "booked ahead $0.00" on a day three
     loads were booked (2026-07-28). Ask MI to refresh, then re-read. */
  const st = State.fin.loads && State.fin.loads.mirror_stale_hours;
  if(st != null && st > 6 && !State.fin._refreshed){
    State.fin._refreshed = true;
    try{
      await fetch(url("/api/fin/loads/refresh"), { method:"POST",
        headers: hdr({"Content-Type":"application/json"}), body: "{}" });   // a JSON body like every other desk POST (#180)
      const again = await grab("/api/fin/loads"+q); State.fin.loads = again;
      const ro2 = await grab("/api/fin/rollup"+q); State.fin.rollup = ro2;
    }catch(e){}
  }
  await refreshStanding();
}

/* ── load ─────────────────────────────────────────────────────────── */
async function grab(path){
  const r = await fetch(url(path), { headers: hdr(), cache:"no-store" });
  if(!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,120));
  return r.json();
}
/* THE DEVICE'S FIX (his ruling 2026-09-01, amending the tap-only pattern for
   the day card alone): pulled once per open — silent after the one-time
   browser grant — held in page state, sent per-request in POST bodies, and
   NEVER persisted server-side. No watchPosition, no polling; REPLAN re-asks
   by his tap. Geolocation is callback-based and can hang past every fetch,
   so nothing here may gate paintField — the day card repaints when the
   answer lands. */
const GEO = { fix:null, at:null, why:"" };
function grabFix(){
  return new Promise(res => {
    if(!navigator.geolocation){ GEO.why = "this device offers no location"; return res(null); }
    navigator.geolocation.getCurrentPosition(
      p => { GEO.fix = { lat:p.coords.latitude, lng:p.coords.longitude };
             GEO.at = Date.now(); GEO.why = ""; res(GEO.fix); },
      e => { GEO.why = e.message || "the device refused"; res(null); },
      { enableHighAccuracy:false, timeout:10000, maximumAge:300000 });
  });
}
let DAY_SEQ = 0;
async function loadDay(fresh, force){
  /* the boot fires load() twice and REPLAN re-enters — the LAST call wins,
     never the last to arrive (loadFin's law); a failed read is RECORDED, never
     left as yesterday's answer wearing today's header */
  const seq = ++DAY_SEQ;
  const rp = $("dreplan"); if(rp){ rp.disabled = true; rp.textContent = "REPLANNING…"; }
  const fix = fresh ? await grabFix()
                    : (GEO.fix || await grabFix());
  await Promise.all([
    /* both payloads carry the book's road_mode (card #192) — whichever
       answers first sets the seg before the card paints */
    grab("/api/hotshot/loads")
      .then(v => { if(seq !== DAY_SEQ) return; State.loads = v; State.loadsErr = null; takeRoadMode(v.road_mode); })
      .catch(e => { if(seq !== DAY_SEQ) return; State.loadsErr = String(e.message || e); }),
    fetch(url("/api/hotshot/day"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}),
      body: JSON.stringify({ origin: fix, force: !!(fresh || force) }) })
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(v => { if(seq !== DAY_SEQ) return; State.day = v; State.dayErr = null; takeRoadMode(v.road_mode); })
      .catch(e => { if(seq !== DAY_SEQ) return; State.day = null; State.dayErr = String(e.message || e); })
  ]);
  if(seq !== DAY_SEQ) return;
  paintDay();
  if(!stage.classList.contains("entered")) separate();
  if(fresh && (State.dayErr || State.loadsErr))
    toast("replan did not answer — " + (State.dayErr || State.loadsErr));
  /* the road rides the same fix, after the book has painted — it is the
     slowest read (router + weather) and must never hold the card */
  loadRoad(fix).catch(() => {});
}

async function load(keep){
  /* the boot fires load() twice (the Load Log pull re-reads) and a refresh
     can land on a read in flight — the LAST call wins, never the last to
     arrive (loadDay's law, card #335): a read another has overtaken neither
     stamps nor paints, so its late answers can never age the newer stamp */
  const seq = ++LOAD_SEQ;
  try{
    const [st, sd, bd] = await Promise.all([
      grab("/api/standing"), grab("/api/standings"), grab("/api/board")]);
    if(seq !== LOAD_SEQ) return;
    State.standing = st; State.standings = sd; State.board = bd; State.err = null;
    const at = State.at = new Date();
    /* the rest are not worth failing the desk over — but a miss is RECORDED,
       never swallowed (card #335): each payload stamps the READ that brought
       it when it lands, and a failure leaves the last payload on screen with
       State.<k>Err set, so the stamp counts it and its panel says its age */
    await Promise.all(READ_REST.map(([k,p]) =>
      grab(p).then(v => { if(seq !== LOAD_SEQ) return;
          State[k] = v; State[k + "ReadAt"] = at; State[k + "Err"] = null;
          if(v && typeof v === "object") READ_BROUGHT.add(v); })
        .catch(e => { if(seq !== LOAD_SEQ) return; State[k + "Err"] = String(e.message || e); })));
    if(seq !== LOAD_SEQ) return;
    /* the money room's own reads — never allowed to fail the desk */
    await loadFin().catch(() => {});
    /* THE MIRROR rides the same read (card #244) — before paintField, so the
       spine's card and its margin note land in one paint rather than the note
       appearing a beat late under a card he has already read. Its own catch
       leaves MIRROR empty, which draws nothing: a dark mirror is SILENT, and
       silence here is indistinguishable from clear by design — the spine is
       where a blind check announces itself (/api/notice?why=1). */
    await loadMirror().catch(() => {});
    deriveTemp(); paintField(); stampRead();
    /* the day card rides AFTER the field paints — a hung geolocation
       prompt must never hold the desk (errors swallowed, fan-out law) */
    loadDay(false, keep === true).catch(() => {});
    /* an ask-shaped push deep-links here (#hand) — open the docket once,

    if(location.hash === "#hand"){
      history.replaceState(null, "", location.pathname + location.search);
      openDocket();
    }
    /* The wake-up auto-open (card #113, his 08-15 ask) is GONE by his own
       QA ruling 2026-08-22 (card #133): the page ambushing every first open
       cost the desk its resting frame. THE PAGE button is the only door. */
    if(ACTIVE !== null) renderRoom();
  }catch(e){
    if(seq !== LOAD_SEQ) return;   /* an overtaken read's failure is not the desk's word */
    State.err = String(e.message || e);
    deriveTemp();
    stampRead();   /* a failed refresh tap must not leave "PULLING THE LOAD LOG…" standing (card #335) */
    MIRROR = []; paintMirror();   /* no ruling hangs under a dead spine */
    $("cq").textContent = "The spine did not answer.";
    $("crz").textContent = State.err;

    else showConnect("could not reach the spine — if you are away from home, check Tailscale first");
  }
}
/* NOTHING RE-READS BEHIND HIS BACK. Bryan, 2026-07-29: "the dial keeps
   resetting and bringing me to the top... should load on bringing up the page
   and only update if i refresh."

   The 30s poll and the focus re-read both called load() -> renderRoom(), which
   rebuilds the room: scroll jumps to the top and the needle re-swings from
   zero. Mid-way through placing an expense that is not freshness, it is the
   floor moving under his hands.

   The staleness this replaced is still handled, and more honestly: the READ
   stamp always says when the page last heard from the spine and turns hot past
   four minutes, and it is a BUTTON — his tap pulls the Load Log and re-reads.
   A surface that says how old it is beats one that silently reloads itself. */
let REFRESH = 0;
function startRefresh(){ clearInterval(REFRESH); }   /* deliberately does nothing */

/* THE LOAD LOG LIVES IN A SHEET, and insights.db only mirrors it when someone
   asks. Before this, the ask happened only when the MI app was opened — so a
   load booked in the sheet could be invisible to every surface for days. The
   spine proxies the ask (MI stays the sole writer). We do it on OPEN and on
   DEMAND, never on the 30s tick: that call reaches out to Google, and polling
   it would be rude to a service we do not own. */
async function pullLoadLog(){
  try{
    const r = await fetch(url("/api/fin/loads/refresh"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}), body:"{}" });
    if(!r.ok) return false;
    return true;
  }catch(e){ return false; }
}
async function refreshNow(){
  const el = $("readstamp");
  if(el){ el.textContent = "PULLING THE LOAD LOG…"; el.classList.remove("stale"); }
  const pulled = await pullLoadLog();
  await load(true);
  if(!pulled) toast("the load log did not answer — showing the local mirror");
}
addEventListener("pagehide", () => clearInterval(REFRESH));

function stampRead(){
  const el = $("readstamp"); if(!el) return;
  if(State.err){ el.textContent = "SPINE UNREACHABLE"; el.classList.add("stale"); return; }
  if(!State.at){ el.textContent = ""; return; }
  /* card #335: the stamp knows what answered. It counts the secondaries the
     latest read did not bring, names them on hover, and it CANNOT run ahead
     of what is on screen — the four-minute heat is judged from the oldest
     read still showing, so a refresh with a route dead cannot cool it past
     the panel that did not answer. One clock: State.at is the time printed. */
  const missed = READ_REST.filter(([k]) => State[k + "Err"]);
  const oldest = readBehind(READ_REST.map(([k]) => k)) || State.at;
  const secs = Math.round((Date.now() - oldest.getTime())/1000);
  el.classList.toggle("stale", secs > 240);
  el.textContent = "READ " + readClock(State.at)
    + (missed.length ? ` · ${missed.length} of ${READ_REST.length} did not answer` : "");
  el.title = missed.map(([k, p]) => `${p} did not answer — ${State[k + "Err"]}`
      + (readAge([k]) ? ` (showing ${readAge([k], true)})` : "")).join("\n")
    + (missed.length ? "\n" : "") + "click to pull the Load Log and re-read the spine";
}
setInterval(stampRead, 20000);

function showConnect(msg){
  $("connect").hidden = false;
  $("cfgApi").value = API || "";
  if(msg){ $("cfgMsg").textContent = msg; $("cfgMsg").classList.add("bad"); }
}
$("cfgGo").addEventListener("click", async () => {
  const a = $("cfgApi").value.trim().replace(/\/$/,""), t = $("cfgTok").value.trim();
  const m = $("cfgMsg"); m.classList.remove("bad"); m.textContent = "checking…";
  try{
    const r = await fetch(a + "/api/health", { headers:{ Authorization:"Bearer " + t } });
    if(!r.ok) throw new Error("the spine answered " + r.status);
    localStorage.setItem("almanac_api", API = a);
    localStorage.setItem("almanac_token", TOK = t);
    $("connect").hidden = true; load(); startRefresh();
  }catch(e){ m.classList.add("bad"); m.textContent = "could not reach the spine: " + (e.message||e); }
});

let tT = 0;
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove("on"), 2400); }

/* a notification tap answers the radio; hash-only changes count too */
function answerHash(){
  if(location.hash !== "#radio") return false;
  history.replaceState(null, "", location.pathname + location.search);
  enter(2, true);   // a push tap answers the CHANNEL — straight into the room
  return true;
}
addEventListener("hashchange", answerHash);

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* KEEP THIS STORAGE, AND PROVE WHETHER IT WAS KEPT (card #222).

   The Fold re-registered from scratch every 9-13 days since July and he had
   to re-scan the QR to get back in — because this origin never ASKED to be
   kept. Without persist(), Chrome files it as "best effort": first evicted
   under storage pressure, fair game for Android's storage manager. Losing
   localStorage loses the token AND the worker registration together, and
   between the wipe and the next scan the device is DARK — the watch, the
   payment chase and the road-approval gate all ring nothing.

   HOW A WIPE IS DETECTED, and why not the obvious way: reading
   almanac_token here cannot tell us, because bootstrap() has already run and
   a #cfg= scan has already written it — a freshly-scanned device would
   always look like it never lost anything. The DEVICE LABEL is the honest
   witness. It lives in the same localStorage, so a wipe takes it too: if we
   had to mint a new one, this profile has no memory of ever being here.
   A stream of one-off labels ~10 days apart IS the eviction, in the open.

   The eviction story is still a hypothesis. This is how it stops being one:
   if persisted comes back false after we asked, we are wrong and we look
   again. Nothing here may throw or block boot — an old browser has no
   navigator.storage at all, and a rejected promise must never take the page
   down over a diagnostic. */
const DEVICE = (() => {
  /* Not a fingerprint — a random id the device picks for itself, so the spine
     can say "the Fold lost its storage" instead of "a device did". */
  try{
    let d = localStorage.getItem("almanac_device");
    if(d) return { label: d, fresh: false };
    d = (navigator.userAgent.match(/SM-[A-Z0-9]+/) || ["device"])[0]
        + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem("almanac_device", d);
    return { label: d, fresh: true };
  }catch(e){ return { label: "unknown", fresh: false }; }
})();
(async function keepStorage(){
  try{
    const st = navigator.storage;
    let asked = false, granted = null, persisted = null;
    if(st && st.persisted){
      persisted = await st.persisted().catch(() => null);
      if(persisted === false && st.persist){
        asked = true;
        granted = await st.persist().catch(() => null);
        if(granted === true) persisted = true;
      }
    }
    let quota = null, usage = null;
    if(st && st.estimate){
      const e = await st.estimate().catch(() => null);
      if(e){ quota = e.quota ?? null; usage = e.usage ?? null; }
    }
    if(typeof configured !== "function" || !configured()) return;   /* unheard anyway */
    fetch(url("/api/device/storage"), { method: "POST",
      headers: hdr({ "Content-Type": "application/json" }),
      body: JSON.stringify({ device: DEVICE.label, fresh: DEVICE.fresh,
                             persisted, asked, granted, quota, usage })
    }).catch(() => {});
  }catch(e){ /* a diagnostic never breaks the page */ }
})();

/* THE VERSION STAMP (Bryan, 2026-08-04: "where is the version number pill on
   the site" — there wasn't one, and every cache dance was blind because of
   it). One home for the number: the service worker's VERSION. The stamp shows
   what THIS DEVICE is actually serving — not what Pages holds — because that
   gap is exactly the thing worth seeing. No SW answering means the page came
   straight from the network: "fresh". Tap = fetch the newest and reload. */
if("serviceWorker" in navigator){
  const el = document.getElementById("shellv");
  navigator.serviceWorker.addEventListener("message", e => {
    if(e.data && e.data.type === "VERSION" && el)
      el.textContent = String(e.data.version || "").replace("almanac-shell-", "") || "v?";
  });
  const askV = () => navigator.serviceWorker.ready
    .then(r => r.active && r.active.postMessage({type:"VERSION"})).catch(()=>{});
  askV(); setTimeout(askV, 2500);
  setTimeout(() => { if(el && !el.textContent.trim()) el.textContent = "fresh"; }, 4000);
  /* a newer worker takes over seconds after load (install skip-waits) — the
     stamp must re-ask THEN, or it reads the old number all session and "i am
     still on v43" is what Bryan gets told by a device already running v45 */
  navigator.serviceWorker.addEventListener("controllerchange", () => setTimeout(askV, 300));
  el && el.addEventListener("click", async () => {
    el.textContent = "pulling…";
    try{
      const r = await navigator.serviceWorker.getRegistration();
      if(r){
        /* the worker skip-waits at install, so the moment the newer one takes
           the controller is the moment to reload — racing it reloads into the
           OLD shell and the stamp reads like the pull did nothing */
        navigator.serviceWorker.addEventListener("controllerchange",
          () => location.reload(), {once: true});
        await r.update();
        const w = r.waiting;
        if(w) w.postMessage({type: "SKIP_WAITING"});
        setTimeout(() => location.reload(), 3000);   // already-newest, or a browser
        return;                                      // that never fires the event
      }
    }catch(_){/* the reload below still serves the point */}
    location.reload();
  });
}else{
  const el = document.getElementById("shellv");
  if(el) el.textContent = "fresh";
}
if(!configured()) showConnect();
else {
  /* Open the desk → the sheet is pulled once, then the spine is read. Opening
     it IS the ask; he should never have to think about a mirror. */
  load().then(() => { answerHash(); startRefresh(); });
  pullLoadLog().then(ok => { if(ok) load(true); });
  $("readstamp").addEventListener("click", refreshNow);
}
})();
