.sgo:disabled{opacity:.5;cursor:default}
.stoprow{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px;
  display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.25)}
.sr1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.snm{font:700 12px/1.35 var(--mono)}
.srt{color:var(--dim);font:700 10px/1 var(--mono)}
.srt.unk{color:var(--unknown);font-weight:400}
.sdog{font:700 8px/1 var(--mono);letter-spacing:.14em;padding:4px 8px;border-radius:3px}
.sdog.ok{color:rgba(var(--key),1);background:rgba(var(--key),.14)}
.sdog.no{color:var(--hot);background:rgba(var(--hot-rgb),.12)}
.sdog.unk{color:var(--unknown);background:rgba(110,110,110,.14)}
.sr2{color:var(--mid);font:400 10.5px/1.5 var(--sans)}
.snote{color:var(--dim);font-style:italic}
.smaybe{color:var(--amber);font:400 9.5px/1.5 var(--mono)}
.sr3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.sr3 .lsp{flex:1}
.slink{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);
  border-radius:5px;color:var(--ink);text-decoration:none;font:700 9px/1 var(--mono);letter-spacing:.14em}
.slink:hover{border-color:rgba(var(--key),.6);color:rgba(var(--key),1)}
.slink.big{margin-top:8px;justify-content:center}
.nonum{color:var(--unknown);font:400 9px/44px var(--mono);letter-spacing:.1em}
.skeep,.sno,.sre{min-height:44px;border-radius:5px;cursor:pointer;
  font:700 9px/1 var(--mono);letter-spacing:.14em;padding:0 16px}
.skeep{background:rgba(var(--key),.16);color:rgba(var(--key),1);border:1px solid rgba(var(--key),.5)}
.sno{background:none;color:var(--dim);border:1px solid var(--line)}
.sre{background:none;color:var(--unknown);border:1px dashed var(--line);
  font:400 9.5px/1 var(--mono);letter-spacing:.04em}
.sbadge{color:rgba(var(--key),1);font:700 9px/1.6 var(--mono);letter-spacing:.14em}
.handadd{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.stops .sub{margin-top:2px;font:400 10.5px/1.5 var(--sans);color:var(--dim)}
/* the corridor's dress */
.sgps{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:4px;border:1px solid var(--line);
  background:none;color:var(--dim);font:700 9px/1 var(--mono);letter-spacing:.14em;cursor:pointer}
.sgps.on{color:rgba(var(--key),1);border-color:rgba(var(--key),.5);background:rgba(var(--key),.1)}
.spin{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;background:rgba(var(--key),.16);color:rgba(var(--key),1);
  font:700 10px/1 var(--mono)}
.smile{color:var(--mid);font:700 9px/1 var(--mono);letter-spacing:.08em}
.smap img{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line)}
/* the LIVE book map — zoom is his, hover answers (his ask 2026-08-14). The
   container isolates Leaflet's internal z-indexes under the desk's menus. */
.smap-live{height:min(58vh,460px);border-radius:6px;border:1px solid var(--line);
  overflow:hidden;position:relative;z-index:0;background:#0b0d10}
.lpin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(0deg);
  display:flex;align-items:center;justify-content:center;
  background:#2E9E5B;color:#04140b;font:700 11px/1 var(--mono);
  border:2px solid rgba(var(--wash),.85);box-shadow:0 1px 6px rgba(0,0,0,.5)}
.lpin.pfuel2{background:var(--amber);color:#171000}
.leaflet-tooltip.ltip,.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;font:400 11px/1.45 var(--mono)}
.leaflet-tooltip.ltip{padding:7px 9px;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.leaflet-tooltip.ltip b{font-weight:700}
.leaflet-tooltip-top.ltip::before{border-top-color:var(--line)}
.leaflet-popup-content{margin:9px 11px;font:400 11px/1.5 var(--mono)}
.leaflet-popup-tip{background:var(--panel2);border:1px solid var(--line)}
.leaflet-popup-content .slink{margin-right:8px}
.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
/* the book's two chapters: proven roof pins go solid green, proven pump pins
   amber — the same law the spine's maps speak in marker color */
.sfuel{font:700 8px/1 var(--mono);letter-spacing:.14em;padding:4px 8px;border-radius:3px;
  color:var(--amber);background:rgba(255,170,40,.12)}
.spin.pbook{background:#2E9E5B;color:#04140b}
.spin.pfuel{background:var(--amber);color:#171000}
@media(max-width:520px){.sgps{width:100%}}
@media(max-width:520px){.stopbar{flex-direction:column}.sr3 .lsp{flex-basis:100%}}
.creed{padding:10px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.creed .ct{font:600 14px/1.4 var(--sans);display:flex;gap:12px;align-items:baseline}
.creed .ct .cf{margin-left:auto;font:700 8px/1 var(--mono);letter-spacing:.13em;color:var(--dim)}
.creed .ct .cf.yes{color:rgba(var(--key),1)}
.creed .cb{margin-top:8px;font:400 13.5px/1.7 var(--sans);color:var(--mid);white-space:pre-wrap}
.gen{flex:1;display:grid;place-items:center;color:var(--dim);font:400 14px/1.6 var(--sans);text-align:center}
.nodata{color:var(--dim);font-style:italic}
.hotline{color:var(--hot);font:400 12.5px/1.6 var(--mono)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
  background:rgba(16,20,24,.96);border:1px solid var(--line);border-radius:4px;padding:9px 15px;
  font:600 10px/1 var(--mono);letter-spacing:.12em;color:rgba(var(--key),1);opacity:0;
  transition:opacity .25s;pointer-events:none;backdrop-filter:blur(8px);max-width:80vw;text-align:center}
.toast.on{opacity:1}
.panelbox{position:fixed;inset:0;background:rgba(5,7,10,.9);z-index:30;display:flex;align-items:center;
  justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.panelbox .in{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:24px;
  width:min(440px,100%);display:flex;flex-direction:column;gap:13px}
.panelbox h2{font:600 19px/1.2 var(--sans)}
.panelbox p{color:var(--dim);font-size:13.5px}
.panelbox label{display:flex;flex-direction:column;gap:5px;font:700 9px/1 var(--mono);letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase}
.panelbox input{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:4px;color:var(--ink);
  font:400 14px/1.3 var(--mono);padding:11px;user-select:text;-webkit-user-select:text}
.panelbox .msg{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.panelbox .msg.bad{color:var(--hot)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* ══ PAPER MODE — the structural grounds ══════════════════════════════
   Everything the variables can't reach: the sky's own gradients, the
   ledger grid, the core, the drawers. Kept LAST so the cascade is the
   whole argument. Night mode above is untouched. */
:root.paper .sky{background:
  radial-gradient(1100px 700px at 50% 40%, rgba(255,252,240,.8), transparent 70%),
  radial-gradient(760px 520px at 14% 76%, rgba(196,160,96,.2), transparent 70%), var(--void)}
:root.paper body.hot .sky{background:
  radial-gradient(1200px 760px at 50% 30%, rgba(214,88,60,.3), transparent 70%),
  radial-gradient(760px 520px at 14% 78%, rgba(179,39,26,.18), transparent 70%), #E3D0B0}
:root.paper .grid{opacity:.5;background-image:
  linear-gradient(rgba(88,66,28,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(88,66,28,.07) 1px,transparent 1px)}
/* the core: at night a moon; on paper the almanac's pressed seal */
:root.paper .core{background:radial-gradient(circle at 38% 32%, rgba(255,250,235,.92),
    rgba(228,209,168,.75) 42%, rgba(178,148,96,.55) 72%, rgba(134,106,62,.6));
  box-shadow:0 0 90px -10px rgba(160,126,66,.55), inset 0 0 60px rgba(120,90,40,.2)}
:root.paper .core .t{color:rgba(58,42,18,.95)}
:root.paper .core .s{color:rgba(94,72,40,.8)}
/* orb lettering: the halo flips to paper, the hue stays the identity —
   inked deep enough to read on cream */
:root.paper .orb .name{text-shadow:0 1px 8px rgba(255,250,235,.95),0 0 2px rgba(255,250,235,.9);
  filter:brightness(.62) saturate(1.5)}
:root.paper .orb.active .name{color:var(--ink);filter:none}
:root.paper .orb .sig{text-shadow:0 1px 6px rgba(255,250,235,.9)}
:root.paper .sysring{border-color:rgba(88,66,28,.28)}
/* the drawers: docket + morning page print on vellum */
:root.paper .docket{background:linear-gradient(200deg,rgba(248,241,226,.99),rgba(238,228,205,.99));
  box-shadow:-18px 0 48px rgba(80,60,30,.3)}
:root.paper .page{background:linear-gradient(196deg,rgba(250,244,230,.99),rgba(240,231,210,.99))}
:root.paper .dockback,:root.paper .pageback{background:rgba(62,48,24,.42)}
:root.paper .toast{background:rgba(247,240,224,.97)}
:root.paper .panelbox{background:rgba(90,72,40,.55)}
:root.paper .panelbox input{background:rgba(255,252,244,.75)}
/* dark type on the amber/green map pins needs cream once amber runs deep */
:root.paper .lpin.pfuel2,:root.paper .spin.pfuel{color:#FFF6E2}
:root.paper .hlStop .pu{color:#FFF6E2}
</style>
</head>
<body>
<div class="sky"></div>
<canvas class="stars" id="stars"></canvas>
<div class="grid"></div>

<div class="stage" id="stage">
  <div class="bar">
    <span class="wm">ALMANAC</span>
    <span class="d" id="dateline"></span>
    <span class="hand" id="hand" role="button" tabindex="0"></span>
    <span class="right">
      <button class="btn" id="lamp"
        title="the lamp — the same almanac by night or on paper"></button>
      <button class="readstamp" id="shellv"
        title="the shell this device is serving — tap to fetch the newest and reload">&#8203;</button>
      <button class="readstamp" id="readstamp" title="click to pull the Load Log and re-read the spine"></button>
      <span class="pill" id="pill">reading the spine</span>
      <button class="btn" id="home" hidden>&#9666; THE FIELD</button>
      <button class="btn" id="toPlate" title="the phone instrument">&#8646; THE INSTRUMENT</button>
    </span>
  </div>

  <!-- THE DOCKET (card #84) — the clipboard at the dock: everything awaiting
       his hand, listed and linked. A queue of doorknobs, never a room: the
       one inline act is the reversible ack; everything else walks him to the
       door that already owns the ceremony. -->
  <div class="dockwrap" id="dockWrap" hidden>
    <div class="dockback" id="dockBack"></div>
    <aside class="docket" id="docket" role="dialog" aria-label="the docket"></aside>
  </div>

  <!-- THE MORNING PAGE (cards #112/#113) — the almanac's daily page: what a
       farmer's almanac has always been. Weather at the top, the numbers,
       yesterday's field notes, the navigator's word, and the proverb at the
       bottom. Loads once on the first open of the day; his CLOSE stamps it
       read. Every figure on it is a SERVED string (one producer) — the page
       computed nothing. -->
  <div class="pagewrap" id="pageWrap" hidden>
    <div class="pageback" id="pageBack"></div>
    <aside class="page" id="page" role="dialog" aria-label="the morning page"></aside>
  </div>

  <div class="fieldwrap" id="fieldwrap">
  <div class="field" id="field">
    <div class="core"><div><div class="t">THE SPINE</div>
      <div class="s">one service &middot; one database<br>everything above is served</div></div></div>
    <div id="orbs"></div>
    <div class="consider" id="consider">
      <span class="lbl" id="clbl">THE SPINE PUT THIS IN FRONT OF YOU</span>
      <div class="q" id="cq">reading&#8230;</div>
      <div class="rz" id="crz"></div>
      <div class="acts"><button class="btn go" id="cgo">OPEN IT</button><button class="btn go" id="cair" hidden>ON AIR</button></div>
      <div class="cml" id="cml" hidden></div>
      <!-- THE MIRROR (card #244). Not an alert and not another orb — the
           ledger reading his own earlier handwriting back to him. It is a
           MARGIN NOTE: a hairline rule, his ruling in the hand it was written
           in, the date set small like a date in a margin, and today's fact
           under it. It renders ONLY when there is something; a "nothing to
           report" panel is the thing that makes him stop reading it. -->
      <div class="mirror" id="mirror" hidden></div>
    </div>
  </div>
  <button class="daycue" id="daycue" hidden>&#9662; THE DAY</button>
  <section class="dayroom" id="dayroom" hidden></section>
  </div>

  <div class="room" id="room"></div>
</div>
<div class="toast" id="toast"></div>

<div class="panelbox" id="connect" hidden>
  <div class="in">
    <h2>Connect</h2>
    <p>Both values stay on this device.</p>
    <label>backend<input id="cfgApi" inputmode="url" placeholder="https://&#8230;"></label>
    <label>token<input id="cfgTok" type="password" placeholder="ALMANAC_TOKEN"></label>
    <button class="btn" id="cfgGo" style="padding:13px">CONNECT</button>
    <span class="msg" id="cfgMsg">Checked against the spine before it is saved.</span>
  </div>
</div>

<script>
"use strict";
(() => {
const $ = id => document.getElementById(id);
const stage = $("stage");

/* ── PAPER MODE inks — canvas fills can't take CSS var(), so every paint
   that owns a hardcoded color asks these at draw time. One source of
   truth: the .paper class the <head> boot script set. ─────────────── */
const PAPER = () => document.documentElement.classList.contains("paper");
const wash  = a => PAPER() ? `rgba(34,26,12,${a})`  : `rgba(255,255,255,${a})`;
const inkc  = a => PAPER() ? `rgba(30,22,10,${a})`  : `rgba(237,240,238,${a})`;
const hotc  = a => PAPER() ? `rgba(179,39,26,${a})` : `rgba(255,59,24,${a})`;
const keyc  = a => PAPER() ? `rgba(143,90,0,${a})`  : `rgba(255,164,25,${a})`;

/* ── config: same keys, same origin, same credentials as the plate ── */
let API = localStorage.getItem("almanac_api") || "";
let TOK = localStorage.getItem("almanac_token") || "";
(function bootstrap(){
  const h = location.hash || "";
  if(h === "#reset" || h === "#nuke"){
    (async () => {
      try{
        const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
        await Promise.all(regs.filter(r => (r.scope || "").includes("/almanac")).map(r => r.unregister()));   /* our worker only — the scanner shares this origin (card #177) */
        const ks = await (caches?.keys?.() ?? []);
        await Promise.all(ks.filter(k => k.startsWith("almanac-shell-")).map(k => caches.delete(k)));   /* our caches only — never the scanner's OpenCV */
      }catch(e){}
      if(h === "#nuke"){ localStorage.removeItem("almanac_api"); localStorage.removeItem("almanac_token"); }
      location.replace(location.pathname + location.search);
    })();
    return;
  }
  const m = h.match(/[#&]cfg=([^&]+)/);
  if(m){
    try{
      const cfg = JSON.parse(decodeURIComponent(m[1]));
      if(cfg.api)   localStorage.setItem("almanac_api",   API = cfg.api.replace(/\/$/, ""));
      if(cfg.token) localStorage.setItem("almanac_token", TOK = cfg.token);
      history.replaceState(null, "", location.pathname + location.search);
    }catch(e){}
  }
})();
const configured = () => localStorage.getItem("almanac_token") !== null && TOK !== "";
const url = p => (API || "") + p;
const hdr = x => Object.assign({ Authorization: "Bearer " + TOK }, x || {});
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const money = v => v == null ? null :
  "$" + Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const short = v => v == null ? "——" :
  "$" + Math.round(Number(v)).toLocaleString("en-US");

/* roadMode — PARTIAL / FULL follows the book, not the device (card #192, his
   Fold UAT of #179): the spine holds the mode in its settings row. What this
   device remembers is only the echo painted before the first payload lands;
   takeRoadMode() overwrites it with the spine's word and nothing else writes
   it. DONE taps stay device-local by his request. */
const State = { fieldLoad:null, loads:null, day:null, loadsErr:null, dayErr:null, road:null, roadErr:null, roadMode:(function(){ try{ return localStorage.getItem('almanac_road_mode') || 'full'; }catch(_){ return 'full'; } })(), standing:null, standings:null, board:null, radio:null, learn:null,
                soul:null, held:null, watch:null, at:null, err:null, glasses:null,
                hand:null, sidech:null, diet:null, brief:null,
                fin:{ summary:null, loads:null, expenses:null, rollup:null,
                      followups:null,
                      summaryErr:null, err:null, stones:[], placed:[] } };
let ACTIVE = null, HOT = false;
/* THE READ'S SECONDARIES (card #335). load() stamps State.at on the three
   primaries, then fans out to these eleven. Before #335 one shared
   .catch(() => {}) swallowed every miss: a payload that did not answer kept
   its LAST value on screen under a fresh READ stamp, and nothing said so.
   Each now keeps loadDay()'s shape — State.<k>Err set in the catch, cleared
   on the answer — and State.<k>ReadAt holds the READ that brought it.
   ONE CLOCK: a ReadAt is only ever a value State.at once held, never a
   second freshness clock; when all eleven answer, every ReadAt IS State.at.
   (ReadAt, not At: State.radioAt is freshenRadio's own 15s throttle and the
   read must not move it.) READ_BROUGHT knows which payload objects a READ
   delivered — a room's own re-fetch or a write's refresh swaps in a payload
   the stamp never saw, and a missed read must never age THAT one (it may be
   newer than the stamp). */
const READ_REST = [
  ["radio","/api/messages"], ["learn","/api/learning"], ["soul","/api/doctrine"],
  ["held","/api/push/held"], ["watch","/api/watch"], ["hotshot","/api/hotshot"],
  ["hand","/api/hand"], ["sidech","/api/threads"],
  ["diet","/api/listening?days=1"], ["brief","/api/brief"],
  ["planner","/api/planner"]
];
const READ_BROUGHT = new WeakSet();
let LOAD_SEQ = 0;
/* which secondaries each room (and its orb) draws from — the hotshot room's
   pulse and bulletin carry their own lines, so standing is not listed */
const ROOM_READ = { radio:["radio","sidech"], learn:["learn"], soul:["soul"], planner:["planner"] };
const readClock = d => d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
/* the oldest READ still on screen among these payloads: only one the latest
   read did NOT bring, and only while the payload showing is the one a read
   delivered. null = every one of them rode the stamp. */
function readBehind(ks){
  let at = null;
  for(const k of ks){
    if(!State[k + "Err"] || !READ_BROUGHT.has(State[k])) continue;
    const a = State[k + "ReadAt"];
    if(a && (!at || a < at)) at = a;
  }
  return at;
}
/* a panel's OWN age. Silent while its payload rode the stamp — the masthead
   speaks for it (loud is a budget, bearing 87: eleven lines repeating the
   stamp would be wallpaper). When the read missed it, the last payload STAYS
   on screen — never blank a panel — and says which read it is from. */
function readAge(ks, short){
  const at = State.at && readBehind(ks);
  if(!at) return "";
  return short ? "as of " + readClock(at)
    : "as of " + readClock(at) + " · the " + readClock(State.at) + " read did not bring it";
}
function readLine(ks){
  const a = readAge(ks);
  return a ? `<div class="readage">${esc(a)}</div>` : "";
}
/* WHY A MONEY FIGURE IS BLANK (card #346): the judgement serves
   parts.unreadable — each figure that went None with the exception's own
   words. The page names the first, never guesses one. */
function unreadWhy(p){
  const u = p && p.unreadable;
  if(!u) return "";
  const k = Object.keys(u)[0];
  return k ? `${k} could not be read — ${String(u[k]).slice(0, 120)}` : "";
}

$("toPlate").addEventListener("click", () => {
  localStorage.setItem("almanac_view", "detent");
  location.href = "detent.html";
});

/* ── THE LAMP — night barn or printed page, his call, kept per device.
   The head boot script already classed <html> before first paint; this
   only has to flip it live and repaint what canvas already drew. ──── */
function setTheme(paper, atBoot){
  document.documentElement.classList.toggle("paper", !!paper);
  try{ localStorage.setItem("almanac_theme", paper ? "paper" : "night"); }catch(e){}
  const mt = $("metaTheme"); if(mt) mt.setAttribute("content", paper ? "#EAE0C9" : "#07080A");
  const b = $("lamp"); if(b) b.textContent = paper ? "☾ NIGHT" : "☀ PAPER";
  if(atBoot) return;               /* nothing painted yet — the label was the job */
  dust();
  paintField(); paintConsider();
  const rmEl = $("roadMap"); if(rmEl) rmEl.classList.toggle("night", !paper);
  if(ACTIVE !== null) renderRoom();
}
$("lamp").addEventListener("click", () => setTheme(!PAPER()));
setTheme(PAPER(), true);

/* dust: stars over the night barn; foxing specks on the printed page */
function dust(){
  const cv = $("stars"); cv.width = innerWidth; cv.height = innerHeight;
  const g = cv.getContext("2d"); g.clearRect(0,0,cv.width,cv.height); let s = 7;
  const rnd = () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
  const paper = PAPER();
  for(let i=0;i<300;i++){
    g.fillStyle = paper ? `rgba(120,94,48,${rnd()*0.22+0.03})`
                        : `rgba(200,218,240,${rnd()*0.45+0.05})`;
    g.beginPath(); g.arc(rnd()*cv.width, rnd()*cv.height, rnd()*1.2+0.25, 0, 7); g.fill();
  }
}
dust();
$("dateline").textContent = new Date().toLocaleDateString("en-US",
  { weekday:"long", month:"long", day:"numeric", year:"numeric" }).toUpperCase();

/* ── the domains. hue = identity. ─────────────────────────────────── */
/* THE RING (his tee, card #122): the orbs sit as a cylinder around the
   spine — the left arc mirrors the right's curve (80,30 / 85,60 / 73,80),
   and PLANNING rides the top band beside RADIO, a bit more to the right. */
const D = [
  {k:"HOTSHOT", hue:"255,110,50",  fx:20, fy:32, r:118, room:"standing"},
  {k:"THE WORK",hue:"70,190,200",  fx:80, fy:30, r:102, room:"work"},
  {k:"RADIO",   hue:"255,164,25",  fx:50, fy:16, r:80,  room:"radio"},
  {k:"MONEY",   hue:"190,160,60",  fx:85, fy:60, r:90,  room:"ledger"},
  {k:"LEARN",   hue:"150,90,220",  fx:15, fy:62, r:84,  room:"learn"},
  {k:"SOUL",    hue:"120,200,120", fx:73, fy:80, r:72,  room:"soul"},
  {k:"PLANNING",hue:"90,160,255",  fx:34, fy:14, r:76,  room:"planner"}
];
/* THE RADIO SYSTEM (card #93, his framing): the radio grew into a DOMAIN —
   tap its orb and the field falls into the radio's own constellation. Every
   child is a DOOR with one job (the one-verb law holds per surface); the
   constellation itself is wayfinding, never a console. Tapping the parent
   again climbs back out. */
const RSYS = [
  {k:"CH 19",   id:"ch19", hue:"255,164,25",  act:"room",
   why:"the channel — telemetry, held reads, the repeater strip"},
  {k:"SIDE CH", id:"sidech", hue:"198,212,228", act:"companion.html",
   why:"the conversation — take it to 21"},
  {k:"THE EAR", id:"ear", hue:"198,212,228", act:"ear.html",
   why:"the diet's intake — what has been in your ears"},
  {k:"REPEATER",id:"rep", hue:"255,164,25",  act:"room",
   why:"the glasses lane — its controls live on CH 19"}
];
let SYS = false;
/* the orbit: he SPINS the children around the parent star to reach one, and
   each orb's SIZE is earned by his own hand — a per-device count of every
   time he takes that door (his ask, 2026-08-11). */
const SPIN = { base: -Math.PI/2, moved: false, movedT: 0 };
function sysUse(){
  try{ return JSON.parse(localStorage.getItem("almanac.radio.use") || "{}"); }
  catch(e){ return {}; }
}
function bumpUse(id){
  const u = sysUse(); u[id] = (u[id] || 0) + 1;
  localStorage.setItem("almanac.radio.use", JSON.stringify(u));
}
function spinGuard(){ return SPIN.moved && performance.now() - SPIN.movedT < 300; }
function sysCenter(){ return { x: innerWidth/2, y: fieldH()*0.48 }; }
function sysRadius(){ return Math.max(140, Math.min(250, Math.min(innerWidth, fieldH())*0.30)); }
const field = $("field"), host = $("orbs");
D.forEach((o,i) => {
  const el = document.createElement("div");
  el.className = "orb"; el.dataset.i = i;
  el.innerHTML =
    `<div class="ball" style="background:radial-gradient(circle at 36% 30%,
       rgba(${o.hue},.96), rgba(${o.hue},.62) 46%, rgba(${o.hue},.16) 78%, rgba(6,8,12,.98));
       box-shadow:0 0 40px -8px rgba(${o.hue},.6), inset 0 -14px 26px rgba(0,0,0,.55),
       inset 0 5px 12px rgba(255,255,255,.12)">
       <div class="fig"><div><span class="n">—</span><span class="u"></span></div></div>
     </div><div class="name">${o.k}</div><div class="sig">&#8230;</div>`;
  el.addEventListener("click", () => enter(i));
  host.appendChild(el);
  o.el = el;
});
/* 96 -> 72 in a room, and lower still on a short screen: the orb rail is
   navigation once he is working, not the view. Every pixel here is a pixel of
   ledger. */
function fieldH(){
  if(!stage.classList.contains("entered")) return Math.round(innerHeight*0.72);
  return innerHeight <= 620 ? 56 : innerHeight <= 820 ? 64 : 72;
}
function layout(){
  const entered = stage.classList.contains("entered");
  const W = innerWidth, H = fieldH();
  field.style.height = H + "px";
  D.forEach((o,i) => {
    if(SYS && !entered && o.room === "radio") return;   // the sun holds its seat
    const r = entered ? (H <= 60 ? 26 : H <= 68 ? 30 : 34) : o.r;
    const b = o.el.querySelector(".ball");
    b.style.width = r + "px"; b.style.height = r + "px";
    if(entered){
      const n = D.length, span = Math.min(W*0.62, 660), x0 = W/2 - span/2;
      o.el.style.left = (x0 + (i+0.5)*(span/n)) + "px";
      o.el.style.top  = Math.round(H/2) + "px";
    } else {
      o.el.style.left = (o.fx/100*W) + "px";
      o.el.style.top  = (o.fy/100*H) + "px";
    }
  });
  if(!entered) separate();
  layoutSys();
}

/* NOTHING MAY COVER ANYTHING (2026-07-28, Bryan: "should be able to read all
   orbs"). The composition in D is hand-placed and stays hand-placed — this
   only ENFORCES what that composition assumes.

   Why it drifted: the seed positions are percentages of the viewport, the
   balls are fixed pixels, and the label under each is white-space:nowrap and
   changes LENGTH WITH THE DATA. "$199.53 TO GO" is far wider than "——", and
   "4 IN QA · 22 OPEN" grows as the board does. So a field that reads perfectly
   at one viewport with one set of numbers collides at another — the layout had
   no idea how big anything actually was.

   So: measure the real rendered box of each orb (ball + name + signal line),
   then push overlapping pairs apart along their axis of least penetration and
   clamp everyone inside the field. Deterministic, no randomness, and it settles
   in a few passes. If the field is genuinely too small to hold them all, the
   balls shrink rather than the labels colliding — unreadable is a failure,
   smaller is not. */
function separate(){
  if(SYS) return;   // the constellation owns the sky; the frozen field waits
  const W = innerWidth, H = fieldH(), GAP = 14, EDGE = 6;
  /* the sig hangs OUTSIDE the element box now (it may not take taps — the
     radio's wide caption was stealing its neighbors' clicks in the rail), so
     the collision law measures it back in: the FOOTPRINT includes the caption
     even though the hit box does not. */
  const box = D.map(o => { const sg = o.el.querySelector(".sig");
    return { w: Math.max(o.el.offsetWidth, sg ? sg.offsetWidth : 0),
             h: o.el.offsetHeight + (sg ? sg.offsetHeight + 7 : 0) }; });
  if(box.some(b => !b.w || !b.h)) return;   // not laid out yet; paintField re-runs this

  // If the footprints cannot fit the field, shrink the BALLS until they can.
  // Labels never shrink — a number you cannot read is the whole defect.
  const need = box.reduce((a,b) => a + (b.w+GAP)*(b.h+GAP), 0);
  const room = Math.max(1, W*H) * 0.62;          // packing is never perfect
  if(need > room){
    const k = Math.max(0.45, Math.sqrt(room/need));
    D.forEach(o => { const b = o.el.querySelector(".ball");
      b.style.width = b.style.height = Math.round(o.r*k) + "px"; });
    D.forEach((o,i) => { box[i] = { w: o.el.offsetWidth, h: o.el.offsetHeight }; });
  }

  /* ORBS ARE NOT THE ONLY THING ON THE FIELD. The consider card — the one
     thing the spine puts in front of him — is opaque and sits over the same
     space, and the core carries the spine's own line. Both were covering orb
     labels in the field Bryan photographed. They are obstacles here, not
     afterthoughts: an orb pushed off a label is fixed, an orb buried under a
     panel is still unreadable. */
  const fr = field.getBoundingClientRect();
  const obstacles = [];
  for(const sel of [".consider", ".core"]){
    const el = document.querySelector(sel);
    if(!el || el.hidden) continue;
    const r = el.getBoundingClientRect();
    if(!r.width || !r.height) continue;
    obstacles.push({ x: r.left - fr.left + r.width/2, y: r.top - fr.top + r.height/2,
                     w: r.width, h: r.height });
  }

  const pos = D.map(o => ({ x: parseFloat(o.el.style.left) || 0,
                            y: parseFloat(o.el.style.top)  || 0 }));
  const clamp = i => {
    pos[i].x = Math.min(W - box[i].w/2 - EDGE, Math.max(box[i].w/2 + EDGE, pos[i].x));
    pos[i].y = Math.min(H - box[i].h/2 - EDGE, Math.max(box[i].h/2 + EDGE, pos[i].y));
  };
  for(let pass = 0; pass < 200; pass++){
    let moved = false;
    for(let i = 0; i < D.length; i++){
      for(let j = i+1; j < D.length; j++){
        const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
        const mw = (box[i].w + box[j].w)/2 + GAP, mh = (box[i].h + box[j].h)/2 + GAP;
        const ox = mw - Math.abs(dx), oy = mh - Math.abs(dy);
        if(ox <= 0 || oy <= 0) continue;          // already clear on one axis
        moved = true;
        if(ox < oy){ const s = (dx < 0 ? -1 : 1) * ox/2; pos[i].x -= s; pos[j].x += s; }
        else       { const s = (dy < 0 ? -1 : 1) * oy/2; pos[i].y -= s; pos[j].y += s; }
      }
      // obstacles do not move; the orb yields entirely
      for(const ob of obstacles){
        const dx = pos[i].x - ob.x, dy = pos[i].y - ob.y;
        const mw = (box[i].w + ob.w)/2 + GAP, mh = (box[i].h + ob.h)/2 + GAP;
        const ox = mw - Math.abs(dx), oy = mh - Math.abs(dy);
        if(ox <= 0 || oy <= 0) continue;
        moved = true;
        if(ox < oy) pos[i].x += (dx < 0 ? -1 : 1) * ox;
        else        pos[i].y += (dy < 0 ? -1 : 1) * oy;
      }
    }
    for(let i = 0; i < D.length; i++) clamp(i);
    if(!moved) break;
  }
  D.forEach((o,i) => { o.el.style.left = pos[i].x + "px"; o.el.style.top = pos[i].y + "px"; });
}
layout();
addEventListener("resize", () => { clearTimeout(window.__l);
  window.__l = setTimeout(() => {
    layout();
    /* A resize with his hand in a field must not rebuild the room: on the
       Fold a resize rides keyboard rises, folds, and split-screen — and an
       anonymous chip editor cannot be handed back like the id'd inputs
       renderRoom rescues (08-08 note). The walls do not move under his
       thumb; the blur that ends the edit repaints, and the next resize
       (keyboard closing) catches the layout up. */
    const ae = document.activeElement, room = $("room");
    if(ae && room && room.contains(ae) &&
       /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    if(ACTIVE !== null) renderRoom();
  }, 160); });

/* ── TEMPERATURE IS DERIVED, never a mood switch ──────────────────── */
function tempFacts(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const f = [];
  if(p.uncovered != null && p.uncovered > 0)
    f.push(`uncovered <b>${money(p.uncovered)}</b>`);
  if(p.booked_ahead_total != null && p.booked_ahead_total <= 0 && p.to_go > 0)
    f.push(`booked ahead <b>$0.00</b>`);
  /* The clock only counts against him when booked work does NOT cover the gap.
     Days left is pressure only if something is still uncovered — a room that
     goes red while $1,000 is booked against $200 is crying wolf, which is the
     one thing this surface must never do. */
  const days = daysLeftInMonth();
  if(p.uncovered != null && p.uncovered > 0 && days <= 7)
    f.push(`<b>${days} day${days===1?"":"s"}</b> left`);
  /* the dead-man row (card #184) is the watch reporting on ITSELF — a dropped
     tick means the next death earns no push, so it gets its own words here
     instead of hiding inside the down count (card #192 follow-up) */
  const W = State.watch || {};
  const dead = (W.checks || []).find(c => c && c.target === "the watch itself" && !c.ok);
  const down = (W.down || []).filter(t => t !== "the watch itself");
  if(down.length) f.push(`<b>${down.length}</b> down on the watch (${esc(down.join(", "))})`);
  if(dead) f.push(`the watch itself is dark — ${esc(dead.detail || "no tick recorded")}`);
  return f;
}
function daysLeftInMonth(){
  const n = new Date(), end = new Date(n.getFullYear(), n.getMonth()+1, 0);
  return Math.max(0, end.getDate() - n.getDate());
}
function deriveTemp(){
  HOT = tempFacts().length > 0;
  document.body.classList.toggle("hot", HOT);
  const pill = $("pill");
  if(State.err){ pill.textContent = "SPINE UNREACHABLE"; pill.classList.remove("on"); return; }
  pill.textContent = HOT ? "HOT · THE NUMBERS TURNED IT" : "COLD · NOTHING IS ASKING";
  pill.classList.toggle("on", HOT);
}
function whyBar(){
  const f = tempFacts();
  /* card #335: the room says its own age when the read missed what it draws
     from — its payloads, plus the watch whose down-count turns every room */
  const o = ACTIVE !== null ? D[ACTIVE] : null;
  const age = readAge(["watch"].concat((o && ROOM_READ[o.room]) || []));
  const ageS = age ? `<span class="readage">${esc(age)}</span>` : "";
  if(!f.length) return `<div class="why"><span class="tag">WHY THIS ROOM</span>
    <span>Nothing served is asking for your hand right now — so the room stays quiet.</span>${ageS}</div>`;
  return `<div class="why"><span class="tag">WHY THIS ROOM IS RED</span>
    <span>${f.length} served fact${f.length===1?"":"s"} turned it: ${f.join(", ")}.
    It goes cold when they do.</span>${ageS}</div>`;
}

/* HOW MANY THINGS CAN ACTUALLY BE SETTLED — one home, because three sites
   each deriving it is how the same page ended up saying 16 and 2 for one
   idea (audit 2026-08-11). counts.standing is the length of a MIXED list:
   bills, down services, and board rulings injected as kind='rule'. The
   rulings and services carry settleable:false; a real bill carries no flag
   at all, so the test is "not false" and never "=== true". A ruling cannot
   be paid by dragging a bank row — it has no bank row. Returns null when
   the spine has not answered, so callers can render "—" instead of a zero
   that looks like good news. */
function settleableCount(s){
  /* card #97: the producer serves the split now (counts.settleable) — one
     number, one home. The local filter remains ONLY as the fallback for a
     spine still serving the old shape, and dies with it. */
  if(s && s.counts && s.counts.settleable != null) return s.counts.settleable;
  return s && s.standings
    ? s.standings.filter(x => x.settleable !== false).length
    : null;
}

/* ── the field's signals — every one of them served ───────────────── */
function paintField(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const b = State.board, s = State.standings, r = State.radio, l = State.learn, d = State.soul;
  const qa = b ? b.cards.filter(c => c.column_name === "qa").length : null;
  const open = b ? b.cards.filter(c => c.column_name !== "done").length : null;
  const needs = settleableCount(s);
  const sig = [
    p.to_go == null ? ["——","",`<span style="color:var(--unknown)">${esc(unreadWhy(p) || "not enough is known")}</span>`]
      : p.to_go > 0 ? [short(p.to_go),"TO GO",`<b class="h">${money(p.to_go)}</b> TO GO`]
                    : [short(-p.to_go),"CLEAR",`<b>${money(-p.to_go)}</b> CLEAR`],
    [qa==null?"—":String(qa),"IN QA", qa==null?"spine unavailable":`<b>${qa}</b> IN QA · ${open} OPEN`],
    [r==null?"—":String(r.unread),"UNREAD", r==null?"spine unavailable":`<b>${r.unread}</b> UNREAD · CH 19`],
    [needs==null?"—":String(needs),"STANDING", needs==null?"spine unavailable":`<b>${needs}</b> STANDING TO SETTLE`],
    (()=>{ /* the orb carries the band's weather — the story starts in orbit */
      if(l==null || !l.wire) return ["—","BAND","spine unavailable"];
      const fr = l.wire.fresh || [];
      const landed = fr.filter(s => (s.age_days||0) < 1).length;
      return [String(fr.length), "FRESH",
        landed ? `<b>${landed}</b> LANDED OVERNIGHT`
        : fr.length ? `BAND HOLDS <b>${fr.length}</b>` : "BAND QUIET"];
    })(),
    [d==null?"—":String(d.confirmed),d==null?"":"OF "+d.total, d==null?"spine unavailable":`<b>${d.confirmed}</b>/${d.total} CONFIRMED`],
    (()=>{ /* the practice rides the orb — the day, worked or waiting */
      const t = State.planner && State.planner.today;
      if(!t) return ["—","MORNING","spine unavailable"];
      const all7 = (t.morning + t.daily) === 7;
      return [`${t.morning}/3`, "MORNING",
        all7 ? `⭐ ALL SEVEN WORKED${t.workout ? " · WORKOUT" : ""}`
             : `PRACTICE <b>${t.morning}</b>/3 · ${t.daily}/4${t.workout ? " · WORKOUT" : ""}`];
    })(),
  ];
  /* the RADIO orb is the parent star now — its signal is the ROLLUP of the
     whole system: the channel's unread + the side channel's unheard */
  (() => { const sc = State.sidech, r = State.radio;
    const un = sc ? (sc.runs||[]).reduce((n,t)=>n+(t.unheard||0),0) : null;
    /* EITHER producer missing means the rollup is unknowable, not smaller
       (audit 2026-08-11): with && , one dead fetch rendered r.unread + 0 as a
       confident whole and OVERWROTE the honest "— · spine unavailable" the
       line above already computed. Every sibling orb renders "—" when its
       producer is null; the parent star was the only one that faked it. */
    if(r == null || sc == null) return;
    const tot = (r ? r.unread : 0) + (un ?? 0);
    sig[2] = [String(tot), "TO HEAR",
      `<b>${r ? r.unread : "—"}</b> CH 19 · <b>${un ?? "—"}</b> CH 21 · THE RADIO SYSTEM`];
  })();
  D.forEach((o,i) => {
    o.el.querySelector(".fig .n").textContent = sig[i][0];
    o.el.querySelector(".fig .u").textContent = sig[i][1];
    /* card #335: an orb the read did not refresh says how old its count is */
    const age = ROOM_READ[o.room] ? readAge(ROOM_READ[o.room], true) : "";
    o.el.querySelector(".sig").innerHTML = sig[i][2]
      + (age ? ` · <span class="readage">${esc(age.toUpperCase())}</span>` : "");
  });
  if(SYS) paintSys();   // the constellation's counts ride every refresh
  /* THE DOCKET wears the masthead (card #84): the count is the docket's
     FRONT — what blocks the flow — never again one room's slice wearing the
     aggregate's name. Tap opens the drawer. Null and unknowns-present must
     never render the same blank as a clean docket (review of #84): a blank
     that means "unreadable" is the exact calm lie the docket exists to end. */
  const hd = State.hand;
  const unk = hd ? (hd.unknowns || []).length : 0;
  $("hand").textContent = hd == null ? "DOCKET —"
    : hd.count_front > 0 ? hd.count_front + " NEED YOUR HAND"
    : hd.count_total > 0 ? "DOCKET · " + hd.count_total + (unk ? " ?" : "")
    : unk ? "DOCKET · ?" : "";
  $("hand").classList.toggle("unk", hd == null || unk > 0);
  /* THE BREATH (card #114): glow only when items exist that his eye has not
     seen — docket rows carry no server id (recon 2026-08-15), so the key is
     derived. Opening the drawer stamps them seen and stills the glow. */
  try{
    const seen = JSON.parse(localStorage.getItem("almanac_hand_seen") || "[]");
    $("hand").classList.toggle("fresh",
      handKeys().some(k => !seen.includes(k)));
  }catch(e){ /* a corrupt stamp never breaks the masthead */ }
  $("hand").title = hd == null ? "the spine has not answered with the docket — tap to see"
    : `${hd.count_front} on the front · ${hd.count_total} in all`
      + (unk ? ` · ${unk} producer${unk === 1 ? "" : "s"} unreadable` : "")
      + (readAge(["hand"]) ? " · " + readAge(["hand"]) : "")
      + " — tap to open the docket";
  /* Consider FIRST, then settle. The signal lines just changed WIDTH
     ("$199.53 TO GO" is wider than the "…" they were seeded with, and wider
     again than "——") and the consider card just changed HEIGHT — a two-line
     question is taller than a one-line one. Settling before either is drawn
     measures the wrong field, which is exactly how the overlap Bryan caught
     got in: it read clean on first paint and collided once real numbers and a
     real question arrived. */
  paintConsider();
  paintDay();
  if(!stage.classList.contains("entered")) separate();
}

/* THE DAY (card #171, his ruling 2026-09-02): the field is the header; this
   SECTION below it drives the day — every stop as a full card with its ETA,
   the load's instructions, contacts and papers, the conflict said out loud.
   Hidden when today is quiet AND fresh; when the log is stale enough that
   today may be unknowable, it says that instead of vanishing. */
function paintDay(){
  const room = $("dayroom"), cue = $("daycue");
  if(!room) return;
  /* a background repaint must not yank the book out from under his thumb */
  const ae = document.activeElement;
  if(ae && ae.id === "fieldLoadSel") return;
  const d = State.day, L = State.loads;
  const act = (L && L.ok && L.active) || [];
  const todayIso = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const dayOk = !!(d && d.ok && d.day === todayIso);   // a prior open's plan never wears today's header
  const stale = d && d.sync_stale_hours != null && d.sync_stale_hours > 24;
  const hasDay = dayOk && !d.quiet && !d.in_flight;
  const haul = (dayOk && d.haul) || [];
  const errs = [];
  if(State.dayErr) errs.push("the day plan did not answer — " + State.dayErr);
  if(State.loadsErr) errs.push("the loads home did not answer — " + State.loadsErr);
  if(d && d.ok === false && d.unavailable) errs.push(d.unavailable);
  if(d && d.day && d.day !== todayIso && !State.dayErr) errs.push("the plan on hand is for " + d.day + " — replan for today");
  const syncErr = (L && L.sync_error) || (d && d.sync_error);
  if(syncErr) errs.push("the log pull failed — " + syncErr);
  const show = act.length > 0 || hasDay || haul.length > 0 || errs.length > 0 || !!(dayOk && d.quiet && stale);
  room.hidden = cue.hidden = !show;
  if(!show){ room.innerHTML = ""; return; }
  const dayWord = new Date(todayIso + "T12:00").toLocaleDateString("en-US",
    {weekday:"long", month:"short", day:"numeric"}).toUpperCase();
  let h = "";
  h += errs.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("");

  /* 1 · THE DAY — when a stop is dated today: the ordered plan */
  if(hasDay){
    const stops = d.stops || [], n = stops.length + (d.unplaced || []).length;
    const loads = d.loads || {};
    h += `<div class="cap2">THE DAY · ${esc(dayWord)} · ${n} STOP${n === 1 ? "" : "S"}</div>`;
    h += `<div class="basis">${esc(d.basis || "")}${
      d.leave_by ? ` · leave by <b>${esc(d.leave_by)}</b>` : ""}</div>`;
    if(d.conflict) h += `<div class="warn">⚠ ${esc(d.conflict)}</div>`;
    if(d.unordered && d.why) h += `<div class="warn">⚠ stops are listed, not ordered — ${esc(d.why)}</div>`;
    stops.forEach((s, i) => {
      const ld = loads[String(s.load_id)] || {};
      /* ONE detail card per stop on this page, and it belongs to THE LOAD.
         THE DAY used to print haulStopHTML here — the SAME component THE LOAD
         renders below — so the load on the hook showed its Merit Brass block
         twice, a few hundred pixels apart (his eye, 2026-09-08: "this seems
         redundant to what is below. i think we can cut"). THE LOAD's own
         select reaches every load on the book, so nothing became unreachable.
         What the card carried that this line did NOT — the place and the
         appointment window — moves UP into the line, the same shape THE ROAD
         AHEAD already uses. Cutting the card without that would have traded a
         duplicate for a today's-plan that never says where or when. */
      const place = [s.city, s.state].filter(Boolean).join(", ");
      const when = [s.date_raw || s.date, s.time_window].filter(Boolean).join(" · ");
      h += `<div class="stopline"><span class="seq">${i + 1}.</span>
        <span>${s.kind === "pickup" ? "PICKUP" : "DROP"} · #${esc(ld.load_number) || "——"}${
          place ? ` · ${esc(place)}` : s.company ? ` · ${esc(s.company)}` : ""}${
          when ? ` · ${esc(when)}` : ""}${
          /* a window the sheet shows but the spine could not read says so
             beside the raw cell (card #333) — the same sentence THE ROAD
             AHEAD prints, served, never a second copy */
          s.window_assumed ? ` · <i class="readage">${esc(s.window_assumed)}</i>` : ""}${
          esc(ld.broker) ? ` · ${esc(ld.broker)}` : ""}</span>
        <span>${s.eta ? `eta ${esc(s.eta)}` : ""}${s.leg_mi != null ? ` · ${s.leg_mi} mi` : ""}</span></div>`;
    });
    (d.unplaced || []).forEach(s => {
      h += `<div class="warn">unplaced: ${esc(s.kind)} ${
        esc(s.company || s.city || "unnamed stop")} — ${esc(pinWhy(s))}</div>`;
    });
  }

  /* 2 · ON THE HOOK — every load in flight, beside whatever is dated today */
  if(haul.length){
    h += `<div class="cap2"${h ? ' style="margin-top:18px"' : ""}>ON THE HOOK · ${esc(dayWord)}</div>`;
    if(!hasDay) h += `<div class="basis">${esc(d.basis || "")}</div>`;
    haul.forEach(hl => {
      const days = hl.days_to_delivery;
      const when = hl.delivery_date_raw || hl.delivery_date || "delivery date unknown";
      const cnt = days == null ? "" : ` · ${days} DAY${days === 1 ? "" : "S"} OUT`;
      const road = hl.road_mi != null ? ` · ~${hl.road_mi} mi / ${hl.road_h} h of road left`
                 : hl.road_why ? ` · road: ${hl.road_why}` : "";
      h += `<div class="stopline"><span class="seq">→</span>
        <span>#${esc(hl.load_number) || "——"} DELIVERS ${esc(when)}${esc(cnt)}${hl.delivery_time ? ` · ${esc(hl.delivery_time)}` : ""}${esc(road)}</span></div>`;
    });
  }
  if(dayOk && d.quiet && stale)
    h += (d.words || []).map(w => `<div class="warn">${esc(w)}</div>`).join("");

  /* 3 · THE LOAD — the current load's whole picture, with the book to flip */
  let sel = null;
  if(act.length){
    sel = act.find(l => l.id === State.fieldLoad) || act[0];
    State.fieldLoad = sel.id;
    h += `<div class="cap2"${h ? ' style="margin-top:18px"' : ""}>THE LOAD · ${act.length} ON THE BOOK</div>`;
    h += `<select class="fieldSel" id="fieldLoadSel" aria-label="Which load to show">${
      act.map(l => `<option value="${l.id}"${l.id === sel.id ? " selected" : ""}>${esc(fieldLoadLabel(l))}</option>`).join("")}</select>`;
    h += `<div id="fieldCard">${haulCard(sel, {road:true})}</div>`;
    h += `<div id="roadroom"></div>`;
  }

  /* 4 · the fine print + the re-plan */
  const subs = [];
  if(dayOk && d.eta_basis) subs.push(d.eta_basis);
  if(dayOk && (hasDay || haul.length) && d.hos_note) subs.push(d.hos_note);
  if(GEO.why && !GEO.fix) subs.push("no device fix — " + GEO.why);
  if(L && L.sync_stale_hours != null) subs.push(L.sync_stale_hours < 0.1 ? "log read just now" : `log read ${L.sync_stale_hours}h ago`);
  h += subs.map(s => `<div class="sub">${esc(s)}</div>`).join("");
  h += `<div class="acts"><button class="btn go" id="dreplan">REPLAN FROM HERE</button></div>`;
  /* an ordinary repaint keeps the road room's node when the road has not
     changed — the map, its tiles and his zoom survive the lamp, a docket act,
     a practice tick */
  const keepRoad = (ROADMAP && State.road && ROADMAP._roadFor === State.road) ? $("roadroom") : null;
  room.innerHTML = h;
  const nr = $("roadroom");
  if(keepRoad && nr){ nr.replaceWith(keepRoad); try{ ROADMAP.invalidateSize(); }catch(_){} }
  else paintRoad();
  wireRoadMode(room);
  const nStops = hasDay ? (d.stops || []).length + (d.unplaced || []).length : 0;
  cue.textContent = hasDay ? `▾ THE DAY — ${nStops} stop${nStops === 1 ? "" : "s"}`
    : sel ? `▾ THE LOAD — #${esc(sel.load_number) || "——"}` : errs.length ? "▾ THE DAY — did not answer" : "▾ THE DAY";
  wireBolBtns(room);
  const fs = $("fieldLoadSel");
  if(fs) fs.addEventListener("change", e => {
    e.stopPropagation();
    State.fieldLoad = Number(fs.value);
    const l = act.find(x => x.id === State.fieldLoad);
    const card = $("fieldCard");
    if(l && card){ card.innerHTML = haulCard(l, {road:true}); wireBolBtns(card); wireRoadMode(card); cue.textContent = `▾ THE LOAD — #${esc(l.load_number) || "——"}`; }
  });
  const rp = $("dreplan");
  if(rp) rp.addEventListener("click", e => {
    e.stopPropagation();      // law on the field's controls (ruled 08-03)
    loadDay(true).catch(() => {});
  });
}

/* THE ROAD AHEAD (card #179, his ask 09-04): the whole book from where he
   sits — LoadCalc's instrument, grown into the desk. FULL = one load at a
   time; PARTIAL = the cheapest legal order across the book (running
   partials). Legs solid when loaded, dashed when empty; ETAs HOS-shaped
   with waits and conflicts said; weather at each stop's hour. */
let ROADMAP = null;
function roadHTML(){
  const r = State.road;
  let h = "";
  const modeWord = State.roadMode === "partial" ? "PARTIAL" : "FULL";
  if(State.roadErr){
    return `<div class="cap2" style="margin-top:18px">THE ROAD AHEAD · ${modeWord}</div>
      <div class="warn">⚠ the road did not answer — ${esc(State.roadErr)}</div>`;
  }
  if(!r) return `<div class="cap2" style="margin-top:18px">THE ROAD AHEAD · ${modeWord}</div><div class="sub">drawing the road…</div>`;
  if(r.quiet) return `<div class="cap2" style="margin-top:18px">THE ROAD AHEAD</div><div class="basis">${esc((r.words || [])[0] || "")}</div>`;
  if(r.ok === false) return `<div class="cap2" style="margin-top:18px">THE ROAD AHEAD · ${modeWord}</div><div class="warn">⚠ ${esc(r.unavailable || "the road could not be drawn")}</div>`;
  const stops = r.stops || [], T = r.totals || {};
  h += `<div class="cap2" style="margin-top:18px">THE ROAD AHEAD · ${esc((r.mode || modeWord).toUpperCase())} · ${stops.length} STOP${stops.length === 1 ? "" : "S"}</div>`;
  h += `<div class="basis">${esc(r.basis || "")}${T.mi != null ? ` · ~${T.mi} mi / ${T.h} h${T.deadhead_mi ? ` (${T.deadhead_mi} mi empty)` : " (no empty miles)"}${T.days != null ? ` · done ${esc(T.done ? new Date(T.done).toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"}) : "")}` : ""}` : ""}</div>`;
  if(State.roadPending) h += `<div class="sub">redrawing from the new fix…</div>`;
  if(r.note) h += `<div class="sub">${esc(r.note)}</div>`;
  (r.caveats || []).forEach(c => { h += `<div class="sub">${esc(c)}</div>`; });
  if(r.unordered && r.why) h += `<div class="warn">⚠ stops are listed, not ordered — ${esc(r.why)}</div>`;
  (r.conflicts || []).forEach(c => { h += `<div class="warn">⚠ ${esc(c)}</div>`; });
  const mappable = (r.legs || []).length && typeof L !== "undefined";
  h += mappable ? `<div class="roadmap" id="roadMap"></div>`
    : `<div class="sub">no map — ${esc(r.unordered ? (r.why || "the router did not answer") : (typeof L === "undefined" ? "the map library did not load" : "no legs to draw"))}</div>`;
  if(mappable && L.Browser && L.Browser.mobile) h += `<div class="sub" style="margin-top:4px">pinch to zoom · two fingers to move the map</div>`;
  /* what he drives INTO, in his own words — the docks already have their own
     weather above; this is the road between them (card #198 pass two) */
  const rw = r.road_wx || {};
  if((rw.intercepts || []).length){
    const worst = rw.intercepts.some(x => x.sev === "danger");
    h += `<div class="wxbox"${worst ? ' style="border-left-color:#ff4444"' : ""}>
      <div class="t">${worst ? "🚨 YOU DRIVE INTO THIS" : "⚠️ ON THE ROAD BETWEEN STOPS"}</div>`;
    rw.intercepts.forEach(x => {
      h += `<div>${x.sev === "danger" ? "🚨" : "⚠️"} ${esc(x.words)}</div>`;
    });
    if(rw.why) h += `<div class="sub" style="margin-top:6px">${esc(rw.why)}</div>`;
    h += `</div>`;
  } else if(rw.why){
    h += `<div class="sub" style="margin-top:8px">the road between stops was not read — ${esc(rw.why)}</div>`;
  } else if((rw.samples || []).length){
    h += `<div class="sub" style="margin-top:8px">the road between stops is clear at every hour you are on it — ${rw.samples.length} point(s) checked</div>`;
  }
  stops.forEach((s, i) => {
    const place = [s.city, s.state].filter(Boolean).join(", ");
    const when = [s.date_raw || s.date, s.time_window].filter(Boolean).join(" · ");
    const leg = s.leg_mi != null ? `${s.loaded_leg ? "loaded" : "empty"} ${s.leg_mi} mi / ${s.leg_h} h` : "";
    const lg = (r.legs || [])[i];
    /* s.why is the blind leg's word (#182): no clock here, and why — it must
       show, or an ETA-less stop reads like a stop with nothing to say */
    const extra = [s.wait_h ? `waits ${s.wait_h}h for the appointment` : "", s.rest_h ? `${s.rest_h}h off on the way` : "",
                   s.why || "", s.window_assumed || "", s.note || "", lg && lg.geometry_why ? `line not drawn — ${lg.geometry_why}` : ""].filter(Boolean).join(" · ");
    h += `<div class="stopline"><span class="seq">${i + 1}.</span>
      <span>${s.kind === "pickup" ? "PICKUP" : "DROP"} · #${esc(s.load_number) || "——"} · ${esc(place) || esc(s.company) || "——"}${when ? ` · ${esc(when)}` : ""}</span>
      <span>${s.eta ? `eta ${esc(s.eta)}` : ""}${leg ? ` · ${esc(leg)}` : ""}${
        s.today ? ` <button type="button" class="btn doneBtn" data-done="${s.id}" title="made this stop — retire it from the road">✓ DONE</button>` : ""}</span></div>`;
    if(extra) h += `<div class="sub" style="margin-top:2px">${esc(extra)}</div>`;
  });
  (r.unplaced || []).forEach(s => {
    h += `<div class="warn">unplaced: ${esc(s.kind)} #${esc(s.load_number) || "——"} ${esc(s.city || s.company || "")} — ${esc(pinWhy(s))}</div>`;
  });
  const W = r.weather || {};
  if((W.lines || []).length || (W.why || []).length){
    h += `<div class="wxbox${W.danger ? " danger" : ""}"><div class="t">${esc(W.title || "Weather advisory")}</div>${
      (W.lines || []).map(l => `<div>${esc(l)}</div>`).join("")}${
      (W.why || []).map(w => `<div class="sub" style="margin-top:4px">weather unknown — ${esc(w)}</div>`).join("")}</div>`;
  } else if(W.title){
    h += `<div class="sub">${esc(W.title)}</div>`;
  }
  if(r.eta_basis) h += `<div class="sub">${esc(r.eta_basis)}</div>`;
  if(r.hos_note) h += `<div class="sub">${esc(r.hos_note)}</div>`;
  return h;
}

/* the road paints in its own room, so the select's focus guard, a docket
   act or the lamp never has to touch the map — and the map survives when
   the road itself has not changed */
let ROAD_DIRTY = false;
function paintRoad(){
  const rr = $("roadroom");
  if(!rr) return;
  rr.innerHTML = roadHTML();
  drawRoadMap();
  rr.querySelectorAll(".doneBtn").forEach(b =>
    b.addEventListener("click", e => {
      e.stopPropagation();
      markDone(Number(b.dataset.done));
    }));
}

/* DONE taps: the Log has no picked-up/delivered mark, so his hand is the
   fact — kept on THIS device only (localStorage, pruned past their day),
   sent with each route request, never held by the spine */
function doneStops(){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem("almanac_done_stops") || "{}") || {}; }catch(_){ d = {}; }
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let changed = false;
  Object.keys(d).forEach(k => { if(d[k] < today){ delete d[k]; changed = true; } });
  if(changed){ try{ localStorage.setItem("almanac_done_stops", JSON.stringify(d)); }catch(_){} }
  return d;
}
function markDone(stopId){
  const d = doneStops();
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  d[String(stopId)] = today;
  try{ localStorage.setItem("almanac_done_stops", JSON.stringify(d)); }catch(_){}
  toast("stop retired from the road — redrawing");
  loadRoad(GEO.fix).catch(() => {});
}

/* ═══ THE RADAR (card #198, his ask 2026-09-05) ══════════════════════════
   "a custom radar that shows the route that i am on … overlay the radar over
   the route." So the z-order IS the answer: base map 200, reflectivity 250,
   the road he is driving 400. The storm never buries the line.

   Frames are IEM's own five-minute steps back from the latest scan. The clock
   on the label is FETCHED from IEM and never computed here — when that fetch
   is quiet the label says the lag it actually knows and admits it has no scan
   time, because a confident wrong timestamp on weather is worse than none.

   The loop is opt-in twice over: the lamp is off until he lights it (one
   frame), and history is only fetched when he asks for the loop (eleven).  */
const RADAR_TILES = "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913{lag}/{z}/{x}/{y}.png";
const RADAR_SCANS = "https://mesonet.agron.iastate.edu/json/radar?operation=list&product=n0q&radar=USCOMP";
const RADAR_LAGS  = [50, 45, 40, 35, 30, 25, 20, 15, 10, 5, 0];   // minutes behind the latest scan
const RADAR_OP    = .62;
let RADAR_SCAN = null;      // { ts: Date, at: ms } — IEM's word, or null for "unread"

/* IEM's own scan clock. Cached two minutes: long enough that stepping the
   loop is free, short enough that a desk left open all evening is not still
   quoting the scan it read at supper. */
async function radarScanTime(){
  if(RADAR_SCAN && Date.now() - RADAR_SCAN.at < 120000) return RADAR_SCAN;
  try{
    const r = await fetch(RADAR_SCANS, { cache: "no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    let best = null;
    (j.scans || []).forEach(s => {
      const raw = String(s && s.ts || "");
      const d = raw ? new Date(/[Zz]$/.test(raw) ? raw : raw + "Z") : null;
      if(d && !isNaN(d) && (!best || d > best)) best = d;
    });
    if(best){ RADAR_SCAN = { ts: best, at: Date.now() }; return RADAR_SCAN; }
  }catch(_){}
  RADAR_SCAN = null;
  return null;
}

function radarLabel(lag){
  const lagTxt = lag ? `− ${lag} min` : "latest scan";
  if(!RADAR_SCAN) return `${lagTxt} · scan time unread`;
  const d = new Date(RADAR_SCAN.ts.getTime() - lag * 60000);
  return `${d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })} · ${lagTxt}`;
}


/* ═══ THE NOWCAST (card #216) ═══════════════════════════════════════════
   Radar sees only what IS. Everything past the newest scan is inference, and
   the Weather Channel's "future radar" is a MODEL wearing radar's clothes.
   So this does the one forward thing radar itself can honestly support:
   advection. Find how the echo actually MOVED between two real scans, and
   carry the newest scan along that vector.

   The motion comes from the radar imagery, not from a wind model — IEM sends
   Access-Control-Allow-Origin: * on the tiles (verified 2026-09-06), so the
   pixels are readable and the answer is derived from the storm rather than
   assumed about it.

   Two rules this must never break:
     1. An extrapolated frame is LABELLED extrapolated and drawn differently.
        A forecast that looks like an observation is the lie pass one refuses.
     2. It stops at 60 minutes. Advection decays as cells grow and die, and
        past about an hour it is fiction. When the correlation is weak it
        draws NOTHING and says why — a confident wrong storm is worse than
        no storm.                                                            */
const RADAR_FX_MINS = [10, 20, 30, 40, 50, 60];   // never further; see rule 2
/* Baselines to try, longest first. A 50-min gap resolves slow drift well but
   convective cells GROW AND DIE across it and stop correlating — measured
   2026-09-07 over north Texas: 0.32, below threshold, correctly refused. A
   shorter gap keeps the same cells recognisable at the cost of resolution, so
   try several and keep the one the echo actually supports. */
const RADAR_FX_BASES = [50, 30, 20];
const RADAR_FX_MINSCORE = 0.35;  // below this the echo did not correlate
const RADAR_FX_MINECHO = 1.5;    // mean alpha; below this there is no weather
let RADAR_MOTION = null;         // {vx, vy, z, score, at} px/min at zoom z

function _radarURL(lag, z, x, y){
  return RADAR_TILES
    .replace("{lag}", lag ? `-m${String(lag).padStart(2, "0")}m` : "")
    .replace("{z}", z).replace("{x}", x).replace("{y}", y);
}

function _img(url){
  return new Promise(done => {
    const im = new Image();
    im.crossOrigin = "anonymous";          // the pixels are the whole point
    im.onload = () => done(im);
    im.onerror = () => done(null);
    im.src = url;
  });
}

/* a 3x3 tile block around the view's centre tile, as one canvas */
async function _radarPatch(lag, z, cx, cy){
  const N = 3, S = 256;
  const cv = document.createElement("canvas");
  cv.width = cv.height = N * S;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  await Promise.all([].concat(...Array.from({length: N}, (_, i) =>
    Array.from({length: N}, (_, j) =>
      _img(_radarURL(lag, z, cx - 1 + i, cy - 1 + j))
        .then(im => { if(im) ctx.drawImage(im, i * S, j * S); })))));
  return ctx.getImageData(0, 0, N * S, N * S);
}

/* alpha only: n0q tiles are transparent where there is no echo, so alpha IS
   the weather mask and it ignores the colour ramp entirely.

   THRESHOLDED, and that is the whole difference between a working nowcast and
   a broken one. Measured 2026-09-07: correlating raw alpha put the peak at a
   0-2 grid-unit shift everywhere — 0 to 10 mph, when real cells run 20-40.
   A 730 km patch is ~98% empty, and what echo there is skews to faint
   stratiform and ground clutter that genuinely does not move. Both outvote
   the convective cells we actually care about. Keeping only STRONG echo makes
   the correlation track the storms instead of the background. */
const RADAR_ECHO_FLOOR = 90;      // of 255 alpha — faint returns are not cells

function _grid(img, size){
  const W = img.width, d = img.data, step = W / size, g = new Float32Array(size * size);
  for(let y = 0; y < size; y++){
    for(let x = 0; x < size; x++){
      let sum = 0;
      const y0 = y * step, x0 = x * step;
      for(let yy = y0; yy < y0 + step; yy++)
        for(let xx = x0; xx < x0 + step; xx++){
          const a = d[((yy * W) + xx) * 4 + 3];
          if(a >= RADAR_ECHO_FLOOR) sum += a;
        }
      g[y * size + x] = sum / (step * step);
    }
  }
  return g;
}

/* normalised cross-correlation over integer shifts — the shift that best
   carries `a` onto `b` is how far the weather travelled between them */
function _bestShift(a, b, size, range, cx, cy){
  let best = null;
  for(let dy = cy - range; dy <= cy + range; dy++){
    for(let dx = cx - range; dx <= cx + range; dx++){
      /* ZERO-MEAN. Plain cross-correlation rewards any two bright-ish
         windows for both being bright, so a featureless background scores
         high at every shift and the true peak drowns. Subtracting each
         window's own mean scores the PATTERN, not the brightness. */
      let sa = 0, sb = 0, n = 0;
      for(let y = 0; y < size; y++){
        const by = y + dy;
        if(by < 0 || by >= size) continue;
        for(let x = 0; x < size; x++){
          const bx = x + dx;
          if(bx < 0 || bx >= size) continue;
          sa += a[y * size + x]; sb += b[by * size + bx]; n++;
        }
      }
      if(!n) continue;
      const ma = sa / n, mb = sb / n;
      let num = 0, na = 0, nb = 0;
      for(let y = 0; y < size; y++){
        const by = y + dy;
        if(by < 0 || by >= size) continue;
        for(let x = 0; x < size; x++){
          const bx = x + dx;
          if(bx < 0 || bx >= size) continue;
          const va = a[y * size + x] - ma, vb = b[by * size + bx] - mb;
          num += va * vb; na += va * va; nb += vb * vb;
        }
      }
      const score = (na > 0 && nb > 0) ? num / Math.sqrt(na * nb) : 0;
      if(!best || score > best.score) best = { dx, dy, score };
    }
  }
  return best;
}

async function radarMotion(m){
  if(RADAR_MOTION && Date.now() - RADAR_MOTION.at < 300000) return RADAR_MOTION;
  /* ALWAYS z7, never the map's zoom. Storm motion is a REGIONAL quantity: a
     3x3 patch at z7 is ~730 km across, which is the weather he is driving
     through. Sampled at the map's own zoom-5 view the patch spans the whole
     continent, so cells moving in opposite directions cancel and one pixel of
     quantisation is ~2.8 mph — the first run measured 9 mph due east for the
     entire USA, which correlated at 0.69 and meant nothing. */
  const z = 7;
  const pt = m.project(m.getCenter(), z).divideBy(256).floor();
  let old_, now_;
  try{
    [old_, now_] = await Promise.all([_radarPatch(RADAR_FX_BASES[0], z, pt.x, pt.y),
                                      _radarPatch(0, z, pt.x, pt.y)]);
  }catch(e){
    RADAR_MOTION = { at: Date.now(), why: "the radar tiles would not open for reading" };
    return RADAR_MOTION;
  }
  const gNow = _grid(now_, 64);
  const echo = gNow.reduce((s, v) => s + v, 0) / gNow.length;
  if(echo < RADAR_FX_MINECHO){
    RADAR_MOTION = { at: Date.now(), why: "almost no echo on screen — nothing to carry forward" };
    return RADAR_MOTION;
  }
  const fNow = _grid(now_, 256);
  /* Every baseline is an INDEPENDENT measurement of the same wind. Measured
     2026-09-07: where cells were genuinely organised (Florida) all three
     agreed — 9 mph toward ~125 deg at 0.67-0.81 — and where they were not
     (N Texas, Ohio Valley) they disagreed with each other AND scored low.
     So agreement between baselines is the real confidence signal, better than
     any single score, and disagreement is the case that must refuse. */
  const runs = [];
  for(const base of RADAR_FX_BASES){
    const old2 = (base === RADAR_FX_BASES[0]) ? old_ : await _radarPatch(base, z, pt.x, pt.y);
    const coarse = _bestShift(_grid(old2, 64), gNow, 64, 8, 0, 0);      // 12 tile-px steps
    const fine = _bestShift(_grid(old2, 256), fNow, 256, 5, coarse.dx * 4, coarse.dy * 4);
    if(fine) runs.push({ vx: fine.dx / base, vy: fine.dy / base, score: fine.score, base });
  }
  const best = runs.length ? runs.reduce((a, b) => b.score > a.score ? b : a) : null;
  if(!best || best.score < RADAR_FX_MINSCORE){
    RADAR_MOTION = { at: Date.now(),
      why: `the echo did not correlate between scans (best ${(best ? best.score : 0).toFixed(2)} over ${RADAR_FX_BASES.join("/")} min) — cells are growing or dying, not drifting` };
    return RADAR_MOTION;
  }
  const speed = Math.hypot(best.vx, best.vy);
  /* Zero trivially agrees with zero, so a FAILED measurement would sail past
     the agreement check and draw a "+60 min" frame identical to the present —
     a forecast that is really just the newest scan wearing a future label.
     Measured 2026-09-07 over N Texas: exactly 0,0 at score 0.51. Below about
     3 mph we cannot tell drift from a flat correlation surface, so we say so. */
  if(speed * 3 * 1000 / 1609.34 * 60 < 3){       // ~3 mph at this zoom's scale
    RADAR_MOTION = { at: Date.now(),
      why: "no measurable drift — the echo is holding still, or the match is too flat to tell" };
    return RADAR_MOTION;
  }
  const agree = runs.filter(r => {
    if(r.base === best.base) return false;
    const sp = Math.hypot(r.vx, r.vy);
    if(sp === 0 || speed === 0) return sp === 0 && speed === 0;
    const cos = (r.vx * best.vx + r.vy * best.vy) / (sp * speed);
    return cos > 0.7 && sp > speed * 0.4 && sp < speed * 2.5;   // ~45 deg, same order
  }).length;
  if(!agree){
    RADAR_MOTION = { at: Date.now(),
      why: `the ${RADAR_FX_BASES.length} scan gaps disagree about which way the echo is moving — no drift this confident is worth drawing` };
    return RADAR_MOTION;
  }
  // 256-grid px -> tile px at z (x3), over ITS OWN baseline -> per minute
  RADAR_MOTION = { vx: best.vx * 3, vy: best.vy * 3,      // 256-grid -> tile px at z
                   z, score: best.score, base: best.base, agree, at: Date.now() };
  return RADAR_MOTION;
}

/* the forecast layer is the NEWEST observed scan, slid along that vector */
function radarFxShow(m, mins){
  const st = m._radar, mo = RADAR_MOTION;
  if(!st.fx || !mo || mo.vx === undefined) return;
  const scale = Math.pow(2, m.getZoom() - mo.z);
  const px = mo.vx * mins * scale, py = mo.vy * mins * scale;
  const pane = m.getPane("radarfx");
  pane.style.transform = `translate(${px}px, ${py}px)`;
  pane.style.opacity = mins ? String(RADAR_OP * 0.85) : "0";
  Object.values(st.layers).forEach(tl => tl.setOpacity(0));
  st.fxMins = mins;
  radarPaint(m);
}

function radarFxOff(m){
  const st = m._radar;
  if(st.fx && m.hasLayer(st.fx)) m.removeLayer(st.fx);
  st.fx = null; st.fxMins = 0;
  const pane = m.getPane("radarfx");
  if(pane){ pane.style.transform = ""; pane.style.opacity = "0"; }
}

function radarFrame(m, lag){
  const st = m._radar;
  if(!st.layers[lag]){
    const tl = L.tileLayer(RADAR_TILES, {
      lag: lag ? `-m${String(lag).padStart(2, "0")}m` : "",
      pane: "radar", opacity: 0, maxZoom: 18, updateWhenIdle: true,
      attribution: 'NEXRAD &copy; <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">Iowa State Mesonet</a>'
    });
    /* a layer that cannot draw says so — a blank map that looks like clear
       skies is the one failure this must never ship */
    tl.on("tileerror", () => { st.err = true; radarPaint(m); });
    st.layers[lag] = tl;
  }
  const tl = st.layers[lag];
  if(!m.hasLayer(tl)) tl.addTo(m);
  return tl;
}

function radarPaint(m){
  const st = m._radar; if(!st || !st.ctl) return;
  const { lamp, play, lab } = st.ctl;
  lamp.classList.toggle("on", st.on);
  play.hidden = !st.on;
  lab.hidden  = !st.on;
  play.classList.toggle("on", st.playing);
  play.textContent = st.playing ? "❚❚ LOOP" : "▶ LOOP";
  if(!st.on) return;
  lab.classList.toggle("warn", !!st.err || !!st.fxMins);
  if(st.err){
    lab.textContent = "the radar did not answer — no reflectivity drawn";
  }else if(st.fxMins){
    /* RULE 1: an extrapolated frame says so, in the label AND in its own
       ink. Never let a forecast wear an observation's clothes. */
    const s2 = RADAR_MOTION && RADAR_MOTION.score;
    lab.textContent = `+${st.fxMins} min · EXTRAPOLATED, not observed`
      + (s2 ? ` · match ${s2.toFixed(2)}` : "");
  }else{
    lab.textContent = radarLabel(RADAR_LAGS[st.i])
      + (st.fxWhy ? " · no +1h" : "");
  }
  lab.classList.toggle("fx", !!st.fxMins);
  lab.title = st.fxWhy
    ? `no forecast frames: ${st.fxWhy}`
    : (st.fxMins ? "carried forward from the newest scan along the measured echo motion — not an observation"
                 : "NEXRAD base reflectivity, Iowa State Mesonet");
}

function radarShow(m, i){
  const st = m._radar; if(!st) return;
  st.i = i;
  if(st.fxMins){                       // leaving the future — put it away
    st.fxMins = 0;
    const pane = m.getPane("radarfx");
    if(pane){ pane.style.opacity = "0"; pane.style.transform = ""; }
  }
  RADAR_LAGS.forEach((lag, k) => {
    const tl = st.layers[lag];
    if(tl) tl.setOpacity(k === i ? RADAR_OP : 0);
  });
  radarPaint(m);
}

function radarStop(m){
  const st = m._radar; if(!st) return;
  clearInterval(st.timer); st.timer = null; st.playing = false;
  radarPaint(m);
}

/* PLAY is where the eleven frames get paid for, and only here. The newest
   frame holds ~3x longer: an hour of weather that ends and immediately
   restarts reads as noise, and the frame that matters is the one that is
   nearly now. */
function radarPlay(m){
  const st = m._radar; if(!st) return;
  RADAR_LAGS.forEach(lag => radarFrame(m, lag));
  radarShow(m, st.i);
  st.playing = true;
  let hold = 0, fxStep = -1;
  st.timer = setInterval(() => {
    const canFx = st.fx && RADAR_MOTION && RADAR_MOTION.vx !== undefined;
    if(fxStep >= 0){                                   // walking the forecast
      fxStep++;
      if(fxStep >= RADAR_FX_MINS.length){ fxStep = -1; radarShow(m, 0); return; }
      radarFxShow(m, RADAR_FX_MINS[fxStep]);
      return;
    }
    if(st.i === RADAR_LAGS.length - 1){                // sitting on the newest
      if(hold < 2){ hold++; return; }
      hold = 0;
      if(canFx){ fxStep = 0; radarFxShow(m, RADAR_FX_MINS[0]); return; }
      radarShow(m, 0);
      return;
    }
    radarShow(m, st.i + 1);
  }, 420);
  radarPaint(m);
}

async function radarOn(m){
  const st = m._radar;
  st.on = true; st.err = false;
  try{ localStorage.setItem("almanac_radar", "1"); }catch(_){}
  radarFrame(m, 0);
  radarShow(m, RADAR_LAGS.length - 1);
  await radarScanTime();
  radarPaint(m);
  /* measure how the echo actually moved, then stand up the forecast layer.
     A failure here costs the loop its forward half and NOTHING else — the
     observed frames are untouched, and the why is said out loud. */
  try{
    const mo = await radarMotion(m);
    if(mo && mo.vx !== undefined && !st.fx){
      st.fx = L.tileLayer(RADAR_TILES, { lag: "", pane: "radarfx", opacity: 1,
                                         maxZoom: 18, updateWhenIdle: true }).addTo(m);
      m.getPane("radarfx").style.opacity = "0";
    }
    st.fxWhy = (mo && mo.why) || null;
  }catch(e){ st.fxWhy = String(e && e.message || e); }
  radarPaint(m);
  /* the label ages; re-read the scan clock while the lamp is lit so a desk
     open for an hour is not still naming the scan it saw when it opened */
  clearInterval(st.clock);
  st.clock = setInterval(async () => {
    const was = RADAR_SCAN && RADAR_SCAN.ts.getTime();
    RADAR_SCAN = null;
    await radarScanTime();
    const now = RADAR_SCAN && RADAR_SCAN.ts.getTime();
    if(now && now !== was) Object.values(st.layers).forEach(tl => tl.redraw());
    radarPaint(m);
  }, 300000);
}

function radarOff(m){
  const st = m._radar;
  radarStop(m);
  radarFxOff(m);
  st.on = false;
  clearInterval(st.clock); st.clock = null;
  try{ localStorage.setItem("almanac_radar", "0"); }catch(_){}
  Object.values(st.layers).forEach(tl => { if(m.hasLayer(tl)) m.removeLayer(tl); });
  st.layers = {};
  radarPaint(m);
}

function radarMount(m){
  m.createPane("radar").style.zIndex = 250;   // above the base map, below the road
  const fxp = m.createPane("radarfx");        // the extrapolated frame rides here
  fxp.style.zIndex = 251;                     // still UNDER the road (400)
  fxp.style.opacity = "0";
  fxp.style.transition = "transform .28s linear";
  m._radar = { on: false, playing: false, err: false, i: RADAR_LAGS.length - 1,
               layers: {}, fx: null, fxMins: 0, timer: null, clock: null, ctl: null };
  const Ctl = L.Control.extend({
    options: { position: "topright" },
    onAdd(){
      const d = L.DomUtil.create("div", "radarctl");
      d.innerHTML = `<button type="button" class="rbtn lamp" title="NEXRAD reflectivity under the road">RADAR</button>
        <button type="button" class="rbtn play" hidden>▶ LOOP</button>
        <span class="rlab" hidden></span>`;
      L.DomEvent.disableClickPropagation(d);
      L.DomEvent.disableScrollPropagation(d);
      const st = m._radar;
      st.ctl = { lamp: d.querySelector(".lamp"), play: d.querySelector(".play"), lab: d.querySelector(".rlab") };
      st.ctl.lamp.addEventListener("click", () => { st.on ? radarOff(m) : radarOn(m); });
      st.ctl.play.addEventListener("click", () => { st.playing ? radarStop(m) : radarPlay(m); });
      return d;
    }
  });
  m.addControl(new Ctl());
  m.on("unload", () => { clearInterval(m._radar.timer); clearInterval(m._radar.clock); });
  let want = "0";
  try{ want = localStorage.getItem("almanac_radar") || "0"; }catch(_){}
  radarPaint(m);
  if(want === "1") radarOn(m).catch(() => {});
}

let ROAD_VIEW = null;
function drawRoadMap(){
  const el = $("roadMap"), r = State.road;
  if(ROADMAP && (!el || ROADMAP._roadFor !== r)){ try{ ROADMAP.remove(); }catch(_){} ROADMAP = null; }
  if(!el || !r || !r.ok || !(r.legs || []).length || typeof L === "undefined") return;
  if(stage.classList.contains("entered")){ ROAD_DIRTY = true; return; }   // a hidden map is a 0×0 map
  if(ROADMAP && ROADMAP._roadFor === r && ROADMAP.getContainer() === el){ ROADMAP.invalidateSize(); return; }
  if(ROADMAP){ try{ ROADMAP.remove(); }catch(_){} ROADMAP = null; ROAD_VIEW = null; }
  const paper = document.documentElement.classList.contains("paper");
  const m = ROADMAP = L.map(el, { zoomControl: true, attributionControl: true, scrollWheelZoom: false,
                                  dragging: !(L.Browser && L.Browser.mobile) });
  m._roadFor = r;
  m.on("moveend", () => { ROAD_VIEW = { c: m.getCenter(), z: m.getZoom() }; });
  m.on("zoomend", () => {          // the vector is px/min at ITS zoom, not this one
    const st = m._radar;
    if(st && st.fxMins) radarFxShow(m, st.fxMins);
  });
  /* OSM's own tiles — the book map's proven source; CARTO's free tiles now
     stamp "API KEY REQUIRED" (caught in the pane 09-04). Night gets its dark
     map from a CSS invert on the tile pane, not from a keyed provider. */
  el.classList.toggle("night", !paper);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors', maxZoom: 18 }).addTo(m);
  radarMount(m);   // card #198 — the pane goes down before the road, so the road lands on top
  const pin = color => L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7],
    html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>` });
  const bounds = L.latLngBounds([]);
  const first = (r.legs[0].geometry || [])[0];
  const startWord = (r.basis || "").startsWith("from home") ? "start — home" : "where you sit";
  if(first){ L.marker(first, { icon: pin("#FFD600"), title: startWord }).addTo(m).bindTooltip(startWord, { direction: "top", offset: [0, -10], className: "ltip", opacity: 1 }); bounds.extend(first); }
  r.legs.forEach((leg, i) => {
    if(leg.geometry && leg.geometry.length){
      const line = L.polyline(leg.geometry, { color: leg.loaded ? "#4FC3F7" : "#FFD600", weight: 4, opacity: .85,
                                              dashArray: leg.loaded ? null : "8 6" }).addTo(m);
      bounds.extend(line.getBounds());
    }
    const s = r.stops[i];
    if(s && s.lat != null){
      const ll = [s.lat, s.lng];
      L.marker(ll, { icon: pin(s.kind === "pickup" ? "#00E676" : "#ff4444"),
                     title: `${s.kind} #${s.load_number || "——"} ${s.city || ""}` }).addTo(m)
        .bindTooltip(`${i + 1}. ${s.kind.toUpperCase()} #${esc(s.load_number)} · ${esc(s.city || s.company || "")}${s.eta ? " · " + esc(s.eta) : ""}`,
                     { direction: "top", offset: [0, -10], className: "ltip", opacity: 1 });
      bounds.extend(ll);
    }
  });
  /* THE INTERCEPT (card #198 pass two): the road he is driving, painted by
     what he drives INTO at the hour he is there. Drawn ON the route and above
     it — the line says where, this says what is waiting. A stretch the
     forecast could not answer is drawn in NEITHER colour: unknown is not
     clear, and a gap that looks calm is the one lie this must not tell. */
  const rwx = (r.road_wx || {});
  const smp = rwx.samples || [];
  for(let i = 1; i < smp.length; i++){
    const a = smp[i - 1], b = smp[i];
    if(!a.sev || !b.sev) continue;                 // unknown: draw nothing
    const sev = (a.sev === "danger" || b.sev === "danger") ? "danger"
              : (a.sev === "bad" || b.sev === "bad") ? "bad" : null;
    if(!sev) continue;
    L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
      color: sev === "danger" ? "#ff4444" : "#FFA726",
      weight: 11, opacity: .38, lineCap: "round", interactive: false
    }).addTo(m);
  }
