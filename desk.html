  const fit = () => { if(ROAD_VIEW) m.setView(ROAD_VIEW.c, ROAD_VIEW.z); else if(bounds.isValid()) m.fitBounds(bounds, { padding: [26, 26], maxZoom: 9 }); };
  fit();
  setTimeout(() => { try{ m.invalidateSize(); fit(); }catch(_){} }, 60);
}

/* why a stop has no pin, in the spine's own order (#182): a geocoder that
   went quiet THIS request (geocode_why, never stored), a verdict on the
   address, a blank city — and "no city on the sheet" only when the city IS
   blank. Before this the desk read geocode_miss alone, and a quiet geocoder
   read as a missing city. */
function pinWhy(s){
  if(s.geocode_why) return s.geocode_why;

}

function takeRoadMode(m){

function wireRoadMode(scope){

let ROAD_SEQ = 0;
async function loadRoad(fix){
  const seq = ++ROAD_SEQ;
  State.roadPending = true;
  if(State.road) paintRoad();     // keep the old map, say it is being redrawn
  try{
    /* no mode in the body: the spine draws the road in the BOOK's mode and
       says which it used; the seg follows the answer (card #192) */
    const r = await fetch(url("/api/hotshot/route"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}),
      body: JSON.stringify({ origin: fix || null, done: Object.keys(doneStops()).map(Number) }) });
    const v = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(v.unavailable || v.error || ("HTTP " + r.status));
    if(seq !== ROAD_SEQ) return;
    State.road = v; State.roadErr = null;
    takeRoadMode(v.mode);
  }catch(e){
    if(seq !== ROAD_SEQ) return;
    State.road = null; State.roadErr = String(e.message || e);
  }
  State.roadPending = false;
  paintRoad();
  if(!stage.classList.contains("entered")) separate();
}

/* ── THE MIRROR (card #244) ───────────────────────────────────────────
   His own rulings against today's facts. The spine decides whether there is
   anything; this only draws it. THREE RULES IT KEEPS:
     · It draws NOTHING when there is nothing — no empty state, no "all
       clear", no placeholder. A panel that is always there is a panel he
       stops seeing, and then it is worth less than nothing on the day it
       is true.
     · It NAMES, it never instructs. His own doctrine is to name the
       behaviour first so the choice is conscious. The words come from the
       spine verbatim; this page writes none of its own.
     · LET IT GO is a TAP, not a hold (the gesture grammar: a hold is
       constitutional and irreversible, and letting a naming go is neither).
       It expires on its own, so a thing he silenced on a bad week speaks
       again on a better one. The line dims only AFTER the spine's 200 —
       nothing on this desk animates on hope. */
let MIRROR = [];
async function loadMirror(){

}

/* ── THE RADIO SYSTEM (card #93) — the parent becomes the sun ──────────
   His refinement 2026-08-11: the children ORBIT the radio orb like the main
   field orbits the spine; he spins the ring to reach one; each orb's size is
   earned by his own usage of that door. */
let RING = null;
function openSys(){
  if(SYS) return;
  SYS = true;
  stage.classList.add("insys");
  const P = D[2];
  P.el.classList.add("active", "sysparent");
  const c = sysCenter();
  P.el.style.left = c.x + "px"; P.el.style.top = c.y + "px";
  /* the orbit ring — the spin's affordance, faint as a lane line */
  RING = document.createElement("div");
  RING.className = "sysring";
  host.appendChild(RING);
  /* size is EARNED: 40px floor, +36px by his relative usage of the door */
  const use = sysUse();
  const mx = Math.max(1, ...RSYS.map(o => use[o.id] || 0));
  RSYS.forEach(o => {
    const el = document.createElement("div");
    el.className = "orb sysorb"; el.title = o.why;
    el.innerHTML =
      `<div class="ball" style="background:radial-gradient(circle at 36% 30%,
         rgba(${o.hue},.96), rgba(${o.hue},.62) 46%, rgba(${o.hue},.16) 78%, rgba(6,8,12,.98));
         box-shadow:0 0 40px -8px rgba(${o.hue},.6), inset 0 -14px 26px rgba(0,0,0,.55),
         inset 0 5px 12px rgba(255,255,255,.12)">
         <div class="fig"><div><span class="n">—</span><span class="u"></span></div></div>
       </div><div class="name">${o.k}</div><div class="sig">&#8230;</div>`;
    el.style.left = c.x + "px"; el.style.top = c.y + "px";
    el.style.opacity = "0";
    el.addEventListener("click", e => {
      e.stopPropagation();
      if(spinGuard()) return;          // the spin's release is not a tap
      bumpUse(o.id);                   // the door remembers his hand — size is earned
      if(o.act === "room"){ closeSys(true); enter(2, true); }
      else location.href = o.act;
    });
    host.appendChild(el);
    o.el = el;
    const b = el.querySelector(".ball");
    const r = 40 + Math.round(36 * ((use[o.id] || 0) / mx));
    b.style.width = b.style.height = r + "px";
  });
  /* seats set SYNCHRONOUSLY — a hidden document never fires rAF (the preview
     pane taught this); the forced reflow lets the transition ride for free */
  void host.offsetWidth;
  layoutSys();   // owns position, scale, depth-opacity — the fade-in rides it
  $("consider").classList.add("dim");
  wireSpin();
  paintSys();
  /* the repeater's truth rides in when asked — never blocks the fall */
  grab("/api/glasses").then(g => { State.glasses = g; paintSys(); }).catch(()=>{});
}
function closeSys(silent){
  if(!SYS) return;
  SYS = false;
  stage.classList.remove("insys");
  $("consider").classList.remove("dim");
  unwireSpin();
  const P = D[2];
  if(ACTIVE === null) P.el.classList.remove("active");
  RSYS.forEach(o => { o.el && o.el.remove(); o.el = null; });
  if(RING){ RING.remove(); RING = null; }
  layout();   // the parent star glides home (sysparent's transition carries it)
  setTimeout(() => P.el.classList.remove("sysparent"), 460);
}
function layoutSys(){
  if(!SYS) return;
  const c = sysCenter(), R = sysRadius(), Ry = R*0.46;   // the tilted plane
  const P = D[2];
  P.el.style.left = c.x + "px"; P.el.style.top = c.y + "px";
  if(RING){
    RING.style.left = c.x + "px"; RING.style.top = c.y + "px";
    RING.style.width = (R*2) + "px"; RING.style.height = (Ry*2) + "px";
  }
  /* a 3D axis (his ask): depth = sin(θ). The far arc passes BEHIND the sun —
     smaller, dimmer, under it; the near arc rides in front, full size. */
  RSYS.forEach((o, i) => { if(!o.el) return;
    const th = SPIN.base + i * (Math.PI*2/RSYS.length);
    const z = Math.sin(th);                       // -1 back … +1 front
    const s = 0.66 + 0.34 * ((z + 1) / 2);
    o.el.style.left = (c.x + R*Math.cos(th)) + "px";
    o.el.style.top  = (c.y + Ry*Math.sin(th)) + "px";
    o.el.style.transform = `translate(-50%,-50%) scale(${s.toFixed(3)})`;
    o.el.style.opacity = String(0.55 + 0.45 * ((z + 1) / 2));
    o.el.style.zIndex = z < 0 ? 4 : 7;            // behind the sun, then in front
  });
}
/* the spin: drag anywhere on the field while the system is open; the ring
   follows his hand and snaps to the nearest seat on release. A tap is a tap
   — under 10px of travel never becomes a spin. */
const DRAG = { on:false, id:0, a0:0, b0:0, x0:0, y0:0 };
function spinDown(e){
  if(!SYS) return;
  DRAG.on = true; DRAG.id = e.pointerId;
  DRAG.b0 = SPIN.base;
  DRAG.x0 = e.clientX; DRAG.y0 = e.clientY;
}
function spinMove(e){
  if(!DRAG.on || e.pointerId !== DRAG.id) return;
  const moved = Math.hypot(e.clientX - DRAG.x0, e.clientY - DRAG.y0);
  if(moved < 10 && !SPIN.moved) return;
  if(!SPIN.moved){ SPIN.moved = true; host.classList.add("spinning"); }
  SPIN.movedT = performance.now();
  /* a tilted ring spins on its vertical axis — his hand slides SIDEWAYS and
     the carousel turns; one radius of travel ≈ a quarter turn and change */
  SPIN.base = DRAG.b0 + ((e.clientX - DRAG.x0) / sysRadius()) * 1.35;
  layoutSys();
}
function spinUp(e){
  if(!DRAG.on || e.pointerId !== DRAG.id) return;
  DRAG.on = false;
  if(SPIN.moved){
    SPIN.movedT = performance.now();
    host.classList.remove("spinning");
    const step = Math.PI*2/RSYS.length;
    /* snap a child into the FRONT seat (θ = π/2, nearest the hand) */
    SPIN.base = Math.round((SPIN.base - Math.PI/2)/step)*step + Math.PI/2;
    layoutSys();
    setTimeout(() => { SPIN.moved = false; }, 300);
  }
}
function wireSpin(){
  field.addEventListener("pointerdown", spinDown);
  addEventListener("pointermove", spinMove);
  addEventListener("pointerup", spinUp);
  addEventListener("pointercancel", spinUp);
}
function unwireSpin(){
  field.removeEventListener("pointerdown", spinDown);
  removeEventListener("pointermove", spinMove);
  removeEventListener("pointerup", spinUp);
  removeEventListener("pointercancel", spinUp);
  SPIN.moved = false;
}
function paintSys(){
  if(!SYS) return;
  const r = State.radio, sc = State.sidech, dt = State.diet, g = State.glasses;
  const un = sc ? (sc.runs||[]).reduce((n,t)=>n+(t.unheard||0),0) : null;
  const kept = dt ? (dt.rows||[]).length : null;
  const set = (o, n, u, sig, ks) => {

/* THE TRANSMITTER — the station has ONE. Promoted from the page's AIR
   (the learn room's only sanctioned global edit, spec §4.2): every voice on
   the desk keys through here, so two programs can never talk over each
   other, and every object URL is revoked on the way out (the old AIR
   leaked its blob). Moved means moved. */
const XMTR = {
  el:null, obj:null, owner:"",
  playing(){ return !!(this.el && !this.el.paused); },
  stop(){
    const cb = this.onstop; this.onstop = null; this.onend = null;
    if(this.el){ try{ this.el.pause(); }catch(_){} this.el = null; }
    if(this.obj){ URL.revokeObjectURL(this.obj); this.obj = null; }
    this.owner = "";
    cb && cb();
  },
  play(blob, owner, opts){
    const o = opts || {};
    this.stop();
    this.owner = owner;
    this.obj = URL.createObjectURL(blob);
    this.el = new Audio(this.obj);
    this.el.playbackRate = o.rate || 1;
    this.onend = o.onend || null; this.onstop = o.onstop || null;
    if(o.ontime) this.el.addEventListener("timeupdate", () => {
      if(XMTR.el) o.ontime(XMTR.el); });
    this.el.onended = () => { const f = this.onend; this.onend = null;
      this.stop(); f && f(); };
    /* metadata BEFORE play — the lock screen must carry the callsign when
       the first syllable lands (spec §3b) */
    if(o.meta && "mediaSession" in navigator){
      try{ navigator.mediaSession.metadata = new MediaMetadata(o.meta); }catch(_){}
    }
    return this.el.play();
  }
};
addEventListener("pagehide", () => XMTR.stop());
function playAir(btn){
  if(XMTR.owner === "page"){ XMTR.stop(); btn.textContent = "▶ ON AIR"; return; }
  btn.textContent = "TUNING…"; btn.disabled = true;
  /* fetch-blob: an <audio src> cannot carry the bearer token */
  fetch(url("/api/brief/audio"), { headers: hdr() })
    .then(r => { if(!r.ok) throw new Error("no air"); return r.blob(); })
    .then(b => {
      btn.textContent = "■ SIGN OFF"; btn.disabled = false;
      return XMTR.play(b, "page", {
        meta: { title: "The morning sign-on", artist: "ALMANAC" },
        onend:  () => { const x = $("cair"); x && (x.textContent = "▶ ON AIR"); },
        onstop: () => { const x = $("cair"); x && (x.textContent = "▶ ON AIR", x.disabled = false); }
      });
    })
    .catch(() => { btn.textContent = "TRANSMITTER OFFLINE"; btn.disabled = true; });
}

function renderDocket(){
  const el = $("docket");
  /* SNAPSHOT BINDING (review of #84): taps resolve against the array this
     DOM was rendered from — a background load() swapping State.hand under
     an open drawer must never redirect an ack to a different row. */
  const snap = State.hand;
  el.innerHTML = docketHTML(snap);
  const x = el.querySelector("#dockX");
  x && (x.onclick = closeDocket);
  el.querySelectorAll("[data-dgo]").forEach(b => b.onclick = () => {
    const idx = D.findIndex(o => o.room === (DOCK_ROOM[b.dataset.dgo] || b.dataset.dgo));
    closeDocket();
    if(idx >= 0) enter(idx);
  });
  /* a ruling row's RULE is a HOLD, the same body as the board's (#87) */
  wireRulers(el);
  el.querySelectorAll(".dact").forEach(b => b.onclick = async () => {
    const item = snap && snap.items[+b.dataset.di];
    if(!item || !item.act) return;
    const spec = b.dataset.mode === "undo" ? item.act.undo : item.act;
    if(!spec) return;
    const row = b.closest(".drow");
    b.disabled = true; b.textContent = "writing…";
    try{
      const r = await fetch(url(spec.path), {method: spec.method || "POST",
        headers: hdr({"Content-Type": "application/json"}),
        body: JSON.stringify(spec.payload || {})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error(out.error || ("HTTP " + r.status));
    }catch(err){
      /* the WRITE failed — and the reason renders in the row, because a
         tooltip does not exist under a thumb (review of #84) */
      b.disabled = false; b.textContent = "REFUSED";
      if(row && !row.querySelector(".dact-err"))
        row.insertAdjacentHTML("beforeend",
          `<div class="dunknown dact-err">${esc(String(err.message || err))}</div>`);
      return;
    }
    /* the write LANDED — nothing past this line may claim otherwise; the
       refreshes degrade quietly, they never repaint success as refusal */
    row && row.querySelector(".dact-err") && row.querySelector(".dact-err").remove();
    try{ State.hand = await grab("/api/hand"); }catch(_){}
    try{ State.fin.followups = await grab("/api/fin/followups"); }catch(_){}
    if(b.dataset.mode !== "undo" && item.act.undo){
      /* the act carries its reverse: the row stays, dimmed, one tap from undone */
      b.disabled = false; b.textContent = "UNDO"; b.dataset.mode = "undo";
      row && row.classList.add("t-done");
    } else {
      renderDocket();
    }
    paintField();
  });
}

/* the arc — drawn from served figures, synchronously (a hidden document
   never runs rAF, and a deferred first paint ships a blank instrument) */
function paintGauge(){
  const cv = $("g"); if(!cv) return;
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  if(p.nut == null || p.contribution == null) return;
  const r = cv.getBoundingClientRect();
  const W = Math.max(240, r.width), H = Math.max(150, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  const NUT = p.nut, C = Math.max(0, p.contribution), MAX = NUT*1.28;
  const cx = W/2, cy = H*0.88, R = Math.min(W*0.42, H*0.78);
  const A0 = Math.PI*1.04, A1 = Math.PI*1.96;
  const ang = v => A0 + (A1-A0)*Math.min(1, Math.max(0,v)/MAX);
  const cs = getComputedStyle(document.documentElement);
  const key = HOT ? (cs.getPropertyValue("--hot-rgb").trim() || "255,59,24")
                  : (cs.getPropertyValue("--key").trim() || "255,164,25");
  const lw = Math.max(16, R*0.15);
  g.lineCap = "butt";
  g.strokeStyle = wash(.05); g.lineWidth = lw+8;
  g.beginPath(); g.arc(cx,cy,R,A0,A1); g.stroke();
  for(let i=0;i<=24;i++){
    const a = A0+(A1-A0)*(i/24), maj = i%4===0;
    g.strokeStyle = maj?wash(.22):wash(.1); g.lineWidth = maj?1.6:1;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*(R-lw/2-2), cy+Math.sin(a)*(R-lw/2-2));
    g.lineTo(cx+Math.cos(a)*(R+lw/2+(maj?6:3)), cy+Math.sin(a)*(R+lw/2+(maj?6:3))); g.stroke();
  }
  const aC = ang(C), aN = ang(NUT);
  g.strokeStyle = `rgba(${key},.9)`; g.lineWidth = lw;
  g.shadowColor = `rgba(${key},.5)`; g.shadowBlur = 20;
  g.beginPath(); g.arc(cx,cy,R,A0,aC); g.stroke(); g.shadowBlur = 0;
  if(aC < aN){                       /* the shortfall: unlit distance, red-edged */
    g.strokeStyle = hotc(.18); g.lineWidth = lw;
    g.beginPath(); g.arc(cx,cy,R,aC,aN); g.stroke();
    g.strokeStyle = hotc(.85); g.lineWidth = 2;
    g.beginPath(); g.arc(cx,cy,R+lw/2-1,aC,aN); g.stroke();
    g.beginPath(); g.arc(cx,cy,R-lw/2+1,aC,aN); g.stroke();
  }
  g.strokeStyle = inkc(1); g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx+Math.cos(aN)*(R-lw/2-4), cy+Math.sin(aN)*(R-lw/2-4));
  g.lineTo(cx+Math.cos(aN)*(R+lw/2+8), cy+Math.sin(aN)*(R+lw/2+8)); g.stroke();
  /* the nut's plate, kept inside the glass — a label that runs off the edge
     reads as a broken instrument */
  const rawx = cx+Math.cos(aN)*(R+lw/2+26), ly = cy+Math.sin(aN)*(R+lw/2+26);
  const half = 42, lx = Math.max(half+2, Math.min(W-half-2, rawx));
  g.textAlign = "center";
  g.fillStyle = inkc(1); g.font = "700 10px ui-monospace,Menlo,monospace";
  g.fillText("THE NUT", lx, ly-3);
  g.fillStyle = wash(.62); g.font = "600 10px ui-monospace,Menlo,monospace";
  g.fillText(money(NUT), lx, ly+11);
  g.save(); g.translate(cx,cy); g.rotate(aC);
  const ng = g.createLinearGradient(0,-4,0,4);
  ng.addColorStop(0,"#F4F7F5"); ng.addColorStop(.5,"#C6CCC8"); ng.addColorStop(1,"#78807A");
  g.fillStyle = ng;
  g.beginPath(); g.moveTo(-14,-4.5); g.lineTo(R-lw/2-4,-1.4); g.lineTo(R-lw/2-4,1.4); g.lineTo(-14,4.5);
  g.closePath(); g.fill(); g.restore();
  const hub = g.createRadialGradient(cx-4,cy-5,1,cx,cy,18);
  hub.addColorStop(0,"#949B94"); hub.addColorStop(1,"#1A1E1D");
  g.fillStyle = hub; g.beginPath(); g.arc(cx,cy,15,0,7); g.fill();
  /* what the needle IS — set to the left, clear of the reading below the hub */
  g.textAlign = "left";
  g.fillStyle = wash(.3); g.font = "700 8px ui-monospace,Menlo,monospace";
  g.fillText("NEEDLE = CONTRIBUTION", 10, cy - 6);
  g.fillText("EARNED MINUS ROAD", 10, cy + 6);
}
/* the workings — served whole, typeset here, computed nowhere */
function wkHTML(k){
  const W = (State.standing && State.standing.judgement && State.standing.judgement.workings) || {};
  const d = W[k]; if(!d) return `<div class="nodata">the spine serves no working for this figure</div>`;
  const rows = (d.rows||[]).map(r => r[1] == null
    ? `<div class="wr"><span>${esc(r[0])}</span><span class="flag" title="UNKNOWN"></span></div>`
    : `<div class="wr"><span>${esc(r[0])}</span><b>${money(r[1])}</b></div>`).join("");
  const whole = d.whole ? `<div class="wr" style="font-style:italic">this figure arrives whole — the spine serves no further breakdown.</div>` : "";
  const tot = d.total ? `<div class="tot"><span>${esc(d.total[0])}</span><b>${
    d.total[1]==null?"——":money(d.total[1])}</b></div>` : "";
  const note = d.note ? `<div class="wr" style="font-style:italic">${esc(d.note)}</div>` : "";
  return rows + whole + tot + note + `<div class="prov">${esc(d.stamp||"")}</div>`;
}

/* ── THE WORK ─────────────────────────────────────────────────────── */
const COLS = [["qa","QA · YOUR REVIEW"],["now","IN HAND"],["next","NEXT"],["later","LATER"]];
function md(t){
  const lines = esc(t).split("\n"); let out = "", ul = false;
  for(const ln of lines){
    if(/^\s*-\s+/.test(ln)){ if(!ul){ out += "<ul>"; ul = true; }
      out += "<li>" + ln.replace(/^\s*-\s+/,"") + "</li>"; }
    else { if(ul){ out += "</ul>"; ul = false; }
      out += ln.trim() === "" ? "<br>" : ln + "<br>"; }
  }
  if(ul) out += "</ul>";
  return out.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
/* ── THE SHIPPED LEDGER (card #283) ───────────────────────────────────
   The board shows what is OPEN; four columns and no fifth, because a done
   card leaves the payload after seven days and should. This is the far side
   of that edge — 219 closed cards that had nowhere to be read. Fetched only
   when he opens the tab: it is a git read on the spine and the board must

const WK = { view:"board", data:null, err:null, loading:false, weeks:8,

function shipCard(c){
  /* Every mark is a FACT the spine served. A card with no commits prints no
     commit chip rather than a zero — an absence and a measured zero read the
     same on a page and are not the same thing. */
  const marks = [];
  if(!c.through_qa) marks.push(`<span class="sm bad">NEVER IN QA</span>`);
  if(c.hand) marks.push(`<span class="sm">${c.hand === "his" ? "HIS HAND" : "THE BOX"}</span>`);
  if(c.days != null) marks.push(`<span class="sm">${c.days}d OPEN</span>`);
  if(c.entries && c.entries.length)
    marks.push(`<span class="sm">ENTRY ${c.entries.join(" / ")}</span>`);
  const com = (c.commits || []).map(x =>
    `<div class="scm"><code>${esc(x.sha)}</code> ${esc(x.subject)}</div>`).join("");
  return `<div class="sc">
    <div class="sct"><span class="sid">#${c.id}</span> ${esc(c.title)}</div>
    <div class="scm-row"><span class="sm dt">${esc((c.done_at||"").slice(0,10))}</span>
      ${c.priority === "high" ? '<span class="sm hi">HIGH</span>' : ""}${marks.join("")}</div>
    ${com}</div>`;
}

/* AN EPIC, COLLAPSED — his ask: "a high level of all the epics we have".
   Collapsed is the default and the point: the header alone has to answer how
   big the body of work is and how much of it is finished, or expanding is
   not a choice, it is the only way to read the page. */
function epicRow(e){
  const on = WK.open.has(e.id);
  const pct = e.total ? Math.round(100 * e.done / e.total) : 0;
  const span = e.first_at && e.last_at
    ? (e.first_at.slice(0,10) === e.last_at.slice(0,10)
        ? e.first_at.slice(0,10)
        : `${e.first_at.slice(0,10)} → ${e.last_at.slice(0,10)}`)
    : "nothing closed yet";
  return `<div class="epk ${on ? "on" : ""}" data-ep="${esc(e.id)}">
    <div class="eph">
      <span class="cav">${on ? "▾" : "▸"}</span>
      <span class="ept">${esc(e.title || e.id || "no epic — unfiled")}</span>
      ${e.state && e.state !== "active"
        ? `<span class="sm">${esc(e.state.toUpperCase())}</span>` : ""}
      <span class="epn">${e.done}/${e.total}</span>
      <span class="eppb"><i style="width:${pct}%"></i></span>
      ${e.open ? `<span class="sm epo">${e.open} OPEN</span>`
               : `<span class="sm epc">ALL CLOSED</span>`}
      <span class="sm dt">${esc(span)}</span>
    </div>
    ${on ? `<div class="epb">
      ${e.why ? `<div class="epwhy">${esc(e.why)}</div>` : ""}
      ${e.cards.length ? e.cards.map(shipCard).join("")

}

/* One header for both axes — the gap counts are a property of the RECORD,

/* ── RADIO ────────────────────────────────────────────────────────── */
const RTF = new Intl.RelativeTimeFormat("en",{numeric:"auto"});
function rel(at){
  const d = (Date.now() - new Date(at).getTime())/1000;
  if(!isFinite(d)) return "";
  if(d < 90) return "now";
  if(d < 3600) return RTF.format(-Math.round(d/60),"minute");
  if(d < 86400) return RTF.format(-Math.round(d/3600),"hour");
  return RTF.format(-Math.round(d/86400),"day");
}
/* 🕶 THE REPEATER — the glasses lane (Funnel + bik bridge + core), seen and
   armed from the room. Dark tower, dead mic: the Funnel idles itself down
   ~15min after the last glasses session by design, so the strip's one control
   puts it back on the air without a terminal (Bryan's ask, 08-04). */
function laneStrip(){

                         : esc(legs.join(" · ") || "dark")}</span>

      const r = await fetch(url("/api/glasses/arm"), { method:"POST",
        headers: hdr({"Content-Type":"application/json"}), body: "{}" });

/* ══ THE STOPS BOOK (hotshot · stops tab) ═══════════════════════════════
   His duesey 2026-08-08, from the road: a night's stop needs TWO filters no
   booking site combines — takes Rosie AND a lot that fits the 55' combo. The
   spine's producer serves candidates with the satellite link already built;
   the parking judgment is HIS EYE on the photo, never an algorithm. KEEP
   stamps a stop PROVEN into the permanent book. This tab paints served
   fields only — the dog flag renders the spine's 1/0/NULL and UNKNOWN never
   reads as no. Fetches fire on open and on his tap, never on a tick. */
const HS = { view:"standing", q:"", bookq:"", ans:null, book:null, err:null,
             busy:false, loaded:false, addOpen:false,
             mode:"route", kind:"hotel", dest:"", gps:null, mapObj:null,
             bookMapObj:null, bookMapWhy:"",
             sa:{ name:"", link:"", note:"", kind:"hotel" },
             haul:null, haulErr:null, haulLoaded:false, haulBusy:false,
             haulOpen:null };

async function loadStops(q){
  /* the last fetch wins, not the last to arrive (loadFin's law) */
  const seq = HS._seq = (HS._seq || 0) + 1;
  try{
    const b = await grab("/api/stops" + (q ? "?q=" + encodeURIComponent(q) : ""));
    if(seq !== HS._seq) return;
    HS.book = b; HS.err = null; HS.readAt = Date.now();
    /* the book is a list AND a map (his word 2026-08-09) — but the list never
       waits on image bytes (review catch): the map fetch rides behind, only
       when the book room is the one showing, and repaints on settle */
    if(b.book_map && b.book_map.pinned){
      if(HS.view === "book") fetchBookMap().then(() => renderRoom()).catch(() => {});
    } else { if(HS.bookMapObj) URL.revokeObjectURL(HS.bookMapObj);
             HS.bookMapObj = null; HS.bookMapWhy = ""; }
  }catch(e){
    if(seq !== HS._seq) return;
    /* the book on screen is his last read — never cleared on failure */
    HS.err = String(e.message || e);
  }
}

async function doStopsSearch(){
  if(HS.busy) return;
  HS.q = (HS.q || "").trim();
  if(!HS.q){ toast("a search needs a place"); return; }
  HS.busy = true; renderRoom();
  try{
    const a = await grab("/api/stops/search?q=" + encodeURIComponent(HS.q)
                         + "&kind=" + encodeURIComponent(HS.kind));
    HS.ans = a; HS.err = null; HS.readAt = Date.now();
    await loadStops(HS.bookq);   /* the book carries the new rows too */
  }catch(e){
    HS.err = String(e.message || e);
    toast("the spine has not answered — the book below is your last read");
  }
  HS.busy = false; renderRoom();
}

function stopGps(){
  /* the Fold's fix — asked once per tap, never in the background */
  if(!navigator.geolocation){ toast("this device offers no location"); return; }
  toast("asking the device for its fix…");
  navigator.geolocation.getCurrentPosition(
    pos => { HS.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
             renderRoom(); },
    err => toast("no fix — " + (err.message || "the device refused")),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 120000 });
}

async function fetchBookMap(){
  /* authed bytes like the corridor's picture; a refusal arrives as words
     (budget spent, no pins yet) and renders as words — never a broken img.
     Seq-guarded (review catch): a stale resolve may not overwrite a newer
     map nor revoke its live URL — the last FETCH wins, not the last to
     arrive (loadFin's law, applied to the picture too). */
  /* the live Leaflet map replaces the static picture whenever it can render
     — skip the Static Maps spend entirely then (the budget stays whole). */
  if(typeof L !== "undefined" && ((HS.book && HS.book.proven) || [])
      .some(s => s.lat != null && s.lng != null)) return;
  const seq = HS._mseq = (HS._mseq || 0) + 1;
  try{
    const r = await fetch(url("/api/stops/bookmap"), { headers: hdr(), cache: "no-store" });
    if(!r.ok){
      const out = await r.json().catch(() => ({}));
      if(seq !== HS._mseq) return;
      if(HS.bookMapObj) URL.revokeObjectURL(HS.bookMapObj);
      HS.bookMapObj = null;
      HS.bookMapWhy = out.error || ("the spine answered " + r.status);
      return;
    }
    const blob = await r.blob();
    if(seq !== HS._mseq) return;
    if(HS.bookMapObj) URL.revokeObjectURL(HS.bookMapObj);
    HS.bookMapObj = URL.createObjectURL(blob); HS.bookMapWhy = "";
  }catch(e){
    if(seq !== HS._mseq) return;
    if(HS.bookMapObj) URL.revokeObjectURL(HS.bookMapObj);
    HS.bookMapObj = null;
    HS.bookMapWhy = "the spine has not answered with the map";
  }
}

async function fetchRouteMap(ref){
  /* the map arrives as authed bytes, never as a keyed URL. Same seq law as
     the book map — a stale corridor picture may not beat a fresh one. */
  const seq = HS._rseq = (HS._rseq || 0) + 1;
  try{
    const r = await fetch(url("/api/stops/map?ref=" + encodeURIComponent(ref)),
                          { headers: hdr(), cache: "no-store" });
    if(!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    if(seq !== HS._rseq) return;
    if(HS.mapObj) URL.revokeObjectURL(HS.mapObj);
    HS.mapObj = URL.createObjectURL(blob);
  }catch(e){
    if(seq !== HS._rseq) return;
    if(HS.mapObj) URL.revokeObjectURL(HS.mapObj);   /* no orphaned blobs */
    HS.mapObj = null;
  }
}

async function doRouteSearch(){
  if(HS.busy) return;
  HS.dest = (HS.dest || "").trim();
  if(!HS.gps){ toast("tap USE MY LOCATION first — the corridor starts where you are"); return; }
  if(!HS.dest){ toast("the corridor needs a destination"); return; }
  HS.busy = true; renderRoom();
  try{
    const r = await fetch(url("/api/stops/route"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}),
      body: JSON.stringify({ origin: HS.gps, dest: HS.dest, kind: HS.kind }) });
    const a = await r.json();
    HS.ans = a; HS.err = null; HS.readAt = Date.now();
    if(a.ok && a.route && a.route.map) await fetchRouteMap(a.route.map);
    else { if(HS.mapObj) URL.revokeObjectURL(HS.mapObj); HS.mapObj = null; }
    await loadStops(HS.bookq);
  }catch(e){
    HS.err = String(e.message || e);
    toast("the spine has not answered — the book below is your last read");
  }
  HS.busy = false; renderRoom();
}

async function stopJudge(id, verdict, btn){
  /* the PUT ON AIR trace: disable, POST, parse even on !ok, never optimistic */
  if(btn) btn.disabled = true;
  try{
    const r = await fetch(url("/api/stops/" + id + "/judge"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}),
      body: JSON.stringify({ verdict }) });
    const out = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(out.error || ("the spine answered " + r.status));
    if(HS.ans && HS.ans.candidates)
      /* MERGE, never replace: the judge answer is a bare DB row — the served
         pin and mile marks must survive the verdict (review catch) */
      HS.ans.candidates = HS.ans.candidates.map(s => s.id === out.stop.id ? {...s, ...out.stop} : s);
    await loadStops(HS.bookq);
    toast(verdict === "keep" ? "PROVEN — in the book"
      : verdict === "no" ? "DISMISSED" : "BACK ON THE FENCE — judge it again");
  }catch(err){
    if(btn) btn.disabled = false;
    toast("NOT SAVED — " + (err.message || err));
  }
  renderRoom();   /* scroll-keep holds his place through the repaint */

  const pin = s.pin ? `<b class="spin${s.kept ? (s.kind === "fuel" ? " pfuel" : " pbook") : ""}">${esc(s.pin)}</b>` : "";

/* ── the live book map ─────────────────────────────────────────────────
   Leaflet over OSM tiles — zoom native, hover speaks, tap speaks on the
   phone. Rebuilt after every room render (the old instance is removed so
   listeners never leak); his zoom and center survive re-renders via
   HS.mapView. Every string is served data — esc() on all of it. */
let BOOKMAP = null;
function wireBookMap(){
  const el = $("bookLive");
  if(BOOKMAP){ try{ BOOKMAP.remove(); }catch(e){} BOOKMAP = null; }
  if(!el || typeof L === "undefined") return;
  const pts = ((HS.book && HS.book.proven) || [])
    .filter(s => s.lat != null && s.lng != null);
  if(!pts.length) return;
  const m = BOOKMAP = L.map(el, {scrollWheelZoom: true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(m);
  pts.forEach(s => {
    const icon = L.divIcon({className: "",
      html: `<div class="lpin${s.kind === "fuel" ? " pfuel2" : ""}">${esc(s.pin || "")}</div>`,
      iconSize: [26, 26], iconAnchor: [13, 24]});
    const mk = L.marker([s.lat, s.lng], {icon}).addTo(m);
    const dogs = s.kind === "fuel" ? null
      : s.allows_dogs === 1 ? "DOGS OK" : s.allows_dogs === 0 ? "NO DOGS" : "dogs ——";
    const facts = [s.address, s.tel, dogs,
      s.rating != null ? s.rating.toFixed(1) + "★" : null].filter(Boolean);
    mk.bindTooltip(`<b>${esc(s.name)}</b>${
        facts.length ? "<br>" + esc(facts.join(" · ")) : ""}${
        s.note ? "<br>" + esc(s.note) : ""}`,
      {direction: "top", offset: [0, -22], className: "ltip", opacity: 1});
    mk.bindPopup(`<b>${esc(s.name)}</b>${
        s.address ? "<br>" + esc(s.address) : ""}${
        dogs ? "<br>" + esc(dogs) : ""}${
        s.rating != null ? " · " + s.rating.toFixed(1) + "★" : ""}${
        s.note ? "<br>" + esc(s.note) : ""}<br>` +
      (s.tel ? `<a class="slink" href="tel:${esc(s.tel)}">CALL</a>` : "") +
      (s.maps_uri ? `<a class="slink" href="${esc(s.maps_uri)}" target="_blank" rel="noopener">LISTING</a>` : "") +
      (s.satellite_uri ? `<a class="slink" href="${esc(s.satellite_uri)}" target="_blank" rel="noopener">SATELLITE</a>` : ""));
  });
  if(HS.mapView) m.setView(HS.mapView.c, HS.mapView.z);
  else m.fitBounds(pts.map(s => [s.lat, s.lng]), {padding: [28, 28], maxZoom: 12});
  m.on("moveend", () => { HS.mapView = {c: m.getCenter(), z: m.getZoom()}; });
}

/* HEAR IT (card #221, his ask 2026-09-09) — the load's instructions out loud,
   because the moment he most needs the tarp/dunnage/call-when-loaded line is
   the moment he should not be reading a screen.

   The first tap on a load CUTS the audio (Kokoro, a few seconds); every tap
   after is instant from the spine's cache. So the button says which of those
   is happening — a control that looks identical while it works and while it
   is broken is one he stops trusting at the wheel, and at the wheel he cannot
   lean in to find out. Every failure ends in WORDS on the button. */
let HEARD = null;                      // the one Audio element — never a chorus
function wireHearBtns(root){
  root.querySelectorAll("[data-hear]").forEach(b => b.addEventListener("click", async () => {
    const id = b.dataset.hear, label = "▶ HEAR IT";
    // A second tap while it plays STOPS it. Driving, the thing he wants most
    // from a voice he did not mean to start is a way to end it.
    if(HEARD && !HEARD.paused && HEARD.dataset.id === id){
      HEARD.pause(); HEARD.currentTime = 0; b.textContent = label; return;
    }
    if(HEARD){ HEARD.pause(); }
    b.disabled = true; b.textContent = "⏳ CUTTING…";
    try{
      // grab() carries the bearer; this answers WAV bytes, not JSON.
      const r = await fetch(url(`/api/hotshot/loads/${id}/voice`), { headers: hdr({}) });
      if(!r.ok){
        let why = `the spine said ${r.status}`;
        try{ const j = await r.json(); if(j && j.error) why = j.error; }catch(e){}
        b.textContent = "⚠ NO VOICE";
        toast("⚠ could not read it out — " + why);
        setTimeout(() => { b.textContent = label; }, 4000);
        return;
      }
      const blob = await r.blob();
      if(!blob.size) throw new Error("the spine sent an empty clip");
      const a = new Audio(URL.createObjectURL(blob));
      a.dataset.id = id;
      HEARD = a;
      a.onended = () => { b.textContent = label; URL.revokeObjectURL(a.src); };
      a.onerror = () => { b.textContent = "⚠ NO VOICE";
                          toast("⚠ the clip would not play"); };
      await a.play();
      b.textContent = "⏸ STOP";
    }catch(e){
      b.textContent = "⚠ NO VOICE";
      toast("⚠ could not read it out — " + (e.message || e));
      setTimeout(() => { b.textContent = label; }, 4000);
    }finally{
      b.disabled = false;
    }
  }));
}

/* MAKE BOL — the old MC contract, spoken to the spine: need_weight comes
   back as a question, never a silent zero (no-fabrication) */
async function makeBol(loadNum, btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "⏳ GENERATING…";
  try{
    const post = b => fetch(url("/api/hotshot/bol"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}), body: JSON.stringify(b) })
      .then(r => r.json());
    let resp = await post({ load: loadNum });
    if(resp && resp.need_weight){
      const w = prompt(`No weight on the Load Log for #${loadNum} — enter weight (lbs):`);
      if(!w){ return; }
      const c = prompt("Commodity description (blank = use sheet / generic):") || "";
      resp = await post({ load: loadNum, weight: parseInt(w, 10), commodity: c });
    }
    if(resp && resp.saved)
      toast("✔ BOL written: " + resp.saved.split("/").pop() + " — open FILL & SIGN at the dock");
    else
      toast("⚠ BOL failed: " + ((resp && resp.error) || "unknown error"));
  }catch(e){ toast("⚠ BOL failed: " + e.message); }
  finally{ btn.disabled = false; btn.textContent = label; }
}

function wireBolBtns(scope){
  /* HEAR IT rides along here on purpose. haulCard renders from three places
     (the day room, the select's repaint, and the haul tab) and every one of
     them already calls wireBolBtns — hanging the voice off the same call
     means a fourth render site cannot quietly ship a dead button. */
  wireHearBtns(scope);
  scope.querySelectorAll(".bolBtn").forEach(b =>
    b.addEventListener("click", e => {
      e.stopPropagation();
      makeBol(b.dataset.bol, b);
    }));
  scope.querySelectorAll(".hlNumBtn").forEach(b =>
    b.addEventListener("click", e => {
      e.stopPropagation();
      openRateCon(b.dataset.rc, b.dataset.num, b);
    }));
}

/* THE RATE CON (his ask 09-04): tap the load number, the confirmation opens.
   Fetched with the bearer like every other read (the route map's pattern),
   then handed to a tab opened INSIDE the tap — a blob URL, so no token ever
   rides an address bar. Desktop renders it inline; the phone hands it to
   its PDF viewer. */
async function openRateCon(row, num, btn){
  const w = window.open("about:blank", "_blank");   // synchronous — inside the gesture
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "⏳";
  try{
    const r = await fetch(url("/api/hotshot/ratecon?row=" + encodeURIComponent(row)), { headers: hdr() });
    if(!r.ok){
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ("HTTP " + r.status));
    }
    const u = URL.createObjectURL(await r.blob());
    if(w && !w.closed){ w.location.href = u; }
    else { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener";
           document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(u), 120000);
  }catch(e){
    if(w && !w.closed) w.close();
    toast("rate con #" + num + " — " + e.message);
  }finally{ btn.disabled = false; btn.textContent = label; }
}

/* ── the strip: FLIGHT STATUS, monthly, always ─────────────────────── */
function finStrip(){
  const s = State.fin.summary;
  if(!s) return `<div class="panel" style="flex:0 0 auto;min-height:96px">
    <div class="cap">flight status</div><div class="gen" style="min-height:60px">
    <span class="nodata">${esc(State.fin.summaryErr ||
      "the spine has not answered with the cockpit")}</span></div></div>`;
  const m = s.the_month || {}, cl = s.survival || {};
  /* runway names its own fields; the clock's cash is the SAME cash the runway
     divides by burn. Reading it from two places is how a payload once said
     'good' and 'CRITICAL' in the same breath. */
  const rw = s.runway || {};
  const r = { cash: rw.total_cash != null ? rw.total_cash : cl.cash,
              weeks: cl.weeks_fuel,          /* SERVED, not derived from months */
              verdict: rw.verdict };
  /* THE CLOCK IS DEAD HERE (his word 2026-08-14): its T−N read
     survival.days_left while the hotshot tab serves judgement.line.days — the
     recorded day they disagreed on one screen (see the standing room's
     comment) retires with the second source. The countdown has ONE home. */
  const ps = payState();
  /* THE ROAD ESTIMATE IS DEAD (2026-08-01). The line is nut + road ACTUALLY
     spent — $0 road on the 1st, growing as CSVs land. Served, never derived,
     and never the projection: if the actuals are unreadable this says "——". */
  /* SHORT/OVER READS THE GAUGE'S BASIS (his ruling 2026-09-26 on card #42,
     carried by #306: "Once it's booked it goes to the MTD Revenue"). The
     gauge beside this panel is BOOKED; the panel read DELIVERED, so gauge
     minus BREAK-EVEN and the SHORT here disagreed by exactly the loads still
     to run. Booked minus the line is SERVED (the rollup's over_under_booked,
     via monthBooked); when this month's cannot be had, the panel falls back
     to delivered and its label SAYS delivered — the word over a number always
     names that number's basis. */
  const bk = monthBooked(m), onBooked = !!bk && bk.over != null;
  const delta = onBooked ? bk.over : m.over_under_actual;
  const proj = m.projected_eom, be = m.break_even_actual;
  const dayPct = m.days_in_month ? (m.day_of_month / m.days_in_month * 100) : 0;
  const gcol = bandCol(m.band);
  return `<div class="strip">
    <div class="panel gp">${heroGauge(m)}</div>
    <div class="panel ro">
      <div class="rr"><div class="rl">projected month-end</div>
        <div class="rbig" style="color:${gcol}">${proj == null ? "——" : money(proj)}</div></div>
      <div class="rr"><div class="rl">${onBooked ? "counting booked" : "delivered basis"} · vs the line</div>
        <div class="rmid" style="color:${delta == null ? "var(--unknown)"
          : delta >= 0 ? C.green : C.red}">${delta == null ? "——"
          : (delta >= 0 ? "▲ " : "▼ ") + money(Math.abs(delta))
            + (delta >= 0 ? " OVER" : " SHORT")}</div></div>
      <div class="rr"><div class="rl">break-even — bills + road so far</div>
        <div class="rmid" style="color:${C.chrome}">${be == null ? "——" : money(be)}</div>
        <div class="rsub">${m.nut_actual == null ? "——" : money(m.nut_actual)} bills +
          ${m.road_actual == null ? "——" : money(m.road_actual)} road
          <span style="color:var(--etch)">actual · grows as spend lands</span></div></div>
      <div class="rr"><div class="rl">${esc((m.month_name||"month").toUpperCase())} · day ${
        m.day_of_month} / ${m.days_in_month} · ${m.days_left} left</div>
        <div class="daybar"><i style="width:${dayPct}%"></i></div></div>
    </div>
    <div class="panel stones">
      <div class="cap">the stones · the month unloads</div>
      <div class="stw" id="stonesW"><canvas id="stonesC"></canvas>
        <div class="sthead">${!ps
          ? `<span class="nodata">the spine has not answered with the standings</span>`
          : ps.owed
          ? `<b>${money(ps.owed)}</b><span>still due · ${ps.settled.length} of ${ps.pay.length} paid</span>`
          : `<b>bare</b><span>all ${ps.pay.length} paid</span>`}</div>
      </div>
      <div class="ln" style="margin-top:6px"><span>cash</span><b>${
        r.cash == null ? "——" : money(r.cash)}</b></div>
      <div class="ln"><span>runway</span><b class="${
        r.verdict === "CRITICAL" ? "dn" : ""}">${r.weeks == null ? "——" :
        r.weeks + " wk"}${r.verdict ? " · " + esc(r.verdict) : ""}</b></div>
    </div>
  </div>`;
}

/* THE ATTITUDE GAUGE, ported from the cockpit that earned its trust — not a
   reinterpretation of it. Same geometry (440×286, hub at 220/240, R=180), same
   red→yellow→green sweep, the same dashed BREAK-EVEN radial with its triangle,
   the same ghost needle for the projection behind the live one.

   THE BAND IS THE MONTH'S OWN VERDICT, never the room's temperature. The desk
   can be hot because a deadline is close while the month itself is CRUSHING;
   painting this needle red on a $2,880-over month would be the instrument
   lying to make the room consistent. */
/* getters, not constants: every C.x read happens at render time, so the
   verdict palette follows the lamp — chalk on the night glass, deep ink
   on paper (pale chrome and #FFD600 vanish on cream). */
const C = {
  get red(){    return PAPER() ? "#C62828" : "#FF4444"; },
  get yellow(){ return PAPER() ? "#A67C00" : "#FFD600"; },
  get green(){  return PAPER() ? "#1B7A3D" : "#00E676"; },
  get chrome(){ return PAPER() ? "#4A4238" : "#C0C8D0"; },
  get mid(){    return PAPER() ? "#6B6258" : "#86868b"; },
  get track(){  return PAPER() ? "#D9CDAF" : "#1f1f1f"; },
};
let GAUGE_AT = null;
const bandCol = b => b === "good" ? C.green : b === "warn" ? C.yellow
                   : b === "red" ? C.red : C.chrome;
const arcPt = (cx,cy,r,t) => { const a = (180 - t*180)*Math.PI/180;
                               return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; };

/* THE MONTH'S BOOKED SPLIT, for the strip only. The strip is monthly on
   every toggle, but the rollup is fetched for FIN.period — its
   reconciliation is THIS month's only while the toggle stands on mo, so it
   is read then and never on another window (a week's still-to-run under a
   month's gauge is the other basis wearing this one's name). If fin_summary
   ever overlays booked_ahead / over_under_booked onto the_month (card #306
   names the lines — finroom was another card's file that day), those win
   and the split holds on every toggle. Both figures are served; nothing
   here is computed. */
function monthBooked(m){
  if(m.booked_ahead !== undefined || m.over_under_booked !== undefined)
    return { ahead: m.booked_ahead, over: m.over_under_booked };
  const ro = State.fin.rollup;
  const R = ro && ro.period === "month" ? ro.reconciliation : null;
  return R ? { ahead: R.booked_ahead, over: R.over_under_booked } : null;
}

function heroGauge(m){
  const cx = 220, cy = 240, R = 180, nlen = 140;
  /* the line is ACTUAL: nut + road spent so far, growing intramonth. The bare
     nut stands in only when the actuals could not be computed at all. */
  const be = m.break_even_actual != null ? m.break_even_actual : m.monthly_nut;
  /* THE GAUGE IS BOOKED (his ruling 2026-09-26 on card #42, carried by #306:
     "Booked loads should accumulate the number... Once it's booked it goes
     to the MTD Revenue"). m.mtd_revenue is the cockpit's month-end booked
     figure, and it stays the number, the needle, the arc and the aria. What
     was wrong was the WORD: it never said which revenue, so the delivered
     figure four inches away read as a contradiction. The caption names the
     basis now, and the delivered figure is printed under the number by name
     so run work never vanishes inside the booked total. Both parts are
     SERVED (earned_delivered on this payload; still-to-run from the month's
     reconciliation) — the page subtracts nothing. */
  const mtd = m.mtd_revenue, proj = m.projected_eom;
  const del = m.earned_delivered, bk = monthBooked(m), ahead = bk ? bk.ahead : null;
  const split = `${del == null ? "——" : money(del)} delivered` + (ahead == null ? ""
    : ahead > 0 ? ` · ${money(ahead)} still to run` : " · nothing still to run");
  if(be == null || mtd == null) return `<div class="gen" style="min-height:200px">
    <span class="nodata">not enough is known to draw the month</span></div>`;
  /* Headroom so BREAK-EVEN sits ~2/3 across rather than crammed at the edge —
     the cockpit's own scale rule, carried over unchanged. */
  const gmax = Math.max(be*1.5, (proj||0)*1.12, mtd*1.12, 1);
  const cl = (v,a,b) => Math.min(b, Math.max(a, v));
  const tBe = cl(be/gmax,0,1), tM = cl(mtd/gmax,0,1), tP = cl((proj||0)/gmax,0,1);
  const rotM = (tM-0.5)*180, rotP = (tP-0.5)*180;
  const col = bandCol(m.band);
  const n1 = arcPt(cx,cy,52,tBe), n2 = arcPt(cx,cy,R+8,tBe), nl = arcPt(cx,cy,R+34,tBe);
  const nlx = Math.max(96, Math.min(344, nl[0]));
  /* THE SWING IS AN ARRIVAL, NOT A TIC. It plays when the reading actually
     changes; on a re-render carrying the same figure the needle is drawn where
     it already stands. Replaying it on every write made the dial look like it
     was resetting — which is exactly what Bryan saw. */
  const pct = Math.min(100, Math.max(0, mtd/gmax*100));
  const same = GAUGE_AT && GAUGE_AT.m === rotM && GAUGE_AT.p === rotP;
  const restM = same ? rotM : -90, restP = same ? rotP : -90;
  const restArc = same ? (100 - pct) : 100;
  /* the viewBox hugs the drawing (his eye 08-15: "stretch to fill more of the
     card") — empty sky above the label and bare gutters beside the arc were
     letterboxing the dial to ~60% of its seat */
  return `<svg class="hero" viewBox="20 4 400 254" role="img"
      aria-label="MTD revenue, booked, ${money(mtd)} — ${esc(split)} — against break-even ${money(be)}">
    <defs><linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${C.red}"/><stop offset="0.5" stop-color="${C.yellow}"/>
      <stop offset="1" stop-color="${C.green}"/></linearGradient></defs>
    <path d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="${C.track}"
      stroke-width="24" stroke-linecap="round"/>
    <path id="heroArc" d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="url(#dgrad)"
      stroke-width="24" stroke-linecap="round" pathLength="100" stroke-dasharray="100"
      stroke-dashoffset="${restArc}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/>
    <line x1="${n1[0]}" y1="${n1[1]}" x2="${n2[0]}" y2="${n2[1]}" stroke="${C.chrome}"
      stroke-width="3" stroke-dasharray="5 4"/>
    <polygon points="${n2[0]-6},${n2[1]-9} ${n2[0]+6},${n2[1]-9} ${n2[0]},${n2[1]+1}"
      fill="${C.chrome}"/>
    <text x="${nlx}" y="${nl[1]-2}" fill="${C.chrome}" font-family="var(--mono)"
      font-size="17" font-weight="700" letter-spacing="0.5" text-anchor="middle"
      >BREAK-EVEN ${money(be)}</text>
    <g id="heroGhost" transform="rotate(${restP} ${cx} ${cy})"
       style="transition:transform 1.25s cubic-bezier(.16,1,.3,1)" data-rot="${rotP}">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-nlen+14}" stroke="${C.mid}"
        stroke-width="2.5" stroke-dasharray="5 4"/></g>
    <g id="heroNeedle" transform="rotate(${restM} ${cx} ${cy})"
       style="transition:transform 1.4s cubic-bezier(.16,1,.3,1)" data-rot="${rotM}">
      <polygon points="${cx-7},${cy} ${cx},${cy-nlen} ${cx+7},${cy}" fill="${col}"
        style="filter:drop-shadow(0 0 5px ${col})"/></g>
    <circle cx="${cx}" cy="${cy}" r="11" fill="${C.chrome}"/>
    <circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}"/>
    <text x="${cx}" y="142" fill="${C.mid}" font-family="var(--mono)" font-size="15"
      font-weight="700" letter-spacing="2.4" text-anchor="middle"
      style="paint-order:stroke;stroke:${PAPER()?"#EFE6CE":"#07080A"};stroke-width:5px;stroke-linejoin:round"
      >MTD REVENUE · BOOKED</text>
    <text x="${cx}" y="204" fill="${col}" font-family="var(--mono)" font-size="54"
      font-weight="600" text-anchor="middle"
      style="paint-order:stroke;stroke:${PAPER()?"#EFE6CE":"#07080A"};stroke-width:8px;stroke-linejoin:round"
      >${money(mtd)}</text>
    <text x="${cx}" y="225" fill="${C.chrome}" font-family="var(--mono)" font-size="12"
      font-weight="600" text-anchor="middle"
      style="paint-order:stroke;stroke:${PAPER()?"#EFE6CE":"#07080A"};stroke-width:4px;stroke-linejoin:round"
      >${esc(split)}</text>
  </svg>`;
}

/* The needles rest pointing left and swing to their served angle the moment
   the SVG lands — the arrival IS the reading.

   NEVER BEHIND requestAnimationFrame. A hidden document freezes its animation
   frames, so an rAF-gated swing leaves the arc empty and the needle at zero
   until the tab is looked at — an instrument reading $0 on a $14,300 month
   because the phone was in a pocket. The same wall-clock-over-animation rule
   the lever lives by. A forced reflow makes the CSS transition play from the
   rest state; if the browser skips the animation entirely, the FINAL values
   are still correct, which is the part that matters. */
function swingGauge(){
  const arc = $("heroArc"), nd = $("heroNeedle"), gh = $("heroGhost");
  if(!arc) return;
  const m = (State.fin.summary || {}).the_month || {};
  const be = m.break_even_actual != null ? m.break_even_actual : m.monthly_nut;
  if(be == null || m.mtd_revenue == null) return;
  const gmax = Math.max(be*1.5, (m.projected_eom||0)*1.12, m.mtd_revenue*1.12, 1);
  const pct = Math.min(100, Math.max(0, m.mtd_revenue/gmax*100));
  void arc.getBoundingClientRect();          // seat the rest state, then move
  arc.style.strokeDashoffset = (100 - pct);
  if(nd) nd.setAttribute("transform", `rotate(${nd.dataset.rot} 220 240)`);
  if(gh) gh.setAttribute("transform", `rotate(${gh.dataset.rot} 220 240)`);
  /* remember where it now stands, so a re-render carrying the same reading
     draws it here instead of swinging up from zero again */
  GAUGE_AT = { m: nd && +nd.dataset.rot, p: gh && +gh.dataset.rot };
}

/* THE CHASE CLOCK — chase emails on a clock (his ask, 2026-08-10): due =
   delivery + 1 calendar month, re-anchored to his last ack; the paid column
   is the mirror's truth. The FOLLOWED UP tap is "a way to tell Atlas that I
   completed" — his hand, recorded, and the clock re-arms a month out. */
function followupStrip(){
  const f = State.fin.followups;
  if(!f) return "";
  const due = (f.followups||[]).filter(r => r.state === "due");
  const next = (f.followups||[]).find(r => r.state === "upcoming");
  if(!due.length && !next) return "";
  return `<div class="fua">
    <div class="cap">the chase clock — ${due.length
      ? `<span style="color:var(--hot)">${due.length} chase email${due.length===1?"":"s"} due</span>`
      : "nothing due"} · ${money(f.outstanding_total||0)} outstanding</div>
    ${due.map(r => `<div class="fur due">
      <span class="who">${esc(r.broker)} · inv ${esc(String(r.invoice))}</span>
      <span class="amt">${money(r.rate)}</span>
      <span class="when">due ${esc(r.due_date)} · ${r.days_over}d over${
        r.last_ack ? ` · last chased ${esc(r.last_ack.slice(0,10))}` : ""}</span>
      <button class="ack" data-fua="${r.sheet_row}">FOLLOWED UP</button>
    </div>`).join("")}
    ${next ? `<div class="fur">
      <span class="who">${esc(next.broker)} · inv ${esc(String(next.invoice))}</span>
      <span class="amt">${money(next.rate)}</span>
      <span class="when">next — due ${esc(next.due_date)} (in ${next.days_until}d)</span>
    </div>` : ""}
  </div>`;
}

/* ── THE FLOOR: cards, loads, and the drag between them ────────────── */
function finFloor(){
  const e = State.fin.expenses, l = State.fin.loads, ro = State.fin.rollup;
  if(!e || !l) return `<div class="panel" style="flex:1"><div class="gen">
    <span class="nodata">${esc(State.fin.err || "the spine has not answered with the floor")}</span></div></div>`;
  /* EVERY transaction in the window, not a filtered pool. Bryan, 2026-07-29:
     "all of the transactions for July in a column." A row he cannot see is a
     row he cannot reconcile, and the whole point of this floor is that the
     month ends with nothing left unaccounted for. Placed rows stay visible,
     marked, so the column is a checklist rather than a shrinking mystery. */
  /* THE COLUMN'S ORDER IS THE WORK'S ORDER (Bryan, 2026-08-02): intake at the
     very top — dropping is the first act of the day; then the nut; then the
     rows, PLACEABLE FIRST and monthly charges filtered to the bottom, because
     the top of the pile is the work (bank rows waiting for a load) and the
     bottom is the already-spoken-for. Stable sort: the producer's date order
     survives within each tier. */
  /* ONE ROW, ONE WORKBENCH (Bryan, 2026-08-04). A bill's bank row works in
     the bucket's ARRIVED tray; a paid bill rests in the bucket's PAID — and
     when five sat in both places at once the honest dual-render read as the
     twin bug. The pile is load work and the marked/held, nothing else; the
     cap says where the bill rows went, because a row that leaves a list
     silently reads as lost. The books' record still carries every row. */
  const billBound = t => t.monthly_candidate || (t.monthly_pay || []).length;
  /* transfers are money MOVED, not work — no workbench at all; the books'
     record is their one home (Bryan, 2026-08-04). His 08-29 ruling extends
     the same sentence to maintenance and books-only rows (Bank Fees /
     Interest): "this column is only for placing Gas, Food, and Lodging
     expenses for loads" — not even greyed. The books tab carries them. */
  const pile = (e.transactions || []).filter(t => !billBound(t) && !t.transfer
      && !t.maintenance
      && !(t.undraggable_because || "").startsWith("books-only"));
  const trayN = (e.transactions || []).filter(billBound).length;
  const tier = t => t.accounted ? 2
    : (t.trip_direct && !t.personal) ? 0
    : (t.undraggable_because || "").startsWith("month-level") ? 2 : 1;
  /* THE FOLD (Bryan, 2026-08-04: "collapse transactions for the month that
     have already been placed"). The 08-02 ruling stands — worked rows never
     vanish, the pile is a checklist — but the checked-off lines now tuck
     behind one line wearing their count and their dollars, one tap from
     visible. The work stays on top, bare. */
  /* THE 2-DAY SHELF (his ruling 08-22, card #137: "these should only hold
     for 2 days and then be filed. want to keep this area clean"). A row
     whose state is TERMINAL — nothing left for his hand — holds visible for
     two days so the event is SEEN, then files into the fold. Filed is never
     gone: one tap opens the fold, and the books' record carries every row.
     sqlite stamps updated_at in UTC without a Z — normalize before math
     (the MI mirror-age precedent). */
  const aged = (iso, days) => {
    if(!iso) return false;
    const d = new Date(iso.length > 10 && !iso.includes("T")
      ? iso.replace(" ", "T") + "Z" : iso);
    return !isNaN(d) && (Date.now() - d.getTime()) > days * 86400e3;
  };
  /* ...AND HIS HAND FILES IT NOW (card #225, 2026-09-12: "this pre-auth needs
     to disappear from the floor"). filed_at is his mark from the row's menu —
     the spine only grants it to a row the shelf would file anyway, so a live
     row can never be hidden this way. It outranks the 2-day wait. */
  const filed = t =>
    !!t.filed_at
    || (t.expired && aged(t.updated_at || t.date, 2))
    || (t.deposit_refund && aged(t.deposit_refund.refund_date || t.date, 2))
    || ((t.undraggable_because || "").startsWith("cash") && aged(t.date, 2));
  const doneRow = t => (t.placements || []).length || t.accounted || filed(t);
  const work = pile.filter(t => !doneRow(t)).sort((a,b) => tier(a) - tier(b));
  const folded = pile.filter(doneRow).sort((a,b) => tier(a) - tier(b));
  const foldSum = folded.reduce((s,t) => s + Math.abs(t.amount || 0), 0);
  const all = work;
  const stale = l.mirror_stale_hours;
  const m0 = (State.fin.summary && State.fin.summary.the_month) || {};
  return `<div class="finscroll">
    <div class="floor">
      <div class="panel">
        <div class="cap">${esc((m0.month_name||"the window").toLowerCase())} — ${
          all.length} in the pile · ${e.pool_count} still to place · ${money(e.pool_total || 0)}${
          trayN ? ` · ${trayN} with the bills &rarr;` : ""}</div>
        <div class="stab">
          <button id="placeAll">place them for me</button>
          <button id="clearAuto" class="ghost">clear the machine's</button>
        </div>
        <div class="exp" style="margin-top:7px">${
          all.length ? all.map(finLine).join("")
            : folded.length ? "" : `<p class="nodata">nothing in the window</p>`}${
          folded.length ? `<div class="fold" id="pileFold" title="${
              FIN.pileOpen ? "tap to tuck them back away" : "tap to see every one"}">
            <span>placed &amp; filed — ${folded.length} row${folded.length===1?"":"s"} · ${
              money(foldSum)}</span><i>${FIN.pileOpen ? "tuck away" : "open"}</i></div>${
            FIN.pileOpen ? folded.map(finLine).join("") : ""}` : ""}</div>
        ${e.blind_days ? `<div class="cap" style="margin-top:8px;color:var(--hot)">
          known through ${esc(e.txn_through||"?")} · ${e.blind_days} day${
          e.blind_days===1?"":"s"} not imported</div>` : ""}
        <div style="margin-top:9px">${finNutList(m0)}</div>
      </div>
      <div class="panel">
        ${followupStrip()}
        <div class="cap">the loads — ${(l.loads||[]).length} in ${esc(FIN.period)} · ${
          /* BOOKED IS THE HEADLINE WORD (his ruling 2026-09-26, card #306).
             This printed the window's TOTAL — every load on the calendar —
             under the word "earned". fin_loads serves the split itself:
             total, earned (delivered on or before today) and booked (still
             to run); the page names both and adds nothing. */
          l.earned == null ? `${money(l.revenue || 0)} booked`
            : `${money(l.total ?? l.revenue)} booked · ${
                l.booked ? `${money(l.earned)} delivered` : "all delivered"}`}${stale != null && stale > 6
            ? ` · <span style="color:var(--hot)">mirror ${stale}h old</span>` : ""}</div>
        <div class="lanes" id="loadZone" style="margin-top:7px">${finMonthlyBox()}${
          (l.loads||[]).length ? recentFirst(l.loads).map(ld => finLane(ld, ro)).join("")
            : `<p class="nodata">no loads delivered in this window</p>`}</div>
      </div>
    </div>
    ${finReconcile()}${finCharts()}</div>`;
}

/* THE NUT, ON THE LEFT — Bryan, 2026-08-01: "they should be on the left and
   when i pay them they will land in the monthly bucket." And an hour later,
   the correction that made it real: "cards that i can drag as i pay."

   What the month demands stands at the top of the same column as what the
   bank says, because they are one checklist: the month is closed when every
   bank row is accounted for AND every bill has crossed to the bucket. Each
   bill is a CARD — the moment he pays it in the real world he drags it into
   MONTHLY, because the bank row is often days from import. The row attaches
   as evidence when it lands; until then the bucket says so honestly. */
/* ONE derivation of the month's pay-set. The nut list, the MONTHLY bucket and
   the strip's stones all read THIS — a third inline settled/open/owed would be
   the #84 restatement class the audit killed (a count derived in two places
   is two counts). */
function payState(){
  const s = State.standings;
  if(!s) return null;
  const pay = [...(s.standings||[]), ...(s.tape||[])].filter(x => x.kind === "pay");
  const settled = pay.filter(x => x.state === "settled");
  const open = pay.filter(x => x.state !== "settled");
  return { pay, settled, open,
           owed: open.reduce((a,x) => a + (x.amount||0), 0),
           settledTotal: settled.reduce((a,x) => a + (x.amount||0), 0) };
}

function finNutList(m0){
  const ps = payState();
  if(!ps) return "";
  const open = [...ps.open].sort((a,b) => ((a.days ?? 99) - (b.days ?? 99)));
  const mon = esc((m0 && m0.month_name || "this month").toLowerCase());
  if(!open.length) return `<div class="nut">
    <div class="cap">the nut — every bill recorded for ${mon}</div></div>`;
  const owed = ps.owed;
  return `<div class="nut">
    <div class="cap">the nut — ${open.length} due in ${mon} · ${money(owed)} open · drag a bill over as you pay it</div>
    ${open.map(x => {
      const can = !!(x.bill_type && x.bill_id);
      return `<div class="bill${x.state === "unmarked" ? " late" : ""}${can ? "" : " inert"}"
       ${can ? `draggable="true" data-bt="${esc(x.bill_type)}" data-bid="${esc(x.bill_id)}"` : ""}
       title="${esc(x.sub || "")}">
      <span>${esc(x.title)}</span>
      <em>${x.state === "unmarked" ? "date passed — unmarked"
           : x.state === "today" ? "today" : esc(x.sub || "due")}</em>
      <b>${x.amount == null ? "——" : money(x.amount)}</b></div>`;}).join("")}
  </div>`;
}

/* one expense, as a line you drag */
function finLine(t){
  /* a bill's bank row is grabbable — it drags to MONTHLY and nowhere else */
  const lock = !!t.undraggable_because && !t.monthly_candidate;
  const pl = t.placements || [];
  /* A PLACED ROW STAYS IN THE COLUMN, marked. The month is closed when nothing
     is unaccounted for, so the list has to work as a checklist — a row that
     vanishes the moment it is placed turns the remainder into a mystery
     instead of a countdown. Split rows say so, and say by whose hand. */
  const mp = t.monthly_pay || [];
  const state = pl.length ?
    `<div class="ep${t.auto?" auto":""}">${
      pl.length > 1 ? `split ${pl.length} ways` : "placed"}${
      t.auto ? " by the machine" : ""} · ${money(t.placed_total)}</div>`
    : mp.length ?
    `<div class="ep">paid ${esc(mp[0].name)} · monthly</div>`
    : t.accounted ?
    `<div class="ep">already accounted for · your hand</div>`
    : t.deposit ?
    `<div class="ep" style="color:rgba(255,200,60,.9)">${t.deposit_refund
        ? "deposit · refunded " + esc(t.deposit_refund.refund_date || "")
          + (t.filed_at ? " · filed by your hand" : "")
        : "deposit · awaiting the refund"}</div>`
    : t.expired ?
    `<div class="ep" style="color:var(--etch)">expired pre-auth — never settled · held out${
      t.filed_at ? " · filed by your hand" : ""}</div>`
    : t.credit ?
    `<div class="ep" style="color:#7ec87e">credit — drag it onto the load it belongs to</div>`
    : t.filed_at ?
    `<div class="ep" style="color:var(--etch)">${(t.undraggable_because || "").startsWith("cash")
        ? "cash — filed by your hand" : "filed by your hand"} · ${esc(String(t.filed_at).slice(0,10))}</div>`
    : "";
  /* his note rides the row — a line for why, on the floor and in the fold */
  const note = t.note ? `<div class="ep note">${esc(t.note)}</div>` : "";
  return `<div class="eline${lock?" locked":""}${pl.length || mp.length || t.accounted?" done":""}" data-txn="${t.id}" ${
    lock?`title="${esc(t.undraggable_because)}"`
        :t.monthly_candidate?`draggable="true" title="a bill's bank row — tap it, drag it into MONTHLY, or right-click"`
        :'draggable="true" title="tap for the row&#39;s moves, or drag it onto a load"'}>
    <div class="em">${esc(t.merchant || t.description || "—")}</div>
    <div class="ea${t.credit ? " cr" : ""}">${
      t.credit ? "+" + money(Math.abs(t.amount)) : money(t.amount)}</div>
    <div class="ed">${esc(t.date)} · ${esc(t.category || "uncategorized")}${
      t.pending ? ` · <span style="color:rgba(255,200,60,.9)">pending</span>` : ""}</div>
    ${state}${note}</div>`;
}

/* THE MONTHLY BOX — Bryan, 2026-07-29: "have a box for Monthly and i will drag
   any monthly in. when i drag it in, it is paid for that month."
   FLIPPED 2026-08-01, his ruling for the August fresh start: "they should be
   on the left and when i pay them they will land in the monthly bucket."

   So the box holds ONLY what has actually been paid — each bill wearing the
   bank row that proved it (the evidence join, monthly_pay). What is still DUE
   stands on the left with the transactions, part of the same checklist the
   month has to clear. A drop is a real financial write, so it goes through the
   one sanctioned writer, and when the transaction does not name one bill
   beyond doubt the box asks instead of guessing. */
function finMonthlyBox(){
  const ps = payState();
  const pay = ps ? ps.pay : [], settled = ps ? ps.settled : [];
  const owed = ps ? ps.owed : 0;
  const ev = (State.fin.expenses && State.fin.expenses.monthly_pays) || [];
  /* ALL of a bill's bank rows, not the first one — the SBA loan pays in two
     ACH debits every month (2026-08-03), and the bucket reads their sum */
  const evAll = x => ev.filter(e =>
    e.bill_type === x.bill_type && String(e.bill_id) === String(x.bill_id));
  const arrived = ((State.fin.expenses && State.fin.expenses.transactions) || [])
    .filter(t => t.monthly_candidate);
  const ask = FIN.ask;                       // a drop the spine handed back to him
  return `<div class="lane monthly" data-row="monthly">
    <div class="lh"><span class="lr">${money(ps ? ps.settledTotal : 0)}</span>
      <div class="lb">MONTHLY</div>
      <div class="lm">paid this month · ${settled.length} of ${pay.length}${
        owed ? ` · ${money(owed)} still due on the left` : ""}</div></div>
    <div class="lin">${ask ? `<div class="ask">
        <div class="at">${ask.txn.category === "Transfer"
          ? `which card did this ${money(ask.txn.amount)} transfer pay? &mdash; a transfer settles a card, nothing else`
          : ask.no_match
          ? `no bill matches ${esc(ask.txn.merchant || "this row")} ${
              money(ask.txn.amount)} — name it yourself`
          : `which bill did ${esc(ask.txn.merchant || "this")} ${
              money(ask.txn.amount)} pay?`}</div>
        ${ask.candidates.map(c => `<button class="acand" data-txn="${ask.txn.id}"
          data-bt="${esc(c.bill_type)}" data-bid="${esc(c.bill_id)}">
          <span>${esc(c.name)}</span><b>${money(c.due)}</b>
          <i>${esc(c.why)}</i></button>`).join("")}
        ${askExtras(ask)}
        <button class="acand cancel">none of these — put it back</button>
      </div>` : (arrived.length || settled.length ?
        /* ARRIVED BANK ROWS FIRST (Bryan, 2026-08-02: "these... should be at
           the top of monthly cards") — the imports that look like bills, each
           one tap away from attaching to the card it paid. */
        (arrived.length ? `<div class="cap" style="margin-bottom:5px">arrived — tap to match to a bill</div>`
          + arrived.map(t => `<div class="drop-in arr" data-arr="${t.id}"
              title="${t.cc_lane ? "a transfer — it can settle a credit card, nothing else (your 08-10 ruling)"
                                 : "tap to say which bill this paid"}">
              <span>${esc(t.merchant || t.description || "—")}${
                t.cc_lane ? ` <i class="pt">transfer &middot; a card only</i>` : ""}</span>
              <b>${money(t.amount)}</b></div>`).join("")
          + (settled.length ? `<div class="cap" style="margin:7px 0 5px">paid</div>` : "") : "")
        + settled.map(x => {
        const es = evAll(x);
        const covered = es.reduce((a,e) => a + (e.amount || 0), 0);
        return `<div class="drop-in paid"><span>${esc(x.title)}<i class="pev${
            es.length ? "" : " hand"}">${es.length > 1
            ? `${es.length} bank rows · ${money(covered)}${
                x.amount != null && Math.abs(covered - x.amount) > 0.01
                  ? " of " + money(x.amount) : ""}`
            : es.length
            ? esc(((es[0].merchant || "bank row") + " · " + (es[0].date || "")).toLowerCase())
            : "your hand · awaiting the bank row"}</i></span>
          <b>${x.amount == null ? "——" : money(x.amount)}</b></div>`;
      }).join("")
        : `<div class="empty">nothing paid yet for ${
             esc((State.fin.summary&&State.fin.summary.the_month&&
                  State.fin.summary.the_month.month_name)||"the month")} —<br>
             drag a bill across as you pay it</div>`)}</div>
    <div class="lf"><span>${ps && ps.open.length ? `${ps.open.length} still due` : "all recorded"}</span>
      <b class="${owed ? "dn" : ""}">${owed ? money(owed) : "clear"}</b></div>
  </div>`;
}

/* THE FRESHEST RUN STANDS NEXT TO THE BILLS (Bryan, 2026-08-11: "we need to
   show monthly and then most recent load... loads should be shown in reverse
   order"). The load he just ran is the one carrying unplaced receipts, so it
   belongs one thumb from MONTHLY — not at the end of a scroll that grows all
   month. Sorted by delivery date, newest first; sheet_row breaks a same-day
   tie (the later row is the later run). Sorted here, never mutating the served
   array — the producer's order stays the producer's. */
function recentFirst(loads){
  return [...loads].sort((a, b) => {
    const d = String(b.delivery_date || "").localeCompare(String(a.delivery_date || ""));
    return d || (b.sheet_row || 0) - (a.sheet_row || 0);
  });
}
/* one load, as an open box you drop into */
function finLane(ld, ro){
  const row = ro && (ro.loads||[]).find(x => x.sheet_row === ld.sheet_row);
  const net = row ? row.net : null;
  /* CONTRIBUTION TO THE NUT, signed. The freight pays its own road first and
     whatever survives is what fights the month's fixed cost — so a load that
     ate more than it earned is a MINUS, and it should read as one. Served, not
     derived here. */
  const nut = row ? row.nut_contribution : null;
  const ids = row ? (row.assigned_txn_ids || []) : [];
  const txns = State.fin.expenses ? (State.fin.expenses.transactions||[]) : [];
  const inside = ids.map(id => txns.find(t => t.id === id)).filter(Boolean);
  /* the verdict first, then its evidence (his 2026-08-11 ruling). Same served
     figure that used to sit in the footer — moved, not copied. */
  const nutBand = `<div class="lnut${nut != null && nut < 0 ? " dn" : ""}" title="${esc((row && row.net_basis) || "")}">
      <span>to the nut${row && row.nut_pct != null
        ? `<i>${row.nut_pct.toFixed(1)}% of the month's</i>`
        /* fee unknown (card #343): the contribution is blank, and the most
           it could be is named beside it rather than printed as the truth */
        : (row && nut == null && row.net_if_no_fee != null
          ? `<i>fee unknown · ${row.net_if_no_fee < 0 ? "−" : "up to +"}${money(Math.abs(row.net_if_no_fee))} if no fee</i>` : "")}</span>
      <b class="${nut == null ? "" : nut < 0 ? "dn" : ""}">${
        nut == null ? "——" : (nut < 0 ? "−" : "+") + money(Math.abs(nut))}</b></div>`;
  return `<div class="lane" data-row="${ld.sheet_row}">
    <div class="lh"><span class="lr">${money(ld.rate || 0)}</span>
      <div class="lb">${esc(ld.broker || "—")}</div>
      <div class="lm">${esc(ld.pickup_city||"?")} &rarr; ${esc(ld.delivery_city||"?")}${
        ld.delivery_state ? ", " + esc(ld.delivery_state) : ""}<br>${esc(ld.delivery_date||"")}</div></div>
    ${nutBand}
    <div class="lin">${inside.length ? inside.map(t => {
      /* what THIS load carries of that transaction — a Pilot week sits on
         several loads, so the portion is the truth here, never the whole */
      const p = (t.placements||[]).find(x => x.sheet_row === ld.sheet_row);
      const part = p ? p.amount : t.amount;
      return `<div class="drop-in${p&&p.source==="auto"?" auto":""}" data-txn="${t.id}"
        title="${esc(p && p.basis ? p.basis : "click to take it back off")}">
        <span>${esc(t.merchant || t.category || "—")}${
          (t.placements||[]).length>1 ? ` <i class="pt">part</i>` : ""}</span>
        <b>${money(part)}</b></div>`; }).join("")
      : `<div class="empty">drag an expense here</div>`}
      ${row && row.fee != null ? `<div class="drop-in" style="opacity:.6;cursor:default">
        <span>factoring fee</span><b>${money(row.fee)}</b></div>` : ""}
      ${row && row.trip_accrual ? `<div class="drop-in" style="opacity:.6;cursor:default">
        <span>trip accrual</span><b>${money(row.trip_accrual)}</b></div>` : ""}</div>
    <div class="lf"><span>the road it ate</span>
      <b class="${(row && row.assigned_cost) ? "dn" : ""}">${
        row && row.assigned_cost != null ? money(row.assigned_cost) : "——"}</b></div>
  </div>`;
}

/* SUMMARY — the month reconciled on real data. Every figure comes from
   finroom's reconciliation block; the page adds nothing. It states BOTH
   revenue bases against the one actual line (nut + road actually spent):
   delivered, the work already run, and booked, which adds the loads on the
   calendar that still owe their own fuel. The gauge above measures BOOKED
   revenue — his ruling 2026-09-26 on card #42, carried by #306 ("Once it's
   booked it goes to the MTD Revenue") — so the booked row is the one that
   matches the dial, and the delivered row stays so run work is never hidden
   inside the booked figure. This note once said the gauge measured ACTUAL
   revenue; it never did, and a comment that believes it re-teaches the
   wrong basis to the next session. */
function finReconcile(){
  const ro = State.fin.rollup, ex = State.fin.expenses, sm = State.fin.summary;
  const R = ro && ro.reconciliation;
  if(!R) return "";
  const m = (sm && sm.the_month) || {};
  const onActual = R.break_even_actual, over = R.over_under_actual, rev = R.revenue;
  /* placement progress is measured on the WINDOW's rows (what landed this
     period), never the load-shifted figure — against the shifted one the bar
     reads past 100% the moment a row rides an earlier month's load */
  const roadWin = R.road_window != null ? R.road_window : R.road_actual;
  const pct = roadWin ? Math.min(100, Math.round(100 * (R.attributed||0) / roadWin)) : 0;
